<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rival Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}
body{
    background:linear-gradient(135deg,#08111f,#0d1a2d,#121f36);
    color:#fff;
    min-height:100vh;
    padding:15px;
}
.container{
    max-width:1400px;
    margin:auto;
}
.header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 25px rgba(0,255,170,0.12);
    margin-bottom:20px;
}
.header img{
    width:52px;
    height:52px;
}
.header h1{
    font-size:24px;
    color:#00ffb7;
}
.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}
select{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#13243b;
    color:#fff;
    font-size:14px;
    outline:none;
}
.table-box{
    overflow-x:auto;
    border-radius:16px;
}
table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
    background:rgba(255,255,255,0.03);
}
th{
    background:#00ffb7;
    color:#000;
    padding:14px;
    font-size:13px;
}
td{
    padding:14px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.08);
    font-size:13px;
}
tr:hover{
    background:rgba(255,255,255,0.04);
}
.warning{
    background:rgba(255,0,0,0.15)!important;
}
.badge{
    padding:6px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
}
.ok{
    background:#123d2d;
    color:#79ffbe;
}
.alert{
    background:#641818;
    color:#ff8e8e;
}
@media(max-width:768px){
    .header h1{
        font-size:16px;
    }
    th,td{
        font-size:11px;
        padding:10px 8px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <img src="https://i.imgur.com/LY3Bb9m.png">
        <h1>GOAT FC Rival Tracker</h1>
    </div>

    <div class="filters">
        <select id="playerSelect">
            <option value="">Select Player</option>
        </select>

        <select id="periodFilter">
            <option value="monthly">Current Month</option>
            <option value="overall">Overall</option>
        </select>

        <select id="typeFilter">
            <option value="all">All Matches</option>
            <option value="Friendly">Friendly Only</option>
            <option value="Tournament">Tournament Only</option>
        </select>
    </div>

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>Opponent</th>
                    <th>Total Match</th>
                    <th>Wins</th>
                    <th>Draws</th>
                    <th>Losses</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="resultTable">
                <tr><td colspan="6">Loading Data...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
const MATCH_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";

const MEMBER_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let allMatches = [];
let memberMap = {};

function parseCSV(text){
    const rows = [];
    let row = [];
    let current = '';
    let inQuotes = false;

    for(let i=0;i<text.length;i++){
        const char = text[i];
        const next = text[i+1];

        if(char === '"' && inQuotes && next === '"'){
            current += '"';
            i++;
        }
        else if(char === '"'){
            inQuotes = !inQuotes;
        }
        else if(char === ',' && !inQuotes){
            row.push(current);
            current = '';
        }
        else if((char === '\n' || char === '\r') && !inQuotes){
            if(current || row.length){
                row.push(current);
                rows.push(row);
                row = [];
                current = '';
            }
        }
        else{
            current += char;
        }
    }

    if(current || row.length){
        row.push(current);
        rows.push(row);
    }

    return rows;
}

async function loadData(){
    try{
        const [matchRes, memberRes] = await Promise.all([
            fetch(MATCH_CSV),
            fetch(MEMBER_CSV)
        ]);

        const matchText = await matchRes.text();
        const memberText = await memberRes.text();

        processMembers(memberText);
        processMatches(matchText);

        populatePlayers();

        document.getElementById("resultTable").innerHTML =
            `<tr><td colspan="6">Select Player to View Data</td></tr>`;
    }
    catch(err){
        document.getElementById("resultTable").innerHTML =
            `<tr><td colspan="6">Failed to Load Data</td></tr>`;
        console.error(err);
    }
}

function processMembers(csv){
    const rows = parseCSV(csv);
    const headers = rows[0];

    rows.slice(1).forEach(r=>{
        const obj = {};
        headers.forEach((h,i)=>obj[h.trim()] = (r[i]||'').trim());

        const id = obj["Club ID Number"];
        const name = obj["Full Name"];

        if(id && name){
            memberMap[id] = `${name} - ${id}`;
        }
    });
}

function processMatches(csv){
    const rows = parseCSV(csv);
    const headers = rows[0];

    allMatches = rows.slice(1).map(r=>{
        let obj = {};
        headers.forEach((h,i)=>obj[h.trim()] = (r[i]||'').trim());
        return obj;
    }).filter(r=>r.P1_ID && r.P2_ID);
}

function populatePlayers(){
    const players = new Set();

    allMatches.forEach(m=>{
        players.add(m.P1_ID);
        players.add(m.P2_ID);
    });

    const select = document.getElementById("playerSelect");

    [...players].sort().forEach(id=>{
        const option = document.createElement("option");
        option.value = id;
        option.textContent = memberMap[id] || id;
        select.appendChild(option);
    });
}

function validCurrentMonth(dateStr){
    const d = new Date(dateStr);
    if(isNaN(d)) return false;

    const now = new Date();

    return d.getMonth()===now.getMonth() &&
           d.getFullYear()===now.getFullYear();
}

function renderData(){
    const player = playerSelect.value;
    const period = periodFilter.value;
    const type = typeFilter.value;
    const tbody = resultTable;

    if(!player){
        tbody.innerHTML=`<tr><td colspan="6">Select Player to View Data</td></tr>`;
        return;
    }

    let data = allMatches.filter(m=>m.Approved==="Yes" || m.Approved==="TRUE" || m.Approved==="1");

    if(period==="monthly"){
        data = data.filter(m=>validCurrentMonth(m.Match_Date));
    }

    if(type==="Friendly"){
        data = data.filter(m=>m.Match_Type==="Friendly");
    }

    if(type==="Tournament"){
        data = data.filter(m=>m.Match_Type!=="Friendly");
    }

    const stats = {};

    data.forEach(m=>{
        let opp,result;

        const p1s = Number(m.P1_Score)||0;
        const p2s = Number(m.P2_Score)||0;

        if(m.P1_ID===player){
            opp=m.P2_ID;
            result=p1s>p2s?"win":p1s<p2s?"loss":"draw";
        }
        else if(m.P2_ID===player){
            opp=m.P1_ID;
            result=p2s>p1s?"win":p2s<p1s?"loss":"draw";
        }
        else return;

        if(!stats[opp]){
            stats[opp]={total:0,win:0,draw:0,loss:0};
        }

        stats[opp].total++;
        stats[opp][result]++;
    });

    const rows = Object.entries(stats).sort((a,b)=>b[1].total-a[1].total);

    if(!rows.length){
        tbody.innerHTML=`<tr><td colspan="6">No Match Data Found</td></tr>`;
        return;
    }

    tbody.innerHTML = rows.map(([opp,s])=>{
        const exceeded = period==="monthly" && s.total>5;

        return `
        <tr class="${exceeded?'warning':''}">
            <td>${memberMap[opp] || opp}</td>
            <td>${s.total}</td>
            <td>${s.win}</td>
            <td>${s.draw}</td>
            <td>${s.loss}</td>
            <td>
                <span class="badge ${exceeded?'alert':'ok'}">
                    ${exceeded?'LIMIT EXCEEDED':'OK'}
                </span>
            </td>
        </tr>
        `;
    }).join('');
}

playerSelect.addEventListener("change",renderData);
periodFilter.addEventListener("change",renderData);
typeFilter.addEventListener("change",renderData);

loadData();
</script>

</body>
</html>
