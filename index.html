<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOAT FC STATISTICS</title>

<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

:root{
--bg:#050816;
--card:#0f172a;
--cyan:#00f5ff;
--green:#00ff88;
--yellow:#ffd60a;
--red:#ff4d6d;
--white:#f8fafc;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
font-family:'Rajdhani',sans-serif;
color:var(--white);
overflow-x:hidden;
padding-bottom:20px;
}

body::before{
content:"";
position:fixed;
inset:0;

background:
radial-gradient(circle at top left,#00f5ff12,transparent 25%),
radial-gradient(circle at bottom right,#00ff8810,transparent 25%);

z-index:-1;
}

/* TOPBAR */

.topbar{
height:48px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 14px;

background:rgba(5,8,22,.88);

backdrop-filter:blur(10px);

border-bottom:1px solid #00f5ff15;

position:sticky;
top:0;
z-index:999;

text-decoration:none;
}

.top-left{
display:flex;
align-items:center;
gap:8px;
}

.top-logo{
width:24px;

filter:
drop-shadow(0 0 5px #00f5ff);
}

.top-title{
font-family:'Orbitron',sans-serif;
font-size:11px;
font-weight:700;
letter-spacing:1px;

background:
linear-gradient(90deg,var(--cyan),var(--green));

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.home-btn{
width:30px;
height:30px;

display:flex;
align-items:center;
justify-content:center;

border-radius:10px;

background:#111827;

border:1px solid #00f5ff20;

color:var(--cyan);

font-size:11px;
}

/* HERO */

.hero{
padding:16px 12px 14px;
text-align:center;
}

.hero-title{
font-family:'Orbitron',sans-serif;
font-size:22px;
font-weight:800;
letter-spacing:2px;

background:
linear-gradient(
90deg,
#00f5ff,
#ffffff,
#00ff88
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-sub{
margin-top:6px;

font-size:10px;
font-weight:700;

letter-spacing:3px;

color:var(--muted);
}

/* WRAP */

.wrap{
width:min(100% - 16px,1400px);
margin:auto;
}

/* SEARCH */

.search-box{
width:100%;

height:48px;

padding:0 15px;

border-radius:16px;

border:1px solid #00f5ff20;

background:
linear-gradient(145deg,#111827,#0f172a);

outline:none;

color:white;

font-size:14px;
font-weight:700;

font-family:'Rajdhani',sans-serif;

margin-bottom:14px;

box-shadow:
0 0 10px #00f5ff08;
}

.search-box::placeholder{
color:#94a3b8;
}

.search-box:focus{

border-color:#00f5ff55;

box-shadow:
0 0 12px #00f5ff22;
}

/* GRID */

#data{
display:grid;

grid-template-columns:
repeat(auto-fit,minmax(330px,1fr));

gap:14px;
}

/* CARD */

.card{
position:relative;

padding:14px;

border-radius:22px;

background:
linear-gradient(145deg,#111827,#0f172a);

border:1px solid #00f5ff15;

overflow:hidden;

box-shadow:
0 0 16px #000;

transition:.25s;
}

.card:hover{
transform:translateY(-4px);

box-shadow:
0 0 18px #00f5ff15;
}

.card::before{
content:"";

position:absolute;

inset:4px;

border-radius:18px;

border:1px solid #00f5ff10;

pointer-events:none;
}

/* RANK COLORS */

.rank1{
border-color:gold;
box-shadow:0 0 18px rgba(255,215,0,.25);
}

.rank2{
border-color:silver;
box-shadow:0 0 18px rgba(192,192,192,.2);
}

.rank3{
border-color:#cd7f32;
box-shadow:0 0 18px rgba(205,127,50,.2);
}

.top10{
border-color:#a855f7;
box-shadow:0 0 18px rgba(168,85,247,.2);
}

/* PLAYER */

.player-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;

margin-bottom:12px;
}

.player-left{
min-width:0;
}

.player-name{
font-size:18px;
font-weight:800;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

color:white;
}

.player-id{
margin-top:4px;

display:inline-flex;
align-items:center;
gap:5px;

padding:5px 10px;

border-radius:999px;

background:#00f5ff10;

border:1px solid #00f5ff20;

font-size:10px;
font-weight:700;

color:var(--cyan);
}

/* RANK */

.rank-badge{
width:42px;
height:42px;

border-radius:14px;

display:flex;
align-items:center;
justify-content:center;

font-family:'Orbitron',sans-serif;
font-size:14px;
font-weight:800;

background:#00f5ff10;

border:1px solid #00f5ff20;

color:var(--cyan);

flex-shrink:0;
}

/* STATS */

.grid{
display:grid;

grid-template-columns:
repeat(3,1fr);

gap:8px;
}

.box{
padding:8px 6px;

border-radius:14px;

background:
linear-gradient(145deg,#0f172a,#111827);

border:1px solid #ffffff10;

text-align:center;
}

.box-value{
font-size:15px;
font-weight:800;

font-family:'Orbitron',sans-serif;

color:white;
}

.box-label{
margin-top:4px;

font-size:8px;
font-weight:700;

letter-spacing:1px;

text-transform:uppercase;

color:var(--muted);
}

/* COLORS */

.win-text{color:#00ff88;}
.loss-text{color:#ff4d6d;}
.draw-text{color:#ffd60a;}
.match-text{color:#00f5ff;}
.rate-text{color:#38bdf8;}
.goal-text{color:#22c55e;}
.con-text{color:#f97316;}
.diff-text{color:#a855f7;}
.seven-text{color:#facc15;}
.friendly-text{color:#06b6d4;}
.tour-text{color:#fb7185;}

/* DOWNLOAD */

.download{
margin-top:12px;
}

.download button{
width:100%;
height:42px;

border:none;

border-radius:14px;

background:
linear-gradient(90deg,#00f5ff,#00ff88);

color:#001018;

font-size:13px;
font-weight:800;

font-family:'Orbitron',sans-serif;

cursor:pointer;

transition:.2s;
}

.download button:hover{
transform:scale(.98);
}

/* MOBILE */

@media(max-width:768px){

#data{
grid-template-columns:1fr;
}

.grid{
grid-template-columns:repeat(2,1fr);
}

.player-name{
font-size:16px;
}

}

</style>
</head>

<body>

<!-- TOPBAR -->

<a href="https://goatfcbd.com"
class="topbar">

<div class="top-left">

<img src="https://i.imgur.com/LY3Bb9m.png"
class="top-logo">

<div class="top-title">
GOAT FC
</div>

</div>

<div class="home-btn">
<i class="fa-solid fa-house"></i>
</div>

</a>

<!-- HERO -->

<div class="hero">

<div class="hero-title">
GOAT FC STATISTICS
</div>

<div class="hero-sub">
ELITE PLAYER PERFORMANCE SYSTEM
</div>

</div>

<!-- WRAP -->

<div class="wrap">

<input
type="text"
id="search"
class="search-box"
placeholder="Search Player Name / Club ID..."
oninput="render()">

<div id="data"></div>

</div>

<script>

const MATCH_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";

const MEMBER_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let players={}, members={}, cache={};

function parseCSV(text){

const rows=[];
let cur=[], val="", q=false;

for(let i=0;i<text.length;i++){

let c=text[i];

if(c=='"'){

if(q && text[i+1]=='"'){
val+='"';
i++;
}else q=!q;

}

else if(c==','&&!q){
cur.push(val);
val="";
}

else if((c=='\n'||c=='\r')&&!q){

if(val||cur.length){

cur.push(val);
rows.push(cur);

cur=[];
val="";

}

}

else{
val+=c;
}

}

return rows;

}

function normalize(id){
return (id||"")
.toLowerCase()
.replace(/[^a-z0-9]/g,'');
}

async function getData(url){

if(cache[url]) return cache[url];

let t=await fetch(url+"&t="+Date.now())
.then(r=>r.text());

cache[url]=t;

return t;

}

async function loadMembers(){

let rows=parseCSV(await getData(MEMBER_URL))
.slice(1);

rows.forEach(c=>{

if(c[1] && !c[1].includes("#VALUE")){

members[normalize(c[1])] = c[0];

}

});

}

async function loadMatches(){

let rows=parseCSV(await getData(MATCH_URL))
.slice(1);

rows.forEach(c=>{

let P1=c[0],
P2=c[1];

let s1=Number(c[3]),
s2=Number(c[4]);

let approved=(c[9]||"").toLowerCase();

if(
!P1 || !P2 ||
P1.includes("#VALUE") ||
P2.includes("#VALUE") ||
isNaN(s1) ||
isNaN(s2) ||
approved!=="yes"
) return;

update(P1,s1,s2,c[2]);
update(P2,s2,s1,c[2]);

});

}

function update(id,s,c,t){

if(!players[id]){

players[id]={
match:0,
win:0,
loss:0,
draw:0,
gs:0,
gc:0,
diff:0,
rate:0,
seven:0,
friendly:0,
other:0
};

}

let p=players[id];

p.match++;

p.gs+=s;
p.gc+=c;

p.diff=p.gs-p.gc;

if(t==="Friendly") p.friendly++;
else p.other++;

if(s>c) p.win++;
else if(s<c) p.loss++;
else p.draw++;

if(s>=7) p.seven++;

p.winp=(p.win/p.match)*100;
p.rate=(p.gs/p.match);

}

function render(){

let q=normalize(
document.getElementById("search").value
);

let sorted=Object.entries(players)

.sort((a,b)=>b[1].win-a[1].win);

let html="";

sorted.forEach(([id,p],i)=>{

let name=
members[normalize(id)]
||"Unknown Player";

if(
q &&
!(
normalize(id).includes(q)
||
normalize(name).includes(q)
)
) return;

let cls="card";

if(i===0) cls+=" rank1";
else if(i===1) cls+=" rank2";
else if(i===2) cls+=" rank3";
else if(i<10) cls+=" top10";

html += `

<div class="${cls}">

<div class="player-head">

<div class="player-left">

<div class="player-name">
${name}
</div>

<div class="player-id">
<i class="fa-solid fa-shield-halved"></i>
${id}
</div>

</div>

<div class="rank-badge">
#${i+1}
</div>

</div>

<div class="grid">

<div class="box">
<div class="box-value win-text">${p.win}</div>
<div class="box-label">Wins</div>
</div>

<div class="box">
<div class="box-value loss-text">${p.loss}</div>
<div class="box-label">Loss</div>
</div>

<div class="box">
<div class="box-value draw-text">${p.draw}</div>
<div class="box-label">Draw</div>
</div>

<div class="box">
<div class="box-value match-text">${p.match}</div>
<div class="box-label">Match</div>
</div>

<div class="box">
<div class="box-value rate-text">${p.winp.toFixed(1)}%</div>
<div class="box-label">Win Rate</div>
</div>

<div class="box">
<div class="box-value goal-text">${p.rate.toFixed(2)}</div>
<div class="box-label">Goal Rate</div>
</div>

<div class="box">
<div class="box-value goal-text">${p.gs}</div>
<div class="box-label">Scored</div>
</div>

<div class="box">
<div class="box-value con-text">${p.gc}</div>
<div class="box-label">Against</div>
</div>

<div class="box">
<div class="box-value diff-text">${p.diff}</div>
<div class="box-label">Diff.</div>
</div>

<div class="box">
<div class="box-value seven-text">${p.seven}</div>
<div class="box-label">7+ Goal</div>
</div>

<div class="box">
<div class="box-value friendly-text">${p.friendly}</div>
<div class="box-label">Friendly</div>
</div>

<div class="box">
<div class="box-value tour-text">${p.other}</div>
<div class="box-label">Tournament</div>
</div>

</div>

<div class="download">
<button onclick="downloadCard(this)">
DOWNLOAD CARD
</button>
</div>

</div>

`;

});

document.getElementById("data").innerHTML=html;

}

function downloadCard(btn){

html2canvas(btn.closest(".card"))
.then(c=>{

let a=document.createElement("a");

a.download="GOAT_FC_STATS.jpg";

a.href=c.toDataURL("image/jpeg");

a.click();

});

}

async function init(){

await Promise.all([
loadMembers(),
loadMatches()
]);

render();

}

init();

</script>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</body>
</html>
