<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:radial-gradient(circle at top,#020617,#0f172a);
color:white;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 12px;
flex-wrap:wrap;
background:rgba(15,23,42,.85);
backdrop-filter:blur(10px);
}
.logo{display:flex;align-items:center;gap:8px;}
.logo img{height:38px;filter:drop-shadow(0 0 10px #7c3aed);}
.logo span{font-size:16px;font-weight:700;}
.nav-links{display:flex;flex-wrap:wrap;gap:8px;}
.nav-links a{
font-size:12px;
padding:6px 8px;
color:#cbd5f5;
text-decoration:none;
}
.nav-links a:hover{
color:#a78bfa;
text-shadow:0 0 10px #a78bfa;
}

/* HERO */
.hero{position:relative;height:240px;overflow:hidden;}
.slide-box{
position:absolute;
width:100%;
height:100%;
opacity:0;
transition:.9s;
}
.slide-box.active{opacity:1;}
.slide-box img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.45);
}
.slide-content{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:90%;
}
.slide-content h1{font-size:18px;margin:4px 0;}
.slide-content p{font-size:12px;color:#cbd5f5;}
.btn{
display:inline-block;
margin-top:6px;
padding:7px 16px;
font-size:12px;
background:linear-gradient(45deg,#7c3aed,#ec4899);
border-radius:25px;
text-decoration:none;
color:white;
}
.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,.4);
border:none;
color:white;
font-size:18px;
padding:6px 10px;
cursor:pointer;
z-index:10;
border-radius:50%;
}
.arrow.left{left:8px;}
.arrow.right{right:8px;}

/* LIVE SCORE */
.live-wrap{
padding:18px 10px 8px;
max-width:1200px;
margin:auto;
overflow:hidden;
}
.live-title{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
font-size:16px;
font-weight:700;
margin-bottom:14px;
color:#22d3ee;
text-shadow:0 0 10px #22d3ee;
}
.live-dot{
width:10px;
height:10px;
background:#ef4444;
border-radius:50%;
animation:pulseLive 1s infinite;
}
@keyframes pulseLive{
50%{transform:scale(1.5);opacity:.5;}
}

.live-track{
display:flex;
gap:12px;
overflow-x:auto;
scrollbar-width:none;
scroll-snap-type:x mandatory;
scroll-behavior:smooth;
}
.live-track::-webkit-scrollbar{display:none;}

.live-card{
min-width:100%;
scroll-snap-align:start;
padding:16px;
border-radius:18px;
position:relative;
overflow:hidden;
background:linear-gradient(145deg,#0f172a,#1e293b);
border:1px solid rgba(124,58,237,.35);
box-shadow:
0 0 18px rgba(124,58,237,.25),
0 0 25px rgba(34,211,238,.10);
}

.live-card::before{
content:'';
position:absolute;
inset:0;
border-radius:18px;
padding:1px;
background:linear-gradient(90deg,#7c3aed,#06b6d4,#ec4899,#7c3aed);
background-size:300% 300%;
animation:rgbBorder 4s linear infinite;
-webkit-mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
pointer-events:none;
}
@keyframes rgbBorder{
0%{background-position:0% 50%;}
100%{background-position:300% 50%;}
}

.live-mid{
display:grid;
grid-template-columns:1fr auto 1fr;
gap:8px;
align-items:center;
}
.player{text-align:center;}
.player-name{
font-size:10px;
font-weight:700;
line-height:1.3;
word-break:break-word;
white-space:normal;
}
.player-id{
font-size:9px;
color:#94a3b8;
}
.center-box{
display:flex;
flex-direction:column;
align-items:center;
gap:5px;
}
.score-box{
font-size:19px;
font-weight:800;
display:flex;
gap:5px;
}
.match-type{
font-size:8px;
padding:4px 10px;
border-radius:20px;
background:linear-gradient(45deg,#7c3aed,#06b6d4);
}
.score-win{color:#22c55e;}
.score-loss{color:#ef4444;}
.score-draw{color:#eab308;}

/* SECTIONS */
.section{text-align:center;padding:25px 10px;}
.glow{
color:#a78bfa;
text-shadow:0 0 10px #7c3aed;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
padding:0 10px;
max-width:900px;
margin:auto;
}
.card{
background:rgba(255,255,255,.05);
padding:12px;
border-radius:12px;
cursor:pointer;
transition:.3s;
}
.card:hover{
transform:scale(1.05);
box-shadow:0 0 20px #8b5cf6;
}

.champ img{
width:100%;
border-radius:10px;
}

.social a{
display:inline-block;
margin:5px;
padding:8px 12px;
font-size:12px;
background:linear-gradient(45deg,#06b6d4,#3b82f6);
border-radius:8px;
color:white;
text-decoration:none;
}

.footer{
text-align:center;
padding:15px;
font-size:12px;
color:#94a3b8;
}

@media(max-width:600px){
.hero{height:200px;}
.player-name{font-size:9px;}
.score-box{font-size:17px;}
.match-type{font-size:7px;}
}
</style>
</head>
<body>

<div class="navbar">
<div class="logo">
<img src="https://i.imgur.com/LY3Bb9m.png">
<span>GOAT FC</span>
</div>
<div class="nav-links">
<a href="#">Club Rules</a>
<a href="#">About</a>
<a href="#">Contact</a>
<a href="#">Registration</a>
</div>
</div>

<div class="hero">
<button class="arrow left" onclick="changeSlide(-1)">‹</button>
<button class="arrow right" onclick="changeSlide(1)">›</button>
</div>

<div class="live-wrap">
<div class="live-title">
<div class="live-dot"></div>
LIVE SCORE
</div>
<div class="live-track" id="liveTrack"></div>
</div>

<div class="section">
<h2 class="glow">Club Hub</h2>
<div class="grid quick-container"></div>
</div>

<div class="section">
<h2 class="glow">Hall of Champions</h2>
<div class="grid champ-container"></div>
</div>

<div class="section social">
<h2 class="glow">JOIN WITH US</h2>
</div>

<div class="footer">
Design By Md Rashedul Hasan
</div>

<script>
const sheetID="1ZoXNHa5sYiP_HaPRyL5RDML7l3kC2IaGuQCAmYkERf8";
let slides=[],current=0;

fetch(`https://opensheet.elk.sh/${sheetID}/SLIDES`)
.then(r=>r.json())
.then(data=>{
slides=data;
document.querySelector(".hero").innerHTML += slides.map((s,i)=>`
<div class="slide-box ${i===0?'active':''}">
<img src="${s.image}">
<div class="slide-content">
<h1>${s.title}</h1>
<p>${s.desc}</p>
<a class="btn" href="${s.link}" target="_blank">${s.button}</a>
</div>
</div>`).join('');
});

function changeSlide(dir){
const boxes=document.querySelectorAll(".slide-box");
boxes[current].classList.remove("active");
current=(current+dir+boxes.length)%boxes.length;
boxes[current].classList.add("active");
}
setInterval(()=>changeSlide(1),7000);

/* CSV PARSER */
function parseCSV(text){
const rows=[];
let row=[],cell='',inside=false;
for(let i=0;i<text.length;i++){
const c=text[i],n=text[i+1];
if(c=='"'&&inside&&n=='"'){cell+='"';i++;}
else if(c=='"'){inside=!inside;}
else if(c==','&&!inside){row.push(cell);cell='';}
else if((c=='\n'||c=='\r')&&!inside){
if(cell||row.length){row.push(cell);rows.push(row);}
row=[];cell='';
}else cell+=c;
}
if(cell||row.length){row.push(cell);rows.push(row);}
const headers=rows.shift();
return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h.trim(),(r[i]||'').trim()])));
}

/* LIVE SCORE FETCH */
Promise.all([
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv").then(r=>r.text()),
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv").then(r=>r.text())
]).then(([matchCSV,memberCSV])=>{

const matches=parseCSV(matchCSV)
.filter(m=>m.Approved?.toLowerCase()==='yes')
.slice(-10)
.reverse();

const members=parseCSV(memberCSV);
const nameMap={};
members.forEach(m=>nameMap[m["Club ID Number"]]=m["Full Name"]);

document.getElementById("liveTrack").innerHTML=matches.map(m=>{
const p1=nameMap[m.P1_ID]||m.P1_ID;
const p2=nameMap[m.P2_ID]||m.P2_ID;

let p1Class='score-draw',p2Class='score-draw';
if(+m.P1_Score>+m.P2_Score){p1Class='score-win';p2Class='score-loss';}
if(+m.P1_Score<+m.P2_Score){p1Class='score-loss';p2Class='score-win';}

return `
<div class="live-card">
<div class="live-mid">
<div class="player">
<div class="player-name">${p1}</div>
<div class="player-id">${m.P1_ID}</div>
</div>

<div class="center-box">
<div class="score-box">
<span class="${p1Class}">${m.P1_Score}</span>-
<span class="${p2Class}">${m.P2_Score}</span>
</div>
<div class="match-type">${m.Match_Type}</div>
</div>

<div class="player">
<div class="player-name">${p2}</div>
<div class="player-id">${m.P2_ID}</div>
</div>
</div>
</div>`;
}).join('');
});

/* AUTO LIVE SLIDE */
setInterval(()=>{
const track=document.getElementById("liveTrack");
const card=track.querySelector(".live-card");
if(!card) return;

track.scrollBy({
left:card.offsetWidth+12,
behavior:'smooth'
});

if(track.scrollLeft+track.clientWidth>=track.scrollWidth-20){
setTimeout(()=>track.scrollTo({left:0,behavior:'smooth'}),500);
}
},4000);
</script>

</body>
</html>
