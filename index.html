<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC STATISTICS</title>

<link rel="icon" href="https://i.imgur.com/LY3Bb9m.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#050816;
--card:#0f172a;
--cyan:#00f5ff;
--green:#00ff88;
--muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
background:var(--bg);
font-family:'Rajdhani',sans-serif;
color:white;
}

/* HEADER */
.header{
text-align:center;
padding:15px;
}

.header img{
width:45px;
filter:drop-shadow(0 0 10px var(--cyan));
}

.header h1{
font-family:'Orbitron';
font-size:22px;
color:var(--cyan);
text-shadow:0 0 10px var(--cyan);
}

.desc{
font-size:12px;
color:var(--muted);
margin-top:5px;
}

/* SEARCH */
.search{
text-align:center;
margin:10px;
}

.search input{
width:90%;
max-width:400px;
padding:10px;
border-radius:10px;
border:1px solid var(--cyan);
background:#0b1220;
color:var(--cyan);
outline:none;
}

/* GRID */
#data{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:12px;
padding:10px;
}

/* CARD */
.card{
background:linear-gradient(145deg,#0b1220,#0f172a);
border:1px solid #00f5ff25;
border-radius:16px;
padding:12px;
box-shadow:0 0 12px rgba(0,245,255,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-3px);
box-shadow:0 0 18px rgba(0,245,255,0.2);
}

/* RANK COLORS */
.rank1{border:1px solid gold;}
.rank2{border:1px solid silver;}
.rank3{border:1px solid #cd7f32;}
.top10{border:1px solid #a855f7;}

/* NAME ROW */
.club{
display:flex;
flex-wrap:wrap;
gap:6px;
align-items:center;
font-size:14px;
margin-bottom:10px;
}

.player-name{
color:#22c55e;
font-weight:700;
font-family:'Orbitron';
}

.player-id{
color:var(--cyan);
font-size:12px;
}

/* BOX GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}

.box{
padding:6px;
border-radius:8px;
font-size:12px;
font-weight:600;
background:rgba(0,245,255,0.05);
border:1px solid rgba(0,245,255,0.2);
text-align:center;
}

/* DOWNLOAD */
.download{
text-align:center;
margin-top:10px;
}

button{
padding:6px 12px;
border:none;
border-radius:8px;
background:var(--cyan);
color:black;
font-weight:700;
cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
#data{grid-template-columns:1fr;}
.grid{grid-template-columns:repeat(2,1fr);}
}

</style>
</head>

<body>

<div class="header">
<img src="https://i.imgur.com/LY3Bb9m.png">
<h1>GOAT FC STATISTICS</h1>
<div class="desc">Overall + Monthly Performance Dashboard</div>
</div>

<div class="search">
<input type="text" id="search" placeholder="Search Player / Club ID..." oninput="render()">
</div>

<div id="data"></div>

<script>

const MATCH_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";
const MEMBER_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let players={}, members={}, cache={};

function normalize(x){
return (x||"").toLowerCase().replace(/[^a-z0-9]/g,'');
}

function parseCSV(t){
return t.split("\n").map(r=>r.split(","));
}

async function load(){
const res=await fetch(MATCH_URL);
const text=await res.text();
const rows=parseCSV(text);

rows.slice(1).forEach(c=>{
let p1=c[0],p2=c[1];
let s1=+c[3],s2=+c[4];
let type=c[2];

if(!players[p1]) players[p1]={win:0,loss:0,draw:0,match:0,gs:0,gc:0};
if(!players[p2]) players[p2]={win:0,loss:0,draw:0,match:0,gs:0,gc:0};

players[p1].match++; players[p2].match++;
players[p1].gs+=s1; players[p1].gc+=s2;
players[p2].gs+=s2; players[p2].gc+=s1;

if(s1>s2) players[p1].win++, players[p2].loss++;
else if(s2>s1) players[p2].win++, players[p1].loss++;
else players[p1].draw++, players[p2].draw++;
});

render();
}

function render(){
let q=normalize(document.getElementById("search").value);
let data=Object.entries(players);

let html="";

data.sort((a,b)=>b[1].win-a[1].win).forEach(([id,p],i)=>{

if(q && !normalize(id).includes(q)) return;

let cls="card";
if(i==0) cls+=" rank1";
else if(i==1) cls+=" rank2";
else if(i==2) cls+=" rank3";
else if(i<10) cls+=" top10";

html+=`
<div class="${cls}">
<div class="club">
<span class="player-name">${id}</span>
<span class="player-id">(${id})</span>
</div>

<div class="grid">
<div class="box">🏆 ${p.win}</div>
<div class="box">❌ ${p.loss}</div>
<div class="box">🤝 ${p.draw}</div>
<div class="box">🎮 ${p.match}</div>
<div class="box">⚽ ${p.gs}</div>
<div class="box">🥅 ${p.gc}</div>
</div>

<div class="download">
<button>Download</button>
</div>
</div>
`;
});

document.getElementById("data").innerHTML=html;
}

load();

</script>

</body>
</html>
