<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:radial-gradient(circle at top,#020617,#0f172a);
color:white;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 12px;
flex-wrap:wrap;
background:rgba(15,23,42,0.85);
backdrop-filter:blur(10px);
}
.logo{display:flex;align-items:center;gap:8px;min-width:160px;}
.logo img{height:38px;filter:drop-shadow(0 0 10px #7c3aed);}
.logo span{font-size:16px;font-weight:700;white-space:nowrap;}
.nav-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
.nav-links a{
font-size:12px;padding:6px 8px;color:#cbd5f5;
text-decoration:none;white-space:nowrap;
}

/* HERO */
.hero{position:relative;height:240px;overflow:hidden;}
.slide-box{position:absolute;width:100%;height:100%;opacity:0;transition:.9s;}
.slide-box.active{opacity:1;}
.slide-box img{width:100%;height:100%;object-fit:cover;filter:brightness(.45);}
.slide-content{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
text-align:center;width:90%;
}
.slide-content h1{font-size:18px;margin:4px 0;}
.slide-content p{font-size:12px;color:#cbd5f5;}
.btn{
display:inline-block;
margin-top:6px;
padding:7px 16px;
font-size:12px;
background:linear-gradient(45deg,#7c3aed,#ec4899);
border-radius:25px;
text-decoration:none;
color:white;
}

/* ARROWS */
.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,.4);
border:none;
color:white;
font-size:18px;
padding:6px 10px;
cursor:pointer;
z-index:10;
border-radius:50%;
}
.arrow.left{left:8px;}
.arrow.right{right:8px;}

/* LIVE SCORE */
.live-wrap{
padding:18px 10px 8px;
max-width:1200px;
margin:auto;
overflow:hidden;
}
.live-title{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
font-size:16px;
font-weight:700;
margin-bottom:14px;
color:#22d3ee;
text-shadow:0 0 10px #22d3ee;
}
.live-dot{
width:10px;
height:10px;
background:#ef4444;
border-radius:50%;
animation:pulseLive 1s infinite;
}
@keyframes pulseLive{
0%{transform:scale(1);}
50%{transform:scale(1.5);}
100%{transform:scale(1);}
}

.live-track{
display:flex;
gap:12px;
overflow-x:auto;
scrollbar-width:none;
scroll-behavior:smooth;
scroll-snap-type:x mandatory;
}
.live-track::-webkit-scrollbar{display:none;}

.live-card{
min-width:100%;
scroll-snap-align:start;
background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(124,58,237,.10));
border:1px solid rgba(34,211,238,.25);
border-radius:16px;
padding:14px;
}

@media(min-width:768px){
.live-card{min-width:calc(50% - 6px);}
}
@media(min-width:1100px){
.live-card{min-width:calc(33.333% - 8px);}
}

.match-type{
display:inline-block;
padding:5px 12px;
border-radius:20px;
font-size:10px;
font-weight:700;
background:linear-gradient(45deg,#7c3aed,#06b6d4);
margin-bottom:12px;
}

.live-mid{
display:grid;
grid-template-columns:1.35fr auto 1.35fr;
align-items:center;
gap:6px;
}

.player{
text-align:center;
min-width:0;
}

.player-name{
font-size:10px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.player-id{
font-size:9px;
color:#94a3b8;
}

.score-box{
font-size:18px;
font-weight:800;
display:flex;
align-items:center;
gap:4px;
white-space:nowrap;
}

.score-win{color:#22c55e;}
.score-loss{color:#ef4444;}
.score-draw{color:#eab308;}

/* SECTION */
.section{text-align:center;padding:25px 10px;}
.glow{color:#a78bfa;}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
padding:0 10px;
max-width:900px;
margin:auto;
}
.card{
background:rgba(255,255,255,.05);
padding:12px;
border-radius:12px;
cursor:pointer;
text-align:center;
position:relative;
}
.champ img{width:100%;border-radius:10px;}
.desc{
max-width:700px;
margin:10px auto;
font-size:12px;
color:#cbd5f5;
}
.social a{
display:inline-block;
margin:5px;
padding:8px 12px;
font-size:12px;
background:linear-gradient(45deg,#06b6d4,#3b82f6);
border-radius:8px;
color:white;
text-decoration:none;
}
.footer{
text-align:center;
padding:15px;
font-size:12px;
color:#94a3b8;
}

@media(max-width:600px){
.hero{height:200px;}
.logo span{font-size:14px;}
.nav-links a{font-size:11px;padding:5px;}
.slide-content h1{font-size:15px;}
.slide-content p{font-size:11px;}
.player-name{font-size:9.5px;}
.score-box{font-size:16px;}
}
</style>
</head>
<body>

<!-- KEEP YOUR SAME HTML BODY / JS FROM PREVIOUS VERSION -->
<!-- ONLY CSS UPDATED FOR LIVE SCORE MOBILE FIT -->

</body>
</html>
