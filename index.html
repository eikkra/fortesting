<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>GOAT FC STATISTICS</title>

<link rel="icon" href="https://i.imgur.com/LY3Bb9m.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

:root{
--bg:#030712;
--card:#071426;
--cyan:#00f5ff;
--green:#00ff88;
--red:#ff4d6d;
--yellow:#ffd60a;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#020617;
font-family:'Rajdhani',sans-serif;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;

background:
radial-gradient(circle at top left,#00f5ff15,transparent 30%),
radial-gradient(circle at bottom right,#00ff8810,transparent 30%);

z-index:-1;
}

/* TOPBAR */

.topbar{
height:50px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;

background:#030712ee;
backdrop-filter:blur(10px);

border-bottom:1px solid #00f5ff15;
}

.top-left{
display:flex;
align-items:center;
gap:8px;
}

.top-logo{
width:24px;
filter:drop-shadow(0 0 6px #00f5ff);
}

.top-title{
font-family:'Orbitron',sans-serif;
font-size:11px;
font-weight:700;
letter-spacing:1px;
color:var(--cyan);
}

.home-btn{
width:30px;
height:30px;

display:flex;
align-items:center;
justify-content:center;

border-radius:10px;

background:#0f172a;

border:1px solid #00f5ff25;
color:var(--cyan);
}

/* HERO */

.hero{
padding:20px 12px 10px;
text-align:center;
}

.hero-title{
font-family:'Orbitron',sans-serif;
font-size:28px;
font-weight:800;

background:linear-gradient(90deg,#00f5ff,#ffffff,#00ff88);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-sub{
margin-top:8px;
font-size:12px;
letter-spacing:2px;
color:var(--muted);
}

/* SEARCH */

.search-wrap{
padding:10px 14px 20px;
display:flex;
justify-content:center;
}

.search{
width:100%;
max-width:500px;

padding:13px 16px;

border-radius:16px;

border:1px solid #00f5ff35;

background:#071426;

color:white;

outline:none;

font-size:14px;
font-family:'Rajdhani';
}

.search:focus{
box-shadow:0 0 15px #00f5ff35;
}

/* FILTER */

.filters{
display:flex;
justify-content:center;
gap:10px;
padding-bottom:20px;
flex-wrap:wrap;
}

.filter-btn{
padding:10px 18px;

border:none;
border-radius:12px;

background:#071426;

color:#00f5ff;

border:1px solid #00f5ff25;

font-family:'Rajdhani';
font-weight:700;
cursor:pointer;
}

.filter-btn.active{
background:#00f5ff;
color:#001018;
}

/* GRID */

#data{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
gap:16px;

padding:0 14px 25px;
}

/* CARD */

.card{
background:linear-gradient(145deg,#071426,#08111f);

border-radius:24px;

padding:14px;

border:1px solid #00f5ff20;

box-shadow:
0 0 15px #000,
0 0 12px #00f5ff10;

position:relative;

overflow:hidden;
}

.card::before{
content:"";

position:absolute;
inset:0;

background:
linear-gradient(120deg,transparent,rgba(255,255,255,.03),transparent);

pointer-events:none;
}

/* RANK */

.rank1{
border-color:gold;
box-shadow:0 0 20px gold;
}

.rank2{
border-color:silver;
box-shadow:0 0 18px silver;
}

.rank3{
border-color:#cd7f32;
box-shadow:0 0 18px #cd7f32;
}

.top10{
border-color:#a855f7;
box-shadow:0 0 16px #a855f7;
}

/* PLAYER */

.player{
text-align:center;
margin-bottom:14px;
}

.player-name{
font-size:22px;
font-weight:800;
color:#00ff88;
}

.player-id{
margin-top:3px;
font-size:13px;
font-weight:700;
color:#00f5ff;
}

/* RANK + TYPE */

.top-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.rank-badge{
padding:7px 12px;

border-radius:12px;

background:#00f5ff15;

border:1px solid #00f5ff30;

font-size:13px;
font-weight:800;
color:#00f5ff;
}

.type-badge{
padding:7px 12px;

border-radius:12px;

background:#00ff8815;

border:1px solid #00ff8830;

font-size:13px;
font-weight:800;
color:#00ff88;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.box{
padding:10px 6px;

border-radius:14px;

background:#081a2d;

border:1px solid #00f5ff20;

text-align:center;
}

.box-title{
font-size:10px;
font-weight:700;
letter-spacing:1px;
color:#94a3b8;
}

.box-value{
margin-top:4px;
font-size:18px;
font-weight:800;
font-family:'Orbitron';
}

/* COLORS */

.win{color:#00ff88;}
.loss{color:#ff4d6d;}
.draw{color:#ffd60a;}
.cyan{color:#00f5ff;}

/* BUTTON */

.download{
margin-top:14px;
text-align:center;
}

.download button{
padding:10px 18px;

border:none;
border-radius:14px;

background:#00f5ff;

color:#001018;

font-weight:800;
font-family:'Rajdhani';

cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

.hero-title{
font-size:21px;
}

#data{
grid-template-columns:1fr;
padding:0 10px 20px;
}

.grid{
grid-template-columns:repeat(3,1fr);
}

.box-value{
font-size:15px;
}

}

</style>
</head>

<body>

<div class="topbar">

<div class="top-left">
<img src="https://i.imgur.com/LY3Bb9m.png" class="top-logo">
<div class="top-title">GOAT FC</div>
</div>

<div class="home-btn">🏠</div>

</div>

<div class="hero">

<div class="hero-title">
GOAT FC STATISTICS
</div>

<div class="hero-sub">
ELITE PERFORMANCE DASHBOARD
</div>

</div>

<div class="search-wrap">

<input
type="text"
id="search"
class="search"
placeholder="Search Player Name or Club ID..."
oninput="render()"
/>

</div>

<div class="filters">

<button class="filter-btn active" onclick="setMode('overall',this)">
OVERALL
</button>

<button class="filter-btn" onclick="setMode('monthly',this)">
MONTHLY
</button>

</div>

<div id="data"></div>

<script>

const MATCH_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv';

const MEMBER_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=133947099&single=true&output=csv';

let players={};
let monthlyPlayers={};
let members={};

let currentMode='overall';

function setMode(mode,btn){

currentMode=mode;

document.querySelectorAll('.filter-btn')
.forEach(x=>x.classList.remove('active'));

btn.classList.add('active');

render();

}

function parseCSV(str){

const rows=[];
let quote=false,row=[],col='';

for(let i=0;i<str.length;i++){

const c=str[i];

if(c==='"'){
quote=!quote;
}

else if(c===','&&!quote){
row.push(col);
col='';
}

else if((c==='\n'||c==='\r')&&!quote){

if(col||row.length){

row.push(col);
rows.push(row);

row=[];
col='';

}

}

else{
col+=c;
}

}

if(col||row.length){

row.push(col);
rows.push(row);

}

return rows;

}

function normalize(x){
return (x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
}

function updatePlayer(store,id,s,c){

if(!store[id]){

store[id]={

match:0,
win:0,
loss:0,
draw:0,
gs:0,
gc:0,
seven:0

};

}

const p=store[id];

p.match++;
p.gs+=s;
p.gc+=c;

if(s>c)p.win++;
else if(s<c)p.loss++;
else p.draw++;

if(s>=7)p.seven++;

p.diff=p.gs-p.gc;
p.winp=((p.win/p.match)*100)||0;
p.rate=(p.gs/p.match)||0;

}

async function init(){

const [matchText,memberText]=await Promise.all([

fetch(MATCH_URL+'&t='+Date.now()).then(r=>r.text()),
fetch(MEMBER_URL+'&t='+Date.now()).then(r=>r.text())

]);

const matchRows=parseCSV(matchText).slice(1);
const memberRows=parseCSV(memberText).slice(1);

memberRows.forEach(r=>{

members[normalize(r[1])]={

name:r[0]||'Unknown'

};

});

const currentMonth=new Date().getMonth()+1;

matchRows.forEach(r=>{

if(!r.length)return;

if((r[9]||'').toLowerCase()!=='yes')return;

const p1=normalize(r[0]);
const p2=normalize(r[1]);

const s1=+r[3]||0;
const s2=+r[4]||0;

updatePlayer(players,p1,s1,s2);
updatePlayer(players,p2,s2,s1);

const date=r[11]||'';
const m=new Date(date).getMonth()+1;

if(m===currentMonth){

updatePlayer(monthlyPlayers,p1,s1,s2);
updatePlayer(monthlyPlayers,p2,s2,s1);

}

});

render();

}

function render(){

const q=normalize(document.getElementById('search').value);

const source=currentMode==='overall'
?players
:monthlyPlayers;

const sorted=Object.entries(source)
.sort((a,b)=>b[1].win-a[1].win);

let html='';

sorted.forEach(([id,p],i)=>{

const name=members[id]?.name||'Unknown Player';

if(q && !(
normalize(name).includes(q)
||
normalize(id).includes(q)
)) return;

let cls='card';

if(i===0) cls+=' rank1';
else if(i===1) cls+=' rank2';
else if(i===2) cls+=' rank3';
else if(i<10) cls+=' top10';

html+=`

<div class="${cls}">

<div class="top-row">

<div class="rank-badge">
#${i+1}
</div>

<div class="type-badge">
${currentMode.toUpperCase()}
</div>

</div>

<div class="player">

<div class="player-name">
${name}
</div>

<div class="player-id">
${id.toUpperCase()}
</div>

</div>

<div class="grid">

<div class="box">
<div class="box-title">WINS</div>
<div class="box-value win">${p.win}</div>
</div>

<div class="box">
<div class="box-title">LOSS</div>
<div class="box-value loss">${p.loss}</div>
</div>

<div class="box">
<div class="box-title">DRAW</div>
<div class="box-value draw">${p.draw}</div>
</div>

<div class="box">
<div class="box-title">MATCH</div>
<div class="box-value cyan">${p.match}</div>
</div>

<div class="box">
<div class="box-title">WIN%</div>
<div class="box-value cyan">${p.winp.toFixed(1)}</div>
</div>

<div class="box">
<div class="box-title">RATE</div>
<div class="box-value cyan">${p.rate.toFixed(2)}</div>
</div>

<div class="box">
<div class="box-title">SCORED</div>
<div class="box-value win">${p.gs}</div>
</div>

<div class="box">
<div class="box-title">CONCEDED</div>
<div class="box-value loss">${p.gc}</div>
</div>

<div class="box">
<div class="box-title">DIFF</div>
<div class="box-value cyan">${p.diff}</div>
</div>

<div class="box">
<div class="box-title">7+ GOALS</div>
<div class="box-value draw">${p.seven}</div>
</div>

</div>

<div class="download">

<button onclick="downloadCard(this)">
Download Card
</button>

</div>

</div>

`;

});

document.getElementById('data').innerHTML=html;

}

function downloadCard(btn){

html2canvas(btn.closest('.card')).then(canvas=>{

const a=document.createElement('a');

a.download='GOAT_FC_STATS.jpg';

a.href=canvas.toDataURL('image/jpeg');

a.click();

});

}

init();

</script>

</body>
</html>
