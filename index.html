<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC Submit</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    background:#05070d;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:700px;
}

/* RGB Animated Ad Box */
.ad-box{
    width:100%;
    min-height:110px;
    border-radius:18px;
    padding:3px;
    background:linear-gradient(90deg,#ff0000,#00ffff,#00ff00,#ff00ff,#ff0000);
    background-size:400%;
    animation:rgbFlow 8s linear infinite;
    margin-bottom:30px;
    box-shadow:0 0 25px rgba(0,255,255,0.35);
}

.ad-inner{
    background:#0b0f1a;
    border-radius:16px;
    min-height:104px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#00ffff;
    font-size:18px;
    font-weight:700;
    letter-spacing:1px;
}

/* Submit Button */
.submit-btn{
    width:100%;
    padding:22px;
    border:none;
    border-radius:18px;
    font-size:18px;
    font-weight:800;
    color:#fff;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:2px;
    background:linear-gradient(90deg,#00ffff,#8b5cf6,#ff00ff);
    background-size:300%;
    animation:rgbFlow 6s linear infinite;
    box-shadow:
        0 0 15px rgba(0,255,255,0.4),
        0 0 30px rgba(139,92,246,0.3);
    transition:.3s;
}

.submit-btn:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:
        0 0 25px rgba(0,255,255,0.7),
        0 0 40px rgba(255,0,255,0.4);
}

@keyframes rgbFlow{
    0%{background-position:0% 50%;}
    100%{background-position:400% 50%;}
}

@media(max-width:768px){
    .submit-btn{
        font-size:16px;
        padding:18px;
    }

    .ad-inner{
        font-size:15px;
        padding:10px;
        text-align:center;
    }
}
</style>
</head>
<body>

<div class="container">

    <!-- Ad Banner Area -->
    <div class="ad-box">
        <div class="ad-inner">
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4134818762312221"
     crossorigin="anonymous"></script>
<!-- GOAT FC -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-4134818762312221"
     data-ad-slot="9931450669"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
        </div>
    </div>

    <!-- Form Open Button -->
    <button class="submit-btn"
        onclick="window.open('https://forms.gle/Ye9pfHMbs35AqQnW6','_blank')">
        Open Score Submit Form
    </button>

</div>

</body>
</html>
