<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC Score Submit</title>
<link rel="icon" href="https://i.imgur.com/LY3Bb9m.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:#050505;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:700px;
background:linear-gradient(135deg,#ff0000,#000,#ff0000);
padding:3px;
border-radius:25px;
animation:rgb 6s linear infinite;
}

@keyframes rgb{
0%{filter:hue-rotate(0deg);}
100%{filter:hue-rotate(360deg);}
}

.inner{
background:#0a0a0a;
padding:25px;
border-radius:22px;
}

.logo{
width:90px;
display:block;
margin:auto;
}

h2{text-align:center;color:red}

input,select{
width:100%;
padding:12px;
margin-top:6px;
margin-bottom:15px;
border-radius:10px;
border:none;
background:#111;
color:white;
}

button{
width:100%;
padding:14px;
background:red;
border:none;
border-radius:12px;
color:white;
font-weight:bold;
cursor:pointer;
}

.preview{
width:100%;
margin-top:10px;
display:none;
border-radius:10px;
}

.status{text-align:center;margin-top:10px}
</style>
</head>

<body>

<div class="container">
<div class="inner">

<img src="https://i.imgur.com/LY3Bb9m.png" class="logo">
<h2>GOAT FC SCORE SUBMIT</h2>

<form id="form">

<label>Your Club ID</label>
<select id="yourClub"></select>

<label>Opponent Club ID</label>
<select id="opponentClub"></select>

<label>Match Type</label>
<select id="matchType">
<option>Friendly</option>
<option>Solo</option>
<option>League</option>
<option>CO-Op</option>
</select>

<label>Your Goal</label>
<input type="number" id="yourGoal">

<label>Opponent Goal</label>
<input type="number" id="opponentGoal">

<label>Screenshot</label>
<input type="file" id="file">
<img id="preview" class="preview">

<button type="submit">SUBMIT</button>

<div class="status" id="status"></div>

</form>

</div>
</div>

<script>
const scriptURL="YOUR_SCRIPT_URL";

const yourClub=document.getElementById("yourClub");
const opponentClub=document.getElementById("opponentClub");

for(let i=1;i<=128;i++){
let id="GFC-"+String(i).padStart(3,'0');
yourClub.innerHTML+=`<option>${id}</option>`;
opponentClub.innerHTML+=`<option>${id}</option>`;
}

let base64Image="";

document.getElementById("file").addEventListener("change",function(){
const file=this.files[0];
const reader=new FileReader();

reader.onload=function(){
base64Image=reader.result;
document.getElementById("preview").src=base64Image;
document.getElementById("preview").style.display="block";
}
reader.readAsDataURL(file);
});

document.getElementById("form").addEventListener("submit",async(e)=>{
e.preventDefault();

document.getElementById("status").innerText="Submitting...";

await fetch(scriptURL,{
method:"POST",
body:JSON.stringify({
yourClub:yourClub.value,
opponentClub:opponentClub.value,
matchType:matchType.value,
yourGoal:yourGoal.value,
opponentGoal:opponentGoal.value,
image:base64Image
})
});

document.getElementById("status").innerText="Submitted Successfully!";
});
</script>

</body>
</html>
