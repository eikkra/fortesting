<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIFA World Cup 2026 – GOAT FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
/* ═══════════════════════════════════════════
   ROOT & RESET
═══════════════════════════════════════════ */
:root{
  --bg:#04040e;
  --bg2:#07071a;
  --bg3:#0a0a1f;
  --card:#0d0d22;
  --card2:#111130;
  --border:rgba(0,240,255,0.10);
  --border2:rgba(191,0,255,0.10);
  --gold:#f0c040;
  --gold2:#c8a415;
  --red:#ff2244;
  --live:#00ff88;
  --text:#eef0ff;
  --muted:#5a5a8a;
  --muted2:#383860;
  --cyan:#00f0ff;
  --purple:#bf00ff;
  --pink:#ff007a;
  --yellow:#f5ff00;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── SCANLINES ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,240,255,0.012) 3px,rgba(0,240,255,0.012) 4px);
  pointer-events:none;z-index:9998;
}

/* ── AMBIENT BG ── */
body::after{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 10% 10%,rgba(0,240,255,0.07) 0%,transparent 50%),
    radial-gradient(ellipse at 90% 85%,rgba(191,0,255,0.07) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(255,34,68,0.04) 0%,transparent 60%);
  pointer-events:none;z-index:-1;
}

/* ── KEYFRAMES ── */
@keyframes rgbShift{
  0%{color:#00f0ff;text-shadow:0 0 20px #00f0ff88;}
  25%{color:#bf00ff;text-shadow:0 0 20px #bf00ff88;}
  50%{color:#ff007a;text-shadow:0 0 20px #ff007a88;}
  75%{color:#f5ff00;text-shadow:0 0 20px #f5ff0088;}
  100%{color:#00f0ff;text-shadow:0 0 20px #00f0ff88;}
}
@keyframes rgbBorder{
  0%{border-color:rgba(0,240,255,0.5);box-shadow:0 0 14px rgba(0,240,255,0.2),inset 0 0 8px rgba(0,240,255,0.05);}
  33%{border-color:rgba(191,0,255,0.5);box-shadow:0 0 14px rgba(191,0,255,0.2),inset 0 0 8px rgba(191,0,255,0.05);}
  66%{border-color:rgba(255,0,122,0.5);box-shadow:0 0 14px rgba(255,0,122,0.2),inset 0 0 8px rgba(255,0,122,0.05);}
  100%{border-color:rgba(0,240,255,0.5);box-shadow:0 0 14px rgba(0,240,255,0.2),inset 0 0 8px rgba(0,240,255,0.05);}
}
@keyframes shimmerText{
  0%{background-position:200% center;}
  100%{background-position:-200% center;}
}
@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,255,136,0.5);}
  50%{opacity:0.6;box-shadow:0 0 0 6px rgba(0,255,136,0);}
}
@keyframes liveGlow{
  0%,100%{text-shadow:0 0 10px rgba(0,255,136,0.5);}
  50%{text-shadow:0 0 28px rgba(0,255,136,1);}
}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes spin2{0%{transform:translate(-50%,-50%);}100%{transform:translate(-50%,-50%) rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes predBar{from{width:0;}to{width:var(--w);}}
@keyframes neonFlicker{
  0%,100%{opacity:1;}95%{opacity:0.8;}96%{opacity:0.3;}97%{opacity:0.9;}
}
@keyframes countIn{from{transform:scale(0.5);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes bracketIn{from{opacity:0;transform:translateX(-20px);}to{opacity:1;transform:translateX(0);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
.header{
  background:rgba(4,4,14,0.97);
  border-bottom:1px solid rgba(0,240,255,0.15);
  position:sticky;top:0;z-index:500;
  padding:0 14px;
  backdrop-filter:blur(20px);
  box-shadow:0 2px 30px rgba(0,240,255,0.06);
}
.header-inner{
  max-width:1200px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  height:60px;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand img{
  height:40px;width:40px;object-fit:contain;
  filter:drop-shadow(0 0 10px rgba(0,240,255,0.6)) brightness(1.1);
  animation:float 4s ease-in-out infinite;
}
.brand-text{display:flex;flex-direction:column;line-height:1;}
.brand-title{
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:2px;}
.header-center{flex:1;text-align:center;}
.wc-title{
  font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;
  letter-spacing:2px;color:var(--text);
  text-shadow:0 0 20px rgba(0,240,255,0.3);
}
.wc-title span{
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:neonFlicker 6s ease-in-out infinite;
}
.live-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(0,255,136,0.1);
  border:1px solid var(--live);border-radius:20px;
  padding:2px 10px;font-size:9px;font-weight:800;
  color:var(--live);letter-spacing:2px;margin-top:3px;
  animation:liveGlow 2s ease-in-out infinite;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.2s ease-in-out infinite;}
.header-right{display:flex;align-items:center;gap:8px;}
.refresh-btn{
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.25);
  border-radius:8px;color:var(--cyan);
  padding:7px 13px;cursor:pointer;font-size:13px;
  transition:all 0.2s;
  box-shadow:0 0 12px rgba(0,240,255,0.1);
}
.refresh-btn:hover{
  background:rgba(0,240,255,0.18);
  box-shadow:0 0 20px rgba(0,240,255,0.3);
  transform:scale(1.05);
}

/* ═══════════════════════════════════════════
   TABS
═══════════════════════════════════════════ */
.tabs-wrap{
  background:rgba(4,4,14,0.95);
  border-bottom:1px solid rgba(0,240,255,0.08);
  position:sticky;top:60px;z-index:499;
  backdrop-filter:blur(20px);
}
.tabs{display:flex;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex-shrink:0;
  padding:12px 16px;
  font-family:'Orbitron',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:1.5px;
  color:var(--muted);cursor:pointer;
  border:none;border-bottom:2px solid transparent;
  background:none;white-space:nowrap;
  transition:all 0.2s;
}
.tab:hover{color:var(--text);}
.tab.active{
  color:var(--cyan);
  border-bottom-color:var(--cyan);
  text-shadow:0 0 12px rgba(0,240,255,0.6);
}
.tab i{margin-right:5px;}

/* ═══════════════════════════════════════════
   MAIN
═══════════════════════════════════════════ */
.main{max-width:1200px;margin:0 auto;padding:16px 12px 80px;}

/* ═══════════════════════════════════════════
   HERO BANNER
═══════════════════════════════════════════ */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(0,240,255,0.05) 0%,rgba(4,4,14,0.95) 40%,rgba(191,0,255,0.05) 100%);
  border:1px solid rgba(0,240,255,0.15);
  border-radius:16px;padding:28px 20px 22px;
  margin-bottom:18px;text-align:center;
  animation:rgbBorder 5s linear infinite;
}
.hero::before{
  content:'⚽';position:absolute;
  font-size:140px;opacity:0.03;
  top:50%;left:50%;
  animation:spin2 25s linear infinite;
  pointer-events:none;
}
.hero-pretitle{
  font-family:'Orbitron',sans-serif;
  font-size:10px;font-weight:700;
  letter-spacing:5px;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink),var(--yellow),var(--cyan));
  background-size:300% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmerText 3s linear infinite;
  margin-bottom:8px;
  display:block;
}
.hero h1{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(18px,5vw,34px);
  font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,#00f0ff,#bf00ff,#ff007a,#f5ff00,#00f0ff);
  background-size:300% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmerText 4s linear infinite;
  line-height:1.1;
}
.hero-flags{font-size:28px;margin-top:10px;letter-spacing:6px;filter:drop-shadow(0 0 8px rgba(0,240,255,0.4));}
.hero-meta{display:flex;justify-content:center;gap:16px;margin-top:16px;flex-wrap:wrap;}
.hero-stat{
  text-align:center;
  background:rgba(0,240,255,0.04);
  border:1px solid rgba(0,240,255,0.12);
  border-radius:10px;padding:10px 18px;
  min-width:70px;
}
.hero-stat-val{
  font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-stat-label{font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:3px;}

/* ═══════════════════════════════════════════
   API STATUS
═══════════════════════════════════════════ */
.api-status{
  background:rgba(0,240,255,0.04);
  border:1px solid rgba(0,240,255,0.12);
  border-radius:8px;padding:9px 14px;
  font-size:11px;color:var(--muted);
  display:flex;align-items:center;gap:8px;
  margin-bottom:14px;letter-spacing:0.5px;
}
.api-status i{color:var(--cyan);}

/* ═══════════════════════════════════════════
   FILTER BAR
═══════════════════════════════════════════ */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filter-input{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;
  color:var(--text);font-family:'Rajdhani',sans-serif;
  font-size:13px;font-weight:600;flex:1;min-width:140px;
  outline:none;transition:all 0.2s;
}
.filter-input:focus{border-color:rgba(0,240,255,0.4);box-shadow:0 0 16px rgba(0,240,255,0.1);}
.filter-select{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;
  color:var(--text);font-family:'Rajdhani',sans-serif;
  font-size:13px;font-weight:600;cursor:pointer;outline:none;
}

/* ═══════════════════════════════════════════
   DATE DIVIDER
═══════════════════════════════════════════ */
.date-divider{
  display:flex;align-items:center;gap:10px;
  margin:20px 0 10px;
  color:var(--cyan);font-size:10px;font-weight:700;letter-spacing:3px;
  text-shadow:0 0 12px rgba(0,240,255,0.5);
}
.date-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,240,255,0.4),transparent);}
.date-divider i{color:var(--purple);}

/* ═══════════════════════════════════════════
   MATCH CARD
═══════════════════════════════════════════ */
.match-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;margin-bottom:8px;
  overflow:hidden;transition:all 0.22s;position:relative;
  animation:fadeUp 0.3s ease both;
}
.match-card:hover{
  border-color:rgba(0,240,255,0.25);
  transform:translateY(-2px);
  box-shadow:0 6px 30px rgba(0,240,255,0.1),0 2px 8px rgba(0,0,0,0.4);
  background:var(--card2);
}
.match-card.live{
  border-color:rgba(0,255,136,0.35);
  box-shadow:0 0 20px rgba(0,255,136,0.12);
  animation:rgbBorder 4s linear infinite;
}
.match-card.finished{border-color:rgba(191,0,255,0.2);}

.match-card-inner{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding:14px 16px;gap:10px;
}
.team-side{display:flex;align-items:center;gap:10px;}
.team-side.away{flex-direction:row-reverse;text-align:right;}
.team-flag{
  font-size:clamp(26px,6vw,38px);line-height:1;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  transition:transform 0.2s;
}
.match-card:hover .team-flag{transform:scale(1.08);}
.team-info{display:flex;flex-direction:column;}
.team-name{font-family:'Exo 2',sans-serif;font-weight:800;font-size:clamp(12px,3vw,15px);line-height:1.2;}
.team-name.long{font-size:clamp(10px,2.5vw,12px);}

.match-center{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:4px;min-width:90px;
}
.match-score{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(20px,5vw,30px);font-weight:900;
  color:var(--gold);letter-spacing:3px;white-space:nowrap;
}
.match-score.live-score{
  color:var(--live);
  animation:liveGlow 2s ease-in-out infinite;
}
.match-time{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(13px,3.5vw,18px);font-weight:700;
  color:var(--text);white-space:nowrap;
}
.match-status-row{display:flex;align-items:center;gap:5px;justify-content:center;}
.status-pill{
  border-radius:20px;padding:2px 9px;
  font-family:'Exo 2',sans-serif;
  font-size:9px;font-weight:800;letter-spacing:1.5px;white-space:nowrap;
}
.status-pill.live{
  background:rgba(0,255,136,0.12);
  border:1px solid var(--live);color:var(--live);
}
.status-pill.ft{
  background:rgba(191,0,255,0.12);
  border:1px solid rgba(191,0,255,0.4);color:var(--purple);
}
.status-pill.upcoming{
  background:rgba(0,240,255,0.06);
  border:1px solid rgba(0,240,255,0.2);color:var(--muted);
}
.match-meta{
  display:flex;align-items:center;gap:12px;
  padding:7px 16px 9px;
  border-top:1px solid rgba(255,255,255,0.04);
  font-size:11px;color:var(--muted);flex-wrap:wrap;
}
.match-meta i{font-size:10px;color:var(--purple);}

.live-minute{
  font-size:10px;font-weight:800;color:var(--live);
  display:flex;align-items:center;gap:3px;
  font-family:'Orbitron',sans-serif;
}
.live-minute-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--live);animation:pulse 1s ease-in-out infinite;
}
.countdown{
  font-family:'Orbitron',sans-serif;
  font-size:10px;color:rgba(0,240,255,0.6);text-align:center;
}
.group-strip{position:absolute;left:0;top:0;bottom:0;width:3px;}

/* ─ PREDICTION SECTION ON CARD ─ */
.pred-section{
  border-top:1px solid rgba(0,240,255,0.06);
  padding:8px 14px 10px;
  background:rgba(0,0,0,0.2);
}
.pred-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:7px;
}
.pred-label{
  font-family:'Exo 2',sans-serif;font-size:9px;font-weight:800;
  letter-spacing:2px;color:var(--muted);text-transform:uppercase;
  display:flex;align-items:center;gap:5px;
}
.pred-label i{color:var(--cyan);}
.pred-vote-count{
  font-family:'Exo 2',sans-serif;font-size:9px;
  color:var(--muted2);letter-spacing:1px;
}
.pred-bars{display:flex;gap:6px;align-items:stretch;}
.pred-bar-wrap{flex:1;display:flex;flex-direction:column;gap:4px;}
.pred-bar-label{
  font-family:'Exo 2',sans-serif;font-size:9px;font-weight:800;
  letter-spacing:1px;
  display:flex;justify-content:space-between;align-items:center;
}
.pred-track{
  height:6px;border-radius:3px;
  background:rgba(255,255,255,0.06);overflow:hidden;
}
.pred-fill{
  height:100%;border-radius:3px;
  width:var(--w);
  animation:predBar 1s ease-out both;
}
.pred-fill.home{background:linear-gradient(90deg,var(--cyan),var(--purple));}
.pred-fill.draw{background:linear-gradient(90deg,#888,#aaa);}
.pred-fill.away{background:linear-gradient(90deg,var(--pink),var(--purple));}

.vote-btns{
  display:flex;gap:5px;margin-top:8px;
}
.vote-btn{
  flex:1;padding:5px 6px;
  border-radius:5px;border:1px solid rgba(0,240,255,0.18);
  background:rgba(0,240,255,0.05);
  color:var(--muted);cursor:pointer;
  font-family:'Exo 2',sans-serif;font-size:9px;font-weight:800;
  letter-spacing:1px;transition:all 0.18s;
  white-space:nowrap;
}
.vote-btn:hover:not(:disabled){
  border-color:rgba(0,240,255,0.5);
  background:rgba(0,240,255,0.12);
  color:var(--cyan);
  box-shadow:0 0 12px rgba(0,240,255,0.2);
}
.vote-btn.voted-home{border-color:var(--cyan);background:rgba(0,240,255,0.15);color:var(--cyan);}
.vote-btn.voted-draw{border-color:#aaa;background:rgba(150,150,150,0.15);color:#ccc;}
.vote-btn.voted-away{border-color:var(--pink);background:rgba(255,0,122,0.15);color:var(--pink);}
.vote-btn:disabled{opacity:0.5;cursor:default;}
.voted-msg{
  font-family:'Exo 2',sans-serif;font-size:9px;font-weight:800;
  letter-spacing:2px;color:var(--live);
  margin-top:6px;text-align:center;
  display:none;
  animation:countIn 0.4s ease;
}

/* ═══════════════════════════════════════════
   GROUPS GRID
═══════════════════════════════════════════ */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.group-card{
  background:var(--card);border-radius:12px;
  overflow:hidden;border:1px solid var(--border);
  transition:all 0.2s;
}
.group-card:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(0,240,255,0.08);
}
.group-card-head{
  padding:10px 14px;
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;
  letter-spacing:2px;
}
.group-team-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;border-top:1px solid rgba(255,255,255,0.04);
  transition:background 0.15s;
}
.group-team-row:hover{background:rgba(0,240,255,0.04);}
.group-flag{font-size:20px;}
.group-team-name{font-size:13px;font-weight:700;flex:1;}

/* ═══════════════════════════════════════════
   KNOCKOUT
═══════════════════════════════════════════ */
.knockout-view-toggle{
  display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;
}
.ko-toggle-btn{
  padding:8px 16px;border-radius:8px;
  border:1px solid rgba(0,240,255,0.18);
  background:rgba(0,240,255,0.04);
  color:var(--muted);cursor:pointer;
  font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;
  letter-spacing:2px;transition:all 0.2s;
}
.ko-toggle-btn.active{
  border-color:var(--cyan);background:rgba(0,240,255,0.12);
  color:var(--cyan);box-shadow:0 0 14px rgba(0,240,255,0.2);
}

/* ─ LIST VIEW ─ */
.knockout-section{margin-bottom:24px;}
.knockout-phase-title{
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;
  letter-spacing:2px;padding:10px 14px;border-radius:8px;
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.ko-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}

/* ─ BRACKET VIEW ─ */
.bracket-wrap{overflow-x:auto;padding-bottom:20px;-webkit-overflow-scrolling:touch;}
.bracket{
  display:flex;gap:0;min-width:900px;
  align-items:flex-start;
  padding:20px 10px;
}
.bracket-round{
  display:flex;flex-direction:column;
  flex-shrink:0;
  position:relative;
}
.bracket-round-title{
  font-family:'Orbitron',sans-serif;font-size:8px;font-weight:900;
  letter-spacing:2px;color:var(--cyan);
  text-align:center;margin-bottom:12px;
  padding:5px 10px;
  background:rgba(0,240,255,0.06);
  border-radius:4px;
  white-space:nowrap;
}
.bracket-spacer{flex:1;}
.bracket-matches{
  display:flex;flex-direction:column;
  justify-content:space-around;
  flex:1;gap:6px;
}
.bracket-match{
  background:var(--card);
  border:1px solid rgba(0,240,255,0.12);
  border-radius:8px;overflow:hidden;
  width:160px;
  transition:all 0.2s;
  animation:bracketIn 0.4s ease both;
  cursor:default;
}
.bracket-match:hover{
  border-color:rgba(0,240,255,0.35);
  box-shadow:0 0 16px rgba(0,240,255,0.12);
}
.bracket-team{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 9px;font-size:11px;font-weight:700;
  font-family:'Exo 2',sans-serif;
  border-bottom:1px solid rgba(255,255,255,0.04);
  gap:4px;
}
.bracket-team:last-child{border-bottom:none;}
.bracket-team-name{
  font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  color:var(--text);
}
.bracket-flag{font-size:14px;}
.bracket-score{
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;
  color:var(--gold);min-width:14px;text-align:center;
}
.bracket-connector{
  display:flex;align-items:center;justify-content:center;
  width:30px;align-self:center;
  flex-shrink:0;
}
.bracket-connector-line{
  width:100%;height:2px;
  background:linear-gradient(90deg,rgba(0,240,255,0.3),rgba(191,0,255,0.3));
  border-radius:1px;
}
.bracket-final-wrap{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px 0;flex:1;
}
.bracket-trophy{
  font-size:32px;margin-bottom:10px;
  animation:float 3s ease-in-out infinite;
  filter:drop-shadow(0 0 16px rgba(240,192,64,0.8));
}

/* ─ BRACKET PHASE COLORS ─ */
.phase-r32{color:#3498db;}
.phase-r16{color:#1abc9c;}
.phase-qf{color:#e67e22;}
.phase-sf{color:#9b59b6;}
.phase-3rd{color:#7f8c8d;}
.phase-final{color:#f0c040;}

/* ═══════════════════════════════════════════
   NO CONTENT / LOADER
═══════════════════════════════════════════ */
.loading-wrap{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:60px 20px;gap:16px;
}
.spinner{
  width:40px;height:40px;
  border:3px solid rgba(0,240,255,0.15);
  border-top-color:var(--cyan);
  border-radius:50%;animation:spin 0.8s linear infinite;
}
.loading-text{
  font-family:'Orbitron',sans-serif;font-size:10px;
  color:var(--cyan);letter-spacing:3px;
}
.no-match{
  text-align:center;padding:40px;color:var(--muted);font-size:14px;
}
.no-match i{font-size:32px;display:block;margin-bottom:10px;color:var(--pink);}

/* ═══════════════════════════════════════════
   SECTION HEAD
═══════════════════════════════════════════ */
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:20px 0 12px;gap:12px;flex-wrap:wrap;
}
.section-title{
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:2px;color:var(--cyan);
  display:flex;align-items:center;gap:8px;
  text-shadow:0 0 12px rgba(0,240,255,0.4);
}

/* ═══════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════ */
.footer{
  text-align:center;padding:32px 20px 20px;
  border-top:1px solid rgba(0,240,255,0.08);
  margin-top:40px;
  background:rgba(0,240,255,0.02);
}
.footer-logo{height:46px;margin-bottom:10px;filter:drop-shadow(0 0 14px rgba(0,240,255,0.5));}
.footer-title{
  font-family:'Orbitron',sans-serif;font-size:10px;
  letter-spacing:4px;margin-bottom:4px;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.footer-sub{font-size:11px;color:var(--muted);}
.footer-links{display:flex;justify-content:center;gap:16px;margin-top:14px;flex-wrap:wrap;}
.footer-link{
  color:var(--muted);font-size:12px;text-decoration:none;
  display:flex;align-items:center;gap:5px;transition:all 0.2s;
}
.footer-link:hover{color:var(--cyan);text-shadow:0 0 12px rgba(0,240,255,0.5);}

/* ═══════════════════════════════════════════
   SCROLL TOP
═══════════════════════════════════════════ */
.scroll-top{
  position:fixed;bottom:20px;right:16px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  color:#000;border:none;border-radius:50%;
  width:44px;height:44px;font-size:15px;cursor:pointer;
  box-shadow:0 4px 20px rgba(0,240,255,0.4);
  transition:all 0.2s;display:none;z-index:800;
  align-items:center;justify-content:center;
}
.scroll-top.show{display:flex;}
.scroll-top:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,240,255,0.6);}

/* ═══════════════════════════════════════════

let liveData={};

let predictions={};

let userVotes={};

/* ══════════════════════════════════════════════
   PREDICTION STORAGE  (localStorage, 1 vote per IP simulated via fingerprint)
   Real IP enforcement = server-side; here we use a stable browser fingerprint
══════════════════════════════════════════════ */
function getBrowserFingerprint(){
  // Lightweight stable fingerprint: screen+timezone+lang+canvas hash
  const nav=window.navigator;
  const raw=[
    nav.language,nav.platform,
    screen.width+'x'+screen.height,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    nav.hardwareConcurrency||0,
    nav.deviceMemory||0
  ].join('|');
  // djb2 hash
  let h=5381;
  for(let i=0;i<raw.length;i++){h=((h<<5)+h)+raw.charCodeAt(i);}
  return (h>>>0).toString(36);
}
const FINGERPRINT=getBrowserFingerprint();

function loadPredictions(){
  try{
    const p=localStorage.getItem('gcwc26_preds');
    const v=localStorage.getItem('gcwc26_votes_'+FINGERPRINT);
    if(p)predictions=JSON.parse(p);
    if(v)userVotes=JSON.parse(v);
  }catch(e){}
}
function savePredictions(){
  try{
    localStorage.setItem('gcwc26_preds',JSON.stringify(predictions));
    localStorage.setItem('gcwc26_votes_'+FINGERPRINT,JSON.stringify(userVotes));
  }catch(e){}
}
function castVote(matchId,choice){
  // Already voted from this device?
  if(userVotes[matchId])return false;
  if(!predictions[matchId])predictions[matchId]={home:0,draw:0,away:0};
  predictions[matchId][choice]++;
  userVotes[matchId]=choice;
  savePredictions();
  return true;
}
function getPredData(matchId){
  const d=predictions[matchId]||{home:0,draw:0,away:0};
  const total=d.home+d.draw+d.away;
  if(!total)return{hp:33,dp:34,ap:33,total:0};
  return{
    hp:Math.round(d.home/total*100),
    dp:Math.round(d.draw/total*100),
    ap:Math.round(d.away/total*100),
    total
  };
}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function formatTime(t){
  const[h,m]=t.split(':').map(Number);
  const ap=h<12?'AM':'PM';
  const h12=h===0?12:h>12?h-12:h;
  return`${h12}:${m.toString().padStart(2,'0')} ${ap}`;
}
function formatDate(d){
  return new Date(d+'T00:00:00').toLocaleDateString('en-BD',{weekday:'short',month:'short',day:'numeric'});
}
function getBDNow(){
  const now=new Date();
  const utc=now.getTime()+now.getTimezoneOffset()*60000;
  return new Date(utc+6*3600000);
}
function getBDDateStr(){
  return getBDNow().toISOString().slice(0,10);
}
function matchDateTime(date,time){
  return new Date(date+'T'+time+':00+06:00');
}
function getMatchStatus(m){
  const live=liveData[m.id];
  if(live)return live;
  const kickoff=matchDateTime(m.date,m.time);
  const now=getBDNow();
  const diff=now-kickoff;
  if(diff>0&&diff<115*60000)return{status:'LIVE',minute:Math.floor(diff/60000)};
  if(diff>115*60000&&(m.homeScore!=null||liveData[m.id]))return{status:'FT',homeScore:m.homeScore,awayScore:m.awayScore};
  return{status:'NS'};
}
function countdown(date,time){
  const kickoff=matchDateTime(date,time);
  const now=getBDNow();
  const diff=kickoff-now;
  if(diff<=0)return'';
  const h=Math.floor(diff/3600000);
  const min=Math.floor((diff%3600000)/60000);
  if(h>48){const days=Math.floor(h/24);return`<i class="far fa-clock"></i> ${days}d ${h%24}h`;}
  return`<i class="far fa-clock"></i> ${h}h ${min}m`;
}
function tncl(name){return name.length>14?'team-name long':'team-name';}

      </div>

        <div class="pred-bar-label" style="flex-direction:row-reverse;"><span style="color:#ff007a;font-size:9px;">${FLAGS[m.away]||''} ${m.away.split(' ').slice(-1)[0].toUpperCase()}</span><span style="color:#ff007a;">${pd.ap}%</span></div>
        <div class="pred-track"><div class="pred-fill away" style="--w:${pd.ap}%"></div></div>
      </div>
    </div>
    ${!locked?`
    <div class="vote-btns" id="vbtns-${m.id}">
      <button class="vote-btn" onclick="doVote('${m.id}','home')" title="Vote ${m.home}">⚽ ${m.home.length>10?m.home.split(' ')[0]:m.home}</button>
      <button class="vote-btn" onclick="doVote('${m.id}','draw')" title="Vote Draw">🤝 DRAW</button>
      <button class="vote-btn" onclick="doVote('${m.id}','away')" title="Vote ${m.away}">⚽ ${m.away.length>10?m.away.split(' ')[0]:m.away}</button>
    </div>
    `:''}
    ${voted?`<div class="voted-msg" style="display:block;">✅ YOU VOTED · ${voted.toUpperCase()} · ${matchStarted?'MATCH STARTED':'LOCKED'}</div>`:''}
    ${matchStarted&&!voted?`<div class="voted-msg" style="display:block;color:var(--muted);">🔒 PREDICTION LOCKED — MATCH STARTED</div>`:''}
  </div>`;
}
function doVote(matchId,choice){
  const ok=castVote(matchId,choice);
  if(!ok){
    const el=document.querySelector(`#pred-${matchId} .voted-msg`);
    if(el){el.textContent='⚠️ ALREADY VOTED FROM THIS DEVICE';el.style.display='block';el.style.color='var(--yellow)';}
    return;
  }
  // Re-render the prediction section
  const el=document.getElementById('pred-'+matchId);
  if(el){
    const m=[...GROUP_MATCHES,...KNOCKOUT_MATCHES].find(x=>x.id===matchId);
    if(m){el.outerHTML=predHtml(m);}
  }
}

/* ══════════════════════════════════════════════
   MATCH CARD
══════════════════════════════════════════════ */
function renderMatchCard(m,isKnockout){
  const st=getMatchStatus(m);
  const isLive=st.status==='LIVE';
  const isFT=st.status==='FT';
  const hf=FLAGS[m.home]||'🏳';
  const af=FLAGS[m.away]||'🏳';
  const gc=m.group?GROUP_COLORS[m.group]:'#00f0ff';
  const kickoff=matchDateTime(m.date,m.time);
  const upcoming=getBDNow()<kickoff;

  let centerHTML='';
  if(isLive){
    const hs=st.homeScore!==undefined?st.homeScore:'0';
    const as_=st.awayScore!==undefined?st.awayScore:'0';
    centerHTML=`<div class="match-score live-score">${hs} – ${as_}</div>
    <div class="match-status-row"><div class="live-minute"><span class="live-minute-dot"></span>${st.minute||'0'}'</div></div>`;
  }else if(isFT&&st.homeScore!=null){
    centerHTML=`<div class="match-score">${st.homeScore} – ${st.awayScore}</div>
    <div class="match-status-row"><span class="status-pill ft"><i class="fas fa-check"></i> FT</span></div>`;
  }else{
    const cd=countdown(m.date,m.time);
    centerHTML=`<div class="match-time">${formatTime(m.time)}</div>
    ${cd?`<div class="countdown">${cd}</div>`:'<div class="match-status-row"><span class="status-pill upcoming">UPCOMING</span></div>'}`;
  }

  const phaseBadge=m.phase
    ?`<span style="background:rgba(240,192,64,0.12);border:1px solid rgba(240,192,64,0.3);color:var(--gold);border-radius:4px;padding:1px 8px;font-size:9px;font-weight:800;letter-spacing:1px;">${m.phase.toUpperCase()}</span>`
    :`<span style="background:${gc}18;border:1px solid ${gc}55;color:${gc};border-radius:4px;padding:1px 8px;font-size:9px;font-weight:800;letter-spacing:1px;">GRP ${m.group}</span>`;

  // Only show prediction for group matches that haven't finished
  const showPred=!isKnockout&&!isFT;

  return`<div class="match-card${isLive?' live':isFT?' finished':''}">
    ${m.group?`<div class="group-strip" style="background:${gc}"></div>`:''}
    <div class="match-card-inner" style="padding-left:${m.group?'20px':'16px'}">
      <div class="team-side home">
        <div class="team-flag">${hf}</div>
        <div class="team-info"><div class="${tncl(m.home)}">${m.home}</div></div>
      </div>
      <div class="match-center">${centerHTML}</div>
      <div class="team-side away">
        <div class="team-flag">${af}</div>
        <div class="team-info"><div class="${tncl(m.away)}">${m.away}</div></div>
      </div>
    </div>
    <div class="match-meta">
      ${phaseBadge}
      <span><i class="fas fa-map-marker-alt"></i> ${m.venue}</span>
      <span><i class="far fa-calendar"></i> ${formatDate(m.date)}</span>
    </div>
    ${showPred?predHtml(m):''}
  </div>`;
}

function renderFixtures(){
  const search=document.getElementById('searchInput').value.toLowerCase();
  const gf=document.getElementById('groupFilter').value;
  const filtered=GROUP_MATCHES.filter(m=>{
    const gok=gf==='ALL'||m.group===gf;
    const sok=!search||m.home.toLowerCase().includes(search)||m.away.toLowerCase().includes(search);
    return gok&&sok;
  });
  const byDate={};
  filtered.forEach(m=>{if(!byDate[m.date])byDate[m.date]=[];byDate[m.date].push(m);});
  let html='';
  if(!filtered.length){
    html=`<div class="no-match"><i class="fas fa-search"></i>No matches found</div>`;
  }else{
    Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).forEach(([date,matches])=>{
      html+=`<div class="date-divider"><i class="fas fa-calendar-day"></i>${formatDate(date)}</div>`;
      matches.forEach(m=>{html+=renderMatchCard(m,false);});
    });
  }
  document.getElementById('fixtureList').innerHTML=html;
  checkLiveIndicator();
}

function renderToday(){
  const today=getBDDateStr();
  const todayM=GROUP_MATCHES.filter(m=>m.date===today);
  const todayKO=KNOCKOUT_MATCHES.filter(m=>m.date===today);
  const all=[...todayM,...todayKO];
  let html='';
  if(!all.length){
    // Show next 5 upcoming matches
    const upcoming=[...GROUP_MATCHES,...KNOCKOUT_MATCHES]
      .filter(m=>matchDateTime(m.date,m.time)>getBDNow())
      .sort((a,b)=>matchDateTime(a.date,a.time)-matchDateTime(b.date,b.time))
      .slice(0,5);
    if(upcoming.length){
      html+=`<div class="date-divider"><i class="fas fa-forward"></i>NEXT UPCOMING MATCHES</div>`;
      upcoming.forEach(m=>{html+=renderMatchCard(m,!!m.phase);});
    }else{
      html=`<div class="no-match"><i class="fas fa-futbol"></i>No upcoming matches found</div>`;
    }
  }else{
    html+=`<div class="date-divider"><i class="fas fa-bolt"></i>TODAY — ${formatDate(today)}</div>`;
    all.forEach(m=>{html+=renderMatchCard(m,!!m.phase);});
  }
  document.getElementById('todayList').innerHTML=html;
}

      const af=FLAGS[m.away]||'';
      const st=getMatchStatus(m);
      html+=`<div class="bracket-match" style="animation-delay:${mi*0.06}s">
        <div class="bracket-team">
          <span class="bracket-flag">${hf}</span>
          <span class="bracket-team-name">${m.home}</span>
          ${st.status==='FT'?`<span class="bracket-score">${st.homeScore}</span>`:''}
        </div>
        <div class="bracket-team">
          <span class="bracket-flag">${af}</span>
          <span class="bracket-team-name">${m.away}</span>
          ${st.status==='FT'?`<span class="bracket-score">${st.awayScore}</span>`:''}
        </div>
      </div>`;
    });
    html+=`</div></div>`;
    // Connector
    if(pi<phases.length-1){
      html+=`<div class="bracket-connector"><div class="bracket-connector-line"></div></div>`;
    }
  });
  // Trophy at end
  html+=`<div class="bracket-final-wrap">
    <div class="bracket-trophy">🏆</div>
    <div style="font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:2px;color:var(--gold);text-shadow:0 0 16px rgba(240,192,64,0.8);">CHAMPION</div>
  </div>`;
  html+=`</div></div>`;
  document.getElementById('knockoutContent').innerHTML=html;
}

function setKoView(v){
  koView=v;
  document.getElementById('koListBtn').classList.toggle('active',v==='list');
  document.getElementById('koBracketBtn').classList.toggle('active',v==='bracket');
  if(v==='list')renderKnockoutList();
  else renderKnockoutBracket();
}

/* ══════════════════════════════════════════════
   LIVE SCORE API
══════════════════════════════════════════════ */
async function fetchLiveScores(){
  try{
    const r=await fetch('https://www.thesportsdb.com/api/v1/json/3/latestsoccer.php');
    if(!r.ok)throw new Error();
    const data=await r.json();
    if(data&&data.events){
      let found=0;
      data.events.forEach(ev=>{
        GROUP_MATCHES.forEach(m=>{
          const hm=ev.strHomeTeam&&(ev.strHomeTeam.toLowerCase().includes(m.home.toLowerCase())||m.home.toLowerCase().includes(ev.strHomeTeam.toLowerCase()));
          const am=ev.strAwayTeam&&(ev.strAwayTeam.toLowerCase().includes(m.away.toLowerCase())||m.away.toLowerCase().includes(ev.strAwayTeam.toLowerCase()));
          if(hm&&am){
            const st=ev.strStatus;
            if(st==='Match Finished'||st==='FT'||st==='AET'){
              liveData[m.id]={status:'FT',homeScore:parseInt(ev.intHomeScore)||0,awayScore:parseInt(ev.intAwayScore)||0};
            }else if(st&&!isNaN(parseInt(st))){
              liveData[m.id]={status:'LIVE',minute:parseInt(st),homeScore:parseInt(ev.intHomeScore)||0,awayScore:parseInt(ev.intAwayScore)||0};
            }
            found++;
          }
        });
      });
      const t=new Date().toLocaleTimeString('en-BD');
      updateApiStatus(found>0?`Live: ${found} match(es) active · Updated ${t}`:`Feed connected · No live matches · ${t}`,found>0);
    }
  }catch(e){
    updateApiStatus('Live feed unavailable — showing scheduled times',false);
  }
}
async function fetchCompletedScores(){
  try{
    const r=await fetch('https://www.thesportsdb.com/api/v1/json/3/eventsseason.php?id=4429&s=2026');
    if(!r.ok)throw new Error();
    const data=await r.json();
    if(data&&data.events){
      data.events.forEach(ev=>{
        if(ev.strStatus!=='Match Finished'&&ev.strStatus!=='FT')return;
        GROUP_MATCHES.forEach(m=>{
          const hm=ev.strHomeTeam&&ev.strHomeTeam.toLowerCase().includes(m.home.toLowerCase().slice(0,5));
          const am=ev.strAwayTeam&&ev.strAwayTeam.toLowerCase().includes(m.away.toLowerCase().slice(0,5));
          if(hm&&am&&!liveData[m.id]){
            liveData[m.id]={status:'FT',homeScore:parseInt(ev.intHomeScore)||0,awayScore:parseInt(ev.intAwayScore)||0};
          }
        });
      });
    }
  }catch(e){}
}
function updateApiStatus(msg,isLive){
  const el=document.getElementById('apiStatusText');
  if(el)el.textContent=msg;
  if(isLive)document.getElementById('liveIndicator').style.display='inline-flex';
  else document.getElementById('liveIndicator').style.display='none';
}
function checkLiveIndicator(){
  const hasLive=Object.values(liveData).some(d=>d.status==='LIVE');
  document.getElementById('liveIndicator').style.display=hasLive?'inline-flex':'none';
}

function calcDaysLeft(){
  const final=new Date('2026-07-20T01:00:00+06:00');
  const now=getBDNow();
  const diff=final-now;
  const days=Math.max(0,Math.ceil(diff/86400000));
  const el=document.getElementById('daysLeft');
  if(el)el.textContent=days>0?days:'🏆';
}
