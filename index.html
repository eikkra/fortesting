<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC STATISTICS</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

body{
margin:0;
font-family:'Rajdhani',sans-serif;
background:#050816;
color:white;
}

.header{
text-align:center;
padding:15px;
}

.header h1{
color:#00f5ff;
margin:0;
text-shadow:0 0 10px #00f5ff;
}

.search{
text-align:center;
margin:10px;
}

.search input{
width:90%;
max-width:400px;
padding:10px;
border-radius:10px;
border:1px solid #00f5ff;
background:#000;
color:#00f5ff;
outline:none;
}

/* GRID */
#data{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:12px;
padding:10px;
}

/* CARD */
.card{
background:linear-gradient(145deg,#0b1220,#020617);
border:1px solid rgba(0,245,255,0.25);
border-radius:16px;
padding:12px;
box-shadow:0 0 12px rgba(0,245,255,0.15);
}

/* TOP */
.title{
font-weight:700;
margin-bottom:10px;
color:#22c55e;
}

/* BOX GRID (COMPACT FIX) */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}

.box{
padding:6px;
border-radius:8px;
font-size:12px;
background:rgba(0,245,255,0.05);
border:1px solid rgba(0,245,255,0.2);

/* 🔥 COMPACT FIX */
line-height:1.1;
}

/* COLORS */
.win{color:#22c55e}
.loss{color:#ef4444}
.draw{color:#facc15}

/* ID COLOR FIX */
.id{
color:#00f5ff;
font-weight:700;
}

.name{
color:#ffffff;
font-weight:700;
}

/* BUTTON */
button{
margin-top:8px;
padding:6px 10px;
border:none;
border-radius:8px;
background:#00f5ff;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
<h1>GOAT FC STATISTICS</h1>
</div>

<div class="search">
<input id="search" placeholder="Search player..." oninput="render()">
</div>

<div id="data"></div>

<script>

const MATCH_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";

const MEMBER_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let players={}, members={};

function parseCSV(t){
let r=[],c=[],v="",q=0;
for(let i=0;i<t.length;i++){
let x=t[i];
if(x=='"'){q=!q}
else if(x==","&&!q){c.push(v);v=""}
else if((x=="\n")&&!q){c.push(v);r.push(c);c=[];v=""}
else v+=x;
}
return r;
}

function norm(x){
return (x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
}

/* MEMBERS */
async function loadMembers(){
let d=await fetch(MEMBER_URL).then(r=>r.text());
parseCSV(d).slice(1).forEach(r=>{
members[norm(r[1])] = r[0];
});
}

/* MATCH FIXED (NEW STRUCTURE) */
async function loadMatches(){
let d=await fetch(MATCH_URL).then(r=>r.text());
let rows=parseCSV(d).slice(1);

rows.forEach(r=>{

let p1=r[0], p2=r[1];
let s1=+r[3], s2=+r[4];
let approved=(r[9]||"").toLowerCase();

if(!p1||!p2||approved!=="yes") return;

if(!players[p1]) players[p1]={win:0,loss:0,draw:0,match:0,gs:0,gc:0};
if(!players[p2]) players[p2]={win:0,loss:0,draw:0,match:0,gs:0,gc:0};

let a=players[p1], b=players[p2];

a.match++; b.match++;
a.gs+=s1; a.gc+=s2;
b.gs+=s2; b.gc+=s1;

if(s1>s2){a.win++;b.loss++}
else if(s2>s1){b.win++;a.loss++}
else{a.draw++;b.draw++}

});
}

/* RENDER */
function render(){

let q=norm(document.getElementById("search").value);

let arr=Object.entries(players)
.sort((a,b)=>b[1].win-a[1].win);

let html="";

arr.forEach(([id,p])=>{

let name=members[norm(id)]||"Unknown";

if(q && !(norm(id).includes(q)||norm(name).includes(q))) return;

html+=`
<div class="card">

<div class="title">
<span class="name">${name}</span>
<span class="id">(${id})</span>
</div>

<div class="grid">

<div class="box win"><i class="fa fa-trophy"></i> Win: ${p.win}</div>
<div class="box loss"><i class="fa fa-times"></i> Loss: ${p.loss}</div>
<div class="box draw"><i class="fa fa-handshake"></i> Draw: ${p.draw}</div>

<div class="box"><i class="fa fa-gamepad"></i> Match: ${p.match}</div>
<div class="box"><i class="fa fa-futbol"></i> GS: ${p.gs}</div>
<div class="box"><i class="fa fa-shield"></i> GC: ${p.gc}</div>

</div>

</div>`;
});

document.getElementById("data").innerHTML=html;
}

async function init(){
await loadMembers();
await loadMatches();
render();
}
init();

</script>

</body>
</html>
