<!DOCTYPE html>
<html lang="en">
<head>
<title>Goat FC Leaderboard</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:'Oswald',sans-serif;
  background:linear-gradient(135deg,#020617,#0a0f1e);
  color:#e2e8f0;
  min-height:100vh;
  overflow-x:hidden;
}

/* subtle grid */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,245,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,.022) 1px,transparent 1px);
  background-size:48px 48px;
  pointer-events:none;z-index:0;
}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:999;
  height:46px;padding:0 14px;
  display:flex;align-items:center;justify-content:space-between;
  text-decoration:none;
  background:rgba(2,6,23,.93);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(0,245,255,.1);
  box-shadow:0 2px 24px rgba(0,0,0,.5);
}
.topbar-left{display:flex;align-items:center;gap:8px;}
.topbar-logo{width:26px;filter:drop-shadow(0 0 6px #00f5ff);}
.topbar-text{
  font-size:13px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(90deg,#00f5ff,#00ff88);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.topbar-right{
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:rgba(0,245,255,.07);
  border:1px solid rgba(0,245,255,.2);
  color:#00f5ff;font-size:12px;
  transition:.2s;
}
.topbar-right:hover{background:rgba(0,245,255,.16);box-shadow:0 0 14px rgba(0,245,255,.3);}

/* ── WRAPPER ── */
.wrapper{
  position:relative;z-index:1;
  max-width:900px;margin:0 auto;
  padding:0 10px 40px;
}

/* ── HEADER ── */
.header{
  display:flex;align-items:center;justify-content:center;
  gap:10px;padding:18px 10px 6px;
}
.logo{width:42px;filter:drop-shadow(0 0 10px #00ffcc);}
h1{
  font-size:20px;font-weight:700;letter-spacing:2px;
  color:#00ffcc;margin:0;
  animation:glowTitle 2.5s ease-in-out infinite alternate;
}
@keyframes glowTitle{
  from{text-shadow:0 0 5px #00ffcc;}
  to  {text-shadow:0 0 18px #00ffff,0 0 35px #00ffff44;}
}

.desc{
  font-size:12px;opacity:.5;
  margin-bottom:12px;text-align:center;letter-spacing:.5px;
}

/* ── TABS ── */
.tabs{margin:0 0 10px;display:flex;justify-content:center;gap:8px;}
.tabs button{
  padding:6px 18px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  background:rgba(255,255,255,.04);
  color:rgba(255,255,255,.45);
  font-family:'Oswald',sans-serif;
  font-size:12px;font-weight:600;letter-spacing:1px;
  cursor:pointer;transition:.2s;
}
.tabs button:hover{
  background:rgba(0,245,255,.07);
  color:#e2e8f0;
  border-color:rgba(0,245,255,.25);
}
.tabs button.active{
  background:linear-gradient(90deg,rgba(0,255,204,.15),rgba(0,195,255,.12));
  color:#fff;
  border-color:rgba(0,245,255,.45);
  box-shadow:0 0 14px rgba(0,245,255,.15);
}

/* ── STATS ROW ── */
.stats{
  display:flex;justify-content:center;
  gap:6px;flex-wrap:wrap;
  margin-bottom:12px;
}
.stat{
  padding:5px 13px;
  border-radius:20px;
  background:rgba(0,255,200,.05);
  border:1px solid rgba(0,255,200,.11);
  font-size:12px;color:rgba(255,255,255,.65);
  animation:statGlow 2.5s ease-in-out infinite alternate;
}
.stat span{color:#00ffcc;font-weight:700;}
@keyframes statGlow{
  from{box-shadow:0 0 4px rgba(0,255,200,.08);}
  to  {box-shadow:0 0 12px rgba(0,255,200,.22);}
}

/* ── CARD ── */
.card{
  background:rgba(255,255,255,.03);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:10px;
  margin-top:4px;
  overflow-x:auto;
}

/* ── TABLE ── */
table{width:100%;border-collapse:collapse;}

th{
  color:#00ffcc;
  font-size:12px;font-weight:600;letter-spacing:1px;
  padding:8px 6px;
  border-bottom:1px solid rgba(0,255,200,.1);
}
th:nth-child(1){width:5%;text-align:center;}
th:nth-child(2){width:30%;text-align:left;}
th:nth-child(n+3){text-align:center;}

td{padding:8px 6px;font-size:13px;}
td:nth-child(1){text-align:center;}
td:nth-child(n+3){text-align:center;}

.player{text-align:left;}
.pid{font-size:10px;opacity:.45;letter-spacing:.5px;margin-top:1px;}

tbody tr{
  border-bottom:1px solid rgba(255,255,255,.05);
  transition:background .15s;
}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.025);}

/* ── RANK 1 GOLD ── */
.rank1{
  background:linear-gradient(90deg,rgba(255,215,0,.17) 0%,transparent 65%);
  animation:goldGlow 2.5s ease-in-out infinite alternate;
}
@keyframes goldGlow{
  from{box-shadow:inset 0 0 8px rgba(255,215,0,.12),inset 3px 0 0 rgba(255,215,0,.35);}
  to  {box-shadow:inset 0 0 24px rgba(255,215,0,.3), inset 3px 0 0 rgba(255,215,0,.8);}
}

/* ── RANK 2 SILVER ── */
.rank2{
  background:linear-gradient(90deg,rgba(192,192,192,.14) 0%,transparent 65%);
  animation:silverGlow 2.5s ease-in-out infinite alternate;
}
@keyframes silverGlow{
  from{box-shadow:inset 0 0 8px rgba(192,192,192,.1), inset 3px 0 0 rgba(192,192,192,.3);}
  to  {box-shadow:inset 0 0 22px rgba(192,192,192,.28),inset 3px 0 0 rgba(192,192,192,.7);}
}

/* ── RANK 3 BRONZE ── */
.rank3{
  background:linear-gradient(90deg,rgba(205,127,50,.15) 0%,transparent 65%);
  animation:bronzeGlow 2.5s ease-in-out infinite alternate;
}
@keyframes bronzeGlow{
  from{box-shadow:inset 0 0 8px rgba(205,127,50,.1), inset 3px 0 0 rgba(205,127,50,.3);}
  to  {box-shadow:inset 0 0 22px rgba(205,127,50,.28),inset 3px 0 0 rgba(205,127,50,.7);}
}

/* ── TOP 4-10 ── */
.top10{
  background:linear-gradient(90deg,rgba(0,255,150,.07) 0%,transparent 65%);
  border-left:2px solid rgba(0,255,150,.25);
  animation:topGlow 3s ease-in-out infinite alternate;
}
@keyframes topGlow{
  from{border-left-color:rgba(0,255,150,.18);}
  to  {border-left-color:rgba(0,255,150,.55);}
}

/* ── MOBILE ── */
@media(max-width:600px){
  .wrapper{padding:0 6px 30px;}
  h1{font-size:17px;}
  .player{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;}
  td,th{font-size:11px;padding:7px 4px;}
}

</style>
</head>
<body>

<a href="https://goatfcbd.com" class="topbar">
  <div class="topbar-left">
    <img src="https://i.imgur.com/LY3Bb9m.png" class="topbar-logo" alt="logo">
    <div class="topbar-text">GOAT FC</div>
  </div>
  <div class="topbar-right"><i class="fa-solid fa-house"></i></div>
</a>

<div class="wrapper">

  <div class="header">
    <img src="https://i.imgur.com/LY3Bb9m.png" class="logo" alt="logo">
    <h1>GOAT FC LEADERBOARD</h1>
  </div>

  <div class="desc">Live competitive ranking based on performance, goals &amp; consistency.</div>

  <div class="tabs">
    <button onclick="loadData('monthly')" id="monthlyBtn" class="active">Monthly</button>
    <button onclick="loadData('overall')" id="overallBtn">Overall</button>
  </div>

  <div class="stats">
    <div class="stat">Match: <span id="m">0</span></div>
    <div class="stat">Goal: <span id="g">0</span></div>
    <div class="stat">Points: <span id="p">0</span></div>
    <div class="stat">Per Match: <span id="pm">0</span></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th style="text-align:left">Player</th>
          <th>Pts</th>
          <th>M</th>
          <th>Win%</th>
          <th>GF</th>
          <th>GA</th>
          <th>GD</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>
  </div>

</div>

<script>

const L="https://opensheet.elk.sh/1DSPKPaU1ZQYbFM4iYbE1VXgDAXU-FCT7--QhYJsNf1M/Leaderboard%20Goat%20FC";
const M="https://opensheet.elk.sh/1DSPKPaU1ZQYbFM4iYbE1VXgDAXU-FCT7--QhYJsNf1M/CLUB%20MEMBERS";

let type="overall";

async function loadData(t){
  type=t;
  document.getElementById("overallBtn").classList.remove("active");
  document.getElementById("monthlyBtn").classList.remove("active");
  document.getElementById(t+"Btn").classList.add("active");

  let[ld,md]=await Promise.all([
    fetch(L).then(r=>r.json()),
    fetch(M).then(r=>r.json())
  ]);

  let map={};
  md.forEach(x=>{
    if(x["Club ID Number"]) map[x["Club ID Number"].trim()]=x["Full Name"];
  });

  ld=ld.filter(r=>map[r["Club_ID"]?.trim()]);

  ld.sort((a,b)=>{
    let Am=+(type==="overall"?a["Overall_PL"]:a["Monthly_PL"])||0;
    let Bm=+(type==="overall"?b["Overall_PL"]:b["Monthly_PL"])||0;
    if(Am===0&&Bm>0)return 1;
    if(Bm===0&&Am>0)return -1;

    let Ap=+(type==="overall"?a["Overall_Point"]:a["Monthly_Point"])||0;
    let Bp=+(type==="overall"?b["Overall_Point"]:b["Monthly_Point"])||0;
    if(Bp!==Ap)return Bp-Ap;

    let Aw=+(type==="overall"?a["Overall_Win%"]:a["Monthly_Win%"])||0;
    let Bw=+(type==="overall"?b["Overall_Win%"]:b["Monthly_Win%"])||0;
    if(Bw!==Aw)return Bw-Aw;

    let Agd=+(type==="overall"?a["Total GD"]:a["Montly GD"])||0;
    let Bgd=+(type==="overall"?b["Total GD"]:b["Montly GD"])||0;
    return Bgd-Agd;
  });

  let tbody=document.getElementById("table");
  tbody.innerHTML="";

  let totalM=0,totalG=0,totalP=0;

  ld.forEach((r,i)=>{
    let cls=i==0?"rank1":i==1?"rank2":i==2?"rank3":i<10?"top10":"";

    let m  =+(t==="overall"?r["Overall_PL"]:r["Monthly_PL"])||0;
    let gf =+(t==="overall"?r["Total GF"]:r["Montly GF"])||0;
    let pt =+(t==="overall"?r["Overall_Point"]:r["Monthly_Point"])||0;
    let win=((+(t==="overall"?r["Overall_Win%"]:r["Monthly_Win%"])||0)*100).toFixed(1);
    let ga =t==="overall"?r["Total GA"]:r["Montly GA"];
    let gd =t==="overall"?r["Total GD"]:r["Montly GD"];

    totalM+=m; totalG+=gf; totalP+=pt;

    let medal=i==0?"🥇":i==1?"🥈":i==2?"🥉":i+1;

    tbody.innerHTML+=`
      <tr class="${cls}">
        <td>${medal}</td>
        <td class="player">
          ${map[r["Club_ID"]]}
          <div class="pid">${r["Club_ID"]}</div>
        </td>
        <td>${pt}</td>
        <td>${m}</td>
        <td>${win}%</td>
        <td>${gf}</td>
        <td>${ga}</td>
        <td>${gd}</td>
      </tr>`;
  });

  let match=Math.round(totalM/2);
  let per=match?(totalG/match).toFixed(2):0;
  document.getElementById("m").innerText=match;
  document.getElementById("g").innerText=totalG;
  document.getElementById("p").innerText=totalP;
  document.getElementById("pm").innerText=per;
}

loadData("monthly");
setInterval(()=>loadData(type),30000);

</script>
</body>
</html>
