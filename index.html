<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC — Ranking System</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-green: #00ff41;
    --neon-cyan: #00e5ff;
    --neon-pink: #ff006e;
    --neon-gold: #ffd700;
    --neon-purple: #bf00ff;
    --bg-dark: #030810;
    --bg-card: #0a1628;
    --bg-panel: #0d1f3c;
    --border-glow: rgba(0,255,65,0.4);
    --text-primary: #e8f4f8;
    --text-dim: #7fa8c0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-dark);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated RGB grid background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,255,65,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,65,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridPulse 4s ease-in-out infinite;
    pointer-events: none; z-index: 0;
  }

  @keyframes gridPulse {
    0%,100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* Floating orbs */
  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: 0.12;
    pointer-events: none; z-index: 0;
    animation: orbFloat 8s ease-in-out infinite;
  }
  .orb1 { width: 400px; height: 400px; background: var(--neon-green); top: -100px; left: -100px; animation-delay: 0s; }
  .orb2 { width: 300px; height: 300px; background: var(--neon-cyan); bottom: -100px; right: -100px; animation-delay: 3s; }
  .orb3 { width: 250px; height: 250px; background: var(--neon-pink); top: 50%; left: 50%; animation-delay: 6s; }

  @keyframes orbFloat {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px,-30px) scale(1.1); }
  }

  /* HEADER */
  header {
    position: relative; z-index: 10;
    text-align: center; padding: 30px 20px 20px;
    border-bottom: 1px solid rgba(0,255,65,0.2);
    background: linear-gradient(180deg, rgba(0,255,65,0.05) 0%, transparent 100%);
  }

  .logo-wrap {
    display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap;
  }

  .logo-icon {
    width: 60px; height: 60px;
    background: radial-gradient(circle, var(--neon-green), #004d14);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 30px var(--neon-green), 0 0 60px rgba(0,255,65,0.3);
    animation: logoPulse 2s ease-in-out infinite;
  }

  @keyframes logoPulse {
    0%,100% { box-shadow: 0 0 30px var(--neon-green), 0 0 60px rgba(0,255,65,0.3); }
    50% { box-shadow: 0 0 50px var(--neon-green), 0 0 100px rgba(0,255,65,0.5); }
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(24px, 5vw, 48px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--neon-green) 0%, var(--neon-cyan) 50%, var(--neon-green) 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: gradientShift 3s ease infinite;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .subtitle {
    font-family: 'Exo 2', sans-serif;
    font-size: 13px; letter-spacing: 8px;
    color: var(--neon-cyan); opacity: 0.7;
    text-transform: uppercase; margin-top: 6px;
  }

  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,0,110,0.15);
    border: 1px solid var(--neon-pink);
    border-radius: 20px; padding: 4px 14px;
    font-size: 11px; letter-spacing: 3px;
    color: var(--neon-pink); margin-top: 10px;
    text-transform: uppercase;
  }

  .live-dot {
    width: 7px; height: 7px;
    background: var(--neon-pink); border-radius: 50%;
    animation: blink 1s ease-in-out infinite;
  }

  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

  /* TEAM TYPE TABS */
  .tabs-container {
    position: relative; z-index: 10;
    display: flex; justify-content: center; gap: 8px;
    padding: 20px 16px 0;
    flex-wrap: wrap;
  }

  .tab-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 10px 24px; border-radius: 4px;
    border: 1px solid rgba(0,255,65,0.3);
    background: rgba(0,255,65,0.05);
    color: var(--text-dim); cursor: pointer;
    transition: all 0.3s ease;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    position: relative; overflow: hidden;
  }

  .tab-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
    opacity: 0; transition: opacity 0.3s;
  }

  .tab-btn:hover { color: var(--neon-green); border-color: var(--neon-green); }
  .tab-btn.active {
    border-color: var(--neon-green);
    color: var(--bg-dark);
    background: var(--neon-green);
    box-shadow: 0 0 20px rgba(0,255,65,0.5), 0 0 40px rgba(0,255,65,0.2);
    text-shadow: none;
  }

  /* PERIOD TABS */
  .period-tabs {
    position: relative; z-index: 10;
    display: flex; justify-content: center; gap: 6px;
    padding: 14px 16px 0;
  }

  .period-btn {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 7px 20px; border-radius: 2px;
    border: 1px solid rgba(0,229,255,0.25);
    background: transparent; color: var(--text-dim);
    cursor: pointer; transition: all 0.3s;
  }

  .period-btn:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); }
  .period-btn.active {
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    background: rgba(0,229,255,0.1);
    box-shadow: 0 0 15px rgba(0,229,255,0.3);
  }

  /* WEEK SELECTOR */
  .week-selector {
    position: relative; z-index: 10;
    display: none; justify-content: center; align-items: center; gap: 12px;
    padding: 12px 16px 0; flex-wrap: wrap;
  }

  .week-selector.visible { display: flex; }

  .week-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 2px;
  }

  .week-select {
    background: var(--bg-panel);
    border: 1px solid rgba(0,255,65,0.3);
    color: var(--neon-green);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; padding: 6px 12px;
    border-radius: 4px; cursor: pointer;
    outline: none;
  }

  /* MAIN CONTENT */
  .main-content {
    position: relative; z-index: 10;
    padding: 20px 16px 40px;
    max-width: 1400px; margin: 0 auto;
  }

  /* SECTION HEADER */
  .section-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }

  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(14px, 3vw, 20px);
    font-weight: 900; letter-spacing: 3px;
    color: var(--neon-green);
    text-transform: uppercase;
  }

  .section-line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--neon-green), transparent);
  }

  /* LOADING / ERROR */
  .loader {
    text-align: center; padding: 60px 20px;
  }

  .loader-ring {
    width: 60px; height: 60px;
    border: 3px solid rgba(0,255,65,0.1);
    border-top-color: var(--neon-green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px; letter-spacing: 3px;
    color: var(--neon-green); opacity: 0.7;
  }

  /* TOP 3 PODIUM */
  .podium-section { margin-bottom: 40px; }

  .podium-grid {
    display: flex; justify-content: center; align-items: flex-end;
    gap: 12px; flex-wrap: nowrap;
  }

  /* PLAYER CARD — podium */
  .player-card {
    position: relative;
    width: 160px;
    background: linear-gradient(160deg, #0d1f3c 0%, #050e1f 100%);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    flex-shrink: 0;
  }

  .player-card:hover {
    transform: translateY(-8px) scale(1.02);
  }

  .player-card.rank-1 {
    width: 190px;
    border: 2px solid var(--neon-gold);
    box-shadow: 0 0 25px rgba(255,215,0,0.4), 0 0 60px rgba(255,215,0,0.15), inset 0 0 20px rgba(255,215,0,0.05);
    animation: goldGlow 2s ease-in-out infinite;
    margin-bottom: 0;
  }

  @keyframes goldGlow {
    0%,100% { box-shadow: 0 0 25px rgba(255,215,0,0.4), 0 0 60px rgba(255,215,0,0.15), inset 0 0 20px rgba(255,215,0,0.05); }
    50% { box-shadow: 0 0 40px rgba(255,215,0,0.7), 0 0 80px rgba(255,215,0,0.3), inset 0 0 30px rgba(255,215,0,0.1); }
  }

  .player-card.rank-2 {
    width: 165px; margin-bottom: 20px;
    border: 2px solid #c0c0c0;
    box-shadow: 0 0 20px rgba(192,192,192,0.3);
  }

  .player-card.rank-3 {
    width: 155px; margin-bottom: 35px;
    border: 2px solid #cd7f32;
    box-shadow: 0 0 20px rgba(205,127,50,0.3);
  }

  /* Card RGB border animation */
  .player-card::before {
    content: '';
    position: absolute; inset: -2px; z-index: -1;
    border-radius: 10px;
    background: linear-gradient(45deg, var(--neon-green), var(--neon-cyan), var(--neon-pink), var(--neon-green));
    background-size: 300% 300%;
    animation: rgbBorder 3s linear infinite;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .player-card:hover::before { opacity: 1; }

  @keyframes rgbBorder {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card-rank-badge {
    position: absolute; top: 8px; left: 8px; z-index: 5;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    font-family: 'Orbitron', sans-serif;
    font-size: 14px; font-weight: 900;
  }

  .rank-1 .card-rank-badge { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; box-shadow: 0 0 15px rgba(255,215,0,0.8); }
  .rank-2 .card-rank-badge { background: linear-gradient(135deg, #e0e0e0, #a0a0a0); color: #000; }
  .rank-3 .card-rank-badge { background: linear-gradient(135deg, #cd7f32, #8b4513); color: #fff; }

  .ref-icon {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    width: 22px; height: 22px;
    background: rgba(255,215,0,0.2);
    border: 1px solid var(--neon-gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    box-shadow: 0 0 8px rgba(255,215,0,0.5);
    cursor: help;
  }

  .card-img-wrap {
    width: 100%; aspect-ratio: 1/1.1;
    overflow: hidden; position: relative;
    background: linear-gradient(160deg, #0a2040, #051020);
  }

  .card-img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center top;
    transition: transform 0.5s ease;
  }

  .player-card:hover .card-img-wrap img {
    transform: scale(1.08);
  }

  .card-img-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    background: radial-gradient(circle, rgba(0,255,65,0.1), transparent);
  }

  /* Scanline overlay on image */
  .card-img-wrap::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    pointer-events: none;
  }

  .card-flag {
    position: absolute; bottom: 8px; left: 8px; z-index: 5;
    width: 28px; height: 18px; border-radius: 2px;
    overflow: hidden; border: 1px solid rgba(255,255,255,0.3);
  }

  .card-flag img { width: 100%; height: 100%; object-fit: cover; }

  .card-bottom {
    padding: 10px 10px 12px;
    background: linear-gradient(180deg, rgba(0,255,65,0.03), rgba(0,0,0,0.5));
    position: relative;
  }

  .card-bottom::before {
    content: '';
    position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
    opacity: 0.5;
  }

  .card-name {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(9px, 1.5vw, 11px);
    font-weight: 700; letter-spacing: 1px;
    color: #fff; text-transform: uppercase;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 0 10px rgba(0,255,65,0.5);
    margin-bottom: 8px;
  }

  .card-stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  .stat-box {
    text-align: center;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(0,255,65,0.1);
    border-radius: 3px; padding: 3px 2px;
  }

  .stat-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px; font-weight: 900;
    color: var(--neon-green);
    line-height: 1;
  }

  .stat-lbl {
    font-size: 8px; letter-spacing: 1px;
    color: var(--text-dim); text-transform: uppercase;
    margin-top: 1px;
  }

  .card-total-pts {
    text-align: center; margin-top: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 18px; font-weight: 900;
    color: var(--neon-gold);
    text-shadow: 0 0 15px rgba(255,215,0,0.7);
  }

  .card-total-label {
    font-size: 8px; letter-spacing: 2px;
    color: var(--text-dim); text-align: center;
    margin-top: 2px; text-transform: uppercase;
  }

  /* RANK TABLE */
  .rank-table-wrap {
    background: var(--bg-panel);
    border: 1px solid rgba(0,255,65,0.15);
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
  }

  .rank-table {
    width: 100%; border-collapse: collapse;
  }

  .rank-table thead tr {
    background: linear-gradient(90deg, rgba(0,255,65,0.1), rgba(0,229,255,0.05));
    border-bottom: 1px solid rgba(0,255,65,0.2);
  }

  .rank-table th {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px; letter-spacing: 2px;
    color: var(--neon-green); text-transform: uppercase;
    padding: 12px 10px; text-align: center;
    white-space: nowrap;
  }

  .rank-table th:nth-child(2) { text-align: left; }

  .rank-table tbody tr {
    border-bottom: 1px solid rgba(0,255,65,0.06);
    transition: background 0.2s;
    cursor: pointer;
  }

  .rank-table tbody tr:hover {
    background: rgba(0,255,65,0.05);
  }

  .rank-table td {
    padding: 10px 10px; text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px; font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
  }

  .rank-table td:nth-child(2) { text-align: left; }

  .rank-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px; font-weight: 900;
  }

  .rank-1-row .rank-num { color: var(--neon-gold); }
  .rank-2-row .rank-num { color: #c0c0c0; }
  .rank-3-row .rank-num { color: #cd7f32; }

  .player-cell {
    display: flex; align-items: center; gap: 10px;
  }

  .table-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    object-fit: cover; object-position: center top;
    border: 2px solid rgba(0,255,65,0.3);
    flex-shrink: 0;
  }

  .table-avatar-ph {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0,255,65,0.1);
    border: 2px solid rgba(0,255,65,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .player-name-wrap { min-width: 0; }

  .table-name {
    font-family: 'Exo 2', sans-serif;
    font-size: 14px; font-weight: 700;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 140px;
  }

  .table-teamtype {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 1px;
  }

  .pts-val {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900; font-size: 15px;
    color: var(--neon-cyan);
  }

  .positive { color: #00ff41; }
  .negative { color: #ff4444; }
  .neutral { color: var(--text-dim); }

  .ref-pts-cell { color: var(--neon-gold); font-size: 13px; }

  td .ref-mini {
    font-size: 10px; vertical-align: super;
    cursor: help;
  }

  /* WEEKLY CARD OF THE WEEK */
  .cotw-section { margin-bottom: 40px; }

  .cotw-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  /* BIG CARD (weekly POTW) */
  .big-card {
    position: relative;
    background: linear-gradient(160deg, #0a1628 0%, #040c1a 100%);
    border: 2px solid var(--neon-green);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 0 30px rgba(0,255,65,0.3),
      0 0 60px rgba(0,255,65,0.1),
      inset 0 0 30px rgba(0,255,65,0.03);
    animation: bigCardPulse 3s ease-in-out infinite;
    transition: transform 0.3s;
    cursor: pointer;
  }

  .big-card:hover { transform: scale(1.03); }

  @keyframes bigCardPulse {
    0%,100% { box-shadow: 0 0 30px rgba(0,255,65,0.3), 0 0 60px rgba(0,255,65,0.1); }
    50% { box-shadow: 0 0 50px rgba(0,255,65,0.6), 0 0 100px rgba(0,255,65,0.2); }
  }

  /* RGB corner decorations */
  .big-card::before, .big-card::after {
    content: '';
    position: absolute; width: 40px; height: 40px;
    border: 2px solid var(--neon-green); z-index: 2;
  }

  .big-card::before { top: 6px; right: 6px; border-left: none; border-bottom: none; }
  .big-card::after  { bottom: 6px; left: 6px; border-right: none; border-top: none; }

  .big-card-header {
    position: absolute; top: 0; right: 0; z-index: 5;
    writing-mode: vertical-rl; text-orientation: mixed;
    transform: rotate(180deg);
    background: var(--neon-green);
    color: var(--bg-dark);
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 900;
    letter-spacing: 2px; padding: 10px 6px;
    text-transform: uppercase;
  }

  .big-card-pts {
    position: absolute; top: 14px; left: 14px; z-index: 5;
  }

  .big-card-pts-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px; font-weight: 900;
    color: #fff; line-height: 1;
    text-shadow: 0 0 20px rgba(0,255,65,0.8);
  }

  .big-card-pts-lbl {
    font-family: 'Exo 2', sans-serif;
    font-size: 10px; letter-spacing: 3px;
    color: var(--neon-green); text-transform: uppercase;
    margin-top: 2px;
  }

  .big-card-img {
    width: 100%; aspect-ratio: 3/4;
    position: relative; overflow: hidden;
    background: radial-gradient(ellipse at bottom, #001a0a, #000);
  }

  .big-card-img img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center top;
    filter: drop-shadow(0 0 20px rgba(0,255,65,0.4));
  }

  .big-card-img-ph {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 80px;
  }

  /* Vertical text on right */
  .big-card-vtext {
    position: absolute; right: 30px; top: 0; bottom: 0;
    display: flex; align-items: center;
    writing-mode: vertical-rl;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(20px, 4vw, 30px);
    font-weight: 900; letter-spacing: 4px;
    color: var(--neon-green);
    text-transform: uppercase;
    text-shadow: 0 0 20px var(--neon-green);
    opacity: 0.15; pointer-events: none;
    z-index: 1;
  }

  .big-card-flag {
    position: absolute; bottom: 12px; left: 12px; z-index: 5;
    width: 36px; height: 24px; border-radius: 3px;
    overflow: hidden; border: 2px solid rgba(255,255,255,0.4);
  }

  .big-card-flag img { width: 100%; height: 100%; object-fit: cover; }

  .big-card-footer {
    padding: 12px 14px;

  /* MODAL */

  .modal-close {
    position: absolute; top: 14px; right: 14px;

  .modal-close:hover { color: var(--neon-pink); }

  .modal-player-header {

  .modal-avatar {
    width: 80px; height: 80px; border-radius: 8px;

    font-family: 'Orbitron', sans-serif;

  .modal-team-badge {
    display: inline-block; margin-top: 4px;

  .modal-total-pts {
    font-family: 'Orbitron', sans-serif;

  .modal-stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);

  .modal-stat {
    background: rgba(0,0,0,0.3);

  /* RESPONSIVE */
  @media (max-width: 600px) {

</style>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- HEADER -->
<header>
  <div class="logo-wrap">
    <div class="logo-icon">⚽</div>
    <div>
      <h1>GOAT FC</h1>
      <div class="subtitle">Ranking System</div>
    </div>
  </div>
  <div class="live-badge"><span class="live-dot"></span> Live Rankings</div>
</header>

<!-- TEAM TYPE TABS -->
<div class="tabs-container" id="teamTabs">
  <button class="tab-btn active" data-team="all" onclick="setTeam('all',this)">🏆 All</button>
  <button class="tab-btn" data-team="Main" onclick="setTeam('Main',this)">⭐ Main</button>
  <button class="tab-btn" data-team="Academy" onclick="setTeam('Academy',this)">🌱 Academy</button>
</div>

<!-- PERIOD TABS -->
<div class="period-tabs">
  <button class="period-btn active" data-period="overall" onclick="setPeriod('overall',this)">Overall</button>
  <button class="period-btn" data-period="monthly" onclick="setPeriod('monthly',this)">Monthly</button>
  <button class="period-btn" data-period="weekly" onclick="setPeriod('weekly',this)">Weekly</button>
</div>

<!-- WEEK SELECTOR -->
<div class="week-selector" id="weekSelector">
  <span class="week-label">📅 Week:</span>
  <select class="week-select" id="weekSelect" onchange="onWeekChange()"></select>
  <span class="week-label">|</span>
  <span class="week-label">📆 Month:</span>
  <select class="week-select" id="monthSelect" onchange="onMonthChange()"></select>
</div>

<!-- MAIN -->
<div class="main-content" id="mainContent">
  <div class="loader" id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">Loading GOAT FC Data...</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// =====================
// CONFIG
// =====================
const CSV = {
  playerSummary: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBY2ORgmyKXCM-OFDvL3B63y0fe_1CgS3NvrG7VHQ5TcSrkEn1pV8VvCdXCLDmbWFI_xx4fJ9pxVeu/pub?gid=2117536811&single=true&output=csv',
  rawMatches:    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBY2ORgmyKXCM-OFDvL3B63y0fe_1CgS3NvrG7VHQ5TcSrkEn1pV8VvCdXCLDmbWFI_xx4fJ9pxVeu/pub?gid=1272733514&single=true&output=csv',
  referee:       'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBY2ORgmyKXCM-OFDvL3B63y0fe_1CgS3NvrG7VHQ5TcSrkEn1pV8VvCdXCLDmbWFI_xx4fJ9pxVeu/pub?gid=895725044&single=true&output=csv',
  members:       'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv'
};

const PROXY = 'https://corsproxy.io/?';

// =====================
// STATE
// =====================
let state = {
  currentTeam: 'all',
  currentPeriod: 'overall',
  currentWeek: null,
  currentMonth: null,
  players: [],        // PlayerSummary
  matches: [],        // RawMatches
  refs: [],           // RefereeSummary
  members: [],        // Club Members (pics)
  weeks: [],          // unique weeks
  months: [],         // unique months
  weeklyHistory: [],  // [{week, player, pts}]
  loaded: false
};

// =====================
// CSV PARSER
// =====================
function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = parseCSVLine(lines[0]);
  return lines.slice(1).map(line => {
    const vals = parseCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (vals[i] || '').trim(); });
    return obj;
  }).filter(r => Object.values(r).some(v => v));
}

function parseCSVLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur); return result;
}

async function fetchCSV(url) {
  try {
    const res = await fetch(PROXY + encodeURIComponent(url));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    return parseCSV(text);
  } catch(e) {
    // Try without proxy
    try {
      const res = await fetch(url);
      const text = await res.text();
      return parseCSV(text);
    } catch(e2) {
      console.warn('CSV fetch failed:', url, e2);
      return [];
    }
  }
}

// =====================
// DATE HELPERS
// =====================
function getWeekNumber(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - (d.getDay()+6)%7);
  const week1 = new Date(d.getFullYear(),0,4);
  const wn = 1 + Math.round(((d.getTime()-week1.getTime())/86400000 - 3 + (week1.getDay()+6)%7)/7);
  return `${d.getFullYear()}-W${String(wn).padStart(2,'0')}`;
}

function getMonthKey(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function friendlyMonth(key) {
  if (!key) return '';
  const [y, m] = key.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)-1]} ${y}`;
}

// =====================
// LOAD DATA
// =====================
async function loadData() {
  const [players, matches, refs, members] = await Promise.all([
    fetchCSV(CSV.playerSummary),
    fetchCSV(CSV.rawMatches),
    fetchCSV(CSV.referee),
    fetchCSV(CSV.members)
  ]);

  state.players = players;
  state.matches = matches;
  state.refs = refs;
  state.members = members;

  // Build week/month lists from matches
  const weekSet = new Set(), monthSet = new Set();
  matches.forEach(m => {
    const ts = m['Timestamp'] || '';
    if (!ts) return;
    const d = new Date(ts);
    if (isNaN(d)) return;
    weekSet.add(getWeekNumber(d));
    monthSet.add(getMonthKey(d));
  });

  state.weeks = [...weekSet].sort().reverse();
  state.months = [...monthSet].sort().reverse();

  // Default selections
  state.currentWeek = state.weeks[0] || null;
  state.currentMonth = state.months[0] || null;

  // Build weekly history (top player per week by computed score)
  buildWeeklyHistory();

  state.loaded = true;
}

// =====================
// MERGE: player data + ref points + picture
// =====================
function getMemberPic(clubId) {
  const m = state.members.find(m => String(m['Club ID Number']).trim() === String(clubId).trim());
  return m ? (m['Profile Picture (For Web)'] || m['Profile Picture'] || '') : '';
}

function getRefPoints(playerName, clubId) {
  // Match by name or clubId
  const r = state.refs.find(r =>
    (r['Player'] && r['Player'].trim().toLowerCase() === (playerName||'').trim().toLowerCase()) ||
    (r['Club ID'] && String(r['Club ID']).trim() === String(clubId).trim())
  );
  if (!r) return 0;
  const pts = parseFloat(r['Points Earned'] || r['Points'] || 0);
  return isNaN(pts) ? 0 : pts;
}

function isReferee(playerName, clubId) {
  return state.refs.some(r =>
    (r['Player'] && r['Player'].trim().toLowerCase() === (playerName||'').trim().toLowerCase()) ||
    (r['Club ID'] && String(r['Club ID']).trim() === String(clubId).trim())
  );
}

function buildEnrichedPlayers(filterFn) {
  return state.players
    .filter(p => p['Player'])
    .filter(filterFn || (() => true))
    .map(p => {
      const name = (p['Player'] || '').trim();
      const clubId = (p['Club ID'] || '').trim();
      const refPts = getRefPoints(name, clubId);
      const basePts = parseFloat(p['Points'] || 0) || 0;
      const totalPts = basePts + refPts;
      const pic = getMemberPic(clubId);
      return {
        name, clubId,
        teamType: (p['Team Type'] || '').trim(),
        matches: parseInt(p['Matches'] || 0) || 0,
        wins: parseInt(p['Wins'] || 0) || 0,
        draws: parseInt(p['Draws'] || 0) || 0,
        losses: parseInt(p['Losses'] || 0) || 0,
        gf: parseInt(p['Goals For'] || 0) || 0,
        ga: parseInt(p['Goals Against'] || 0) || 0,
        gd: parseInt(p['Goal Diff'] || 0) || 0,
        motm: parseInt(p['MOTM'] || 0) || 0,
        yellow: parseInt(p['Yellow'] || p['Yellow Card'] || 0) || 0,
        red: parseInt(p['Red'] || p['Red Card'] || 0) || 0,
        basePts, refPts, totalPts,
        pic,
        isRef: refPts > 0
      };
    })
    .sort((a, b) => b.totalPts - a.totalPts)
    .map((p, i) => ({ ...p, rank: i + 1 }));
}

// =====================
// PERIOD-BASED FILTERS
// =====================
function filterMatchesByWeek(week) {
  return state.matches.filter(m => {
    const ts = m['Timestamp'];
    if (!ts) return false;
    const d = new Date(ts);
    return !isNaN(d) && getWeekNumber(d) === week;
  });
}

function filterMatchesByMonth(month) {
  return state.matches.filter(m => {
    const ts = m['Timestamp'];
    if (!ts) return false;
    const d = new Date(ts);
    return !isNaN(d) && getMonthKey(d) === month;
  });
}

function computePointsFromMatches(filteredMatches) {
  // pts: win=3, draw=1, loss=0. MOTM=+2
  const playerMap = {};
  filteredMatches.forEach(m => {
    const player = (m['GOAT FC Player'] || '').trim();
    const result = (m['Result'] || '').trim().toLowerCase();
    const motm = (m['MOTM'] || '').trim();
    const yellow = parseInt(m['Yellow Card'] || 0) || 0;
    const red = parseInt(m['Red Card'] || 0) || 0;
    if (!player) return;
    if (!playerMap[player]) {
      playerMap[player] = { name: player, matches: 0, wins: 0, draws: 0, losses: 0,
        gf: 0, ga: 0, gd: 0, motm: 0, yellow: 0, red: 0, basePts: 0 };
    }
    const pm = playerMap[player];
    pm.matches++;
    const gs = parseInt(m['GOAT Score'] || 0) || 0;
    const os = parseInt(m['Opp Score'] || 0) || 0;
    pm.gf += gs; pm.ga += os; pm.gd += (gs - os);
    if (result === 'win' || result === 'w') { pm.wins++; pm.basePts += 3; }
    else if (result === 'draw' || result === 'd') { pm.draws++; pm.basePts += 1; }
    else { pm.losses++; }
    if (motm && motm.toLowerCase() === player.toLowerCase()) pm.motm++;
    pm.yellow += yellow; pm.red += red;
  });

  return Object.values(playerMap).map(p => {
    const sp = state.players.find(sp => sp['Player'] && sp['Player'].trim().toLowerCase() === p.name.toLowerCase());
    const clubId = sp ? (sp['Club ID'] || '').trim() : '';
    const teamType = sp ? (sp['Team Type'] || '').trim() : '';
    const refPts = getRefPoints(p.name, clubId);
    const totalPts = p.basePts + refPts;
    const pic = getMemberPic(clubId);
    return { ...p, clubId, teamType, refPts, totalPts, pic, isRef: refPts > 0 };
  }).sort((a, b) => b.totalPts - a.totalPts)
    .map((p, i) => ({ ...p, rank: i + 1 }));
}

// =====================
// WEEKLY HISTORY
// =====================
function buildWeeklyHistory() {
  state.weeklyHistory = [];
  state.weeks.forEach(week => {
    const matches = filterMatchesByWeek(week);
    if (!matches.length) return;
    const pts = computePointsFromMatches(matches);
    if (!pts.length) return;
    const top = pts[0];
    state.weeklyHistory.push({ week, player: top, pts: top.totalPts });
  });
}

// =====================
// GET CURRENT RANKED LIST
// =====================
function getCurrentRankedList() {
  let teamFilter = p => state.currentTeam === 'all' ? true :
    (p['Team Type'] || p.teamType || '').trim() === state.currentTeam;

  if (state.currentPeriod === 'overall') {
    return buildEnrichedPlayers(p => {
      const tt = (p['Team Type'] || '').trim();
      return state.currentTeam === 'all' || tt === state.currentTeam;
    });
  } else if (state.currentPeriod === 'weekly') {
    const matches = filterMatchesByWeek(state.currentWeek);
    let data = computePointsFromMatches(matches);
    if (state.currentTeam !== 'all') data = data.filter(p => p.teamType === state.currentTeam);
    return data.map((p, i) => ({ ...p, rank: i + 1 }));
  } else {
    const matches = filterMatchesByMonth(state.currentMonth);
    let data = computePointsFromMatches(matches);
    if (state.currentTeam !== 'all') data = data.filter(p => p.teamType === state.currentTeam);
    return data.map((p, i) => ({ ...p, rank: i + 1 }));
  }
}

// =====================
// RENDER
// =====================
function render() {
  const mc = document.getElementById('mainContent');
  mc.innerHTML = '';

  if (!state.loaded) {
    mc.innerHTML = '<div class="loader"><div class="loader-ring"></div><div class="loader-text">Loading...</div></div>';
    return;
  }

  const ranked = getCurrentRankedList();

  if (!ranked.length) {
    mc.innerHTML = '<div class="no-data">⚽ NO DATA FOUND</div>';
    return;
  }

  // TOP 3 PODIUM
  const podium = ranked.slice(0, 3);
  const ordered = [];
  if (podium[1]) ordered.push({ ...podium[1], rank: 2 });
  if (podium[0]) ordered.push({ ...podium[0], rank: 1 });
  if (podium[2]) ordered.push({ ...podium[2], rank: 3 });

  const podiumHtml = `
    <div class="podium-section">
      <div class="section-header">
        <div class="section-title">🏆 Top Players</div>
        <div class="section-line"></div>
      </div>
      <div class="podium-grid">
        ${ordered.map(p => buildPlayerCard(p)).join('')}
      </div>
    </div>
  `;

  // FULL RANK TABLE
  const tableHtml = `
    <div style="margin-bottom:40px">
      <div class="section-header">
        <div class="section-title">📊 Full Rankings</div>
        <div class="section-line"></div>
      </div>
      <div class="rank-table-wrap">
        <table class="rank-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>M</th>
              <th>W</th>
              <th>D</th>
              <th>L</th>
              <th>GD</th>
              <th>MOTM</th>
              <th>⚠️</th>
              <th>🟥</th>
              <th>PTS</th>
            </tr>
          </thead>
          <tbody>
            ${ranked.map(p => buildTableRow(p)).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // WEEKLY HISTORY (only in weekly period)
  let historyHtml = '';
  if (state.currentPeriod === 'weekly') {
    const otherWeeks = state.weeklyHistory.filter(h => h.week !== state.currentWeek);
    if (otherWeeks.length) {
      historyHtml = `
        <div class="cotw-section">
          <div class="section-header">
            <div class="section-title">🌟 Player of the Week History</div>
            <div class="section-line"></div>
          </div>
          <div class="history-grid">
            ${otherWeeks.map(h => buildHistoryCard(h)).join('')}
          </div>
        </div>
      `;
    }

    // Current week POTW card
    const curWeekTop = state.weeklyHistory.find(h => h.week === state.currentWeek);
    if (curWeekTop) {
      const cotwHtml = `
        <div class="cotw-section">
          <div class="section-header">
            <div class="section-title">⚡ Player of the Week</div>
            <div class="section-line"></div>
          </div>
          <div style="display:flex;justify-content:center">
            ${buildBigCard(curWeekTop.player, state.currentWeek)}
          </div>
        </div>
      `;
      mc.innerHTML = cotwHtml + podiumHtml + tableHtml + historyHtml;
      return;
    }
  }

  mc.innerHTML = podiumHtml + tableHtml + historyHtml;
}

// =====================
// CARD BUILDERS
// =====================
function imgOrPh(pic, cls='', phSize='36px') {
  if (pic && (pic.startsWith('http') || pic.startsWith('data:'))) {
    return `<img src="${pic}" class="${cls}" onerror="this.style.display='none';this.nextSibling.style.display='flex';" loading="lazy">
            <div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-size:${phSize}">🧑</div>`;
  }
  return `<div style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-size:${phSize}">🧑</div>`;
}

function buildPlayerCard(p) {
  const rankClass = p.rank <= 3 ? `rank-${p.rank}` : '';
  const pic = p.pic;
  return `
  <div class="player-card ${rankClass}" onclick="showModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
    <div class="card-rank-badge">${p.rank}</div>
    ${p.isRef ? `<div class="ref-icon" title="Referee Points: +${p.refPts}">🟨</div>` : ''}
    <div class="card-img-wrap">
      ${imgOrPh(pic, 'card-img', '48px')}
      <div class="card-flag">
        <img src="https://flagcdn.com/w40/bd.png" alt="BD" onerror="this.style.display='none'">
      </div>
    </div>
    <div class="card-bottom">
      <div class="card-name">${p.name}</div>
      <div class="card-stats-grid">
        <div class="stat-box"><div class="stat-val">${p.wins}</div><div class="stat-lbl">W</div></div>
        <div class="stat-box"><div class="stat-val">${p.draws}</div><div class="stat-lbl">D</div></div>
        <div class="stat-box"><div class="stat-val">${p.losses}</div><div class="stat-lbl">L</div></div>
      </div>
      <div class="card-total-pts">${p.totalPts}</div>
      <div class="card-total-label">Total Points</div>
    </div>
  </div>`;
}

function buildTableRow(p) {
  const rankCls = p.rank === 1 ? 'rank-1-row' : p.rank === 2 ? 'rank-2-row' : p.rank === 3 ? 'rank-3-row' : '';
  const gdCls = p.gd > 0 ? 'positive' : p.gd < 0 ? 'negative' : 'neutral';
  const refBadge = p.isRef ? `<span class="ref-mini" title="Includes Referee Points: +${p.refPts}">🟨</span>` : '';
  const pic = p.pic;

  let avatarHtml;
  if (pic && pic.startsWith('http')) {
    avatarHtml = `<img src="${pic}" class="table-avatar" onerror="this.outerHTML='<div class=table-avatar-ph>🧑</div>'" loading="lazy">`;
  } else {
    avatarHtml = `<div class="table-avatar-ph">🧑</div>`;
  }

  return `
  <tr class="${rankCls}" onclick="showModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
    <td><span class="rank-num">${p.rank}</span></td>
    <td>
      <div class="player-cell">
        ${avatarHtml}
        <div class="player-name-wrap">
          <div class="table-name">${p.name}${refBadge}</div>
          <div class="table-teamtype">${p.teamType}</div>
        </div>
      </div>
    </td>
    <td>${p.matches}</td>
    <td class="positive">${p.wins}</td>
    <td class="neutral">${p.draws}</td>
    <td class="negative">${p.losses}</td>
    <td class="${gdCls}">${p.gd > 0 ? '+' : ''}${p.gd}</td>
    <td style="color:var(--neon-cyan)">${p.motm}</td>
    <td style="color:#ffd700">${p.yellow}</td>
    <td style="color:#ff4444">${p.red}</td>
    <td><span class="pts-val">${p.totalPts}</span></td>
  </tr>`;
}

function buildBigCard(p, week) {
  const pic = p.pic;
  const weekLabel = week ? `Week ${week.split('-W')[1]} · ${week.split('-W')[0]}` : 'POTW';
  return `
  <div class="big-card" onclick="showModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
    <div class="big-card-header">Player of the Week</div>
    <div class="big-card-pts">
      <div class="big-card-pts-num">${p.totalPts}</div>
      <div class="big-card-pts-lbl">Rank #${p.rank}</div>
    </div>
    <div class="big-card-img">
      ${pic && pic.startsWith('http')
        ? `<img src="${pic}" onerror="this.style.display='none'" loading="lazy">`
        : `<div class="big-card-img-ph">🧑</div>`}
      <div class="big-card-vtext">POTW</div>
      <div class="big-card-flag">
        <img src="https://flagcdn.com/w40/bd.png" alt="BD" onerror="this.style.display='none'">
      </div>
    </div>
    <div class="big-card-footer">
      <div class="big-card-name">${p.name}</div>
      <div class="big-card-stars">${'<span class="star">★</span>'.repeat(Math.min(5, Math.max(1, Math.round(p.wins / Math.max(p.matches,1) * 5))))}</div>
    </div>
    <div class="big-card-week-tag">${weekLabel}</div>
  </div>`;
}

function buildHistoryCard(h) {
  const p = h.player;
  const pic = p.pic;
  const wNum = h.week ? h.week.split('-W')[1] : '?';
  const yr = h.week ? h.week.split('-W')[0].slice(2) : '';
  return `
  <div class="history-card" onclick="showModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
    <div class="history-card-week">Week ${wNum} '${yr}</div>
    <div class="history-card-img">
      ${pic && pic.startsWith('http')
        ? `<img src="${pic}" onerror="this.style.display='none'" loading="lazy">`
        : `<div class="history-card-img-ph">🧑</div>`}
    </div>
    <div class="history-card-info">
      <div class="history-card-name">${p.name}</div>
      <div class="history-card-pts">${h.pts} PTS</div>
    </div>
  </div>`;
}

// =====================
// MODAL
// =====================
function showModal(p) {
  const mc = document.getElementById('modalContent');
  const pic = p.pic;
  let avatarHtml;
  if (pic && pic.startsWith('http')) {
    avatarHtml = `<img src="${pic}" class="modal-avatar" onerror="this.outerHTML='<div class=modal-avatar-ph>🧑</div>'" loading="lazy">`;
  } else {
    avatarHtml = `<div class="modal-avatar-ph">🧑</div>`;
  }

  const refSection = p.isRef ? `
    <div class="modal-ref-section">
      <div class="modal-ref-title">🟨 Referee Contribution</div>
      <div style="font-size:13px;color:var(--text-dim)">Base Points: <span style="color:var(--neon-cyan)">${p.basePts}</span> + Referee Points: <span style="color:var(--neon-gold)">${p.refPts}</span> = <span style="color:var(--neon-green)">${p.totalPts}</span></div>
    </div>` : '';

  mc.innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-player-header">
      ${avatarHtml}
      <div>
        <div class="modal-name">${p.name}</div>
        <div class="modal-team-badge">${p.teamType || 'GOAT FC'}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <img src="https://flagcdn.com/w40/bd.png" style="width:28px;height:18px;border-radius:2px;border:1px solid rgba(255,255,255,0.3)" onerror="this.style.display='none'">
          <span style="font-size:11px;color:var(--text-dim);letter-spacing:2px">ID: ${p.clubId}</span>
        </div>
        <div class="modal-total-pts">${p.totalPts} <span style="font-size:14px;color:var(--text-dim)">PTS</span></div>
        <div style="font-size:10px;letter-spacing:2px;color:var(--text-dim);margin-top:2px">RANK #${p.rank}</div>
      </div>
    </div>
    <div class="modal-stats-grid">
      <div class="modal-stat"><div class="modal-stat-val">${p.matches}</div><div class="modal-stat-lbl">Matches</div></div>
      <div class="modal-stat"><div class="modal-stat-val" style="color:#00ff41">${p.wins}</div><div class="modal-stat-lbl">Wins</div></div>
      <div class="modal-stat"><div class="modal-stat-val" style="color:#aaa">${p.draws}</div><div class="modal-stat-lbl">Draws</div></div>
      <div class="modal-stat"><div class="modal-stat-val" style="color:#ff4444">${p.losses}</div><div class="modal-stat-lbl">Losses</div></div>
      <div class="modal-stat"><div class="modal-stat-val">${p.gf}</div><div class="modal-stat-lbl">Goals For</div></div>
      <div class="modal-stat"><div class="modal-stat-val">${p.gd > 0 ? '+':''}<span style="color:${p.gd>=0?'#00ff41':'#ff4444'}">${p.gd}</span></div><div class="modal-stat-lbl">Goal Diff</div></div>
      <div class="modal-stat"><div class="modal-stat-val" style="color:var(--neon-cyan)">${p.motm}</div><div class="modal-stat-lbl">MOTM</div></div>
      <div class="modal-stat"><div class="modal-stat-val" style="color:#ffd700">${p.yellow}</div><div class="modal-stat-lbl">Yellow</div></div>
      <div class="modal-stat"><div class="modal-stat-val" style="color:#ff4444">${p.red}</div><div class="modal-stat-lbl">Red</div></div>
    </div>
    ${refSection}
  `;

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay') || e === undefined) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

// =====================
// CONTROLS
// =====================
function setTeam(team, btn) {
  state.currentTeam = team;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setPeriod(period, btn) {
  state.currentPeriod = period;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const ws = document.getElementById('weekSelector');
  ws.classList.toggle('visible', period !== 'overall');

  populateWeekMonthSelects();
  render();
}

function populateWeekMonthSelects() {
  const wSel = document.getElementById('weekSelect');
  const mSel = document.getElementById('monthSelect');

  wSel.innerHTML = state.weeks.map(w =>
    `<option value="${w}" ${w === state.currentWeek ? 'selected':''}>${w}</option>`
  ).join('') || '<option>No data</option>';

  mSel.innerHTML = state.months.map(m =>
    `<option value="${m}" ${m === state.currentMonth ? 'selected':''}>${friendlyMonth(m)}</option>`
  ).join('') || '<option>No data</option>';
}

function onWeekChange() {
  state.currentWeek = document.getElementById('weekSelect').value;
  if (state.currentPeriod === 'weekly') render();
}

function onMonthChange() {
  state.currentMonth = document.getElementById('monthSelect').value;
  if (state.currentPeriod === 'monthly') render();
}

// =====================
// INIT
// =====================
async function init() {
  document.getElementById('mainContent').innerHTML = `
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-text">Loading GOAT FC Data...</div>
    </div>`;

  await loadData();

  populateWeekMonthSelects();
  render();
}

init();
</script>
</body>
</html>
