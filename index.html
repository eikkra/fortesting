<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rival Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}
body{
    background:linear-gradient(135deg,#050b14,#0b1320,#101b2d);
    color:#fff;
    min-height:100vh;
    padding:14px;
}
.container{
    max-width:1400px;
    margin:auto;
}
.header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    flex-wrap:nowrap;
    padding:16px 18px;
    border-radius:18px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(0,255,183,0.2);
    box-shadow:
        0 0 15px rgba(0,255,183,0.15),
        inset 0 0 15px rgba(0,255,183,0.06);
    margin-bottom:20px;
}
.header img{
    width:48px;
    height:48px;
    object-fit:contain;
    flex-shrink:0;
}
.header h1{
    font-size:24px;
    color:#00ffb7;
    text-shadow:
        0 0 5px #00ffb7,
        0 0 15px #00ffb7;
    white-space:nowrap;
}
.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    margin-bottom:18px;
}
select{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#13243b;
    color:#fff;
    font-size:14px;
    outline:none;
}
.tableWrap{
    overflow-x:auto;
    border-radius:16px;
}
table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
    background:rgba(255,255,255,0.03);
}
th{
    background:#00ffb7;
    color:#000;
    padding:14px;
    font-size:13px;
}
td{
    padding:14px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.08);
    font-size:13px;
}
tr:hover{
    background:rgba(255,255,255,0.04);
}
.warning{
    background:rgba(255,0,0,0.14)!important;
}
.badge{
    padding:6px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
}
.ok{
    background:#143f2e;
    color:#75ffba;
}
.alert{
    background:#661919;
    color:#ff9b9b;
}
@media(max-width:768px){
    .header{
        padding:14px 12px;
    }
    .header h1{
        font-size:17px;
    }
    .header img{
        width:38px;
        height:38px;
    }
    th,td{
        padding:10px 8px;
        font-size:11px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <img src="https://i.imgur.com/LY3Bb9m.png" alt="GOAT FC">
        <h1>Rival Tracker</h1>
    </div>

    <div class="filters">
        <select id="playerSelect">
            <option value="">Select Player</option>
        </select>

        <select id="periodFilter">
            <option value="monthly">Current Month</option>
            <option value="overall">Overall</option>
        </select>

        <select id="typeFilter">
            <option value="all">All Matches</option>
            <option value="Friendly">Friendly Only</option>
            <option value="Tournament">Tournament Only</option>
        </select>
    </div>

    <div class="tableWrap">
        <table>
            <thead>
                <tr>
                    <th>Opponent</th>
                    <th>Matches</th>
                    <th>Win</th>
                    <th>Draw</th>
                    <th>Loss</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="resultTable">
                <tr><td colspan="6">Loading Data...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
const MATCH_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";
const MEMBER_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let matches=[];
let members={};

function clean(v){
    return String(v||"")
        .replace(/^"+|"+$/g,"")
        .replace(/\s+/g," ")
        .trim();
}

function parseCSV(text){
    const rows=[];
    let row=[],cur="",q=false;

    for(let i=0;i<text.length;i++){
        const c=text[i],n=text[i+1];

        if(c=='"'&&q&&n=='"'){cur+='"';i++;}
        else if(c=='"'){q=!q;}
        else if(c==','&&!q){row.push(cur);cur="";}
        else if((c=='\n'||c=='\r')&&!q){
            if(cur||row.length){
                row.push(cur);
                rows.push(row);
                row=[];cur="";
            }
        }
        else cur+=c;
    }

    if(cur||row.length){
        row.push(cur);
        rows.push(row);
    }

    return rows;
}

function approved(v){
    v=clean(v).toLowerCase();
    return ["yes","true","1","approved"].includes(v);
}

function validDate(d){
    const x=new Date(d);
    return !isNaN(x);
}

function isCurrentMonth(d){
    const x=new Date(d);
    const now=new Date();
    return x.getMonth()===now.getMonth() &&
           x.getFullYear()===now.getFullYear();
}

async function loadAll(){
    try{
        const [mRes,uRes]=await Promise.all([
            fetch(MATCH_CSV),
            fetch(MEMBER_CSV)
        ]);

        const [mTxt,uTxt]=await Promise.all([
            mRes.text(),
            uRes.text()
        ]);

        loadMembers(uTxt);
        loadMatches(mTxt);
        populatePlayers();

        resultTable.innerHTML='<tr><td colspan="6">Select Player to View Data</td></tr>';

    }catch(err){
        console.error(err);
        resultTable.innerHTML='<tr><td colspan="6">Load Failed</td></tr>';
    }
}

function loadMembers(csv){
    const rows=parseCSV(csv);
    const h=rows[0];

    rows.slice(1).forEach(r=>{
        const obj={};
        h.forEach((x,i)=>obj[clean(x)]=clean(r[i]));

        const id=clean(obj["Club ID Number"]);
        const name=clean(obj["Full Name"]);

        if(
            id &&
            name &&
            id!="#VALUE!" &&
            name!="#VALUE!"
        ){
            members[id]=`${name} - ${id}`;
        }
    });
}

function loadMatches(csv){
    const rows=parseCSV(csv);
    const h=rows[0];

    matches=rows.slice(1).map(r=>{
        const obj={};
        h.forEach((x,i)=>obj[clean(x)]=clean(r[i]));
        return obj;
    }).filter(m=>
        m.P1_ID &&
        m.P2_ID &&
        m.P1_ID!="#VALUE!" &&
        m.P2_ID!="#VALUE!"
    );
}

function populatePlayers(){
    const ids=[...new Set([
        ...matches.map(m=>clean(m.P1_ID)),
        ...matches.map(m=>clean(m.P2_ID))
    ])].filter(id=>id && id!="#VALUE!");

    ids.sort();

    playerSelect.innerHTML='<option value="">Select Player</option>';

    ids.forEach(id=>{
        const op=document.createElement("option");
        op.value=id;
        op.textContent=members[id]||id;
        playerSelect.appendChild(op);
    });
}

function renderData(){
    const player=clean(playerSelect.value);
    const period=periodFilter.value;
    const type=typeFilter.value;

    if(!player){
        resultTable.innerHTML='<tr><td colspan="6">Select Player to View Data</td></tr>';
        return;
    }

    let data=matches.filter(m=>approved(m.Approved));

    if(period==="monthly"){
        data=data.filter(m=>validDate(m.Match_Date)&&isCurrentMonth(m.Match_Date));
    }

    if(type==="Friendly"){
        data=data.filter(m=>clean(m.Match_Type)==="Friendly");
    }

    if(type==="Tournament"){
        data=data.filter(m=>clean(m.Match_Type)!=="Friendly");
    }

    const stats={};

    data.forEach(m=>{
        const p1=clean(m.P1_ID);
        const p2=clean(m.P2_ID);

        let opp,result;

        const s1=Number(m.P1_Score)||0;
        const s2=Number(m.P2_Score)||0;

        if(p1===player){
            opp=p2;
            result=s1>s2?"win":s1<s2?"loss":"draw";
        }
        else if(p2===player){
            opp=p1;
            result=s2>s1?"win":s2<s1?"loss":"draw";
        }
        else return;

        if(!stats[opp]){
            stats[opp]={total:0,win:0,draw:0,loss:0};
        }

        stats[opp].total++;
        stats[opp][result]++;
    });

    const rows=Object.entries(stats).sort((a,b)=>b[1].total-a[1].total);

    if(!rows.length){
        resultTable.innerHTML='<tr><td colspan="6">No Data Found</td></tr>';
        return;
    }

    resultTable.innerHTML=rows.map(([opp,s])=>{
        const limit=period==="monthly" && s.total>5;

        return `
        <tr class="${limit?'warning':''}">
            <td>${members[opp]||opp}</td>
            <td>${s.total}</td>
            <td>${s.win}</td>
            <td>${s.draw}</td>
            <td>${s.loss}</td>
            <td>
                <span class="badge ${limit?'alert':'ok'}">
                    ${limit?'LIMIT EXCEEDED':'OK'}
                </span>
            </td>
        </tr>
        `;
    }).join("");
}

playerSelect.addEventListener("change",renderData);
periodFilter.addEventListener("change",renderData);
typeFilter.addEventListener("change",renderData);

loadAll();
</script>

</body>
</html>
