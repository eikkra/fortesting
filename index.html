<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:radial-gradient(circle at top,#020617,#0f172a);
color:white;
overflow-x:hidden;
}

/* ===== NAVBAR ===== */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 12px;
flex-wrap:wrap;
background:rgba(15,23,42,0.85);
backdrop-filter:blur(10px);
}
.logo{display:flex;align-items:center;gap:8px;min-width:160px;}
.logo img{height:38px;filter:drop-shadow(0 0 10px #7c3aed);}
.logo span{font-size:16px;font-weight:700;white-space:nowrap;}
.nav-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
.nav-links a{
font-size:12px;padding:6px 8px;color:#cbd5f5;
text-decoration:none;white-space:nowrap;
}
.nav-links a:hover{color:#a78bfa;text-shadow:0 0 10px #a78bfa;}

/* ===== HERO ===== */
.hero{position:relative;height:240px;overflow:hidden;}
.slide-box{
position:absolute;width:100%;height:100%;
opacity:0;transition:all .9s ease;
}
.slide-box.active{opacity:1;}
.slide-box img{
width:100%;height:100%;object-fit:cover;
filter:brightness(.45);
}
.slide-content{
z-index:5;position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
text-align:center;width:90%;
}
.slide-content h1{font-size:18px;margin:4px 0;text-shadow:0 0 10px #8b5cf6;}
.slide-content p{font-size:12px;margin:5px 0;color:#cbd5f5;}
.btn{
display:inline-block;margin-top:6px;padding:7px 16px;
font-size:12px;background:linear-gradient(45deg,#7c3aed,#ec4899);
border-radius:25px;text-decoration:none;color:white;
}

/* ===== ARROWS ===== */
.arrow{
position:absolute;top:50%;transform:translateY(-50%);
background:rgba(0,0,0,.4);border:none;color:white;
font-size:18px;padding:6px 10px;cursor:pointer;
z-index:10;border-radius:50%;
}
.arrow.left{left:8px;}
.arrow.right{right:8px;}

/* ===== LIVE SCORE ===== */
.live-wrap{padding:18px 10px 8px;max-width:1200px;margin:auto;overflow:hidden;}
.live-title{
display:flex;justify-content:center;align-items:center;gap:8px;
font-size:16px;font-weight:700;margin-bottom:14px;
color:#22d3ee;text-shadow:0 0 10px #22d3ee;
}
.live-dot{
width:10px;height:10px;background:#ef4444;border-radius:50%;
animation:pulseLive 1s infinite;box-shadow:0 0 10px #ef4444;
}
@keyframes pulseLive{
0%{transform:scale(1);opacity:1;}
50%{transform:scale(1.5);opacity:.5;}
100%{transform:scale(1);opacity:1;}
}
.live-track{
display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;
scroll-behavior:smooth;scroll-snap-type:x mandatory;
}
.live-track::-webkit-scrollbar{display:none;}
.live-card{
min-width:100%;scroll-snap-align:start;
background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(124,58,237,.10));
border:1px solid rgba(34,211,238,.25);
border-radius:16px;padding:14px;
box-shadow:0 0 20px rgba(34,211,238,.12), inset 0 0 12px rgba(124,58,237,.08);
}
@media(min-width:768px){.live-card{min-width:calc(50% - 6px);}}
@media(min-width:1100px){.live-card{min-width:calc(33.333% - 8px);}}

.match-type{
display:inline-block;padding:5px 12px;border-radius:20px;
font-size:10px;font-weight:700;
background:linear-gradient(45deg,#7c3aed,#06b6d4);
margin-bottom:12px;
}
.live-mid{
display:grid;grid-template-columns:1fr auto 1fr;
align-items:center;gap:10px;
}
.player{text-align:center;min-width:0;}
.player-name{
font-size:11px;font-weight:700;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player-id{font-size:10px;color:#94a3b8;}
.score-box{font-size:22px;font-weight:800;display:flex;gap:6px;}
.score-win{color:#22c55e;}
.score-loss{color:#ef4444;}
.score-draw{color:#eab308;}

/* ===== SECTION ===== */
.section{text-align:center;padding:25px 10px;}
.section h2{
margin-bottom:15px;font-size:16px;
animation:glowPulse 2.5s infinite alternate;
}
@keyframes glowPulse{
0%{text-shadow:0 0 5px #7c3aed;}
100%{text-shadow:0 0 20px #a78bfa;}
}
.glow{color:#a78bfa;}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
padding:0 10px;
max-width:900px;
margin:auto;
}
.card{
background:rgba(255,255,255,.05);
padding:12px;border-radius:12px;
transition:.3s;cursor:pointer;text-align:center;position:relative;
}
.quick-container .card::before,
.champ-container .card::before{
content:"";position:absolute;inset:0;border-radius:12px;padding:1px;
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
-webkit-mask-composite:xor;mask-composite:exclude;
}
.quick-container .card::before{background:linear-gradient(45deg,#FFD700,#FFA500);}
.champ-container .card::before{background:linear-gradient(45deg,#38bdf8,#6366f1);}
.card:hover{transform:scale(1.05);box-shadow:0 0 20px #8b5cf6;}
.champ img{width:100%;border-radius:10px;}
.champ h4{font-size:11px;}
.champ p{font-size:10px;color:#cbd5f5;}
.desc{max-width:700px;margin:10px auto;font-size:12px;color:#cbd5f5;}

/* ===== STORE ===== */
.store-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
max-width:1000px;
margin:auto;
padding:0 10px;
}
.store-card{
background:rgba(255,255,255,.05);
border:1px solid rgba(168,85,247,.25);
border-radius:14px;
padding:10px;
box-shadow:0 0 15px rgba(124,58,237,.12);
}
.store-card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:10px;
margin-bottom:8px;
}
.store-btn{
display:block;
padding:8px;
font-size:11px;
border-radius:10px;
background:linear-gradient(45deg,#7c3aed,#06b6d4);
color:white;
text-decoration:none;
}

/* ===== VISITOR ===== */
.visitor-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
max-width:500px;
margin:20px auto 0;
padding:0 10px;
}
.visitor-card{
background:rgba(255,255,255,.05);
padding:16px;
border-radius:14px;
border:1px solid rgba(34,211,238,.25);
box-shadow:0 0 20px rgba(34,211,238,.08);
}
.visitor-card h3{
margin:0 0 8px;
font-size:12px;
color:#94a3b8;
}
.visitor-card div{
font-size:22px;
font-weight:800;
color:#22d3ee;
}

/* ===== SOCIAL ===== */
.social a{
display:inline-block;
margin:5px;padding:8px 12px;
font-size:12px;background:linear-gradient(45deg,#06b6d4,#3b82f6);
border-radius:8px;color:white;text-decoration:none;
}

.footer{
text-align:center;padding:15px;font-size:12px;
color:#94a3b8;border-top:1px solid rgba(255,255,255,.1);
}
.footer a{color:#a78bfa;text-decoration:none;}

@media(max-width:600px){
.navbar{flex-direction:column;align-items:center;}
.logo{justify-content:center;width:100%;}
.nav-links{justify-content:center;width:100%;}
.hero{height:200px;}
.store-grid{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>

<div class="navbar">
<div class="logo">
<img src="https://i.imgur.com/LY3Bb9m.png">
<span>GOAT FC</span>
</div>
<div class="nav-links">
<a href="#" target="_blank">Club Rules</a>
<a href="#" target="_blank">About</a>
<a href="#" target="_blank">Contact</a>
<a href="#" target="_blank">Registration</a>
</div>
</div>

<div class="hero">
<button class="arrow left" onclick="changeSlide(-1)">‹</button>
<button class="arrow right" onclick="changeSlide(1)">›</button>
</div>

<div class="live-wrap">
<div class="live-title"><div class="live-dot"></div>LIVE SCORE</div>
<div class="live-track" id="liveTrack"></div>
</div>

<div class="section">
<h2 class="glow">Club Hub</h2>
<div class="grid quick-container"></div>
</div>

<div class="section">
<h2 class="glow">GOAT STORE</h2>
<div class="store-grid" id="storeGrid"></div>
</div>

<div class="section" style="margin-top:-10px;">
<h2 class="glow">Hall of Champions</h2>
<div class="grid champ-container"></div>
<div class="desc">🏆 This zone represents champions, top scorers, and elite performers of Goat FC.</div>
</div>

<div class="section social">
<h2 class="glow">JOIN WITH US</h2>
</div>

<div class="visitor-grid">
<div class="visitor-card">
<h3>TOTAL VISITS</h3>
<div id="totalVisits">0</div>
</div>
<div class="visitor-card">
<h3>TODAY VISITS</h3>
<div id="todayVisits">0</div>
</div>
</div>

<div class="footer">
Design By <a href="https://www.facebook.com/mdrashedulhasan02/">Md Rashedul Hasan</a>
</div>

<script>
const sheetID="1ZoXNHa5sYiP_HaPRyL5RDML7l3kC2IaGuQCAmYkERf8";
let slides=[],current=0;

/* SLIDES */
fetch(`https://opensheet.elk.sh/${sheetID}/SLIDES`)
.then(r=>r.json())
.then(data=>{slides=data;renderSlides();startAuto();});

function renderSlides(){
let hero=document.querySelector(".hero");
hero.innerHTML=`
<button class="arrow left" onclick="changeSlide(-1)">‹</button>
<button class="arrow right" onclick="changeSlide(1)">›</button>`;
hero.innerHTML+=slides.map((item,i)=>`
<div class="slide-box ${i==0?'active':''}">
<img src="${item.image}">
<div class="slide-content">
<h1>${item.title}</h1>
<p>${item.desc}</p>
<a class="btn" href="${item.link}" target="_blank">${item.button}</a>
</div></div>`).join('');
}
function startAuto(){setInterval(()=>changeSlide(1),7000);}
function changeSlide(dir){
let boxes=document.querySelectorAll(".slide-box");
boxes[current].classList.remove("active");
current=(current+dir+boxes.length)%boxes.length;
boxes[current].classList.add("active");
}

/* STORE */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vS3VQ-e6O8uHjlq8Lsdp5j0vxxOMZH1O17Nbo1ISGXDU_EFsuBEXNWydPbuhJ46lnxqJmevXaN2xPiL/pub?gid=1152972554&single=true&output=csv")
.then(r=>r.text())
.then(csv=>{
const rows=csv.trim().split("\n").slice(1);
document.getElementById("storeGrid").innerHTML=rows.map(r=>{
const [img,btn,link]=r.split(",");
return `
<div class="store-card">
<img src="${img}">
<a class="store-btn" href="${link}" target="_blank">${btn}</a>
</div>`;
}).join('');
});

/* VISITOR COUNTER */
fetch("https://api.countapi.xyz/hit/goatfc/total")
.then(r=>r.json())
.then(d=>document.getElementById("totalVisits").innerText=d.value);

const todayKey=new Date().toISOString().slice(0,10);
fetch(`https://api.countapi.xyz/hit/goatfc/${todayKey}`)
.then(r=>r.json())
.then(d=>document.getElementById("todayVisits").innerText=d.value);
</script>

</body>
</html>
