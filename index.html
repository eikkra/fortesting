<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC Profile</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Segoe UI;
    background:#020617;
    color:#fff;
}

/* HEADER */
.header{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:10px;
}
.logo{
    width:34px;
}
.title{
    font-size:18px;
    font-weight:800;
    color:#00f5ff;
    letter-spacing:1px;
}

/* CARD */
.profile{
    width:min(700px,95%);
    margin:auto;
    background:#08111f;
    border-radius:15px;
    overflow:hidden;
    border:1px solid #00f5ff22;
}

/* COVER */
.cover{
    height:90px;
    background:url('https://c4.wallpaperflare.com/wallpaper/398/874/541/champions-league-stadium-wallpaper-preview.jpg');
    background-size:cover;
}

/* TOP */
.top{
    text-align:center;
    margin-top:-35px;
    padding-bottom:10px;
}

.avatar{
    width:75px;
    height:75px;
    border-radius:50%;
    border:2px solid #00f5ff;
}

/* NAME + ID ROW */
.nameRow{
    display:flex;
    justify-content:center;
    gap:8px;
    align-items:center;
    margin-top:6px;
    font-weight:700;
}

.name{
    color:#fff;
    font-size:16px;
}

.clubid{
    color:#00f5ff;
    font-size:13px;
}

/* RANK + CP ROW */
.subRow{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:4px;
    font-size:12px;
    color:#94a3b8;
}

.badge{
    background:#00f5ff11;
    border:1px solid #00f5ff33;
    padding:3px 8px;
    border-radius:20px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    padding:10px;
}

.box{
    background:#0f172a;
    border:1px solid #00f5ff22;
    padding:8px;
    border-radius:10px;
    text-align:center;
}

.label{font-size:9px;color:#94a3b8}
.value{font-size:14px;color:#00f5ff;font-weight:700;margin-top:3px}

/* MATCH */
.match{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    font-size:10px;
    padding:6px;
    margin:5px 10px;
    background:#0f172a;
    border-radius:10px;
}

.score{
    padding:3px 6px;
    border-radius:6px;
}

/* DOWNLOAD */
.download{
    text-align:center;
    padding:10px;
}
button{
    background:#00f5ff;
    border:none;
    padding:8px 12px;
    border-radius:20px;
    font-weight:700;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
<img class="logo" src="https://i.imgur.com/LY3Bb9m.png">
<div class="title">PLAYER PROFILE</div>
</div>

<div id="app">Loading...</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

const MATCH_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";

const MEMBER_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

const CP_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1252347749&single=true&output=csv";

const id=new URLSearchParams(location.search).get("id")?.toLowerCase().replace(/[^a-z0-9]/g,'')||"gfc001";

/* FAST CSV */
function csv(t){
return t.trim().split("\n").map(r=>r.split(","));
}

async function load(){

const [m,mem,cp]=await Promise.all([
fetch(MATCH_CSV).then(r=>r.text()),
fetch(MEMBER_CSV).then(r=>r.text()),
fetch(CP_CSV).then(r=>r.text())
]);

const M=csv(m),MEM=csv(mem),CP=csv(cp);

/* MEMBER */
const user=MEM.find(x=>
(x[1]||"").toLowerCase().replace(/[^a-z0-9]/g,'')===id
) || [];

const name=user[0]||"Unknown";
const club=user[1]||"";
const pic=user[4]||"https://i.imgur.com/LY3Bb9m.png";

/* CP */
const cpRow=CP.find(x=>
(x[0]||"").toLowerCase().replace(/[^a-z0-9]/g,'')===id
) || [];

const netcp=cpRow[6]||cpRow[7]||0;

/* MATCH + STATS */
let win=0,loss=0,draw=0,gs=0,gc=0;

M.slice(1).forEach(r=>{
if((r[9]||"").toLowerCase()!="yes")return;

const p1=r[0].toLowerCase().replace(/[^a-z0-9]/g,'');
const p2=r[1].toLowerCase().replace(/[^a-z0-9]/g,'');

if(p1!==id && p2!==id)return;

let me,op;

if(p1===id){me=+r[3];op=+r[4];}
else{me=+r[4];op=+r[3];}

gs+=me;gc+=op;

if(me>op)win++;
else if(me<op)loss++;
else draw++;
});

const total=win+loss+draw;
const rank=1; // (optional leaderboard add korte parba)

document.getElementById("app").innerHTML=`
<div class="profile">

<div class="cover"></div>

<div class="top">
<img class="avatar" src="${pic}">

<!-- NAME + CLUB ID ROW -->
<div class="nameRow">
<div class="name">${name}</div>
<div class="clubid">| ${club}</div>
</div>

<!-- RANK + CP ROW -->
<div class="subRow">
<div class="badge">🏆 Rank #${rank}</div>
<div class="badge">💰 ${netcp} CP</div>
</div>
</div>

<!-- STATS -->
<div class="grid">
<div class="box"><div class="label">WIN</div><div class="value">${win}</div></div>
<div class="box"><div class="label">LOSS</div><div class="value">${loss}</div></div>
<div class="box"><div class="label">DRAW</div><div class="value">${draw}</div></div>
<div class="box"><div class="label">MATCH</div><div class="value">${total}</div></div>
<div class="box"><div class="label">SCORED</div><div class="value">${gs}</div></div>
<div class="box"><div class="label">CONCEDED</div><div class="value">${gc}</div></div>
</div>

<div class="download">
<button onclick="download()">⬇ Download</button>
</div>

</div>
`;
}

function download(){
html2canvas(document.querySelector(".profile"),{scale:2,useCORS:true})
.then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="profile.png";
a.click();
});
}

load();

</script>

</body>
</html>
