<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Exo+2:wght@700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
--bg:#060610;
--surface:#0d0d1a;
--surface2:#111122;
--surface3:#161628;
--border:#1e1e3a;
--border2:#252548;
--neon-cyan:#00f0ff;
--neon-purple:#bf00ff;
--neon-green:#00ff88;
--neon-pink:#ff007a;
--neon-yellow:#f5ff00;
--text:#eef0ff;
--muted:#5a5a80;
--muted2:#383860;
}

/* ── ANIMATIONS ── */
@keyframes shimmer{
0%{background-position:200% center;}
100%{background-position:-200% center;}
}
@keyframes pulse{
0%,100%{opacity:1;}50%{opacity:0.3;}
}
@keyframes rgbBorder{
0%{border-color:#00f0ff;box-shadow:0 0 16px #00f0ff50;}
33%{border-color:#bf00ff;box-shadow:0 0 16px #bf00ff50;}
66%{border-color:#ff007a;box-shadow:0 0 16px #ff007a50;}
100%{border-color:#00f0ff;box-shadow:0 0 16px #00f0ff50;}
}
@keyframes glowPulse{
0%,100%{text-shadow:0 0 10px rgba(0,240,255,0.6);}
50%{text-shadow:0 0 22px rgba(0,240,255,1),0 0 40px rgba(0,240,255,0.4);}
}
@keyframes pulseLive{
0%{transform:scale(1);opacity:1;}
50%{transform:scale(1.6);opacity:.4;}
100%{transform:scale(1);opacity:1;}
}
@keyframes borderScan{
0%{background-position:0% 50%;}
100%{background-position:300% 50%;}
}
@keyframes cardFloat{
0%,100%{transform:translateY(0px);}
50%{transform:translateY(-5px);}
}
@keyframes fadeUp{
from{opacity:0;transform:translateY(18px);}
to{opacity:1;transform:translateY(0);}
}

/* ── FOOTBALL LOADING SCREEN ── */
#loadScreen{
position:fixed;inset:0;
background:var(--bg);
z-index:9999;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
gap:20px;
transition:opacity .6s ease;
}
#loadScreen.hide{
opacity:0;pointer-events:none;
}

.load-ball-wrap{
position:relative;
width:80px;height:80px;
}

.load-ball{
width:80px;height:80px;
border-radius:50%;
background:
radial-gradient(circle at 35% 35%, #fff 0%, #ccc 40%, #555 100%);
position:relative;
animation:ballSpin 1s linear infinite, ballBounce 0.5s ease-in-out infinite alternate;
box-shadow:0 0 30px rgba(0,240,255,0.4), 0 0 60px rgba(0,240,255,0.15);
overflow:hidden;
}

.load-ball::before{
content:"";
position:absolute;inset:0;border-radius:50%;
background:
repeating-conic-gradient(
#222 0deg 40deg,
transparent 40deg 72deg,
#222 72deg 112deg,
transparent 112deg 144deg,
#222 144deg 184deg,
transparent 184deg 216deg,
#222 216deg 256deg,
transparent 256deg 288deg,
#222 288deg 328deg,
transparent 328deg 360deg
);
opacity:0.45;
}

.load-ball::after{
content:"";
position:absolute;
top:8%;left:15%;
width:30%;height:25%;
background:rgba(255,255,255,0.35);
border-radius:50%;
transform:rotate(-30deg);
}

.load-shadow{
width:70px;height:12px;
background:radial-gradient(ellipse,rgba(0,240,255,0.25) 0%,transparent 70%);
border-radius:50%;
margin-top:6px;
animation:shadowPulse 0.5s ease-in-out infinite alternate;
}

@keyframes ballSpin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}
@keyframes ballBounce{
from{transform:translateY(0) rotate(0deg) scale(1);}
to{transform:translateY(-22px) rotate(180deg) scale(0.95);}
}
@keyframes shadowPulse{
from{transform:scaleX(1);opacity:0.6;}
to{transform:scaleX(0.65);opacity:0.2;}
}

.load-logo{
font-family:'Orbitron',sans-serif;
font-size:22px;font-weight:900;letter-spacing:6px;
background:linear-gradient(90deg,#00f0ff,#bf00ff,#ff007a,#00f0ff);
background-size:300% auto;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation:shimmer 2s linear infinite;
}

.load-sub{
font-family:'Exo 2',sans-serif;
font-size:9px;font-weight:800;
letter-spacing:4px;color:var(--muted);
text-transform:uppercase;
animation:pulse 1.2s ease-in-out infinite;
}

/* ── BODY ── */
body{
background:var(--bg);
font-family:'Rajdhani',sans-serif;
color:var(--text);
overflow-x:hidden;
padding-bottom:40px;
}

/* Football field subtle background */
body::before{
content:"";
position:fixed;inset:0;
background:
radial-gradient(ellipse at 15% 15%,rgba(0,240,255,0.05) 0%,transparent 45%),
radial-gradient(ellipse at 85% 85%,rgba(191,0,255,0.05) 0%,transparent 45%),
radial-gradient(ellipse at 50% 50%,rgba(0,255,136,0.015) 0%,transparent 60%);
pointer-events:none;z-index:-1;
}

/* Subtle field lines */
body::after{
content:"";
position:fixed;inset:0;
background:
repeating-linear-gradient(
0deg,
transparent,
transparent 79px,
rgba(0,255,136,0.018) 79px,
rgba(0,255,136,0.018) 80px
),
repeating-linear-gradient(
90deg,
transparent,
transparent 79px,
rgba(0,240,255,0.01) 79px,
rgba(0,240,255,0.01) 80px
);
pointer-events:none;z-index:-1;
}

/* ── NAVBAR ── */
.navbar{
height:50px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
background:rgba(6,6,16,0.97);
border-bottom:1px solid rgba(0,240,255,0.12);
position:sticky;top:0;z-index:998;
backdrop-filter:blur(14px);
box-shadow:0 2px 20px rgba(0,240,255,0.05);
gap:10px;
}

.logo{
display:flex;align-items:center;gap:8px;
flex-shrink:0;
text-decoration:none;
}

.logo img{
height:26px;
filter:drop-shadow(0 0 7px #00f0ff) brightness(1.1);
}

.logo-text{
font-family:'Orbitron',sans-serif;
font-size:14px;font-weight:900;letter-spacing:3px;
background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.nav-links{
display:flex;
align-items:center;
gap:2px;
overflow-x:auto;
scrollbar-width:none;
flex-shrink:1;
min-width:0;
}
.nav-links::-webkit-scrollbar{display:none;}

.nav-links a{
font-family:'Exo 2',sans-serif;
font-size:9px;font-weight:800;
letter-spacing:1.5px;
color:var(--muted);
text-decoration:none;
white-space:nowrap;
padding:5px 9px;
border-radius:4px;
border:1px solid transparent;
text-transform:uppercase;
transition:all .2s;
flex-shrink:0;
}
.nav-links a:hover{
color:var(--neon-cyan);
border-color:rgba(0,240,255,0.2);
background:rgba(0,240,255,0.05);
text-shadow:0 0 8px rgba(0,240,255,0.6);
}

/* ── HERO SLIDER ── */
.hero{
position:relative;
height:220px;
overflow:hidden;
background:#05050f;
}

.slide-box{
position:absolute;inset:0;
opacity:0;
transition:opacity .9s ease;
}
.slide-box.active{opacity:1;}

.slide-box img{
width:100%;height:100%;
object-fit:cover;
object-position:center 35%;
opacity:0.7;
}

.slide-overlay{
position:absolute;inset:0;
background:linear-gradient(0deg,rgba(6,6,16,0.92) 0%,rgba(6,6,16,0.25) 55%,rgba(6,6,16,0.05) 100%);
}

.slide-grid{
position:absolute;inset:0;
background:
repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(0,240,255,0.025) 39px,rgba(0,240,255,0.025) 40px),
repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(0,240,255,0.012) 39px,rgba(0,240,255,0.012) 40px);
}

.slide-content{
position:absolute;
bottom:22px;left:0;right:0;
text-align:center;
padding:0 20px;
z-index:5;
}

.slide-content h1{
font-family:'Orbitron',sans-serif;
font-size:16px;font-weight:900;
letter-spacing:3px;
/* Better title color - bright white to cyan gradient */
background:linear-gradient(90deg,#ffffff 0%,#00f0ff 50%,#f5ff00 100%);
background-size:200% auto;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation:shimmer 3s linear infinite;
margin-bottom:6px;
text-shadow:none;
}

.slide-content p{
font-family:'Exo 2',sans-serif;
font-size:10px;font-weight:700;
letter-spacing:2px;
color:rgba(238,240,255,0.65);
margin-bottom:12px;
text-transform:uppercase;
}

/* Better button - bright, visible */
.slide-btn{
display:inline-flex;align-items:center;gap:7px;
padding:8px 22px;
font-family:'Exo 2',sans-serif;
font-size:10px;font-weight:900;
letter-spacing:2px;
text-transform:uppercase;
text-decoration:none;
color:#ffffff;
background:linear-gradient(90deg,#00f0ff,#bf00ff);
border-radius:4px;
box-shadow:0 0 20px rgba(0,240,255,0.5), 0 0 40px rgba(191,0,255,0.3);
transition:all .25s;
border:1px solid rgba(255,255,255,0.2);
}
.slide-btn:hover{
box-shadow:0 0 30px rgba(0,240,255,0.7), 0 0 60px rgba(191,0,255,0.4);
transform:scale(1.04);
}

.arrow{
position:absolute;top:50%;transform:translateY(-50%);
background:rgba(6,6,16,0.75);
border:1px solid rgba(0,240,255,0.2);
color:var(--neon-cyan);
font-size:14px;
width:32px;height:32px;
display:flex;align-items:center;justify-content:center;
cursor:pointer;z-index:10;
border-radius:4px;
transition:all .2s;
}
.arrow:hover{background:rgba(0,240,255,0.12);box-shadow:0 0 12px rgba(0,240,255,0.25);}
.arrow.left{left:10px;}
.arrow.right{right:10px;}

/* ── SECTION WRAPPER ── */
.section{
max-width:960px;
margin:0 auto;
padding:22px 12px 0;
}

/* ── SECTION HEADER — CENTERED ── */
.sec-head{
display:flex;align-items:center;justify-content:center;gap:12px;
margin-bottom:14px;
}

.sec-line{
flex:1;height:1px;
background:linear-gradient(90deg,transparent,rgba(0,240,255,0.3));
max-width:120px;
}
.sec-line.right{
background:linear-gradient(270deg,transparent,rgba(0,240,255,0.3));
}

.sec-title{
font-family:'Orbitron',sans-serif;
font-size:11px;font-weight:900;
letter-spacing:4px;
background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation:glowPulse 3s ease-in-out infinite;
text-transform:uppercase;
white-space:nowrap;
}

/* ── LIVE SCORE ── */
.live-head{
display:flex;align-items:center;justify-content:center;gap:10px;
margin-bottom:14px;
}

.live-dot{
width:8px;height:8px;
background:#ef4444;border-radius:50%;
animation:pulseLive 1.2s infinite;
box-shadow:0 0 8px #ef4444;
flex-shrink:0;
}

/* 3 cards exactly on desktop, scroll on mobile */
.live-track{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

@media(max-width:700px){
.live-track{
display:flex;
overflow-x:auto;
scrollbar-width:none;
scroll-behavior:smooth;
scroll-snap-type:x mandatory;
gap:10px;
}
.live-track::-webkit-scrollbar{display:none;}
.live-card{
min-width:85vw !important;
scroll-snap-align:start;
}
}

/* LIVE CARD */
.live-card{
background:var(--surface);
border:1px solid var(--border);
border-radius:6px;
padding:12px 10px;
position:relative;
overflow:hidden;
animation:cardFloat 3s ease-in-out infinite;
}

/* Stagger float animation */
.live-card:nth-child(2){animation-delay:0.3s;}
.live-card:nth-child(3){animation-delay:0.6s;}
.live-card:nth-child(4){animation-delay:0.9s;}

/* RGB scan border */
.live-card::before{
content:"";
position:absolute;inset:0;
border-radius:6px;padding:1px;
background:linear-gradient(90deg,
transparent 0%,transparent 30%,
#00f0ff 42%,#bf00ff 50%,#ff007a 58%,
transparent 70%,transparent 100%);
background-size:300% 300%;
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
animation:borderScan 2.5s linear infinite;
pointer-events:none;
}

.live-mid{
display:grid;
grid-template-columns:1fr 76px 1fr;
align-items:center;
gap:4px;
}

.lm-player{
display:flex;flex-direction:column;
align-items:center;
text-align:center;
gap:2px;
}

.lm-rank{
font-family:'Orbitron',sans-serif;
font-size:9px;font-weight:900;
color:#ffcc00;
text-shadow:0 0 8px rgba(255,200,0,0.7);
}

.lm-name{
font-family:'Exo 2',sans-serif;
font-size:11px;font-weight:900;
line-height:1.1;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
max-width:100%;
}

.lm-id{
font-family:'Exo 2',sans-serif;
font-size:8px;font-weight:800;
color:var(--neon-cyan);
text-shadow:0 0 6px rgba(0,240,255,0.6);
}

.lm-center{
display:flex;flex-direction:column;
align-items:center;gap:3px;
}

.match-type-pill{
font-family:'Exo 2',sans-serif;
font-size:7px;font-weight:800;
letter-spacing:1px;
padding:2px 7px;border-radius:2px;
background:rgba(0,240,255,0.08);
border:1px solid rgba(0,240,255,0.25);
color:var(--neon-cyan);
text-transform:uppercase;
white-space:nowrap;
}

.score-box{
font-family:'Orbitron',sans-serif;
font-size:18px;font-weight:900;
letter-spacing:1px;
line-height:1;
}

.s-win{color:var(--neon-green);text-shadow:0 0 10px var(--neon-green);}
.s-loss{color:var(--neon-pink);text-shadow:0 0 10px var(--neon-pink);}
.s-draw{color:var(--neon-yellow);text-shadow:0 0 10px var(--neon-yellow);}
.s-sep{color:var(--muted2);font-size:13px;}

.match-date{
font-family:'Exo 2',sans-serif;
font-size:8px;font-weight:700;
color:#7dd3fc;
white-space:nowrap;
}

/* ── CLUB HUB ── */
.hub-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
gap:8px;
}

.hub-card{
background:var(--surface);
border:1px solid var(--border);
border-radius:6px;
padding:16px 10px;
cursor:pointer;
text-align:center;
position:relative;
overflow:hidden;
transition:all .25s;
animation:cardFloat 3.5s ease-in-out infinite;
}

.hub-card:nth-child(2){animation-delay:0.4s;}
.hub-card:nth-child(3){animation-delay:0.8s;}
.hub-card:nth-child(4){animation-delay:1.2s;}

.hub-card::before{
content:"";
position:absolute;inset:0;border-radius:6px;padding:1px;
background:linear-gradient(45deg,#ffcc00,#ff8800,#ffcc00);
background-size:200% auto;
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
-webkit-mask-composite:xor;mask-composite:exclude;
animation:shimmer 3s linear infinite;
}

.hub-card:hover{
transform:translateY(-5px) scale(1.02);
box-shadow:0 0 24px rgba(255,200,0,0.2);
background:var(--surface2);
}

.hub-icon{
font-size:24px;
margin-bottom:8px;
display:block;
filter:drop-shadow(0 0 6px rgba(255,200,0,0.5));
}

.hub-title{
font-family:'Exo 2',sans-serif;
font-size:9px;font-weight:800;
letter-spacing:1.5px;
color:var(--text);
text-transform:uppercase;
}

/* ── COMING SOON ── */
.store-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
}

.store-card{
background:var(--surface);
border:1px solid var(--border);
border-radius:6px;
overflow:hidden;
transition:all .25s;
animation:cardFloat 4s ease-in-out infinite;
}

.store-card:nth-child(2){animation-delay:0.5s;}
.store-card:nth-child(3){animation-delay:1s;}
.store-card:nth-child(4){animation-delay:1.5s;}

.store-card:hover{
transform:translateY(-5px);
border-color:rgba(0,240,255,0.3);
box-shadow:0 0 22px rgba(0,240,255,0.1);
}

.store-card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
display:block;
}

.store-btn{
display:block;
margin:8px;
padding:8px;
font-family:'Exo 2',sans-serif;
font-size:9px;font-weight:800;
letter-spacing:1.5px;
text-align:center;
text-transform:uppercase;
text-decoration:none;
color:#fff;
background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple));
border-radius:3px;
transition:opacity .2s;
box-shadow:0 0 12px rgba(0,240,255,0.3);
}
.store-btn:hover{opacity:0.85;}

/* ── HALL OF CHAMPIONS ── */
.champ-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
gap:8px;
margin-bottom:10px;
}

.champ-card{
background:var(--surface);
border:1px solid var(--border);
border-radius:6px;
overflow:hidden;
cursor:pointer;
text-align:center;
transition:all .25s;
position:relative;
animation:cardFloat 3.8s ease-in-out infinite;
}

.champ-card:nth-child(2){animation-delay:0.35s;}
.champ-card:nth-child(3){animation-delay:0.7s;}
.champ-card:nth-child(4){animation-delay:1.05s;}

.champ-card::before{
content:"";
position:absolute;inset:0;border-radius:6px;padding:1px;
background:linear-gradient(45deg,#38bdf8,#6366f1,#38bdf8);
background-size:200% auto;
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
-webkit-mask-composite:xor;mask-composite:exclude;
animation:shimmer 3s linear infinite;
}

.champ-card:hover{
transform:translateY(-5px) scale(1.02);
box-shadow:0 0 22px rgba(99,102,241,0.25);
}

.champ-card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
display:block;
}

.champ-info{padding:8px 6px 10px;}

.champ-title{
font-family:'Exo 2',sans-serif;
font-size:10px;font-weight:900;
color:var(--text);
margin-bottom:3px;
}

.champ-sub{
font-family:'Exo 2',sans-serif;
font-size:8px;font-weight:700;
color:var(--muted);
}

.champ-desc{
text-align:center;
font-family:'Exo 2',sans-serif;
font-size:10px;font-weight:700;
color:var(--muted);
padding:10px 0 0;
}

/* ── SOCIAL ── */
.social-wrap{
display:flex;flex-wrap:wrap;justify-content:center;gap:10px;
padding-top:4px;
}

.social-btn{
display:inline-flex;align-items:center;gap:8px;
padding:10px 20px;
font-family:'Exo 2',sans-serif;
font-size:10px;font-weight:800;
letter-spacing:1.5px;
text-transform:uppercase;
text-decoration:none;
color:var(--text);
background:var(--surface);
border:1px solid var(--border2);
border-radius:5px;
transition:all .25s;
position:relative;
overflow:hidden;
animation:cardFloat 4s ease-in-out infinite;
}

.social-btn:nth-child(2){animation-delay:0.5s;}
.social-btn:nth-child(3){animation-delay:1s;}

.social-btn::before{
content:"";
position:absolute;inset:0;
background:linear-gradient(90deg,transparent,rgba(0,240,255,0.06),transparent);
transform:translateX(-100%);
transition:transform .4s;
}
.social-btn:hover::before{transform:translateX(100%);}

.social-btn:hover{
border-color:rgba(0,240,255,0.35);
background:var(--surface2);
box-shadow:0 0 18px rgba(0,240,255,0.1);
color:var(--neon-cyan);
transform:translateY(-2px);
}

.social-btn i{
font-size:14px;
}

/* ── DIVIDER ── */
.sdiv{
height:1px;
background:linear-gradient(90deg,transparent,var(--border2),transparent);
margin:22px auto 0;
max-width:960px;
padding:0 12px;
}

/* ── FOOTER ── */
.footer{
text-align:center;
padding:20px 14px 10px;
font-family:'Exo 2',sans-serif;
font-size:9px;font-weight:700;
letter-spacing:2px;
color:var(--muted2);
text-transform:uppercase;
}
.footer a{
color:var(--neon-cyan);
text-decoration:none;
text-shadow:0 0 6px rgba(0,240,255,0.4);
}

/* ── LOADER ROW ── */
.loader-row{
padding:30px 10px;
text-align:center;
font-family:'Orbitron',sans-serif;
font-size:9px;letter-spacing:4px;color:var(--muted);
grid-column:1/-1;
}
.loader-row i{

}

</style>
</head>
<body>

    <div class="loader-row"><i class="fa-solid fa-spinner fa-spin"></i>LOADING...</div>

</div>

<div class="sdiv"></div>

<!-- FOOTER -->
<div class="footer">
  Design By <a href="https://www.facebook.com/mdrashedulhasan02/" target="_blank">Md Rashedul Hasan</a>
  &nbsp;·&nbsp; GOAT FC © 2025
</div>

<script>
const sheetID = "1ZoXNHa5sYiP_HaPRyL5RDML7l3kC2IaGuQCAmYkERf8";

/* ── LOADING SCREEN ── */
window.addEventListener('load', () => {
  setTimeout(() => {
    const ls = document.getElementById('loadScreen');
    ls.classList.add('hide');
    setTimeout(() => ls.remove(), 700);
  }, 1800);
});

/* ── SLIDES ── */
let slides = [], current = 0, autoTimer;

fetch(`https://opensheet.elk.sh/${sheetID}/SLIDES`)
  .then(r => r.json())
  .then(data => { slides = data; renderSlides(); startAuto(); })
  .catch(() => {});

function renderSlides() {
  const hero = document.getElementById('heroSlider');
  let html = `
    <button class="arrow left" onclick="changeSlide(-1)">&#8249;</button>
    <button class="arrow right" onclick="changeSlide(1)">&#8250;</button>
  `;
  html += slides.map((s, i) => `
    <div class="slide-box ${i === 0 ? 'active' : ''}">
      <img src="${s.image}" alt="">
      <div class="slide-overlay"></div>
      <div class="slide-grid"></div>
      <div class="slide-content">
        <h1>${s.title}</h1>
        <p>${s.desc}</p>
        <a class="slide-btn" href="${s.link}" target="_blank">
          <i class="fa-solid fa-bolt"></i>${s.button}
        </a>
      </div>
    </div>
  `).join('');
  hero.innerHTML = html;
}

function startAuto() {
  clearInterval(autoTimer);
  autoTimer = setInterval(() => changeSlide(1), 7000);
}

function changeSlide(dir) {
  const boxes = document.querySelectorAll('.slide-box');
  if (!boxes.length) return;
  boxes[current].classList.remove('active');
  current = (current + dir + boxes.length) % boxes.length;
  boxes[current].classList.add('active');
}

/* ── CSV PARSER ── */
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inside = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (c === '"' && inside && n === '"') { cell += '"'; i++; }
    else if (c === '"') { inside = !inside; }
    else if (c === ',' && !inside) { row.push(cell); cell = ''; }
    else if ((c === '\n' || c === '\r') && !inside) {
      if (cell || row.length) { row.push(cell); rows.push(row); row = []; cell = ''; }
      if (c === '\r' && n === '\n') i++;
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const headers = rows.shift();
  return rows.map(r => Object.fromEntries(headers.map((h, i) => [h.trim(), (r[i] || '').trim()])));
}

function formatBDTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  return d.toLocaleString('en-BD', {
    day: '2-digit', month: 'short',
    hour: '2-digit', minute: '2-digit',
    hour12: true, timeZone: 'Asia/Dhaka'
  });
}

/* ── LIVE SCORE ── */
Promise.all([
  fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv&t=" + Date.now()).then(r => r.text()),
  fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv&t=" + Date.now()).then(r => r.text()),
  fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1033046915&single=true&output=csv&t=" + Date.now()).then(r => r.text())
]).then(([matchCSV, memberCSV, leaderCSV]) => {

  const matches = parseCSV(matchCSV)
    .filter(m => m.Approved?.toLowerCase() === 'yes' && !isNaN(parseFloat(m.P1_Score)) && !isNaN(parseFloat(m.P2_Score)))
    .slice(-10).reverse();

  const nameMap = {};
  parseCSV(memberCSV).forEach(m => nameMap[m["Club ID Number"]] = m["Full Name"]);

  const rankMap = {};
  parseCSV(leaderCSV).forEach(r => { rankMap[r["Club_ID"]] = r["Overall Rank"]; });

  if (!matches.length) {
    document.getElementById('liveTrack').innerHTML = `<div class="loader-row" style="grid-column:1/-1">No recent matches</div>`;
    return;
  }

  /* Show only latest 3 on desktop (grid shows all, but we limit to 3) */
  const show = matches.slice(0, 3);

  document.getElementById('liveTrack').innerHTML = show.map((m, idx) => {
    const p1 = nameMap[m.P1_ID] || m.P1_ID;
    const p2 = nameMap[m.P2_ID] || m.P2_ID;
    const p1Rank = rankMap[m.P1_ID] ? `#${rankMap[m.P1_ID]}` : '';
    const p2Rank = rankMap[m.P2_ID] ? `#${rankMap[m.P2_ID]}` : '';
    let s1cls = 's-draw', s2cls = 's-draw';
    if (+m.P1_Score > +m.P2_Score) { s1cls = 's-win'; s2cls = 's-loss'; }
    else if (+m.P1_Score < +m.P2_Score) { s1cls = 's-loss'; s2cls = 's-win'; }

    return `
      <div class="live-card">
        <div class="live-mid">
          <div class="lm-player">
            <div class="lm-rank">${p1Rank}</div>
            <div class="lm-name">${p1}</div>
            <div class="lm-id">${m.P1_ID}</div>
          </div>
          <div class="lm-center">
            <div class="match-type-pill">${m.Match_Type}</div>
            <div class="score-box">
              <span class="${s1cls}">${m.P1_Score}</span>
              <span class="s-sep">—</span>
              <span class="${s2cls}">${m.P2_Score}</span>
            </div>
            <div class="match-date">${formatBDTime(m.Match_Date)}</div>
          </div>
          <div class="lm-player">
            <div class="lm-rank">${p2Rank}</div>
            <div class="lm-name">${p2}</div>
            <div class="lm-id">${m.P2_ID}</div>
          </div>
        </div>
      </div>`;
  }).join('');

}).catch(() => {
  document.getElementById('liveTrack').innerHTML = `<div class="loader-row" style="grid-column:1/-1">Failed to load</div>`;
});

/* ── CLUB HUB ── */
fetch(`https://opensheet.elk.sh/${sheetID}/LINKS`)
  .then(r => r.json())
  .then(data => {
    document.getElementById('hubGrid').innerHTML = data.map(l => `
      <div class="hub-card" onclick="window.open('${l.link}','_blank')">
        <span class="hub-icon">${l.icon}</span>
        <div class="hub-title">${l.title}</div>
      </div>
    `).join('');
  }).catch(() => {
    document.getElementById('hubGrid').innerHTML = '<div class="loader-row">Failed to load</div>';
  });

/* ── CHAMPIONS ── */
fetch(`https://opensheet.elk.sh/${sheetID}/CHAMPIONS`)
  .then(r => r.json())
  .then(data => {
    document.getElementById('champGrid').innerHTML = data.map(c => `
      <div class="champ-card">
        <img src="${c.image}" alt="${c.title}">
        <div class="champ-info">
          <div class="champ-title">${c.title}</div>
          <div class="champ-sub">${c.subtitle}</div>
        </div>
      </div>
    `).join('');
    document.getElementById('champDesc').innerHTML =
      '<i class="fa-solid fa-trophy" style="color:#ffcc00;margin-right:6px;"></i>This zone represents champions, top scorers, and elite performers of Goat FC.';
  }).catch(() => {});

/* ── SOCIAL — Telegram icon fix ── */
function getSocialIcon(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('facebook')) return 'fa-brands fa-facebook';
  if (n.includes('telegram')) return 'fa-brands fa-telegram';
  if (n.includes('whatsapp')) return 'fa-brands fa-whatsapp';
  if (n.includes('discord')) return 'fa-brands fa-discord';
  if (n.includes('youtube')) return 'fa-brands fa-youtube';
  if (n.includes('instagram')) return 'fa-brands fa-instagram';
  if (n.includes('twitter') || n.includes('x.com')) return 'fa-brands fa-x-twitter';
  return 'fa-solid fa-link';
}

fetch(`https://opensheet.elk.sh/${sheetID}/SOCIAL`)
  .then(r => r.json())
  .then(data => {
    document.getElementById('socialWrap').innerHTML = data.map(s => `
      <a class="social-btn" href="${s.link}" target="_blank">
        <i class="${getSocialIcon(s.name)}"></i>${s.name}
      </a>
    `).join('');
  }).catch(() => {});

/* ── COMING SOON STORE ── */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vS3VQ-e6O8uHjlq8Lsdp5j0vxxOMZH1O17Nbo1ISGXDU_EFsuBEXNWydPbuhJ46lnxqJmevXaN2xPiL/pub?gid=1152972554&single=true&output=csv")
  .then(r => r.text())
  .then(csv => {
    const items = parseCSV(csv);
    document.getElementById('storeGrid').innerHTML = items.map(item => `
      <div class="store-card">
        <img src="${item['Image Url']}" alt="Item">
        <a class="store-btn" href="${item['Link Url']}" target="_blank">${item['Botton Name']}</a>
      </div>
    `).join('');
  }).catch(() => {
    document.getElementById('storeGrid').innerHTML = '<div class="loader-row">Failed to load</div>';
  });
</script>

</body>
