<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Schedule & Fixture</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
    --green:#00ff88;
    --green2:#00cc66;
    --home:#00ffd0;
    --away:#ff4d6d;
    --border:rgba(0,255,136,.2);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Poppins;
    background:radial-gradient(circle,#0b1f15,#020705);
    color:#eafff2;
    padding:12px;
}
.container{max-width:950px;margin:auto;}
.title{
    text-align:center;
    font-family:Orbitron;
    font-size:22px;
    color:var(--green);
    margin-bottom:16px;
}
select{
    width:100%;
    padding:10px;
    border-radius:10px;
    background:#0d1f16;
    border:1px solid var(--border);
    color:var(--green);
    margin-bottom:14px;
}
.match-card{
    background:linear-gradient(145deg,#0d1f16,#11281c);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
}
.match-row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
}
.team{
    display:flex;
    align-items:center;
    gap:6px;
}
.team.right{justify-content:flex-end;}
.team img{
    width:26px;
    height:26px;
    border-radius:6px;
    background:#fff;
    flex-shrink:0;
}
.team-info{
    display:flex;
    flex-direction:column;
}
.team-name{
    font-size:11px;
    font-weight:700;
    line-height:1.2;
    word-break:break-word;
}
.tag{
    font-size:9px;
    margin-top:2px;
}
.home-tag{color:var(--home);}
.away-tag{color:var(--away);}
.vs{
    font-family:Orbitron;
    font-size:13px;
    color:var(--green);
    text-align:center;
    min-width:35px;
}
.btn-row{
    display:flex;
    gap:6px;
    margin-top:10px;
}
.btn{
    flex:1;
    padding:8px;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
    border:none;
    cursor:pointer;
    text-align:center;
}
.group-btn{
    background:rgba(0,255,136,.1);
    color:var(--green);
    border:1px solid var(--border);
    text-decoration:none;
}
.fixture-btn{
    background:linear-gradient(90deg,var(--green),var(--green2));
    color:#03140a;
}
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    justify-content:center;
    align-items:center;
    padding:15px;
}
.modal-box{
    background:#08150f;
    border:1px solid var(--border);
    padding:14px;
    border-radius:12px;
    width:100%;
    max-width:600px;
}
textarea{
    width:100%;
    height:360px;
    background:#06110b;
    color:#dffff0;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    font-size:12px;
}
.copy-btn{
    margin-top:10px;
    width:100%;
    padding:10px;
    background:var(--green);
    border:none;
    border-radius:8px;
    font-weight:800;
}
</style>
</head>
<body>

<div class="container">
    <div class="title">MATCH SCHEDULE & FIXTURE</div>
    <select id="roundSelect"></select>
    <div id="fixture"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <textarea id="output"></textarea>
        <button class="copy-btn" onclick="copyText()">COPY</button>
    </div>
</div>

<script>
const TEAM_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=467352529&single=true&output=csv";
const MEMBER_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let fixtures=[], members={};

/* PROPER CSV PARSER */
function parseCSV(text){
    const rows=[];
    let row=[], cell='', inQuotes=false;

    for(let i=0;i<text.length;i++){
        const char=text[i];
        const next=text[i+1];

        if(char === '"'){
            if(inQuotes && next === '"'){
                cell += '"';
                i++;
            }else{
                inQuotes = !inQuotes;
            }
        }
        else if(char === ',' && !inQuotes){
            row.push(cell.trim());
            cell='';
        }
        else if((char === '\n' || char === '\r') && !inQuotes){
            if(cell || row.length){
                row.push(cell.trim());
                rows.push(row);
                row=[];
                cell='';
            }
        }
        else{
            cell += char;
        }
    }

    if(cell || row.length){
        row.push(cell.trim());
        rows.push(row);
    }

    return rows;
}

async function getCSV(url){
    const res = await fetch(url);
    const text = await res.text();
    return parseCSV(text);
}

async function load(){
    const memberRows = await getCSV(MEMBER_CSV);
    memberRows.shift();

    memberRows.forEach(r=>{
        const clubId = (r[1] || '').trim();
        const fullName = (r[0] || '').trim();
        if(clubId) members[clubId] = fullName;
    });

    const teamRows = await getCSV(TEAM_CSV);
    teamRows.shift();

    const teams = teamRows.map(r=>({
        name:r[0] || '',
        logo:r[1] || '',
        ids:r[3] || '',
        link:r[7] || ''
    }));

    fixtures = doubleRoundRobin(teams);
    initUI();
}

function doubleRoundRobin(teams){
    let n=teams.length, arr=[...teams], rounds=n-1, half=n/2, first=[];

    for(let r=0;r<rounds;r++){
        let matches=[];
        for(let i=0;i<half;i++){
            let t1=arr[i], t2=arr[n-1-i];
            let flip=(r+i)%2===0;
            matches.push({home:flip?t1:t2, away:flip?t2:t1});
        }
        first.push(matches);
        arr.splice(1,0,arr.pop());
    }

    return [...first, ...first.map(round=>round.map(m=>({home:m.away, away:m.home})))];
}

function initUI(){
    const select=document.getElementById("roundSelect");
    fixtures.forEach((_,i)=>{
        select.innerHTML += `<option value="${i}">Round ${i+1}</option>`;
    });
    select.onchange=e=>render(e.target.value);
    render(0);
}

function render(r){
    const box=document.getElementById("fixture");
    box.innerHTML='';

    fixtures[r].forEach(m=>{
        box.innerHTML += `
        <div class="match-card">
            <div class="match-row">
                <div class="team">
                    <img src="${m.home.logo}">
                    <div class="team-info">
                        <div class="team-name">${m.home.name}</div>
                        <span class="tag home-tag">HOME</span>
                    </div>
                </div>

                <div class="vs">VS</div>

                <div class="team right">
                    <div class="team-info" style="text-align:right">
                        <div class="team-name">${m.away.name}</div>
                        <span class="tag away-tag">AWAY</span>
                    </div>
                    <img src="${m.away.logo}">
                </div>
            </div>

            <div class="btn-row">
                <a href="${m.home.link}" target="_blank" class="btn group-btn">Match Group</a>
                <button class="btn fixture-btn" onclick='gen(${JSON.stringify(m.home)},${JSON.stringify(m.away)})'>
                    Fixture Generate
                </button>
            </div>
        </div>`;
    });
}

function players(ids){
    return ids.split(",").map(id=>{
        const clean=id.trim().replace(/^"|"$/g,'');
        return members[clean] || "undefined";
    });
}

function gen(h,a){
    const hp=players(h.ids);
    const ap=players(a.ids);

    const txt=`Powered by GOAT FC

${h.name} (Home) 🆚 ${a.name} (Away)

First Lag: 11:00 PM
1️⃣ ${hp[0] || 'undefined'} 🆚 ${ap[0] || 'undefined'}
2️⃣ ${hp[1] || 'undefined'} 🆚 ${ap[1] || 'undefined'}

Last Lag: 12:00 AM
3️⃣ ${hp[2] || 'undefined'} 🆚 ${ap[2] || 'undefined'}
4️⃣ ${hp[3] || 'undefined'} 🆚 ${ap[3] || 'undefined'}

Sub Player List:
↕️ ${hp[4] || 'undefined'} (Home)
↕️ ${hp[5] || 'undefined'} (Home)

↕️ ${ap[4] || 'undefined'} (Away)
↕️ ${ap[5] || 'undefined'} (Away)

📍Tournament Rules: www.goatfcbd.com/rules
Visit: www.goatfcbd.com`;

    document.getElementById("output").value = txt;
    document.getElementById("modal").style.display = "flex";
}

function copyText(){
    const t=document.getElementById("output");
    t.select();
    document.execCommand("copy");
}

document.getElementById("modal").onclick=e=>{
    if(e.target.id==="modal") e.target.style.display="none";
};

load();
</script>

</body>
</html>
