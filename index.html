<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rival Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    background:linear-gradient(135deg,#050b14,#0b1320,#101b2d);
    color:#fff;
    min-height:100vh;
    padding:10px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(0,255,183,0.15);
    border-radius:20px;
    padding:14px;
    box-shadow:
        0 0 20px rgba(0,255,183,0.06),
        inset 0 0 20px rgba(0,255,183,0.02);
}

.header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:12px;
    margin-bottom:14px;
    border-radius:16px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(0,255,183,0.08);
}

.header img{
    width:42px;
    height:42px;
    object-fit:contain;
    filter:
        drop-shadow(0 0 3px rgba(0,255,183,.45))
        drop-shadow(0 0 8px rgba(0,140,255,.25));
}

.header h1{
    font-size:24px;
    font-weight:900;
    background:linear-gradient(90deg,#00ffb7,#00d9ff,#7d7dff,#ff4dff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 8px rgba(0,255,183,.18);
}

/* FILTERS */
.filter-top{
    margin-bottom:10px;
}
.filter-bottom{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:14px;
}

select{
    width:100%;
    padding:12px 10px;
    border:none;
    border-radius:10px;
    background:#13243b;
    color:#fff;
    font-size:13px;
    outline:none;
    text-align:center;
}

/* TABLE */
.tableWrap{
    width:100%;
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.06);
}

table{
    width:100%;
    border-collapse:collapse;
    background:rgba(255,255,255,0.025);
    table-layout:fixed;
}

th{
    background:#00ffb7;
    color:#000;
    padding:11px 6px;
    font-size:12px;
}

td{
    padding:10px 6px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.06);
    font-size:11px;
    word-break:break-word;
}

.opponent-name{
    font-size:11px;
    font-weight:700;
    line-height:1.25;
}

.opponent-id{
    font-size:9px;
    opacity:.7;
    margin-top:2px;
}

.warning{
    background:rgba(255,0,0,0.14)!important;
}

.badge{
    padding:4px 6px;
    border-radius:999px;
    font-size:9px;
    font-weight:700;
}

.ok{
    background:#143f2e;
    color:#75ffba;
}

.alert{
    background:#661919;
    color:#ff9b9b;
}

@media(max-width:768px){

    body{
        padding:6px;
    }

    .container{
        padding:10px;
        border-radius:16px;
    }

    .header{
        padding:10px;
    }

    .header img{
        width:34px;
        height:34px;
    }

    .header h1{
        font-size:16px;
    }

    select{
        padding:10px 6px;
        font-size:10px;
    }

    th{
        font-size:9px;
        padding:9px 4px;
    }

    td{
        font-size:9px;
        padding:9px 4px;
    }

    .opponent-name{
        font-size:9px;
    }

    .opponent-id{
        font-size:8px;
    }

    .badge{
        font-size:8px;
        padding:3px 5px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <img src="https://i.imgur.com/LY3Bb9m.png" alt="Logo">
        <h1>Rival Tracker</h1>
    </div>

    <div class="filter-top">
        <select id="playerSelect">
            <option value="">Select Player</option>
        </select>
    </div>

    <div class="filter-bottom">
        <select id="periodFilter">
            <option value="monthly">Monthly</option>
            <option value="overall">Overall</option>
        </select>

        <select id="typeFilter">
            <option value="all">All Match</option>
            <option value="Friendly">Friendly</option>
            <option value="Tournament">Tournament</option>
        </select>
    </div>

    <div class="tableWrap">
        <table>
            <thead>
                <tr>
                    <th>Opponent</th>
                    <th>Match</th>
                    <th>W</th>
                    <th>D</th>
                    <th>L</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="resultTable">
                <tr><td colspan="6">Loading Data...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
const MONTHLY_MATCH_LIMIT = 5;

const MATCH_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";
const MEMBER_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let matches=[], members={};

function clean(v){
    return String(v||"").replace(/^"+|"+$/g,"").replace(/\s+/g," ").trim();
}

function parseCSV(text){
    const rows=[]; let row=[],cur="",q=false;
    for(let i=0;i<text.length;i++){
        const c=text[i],n=text[i+1];
        if(c=='"'&&q&&n=='"'){cur+='"';i++;}
        else if(c=='"'){q=!q;}
        else if(c==','&&!q){row.push(cur);cur="";}
        else if((c=='\n'||c=='\r')&&!q){
            if(cur||row.length){row.push(cur);rows.push(row);}
            row=[];cur="";
        } else cur+=c;
    }
    if(cur||row.length){row.push(cur);rows.push(row);}
    return rows;
}

function approved(v){
    return ["yes","true","1","approved"].includes(clean(v).toLowerCase());
}

function isCurrentMonth(d){
    const x=new Date(d), now=new Date();
    return !isNaN(x)&&x.getMonth()===now.getMonth()&&x.getFullYear()===now.getFullYear();
}

async function loadAll(){
    const [mRes,uRes]=await Promise.all([fetch(MATCH_CSV),fetch(MEMBER_CSV)]);
    const [mTxt,uTxt]=await Promise.all([mRes.text(),uRes.text()]);
    loadMembers(uTxt);
    loadMatches(mTxt);
    populatePlayers();
    resultTable.innerHTML='<tr><td colspan="6">Select Player</td></tr>';
}

function loadMembers(csv){
    const rows=parseCSV(csv), h=rows[0];
    rows.slice(1).forEach(r=>{
        const obj={};
        h.forEach((x,i)=>obj[clean(x)]=clean(r[i]));
        const id=obj["Club ID Number"], name=obj["Full Name"];
        if(id&&name&&id!="#VALUE!"&&name!="#VALUE!"){
            members[id]={name,id};
        }
    });
}

function loadMatches(csv){
    const rows=parseCSV(csv), h=rows[0];
    matches=rows.slice(1).map(r=>{
        const obj={};
        h.forEach((x,i)=>obj[clean(x)]=clean(r[i]));
        return obj;
    }).filter(m=>m.P1_ID&&m.P2_ID);
}

function populatePlayers(){
    const ids=[...new Set([...matches.map(m=>clean(m.P1_ID)),...matches.map(m=>clean(m.P2_ID))])]
        .filter(id=>id&&id!="#VALUE!")
        .sort();

    ids.forEach(id=>{
        const op=document.createElement("option");
        op.value=id;
        op.textContent=members[id]?`${members[id].name} - ${id}`:id;
        playerSelect.appendChild(op);
    });
}

function renderOpponent(opp){
    if(!members[opp]) return opp;
    return `
        <div class="opponent-name">${members[opp].name}</div>
        <div class="opponent-id">${opp}</div>
    `;
}

function renderData(){
    const player=clean(playerSelect.value);
    if(!player){
        resultTable.innerHTML='<tr><td colspan="6">Select Player</td></tr>';
        return;
    }

    let data=matches.filter(m=>approved(m.Approved));

    if(periodFilter.value==="monthly"){
        data=data.filter(m=>isCurrentMonth(m.Match_Date));
    }

    if(typeFilter.value==="Friendly"){
        data=data.filter(m=>clean(m.Match_Type)==="Friendly");
    }

    if(typeFilter.value==="Tournament"){
        data=data.filter(m=>clean(m.Match_Type)!=="Friendly");
    }

    const stats={};

    data.forEach(m=>{
        const p1=clean(m.P1_ID), p2=clean(m.P2_ID);
        const s1=Number(m.P1_Score)||0, s2=Number(m.P2_Score)||0;

        let opp,res;

        if(p1===player){
            opp=p2;
            res=s1>s2?"win":s1<s2?"loss":"draw";
        }else if(p2===player){
            opp=p1;
            res=s2>s1?"win":s2<s1?"loss":"draw";
        }else return;

        if(!stats[opp]) stats[opp]={total:0,win:0,draw:0,loss:0};

        stats[opp].total++;
        stats[opp][res]++;
    });

    const rows=Object.entries(stats).sort((a,b)=>b[1].total-a[1].total);

    resultTable.innerHTML=rows.length?rows.map(([opp,s])=>{
        const limit=periodFilter.value==="monthly"&&s.total>MONTHLY_MATCH_LIMIT;

        return `
        <tr class="${limit?'warning':''}">
            <td>${renderOpponent(opp)}</td>
            <td>${s.total}</td>
            <td>${s.win}</td>
            <td>${s.draw}</td>
            <td>${s.loss}</td>
            <td><span class="badge ${limit?'alert':'ok'}">${limit?'LIMIT':'OK'}</span></td>
        </tr>`;
    }).join(''):'<tr><td colspan="6">No Data Found</td></tr>';
}

playerSelect.addEventListener("change",renderData);
periodFilter.addEventListener("change",renderData);
typeFilter.addEventListener("change",renderData);

loadAll();
</script>

</body>
</html>
