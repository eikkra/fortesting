<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIFA World Cup 2026 – Powered by GOAT FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --red: #C8102E;
  --red-dark: #8B0A1E;
  --gold: #C8A415;
  --gold-light: #F0C040;
  --bg: #080810;
  --bg2: #0D0D18;
  --bg3: #12121F;
  --card: #14141F;
  --card2: #1A1A2E;
  --border: rgba(200,164,21,0.18);
  --text: #E8E8F0;
  --muted: #7A7A9A;
  --live: #00E676;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── SCANLINE OVERLAY ── */
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:9999;}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,#0D0010 0%,#1A0010 40%,#200018 100%);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100;padding:0 16px;}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand img{height:46px;width:46px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(200,164,21,0.5));}
.brand-text{display:flex;flex-direction:column;line-height:1;}
.brand-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;color:var(--gold-light);letter-spacing:2px;}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px;}
.header-center{flex:1;text-align:center;}
.wc-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--text);letter-spacing:1px;}
.wc-title span{color:var(--gold);}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(0,230,118,0.15);border:1px solid var(--live);border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;color:var(--live);margin-top:3px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,230,118,0.5);}50%{opacity:0.6;box-shadow:0 0 0 5px rgba(0,230,118,0);}}
.header-right{display:flex;align-items:center;gap:8px;}
.refresh-btn{background:rgba(200,164,21,0.1);border:1px solid var(--gold);border-radius:8px;color:var(--gold);padding:7px 12px;cursor:pointer;font-size:13px;transition:all 0.2s;}
.refresh-btn:hover{background:var(--gold);color:#000;}

/* ── TABS ── */
.tabs-wrap{background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:99;}
.tabs{display:flex;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:13px 18px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;background:none;border-left:none;border-right:none;border-top:none;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ── MAIN ── */
.main{max-width:1200px;margin:0 auto;padding:16px 12px 60px;}

/* ── HERO BANNER ── */
.hero{background:linear-gradient(135deg,rgba(200,16,46,0.2) 0%,rgba(13,13,24,0.9) 50%,rgba(200,164,21,0.15) 100%);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'⚽';position:absolute;font-size:120px;opacity:0.04;top:50%;left:50%;transform:translate(-50%,-50%);animation:spin 20s linear infinite;}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
.hero h1{font-family:'Orbitron',sans-serif;font-size:clamp(16px,4vw,28px);font-weight:900;background:linear-gradient(90deg,var(--gold-light),var(--red),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.hero-meta{display:flex;justify-content:center;gap:20px;margin-top:12px;flex-wrap:wrap;}
.hero-stat{text-align:center;}
.hero-stat-val{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;color:var(--gold);}
.hero-stat-label{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px;}
.hero-flags{font-size:22px;margin-top:10px;letter-spacing:4px;}

/* ── SECTION HEADER ── */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px;gap:12px;flex-wrap:wrap;}
.section-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:2px;display:flex;align-items:center;gap:8px;}
.section-title i{color:var(--red);}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filter-input{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:13px;flex:1;min-width:140px;outline:none;transition:border-color 0.2s;}
.filter-input:focus{border-color:var(--gold);}
.filter-select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:13px;cursor:pointer;outline:none;}
.filter-select:focus{border-color:var(--gold);}

/* ── DATE DIVIDER ── */
.date-divider{display:flex;align-items:center;gap:10px;margin:18px 0 10px;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:2px;}
.date-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);}

/* ── MATCH CARD ── */
.match-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:all 0.2s;position:relative;}
.match-card:hover{border-color:rgba(200,164,21,0.4);transform:translateY(-1px);box-shadow:0 4px 20px rgba(200,164,21,0.1);}
.match-card.live{border-color:rgba(0,230,118,0.4);box-shadow:0 0 16px rgba(0,230,118,0.1);}
.match-card.finished{border-color:rgba(200,164,21,0.2);}
.match-card-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px;gap:10px;}
.team-side{display:flex;align-items:center;gap:10px;}
.team-side.away{flex-direction:row-reverse;text-align:right;}
.team-flag{font-size:clamp(24px,6vw,36px);line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));}
.team-info{display:flex;flex-direction:column;}
.team-name{font-weight:700;font-size:clamp(12px,3vw,15px);line-height:1.2;}
.team-name.long{font-size:clamp(10px,2.5vw,13px);}
.team-group-badge{font-size:10px;color:var(--muted);margin-top:2px;}
/* Center score/time */
.match-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:90px;}
.match-score{font-family:'Orbitron',sans-serif;font-size:clamp(20px,5vw,30px);font-weight:900;color:var(--gold-light);letter-spacing:3px;white-space:nowrap;}
.match-score.live-score{color:var(--live);text-shadow:0 0 20px rgba(0,230,118,0.5);animation:glow 2s ease-in-out infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 10px rgba(0,230,118,0.4);}50%{text-shadow:0 0 25px rgba(0,230,118,0.8);}}
.match-time{font-family:'Orbitron',sans-serif;font-size:clamp(13px,3.5vw,18px);font-weight:700;color:var(--text);white-space:nowrap;}
.match-time.soon{color:var(--gold-light);}
.match-status-row{display:flex;align-items:center;gap:5px;justify-content:center;}
.status-pill{border-radius:20px;padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:1px;white-space:nowrap;}
.status-pill.live{background:rgba(0,230,118,0.15);border:1px solid var(--live);color:var(--live);}
.status-pill.ft{background:rgba(200,164,21,0.12);border:1px solid rgba(200,164,21,0.3);color:var(--gold);}
.status-pill.upcoming{background:rgba(100,100,160,0.15);border:1px solid rgba(100,100,160,0.3);color:#A0A0C0;}
.match-meta{display:flex;align-items:center;gap:12px;padding:6px 16px 8px;border-top:1px solid rgba(255,255,255,0.04);font-size:11px;color:var(--muted);flex-wrap:wrap;}
.match-meta i{font-size:10px;color:var(--red);}
.group-strip{position:absolute;left:0;top:0;bottom:0;width:3px;}

/* ── LIVE MINUTE ── */
.live-minute{font-size:10px;font-weight:700;color:var(--live);display:flex;align-items:center;gap:3px;}
.live-minute-dot{width:5px;height:5px;border-radius:50%;background:var(--live);animation:pulse 1s ease-in-out infinite;}

/* ── COUNTDOWN ── */
.countdown{font-family:'Orbitron',sans-serif;font-size:11px;color:#A0A0C0;text-align:center;}

/* ── GROUPS GRID ── */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.group-card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.group-card-head{padding:10px 14px;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;letter-spacing:2px;}
.group-team-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid rgba(255,255,255,0.04);}
.group-team-row:hover{background:rgba(255,255,255,0.02);}
.group-flag{font-size:20px;}
.group-team-name{font-size:13px;font-weight:500;flex:1;}

/* ── KNOCKOUT BRACKET ── */
.knockout-section{margin-bottom:24px;}
.knockout-phase-title{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:800;letter-spacing:2px;padding:10px 14px;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.ko-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}

/* ── LOADING ── */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid rgba(200,164,21,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin2 0.8s linear infinite;}
@keyframes spin2{to{transform:rotate(360deg);}}
.loading-text{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--gold);letter-spacing:2px;}

/* ── API STATUS ── */
.api-status{background:rgba(200,164,21,0.08);border:1px solid rgba(200,164,21,0.2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.api-status i{color:var(--gold);}

/* ── FOOTER ── */
.footer{text-align:center;padding:32px 20px 20px;border-top:1px solid var(--border);margin-top:40px;}
.footer-logo{height:50px;margin-bottom:10px;filter:drop-shadow(0 0 12px rgba(200,164,21,0.4));}
.footer-title{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:4px;}
.footer-sub{font-size:11px;color:var(--muted);}
.footer-links{display:flex;justify-content:center;gap:16px;margin-top:14px;flex-wrap:wrap;}
.footer-link{color:var(--muted);font-size:12px;text-decoration:none;display:flex;align-items:center;gap:5px;transition:color 0.2s;}
.footer-link:hover{color:var(--gold);}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .header-center .wc-title{font-size:11px;}
  .match-card-inner{grid-template-columns:1fr auto 1fr;padding:10px 10px;}
  .match-meta{font-size:10px;}
  .hero h1{font-size:16px;}
  .hero-stat-val{font-size:18px;}
  .tab{padding:11px 13px;font-size:9px;}
  .team-name{font-size:11px;}
  .match-score{font-size:20px;}
  .match-time{font-size:14px;}
}
@media(min-width:900px){
  .main{padding:20px 20px 60px;}
  .match-card-inner{padding:16px 22px;}
  .team-flag{font-size:38px;}
}

/* ── NO CONTENT ── */
.no-match{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
.no-match i{font-size:36px;display:block;margin-bottom:10px;color:var(--red);}

/* ── SCROLL TO TOP ── */
.scroll-top{position:fixed;bottom:20px;right:16px;background:var(--red);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:16px;cursor:pointer;box-shadow:0 4px 16px rgba(200,16,46,0.4);transition:all 0.2s;display:none;z-index:200;align-items:center;justify-content:center;}
.scroll-top.show{display:flex;}
.scroll-top:hover{background:var(--red-dark);}
</style>
</head>

//  STATE
// ═══════════════════════════════════════════════════════
let liveData = {}; // keyed by match id from API
let lastUpdated = null;
let autoRefreshTimer = null;

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function formatTime(t) {
  // t = "HH:MM" in BD time → format as 12h AM/PM
  const [h,m] = t.split(':').map(Number);
  const ampm = h < 12 ? 'AM' : 'PM';
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-BD',{weekday:'short',month:'short',day:'numeric'});
}

function getBDDateStr() {
  // Current BD time
  const now = new Date();
  const bdOffset = 6 * 60; // UTC+6
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const bd = new Date(utc + bdOffset * 60000);
  return bd.toISOString().slice(0, 10);
}

function getBDNow() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + 6 * 3600000);
}

function matchDateTime(dateStr, timeStr) {
  return new Date(dateStr + 'T' + timeStr + ':00+06:00');
}

function getMatchStatus(m) {
  const live = liveData[m.id];
  if (live) return live;
  const kickoff = matchDateTime(m.date, m.time);
  const now = getBDNow();
  const diff = now - kickoff;
  if (diff > 0 && diff < 115 * 60000) return {status:'LIVE', minute: Math.floor(diff/60000)};
  if (diff > 115 * 60000) return {status:'FT', homeScore: m.homeScore, awayScore: m.awayScore};
  return {status:'NS'};
}

function countdown(dateStr, timeStr) {
  const kickoff = matchDateTime(dateStr, timeStr);
  const now = getBDNow();
  const diff = kickoff - now;
  if (diff <= 0) return '';
  const h = Math.floor(diff / 3600000);
  const min = Math.floor((diff % 3600000) / 60000);
  if (h > 48) {
    const days = Math.floor(h / 24);
    return `<i class="far fa-clock"></i> ${days}d ${h % 24}h`;
  }
  return `<i class="far fa-clock"></i> ${h}h ${min}m`;
}

function teamNameClass(name) {
  return name.length > 14 ? 'team-name long' : 'team-name';
}

// ═══════════════════════════════════════════════════════
//  MATCH CARD RENDERER
// ═══════════════════════════════════════════════════════
function renderMatchCard(m, isKnockout) {
  const st = getMatchStatus(m);
  const isLive = st.status === 'LIVE';
  const isFT = st.status === 'FT';
  const homeFlag = FLAGS[m.home] || '🏳';
  const awayFlag = FLAGS[m.away] || '🏳';
  const gc = m.group ? GROUP_COLORS[m.group] : '#C8A415';
  const timeStr = formatTime(m.time);

  let centerHTML = '';
  if (isLive) {
    const hs = st.homeScore !== undefined ? st.homeScore : '0';
    const as = st.awayScore !== undefined ? st.awayScore : '0';
    centerHTML = `
      <div class="match-score live-score">${hs} – ${as}</div>
      <div class="match-status-row">
        <div class="live-minute"><span class="live-minute-dot"></span>${st.minute || '0'}'</div>
      </div>`;
  } else if (isFT && st.homeScore !== null && st.homeScore !== undefined) {
    centerHTML = `
      <div class="match-score">${st.homeScore} – ${st.awayScore}</div>
      <div class="match-status-row"><span class="status-pill ft"><i class="fas fa-check"></i> FT</span></div>`;
  } else {
    const cd = countdown(m.date, m.time);
    centerHTML = `
      <div class="match-time${cd ? ' soon' : ''}">${timeStr}</div>
      ${cd ? `<div class="countdown">${cd}</div>` : '<div class="match-status-row"><span class="status-pill upcoming">UPCOMING</span></div>'}`;
  }

  const phaseBadge = m.phase ? `<span style="background:rgba(200,164,21,0.15);border:1px solid rgba(200,164,21,0.3);color:var(--gold);border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:1px;">${m.phase}</span>` : `<span style="background:${gc}22;border:1px solid ${gc}66;color:${gc};border-radius:4px;padding:1px 7px;font-size:10px;font-weight:800;">GRP ${m.group}</span>`;

  return `<div class="match-card${isLive?' live':isFT?' finished':''}">
    ${m.group ? `<div class="group-strip" style="background:${gc}"></div>` : ''}
    <div class="match-card-inner" style="padding-left:${m.group?'20px':'16px'}">
      <div class="team-side home">
        <div class="team-flag">${homeFlag}</div>
        <div class="team-info"><div class="${teamNameClass(m.home)}">${m.home}</div></div>
      </div>
      <div class="match-center">${centerHTML}</div>
      <div class="team-side away">
        <div class="team-flag">${awayFlag}</div>
        <div class="team-info"><div class="${teamNameClass(m.away)}">${m.away}</div></div>
      </div>
    </div>
    <div class="match-meta">
      ${phaseBadge}
      <span><i class="fas fa-map-marker-alt"></i> ${m.venue}</span>
      <span><i class="far fa-calendar"></i> ${formatDate(m.date)}</span>
    </div>
  </div>`;
}

  const filtered = GROUP_MATCHES.filter(m => {
    const gok = groupF === 'ALL' || m.group === groupF;
    const sok = !search || m.home.toLowerCase().includes(search) || m.away.toLowerCase().includes(search);
    return gok && sok;
  });
  const byDate = {};
  filtered.forEach(m => { if (!byDate[m.date]) byDate[m.date]=[]; byDate[m.date].push(m); });
  let html = '';
  if (!filtered.length) {
    html = `<div class="no-match"><i class="fas fa-search"></i>No matches found</div>`;
  } else {
    Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).forEach(([date,matches]) => {
      html += `<div class="date-divider"><i class="fas fa-calendar-day" style="color:var(--red)"></i>${formatDate(date)}</div>`;
      matches.forEach(m => { html += renderMatchCard(m); });
    });
  }
  document.getElementById('fixtureList').innerHTML = html;
  checkLiveIndicator();
}

// ═══════════════════════════════════════════════════════
//  RENDER TODAY
// ═══════════════════════════════════════════════════════
function renderToday() {
  const today = getBDDateStr();
  const todayM = GROUP_MATCHES.filter(m => m.date === today || m.date === today);
  // also check knockout
  const todayKO = KNOCKOUT_MATCHES.filter(m => m.date === today);
  const all = [...todayM, ...todayKO];
  let html = '';
  if (!all.length) {
    // look for nearest upcoming
    const upcoming = [...GROUP_MATCHES, ...KNOCKOUT_MATCHES]
      .filter(m => matchDateTime(m.date, m.time) > getBDNow())
      .sort((a,b) => matchDateTime(a.date,a.time) - matchDateTime(b.date,b.time))
      .slice(0, 5);
    if (upcoming.length) {
      html += `<div class="date-divider"><i class="fas fa-bolt" style="color:var(--red)"></i>NEXT UPCOMING MATCHES</div>`;
      upcoming.forEach(m => { html += renderMatchCard(m, !!m.phase); });
    } else {
      html = `<div class="no-match"><i class="fas fa-futbol"></i>No matches today. Check the Fixtures tab!</div>`;
    }
  } else {
    html += `<div class="date-divider"><i class="fas fa-bolt" style="color:var(--red)"></i>TODAY – ${formatDate(today)}</div>`;
    all.forEach(m => { html += renderMatchCard(m, !!m.phase); });
  }
  document.getElementById('todayList').innerHTML = html;
}

// ═══════════════════════════════════════════════════════
//  RENDER GROUPS
// ═══════════════════════════════════════════════════════
function renderGroups() {
  let html = '';
  Object.entries(GROUPS).forEach(([g, teams]) => {
    const gc = GROUP_COLORS[g];
    html += `<div class="group-card">
      <div class="group-card-head" style="background:linear-gradient(90deg,${gc}cc,${gc}44);color:#fff;">
        <i class="fas fa-shield-halved"></i> GROUP ${g}
      </div>`;
    teams.forEach(t => {
      html += `<div class="group-team-row">
        <span class="group-flag">${FLAGS[t]||'🏳'}</span>
        <span class="group-team-name">${t}</span>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('groupsGrid').innerHTML = html;
}

// ═══════════════════════════════════════════════════════
//  RENDER KNOCKOUT
// ═══════════════════════════════════════════════════════
function renderKnockout() {
  const phases = ['Round of 32','Round of 16','Quarterfinal','Semifinal','3rd Place','Final'];
  const phaseColors = {
    'Round of 32':'#3498db','Round of 16':'#1abc9c',
    'Quarterfinal':'#e67e22','Semifinal':'#9b59b6',
    '3rd Place':'#7f8c8d','Final':'#C8A415'
  };
  const phaseIcons = {
    'Round of 32':'fa-list','Round of 16':'fa-th-large',
    'Quarterfinal':'fa-arrows-to-dot','Semifinal':'fa-star-half-stroke',
    '3rd Place':'fa-medal','Final':'fa-trophy'
  };
  let html = '';
  phases.forEach(phase => {
    const matches = KNOCKOUT_MATCHES.filter(m => m.phase === phase);
    if (!matches.length) return;
    const pc = phaseColors[phase];
    html += `<div class="knockout-section">
      <div class="knockout-phase-title" style="background:${pc}18;border:1px solid ${pc}44;color:${pc}">
        <i class="fas ${phaseIcons[phase]||'fa-futbol'}"></i>${phase === 'Final' ? '🏆 GRAND FINAL' : phase.toUpperCase()}
      </div>
      <div class="ko-grid">`;
    matches.forEach(m => { html += renderMatchCard(m, true); });
    html += `</div></div>`;
  });
  document.getElementById('knockoutContent').innerHTML = html;
}

// ═══════════════════════════════════════════════════════
//  LIVE SCORE API (TheSportsDB — free, no key)
// ═══════════════════════════════════════════════════════
async function fetchLiveScores() {
  try {
    // TheSportsDB free API: livescore for soccer
    const r = await fetch('https://www.thesportsdb.com/api/v1/json/3/latestsoccer.php');
    if (!r.ok) throw new Error('API error');
    const data = await r.json();
    if (data && data.events) {
      let found = 0;
      data.events.forEach(ev => {
        // Match group stage teams
        GROUP_MATCHES.forEach(m => {
          const hMatch = ev.strHomeTeam && (
            ev.strHomeTeam.toLowerCase().includes(m.home.toLowerCase()) ||
            m.home.toLowerCase().includes(ev.strHomeTeam.toLowerCase())
          );
          const aMatch = ev.strAwayTeam && (
            ev.strAwayTeam.toLowerCase().includes(m.away.toLowerCase()) ||
            m.away.toLowerCase().includes(ev.strAwayTeam.toLowerCase())
          );
          if (hMatch && aMatch) {
            const st = ev.strStatus;
            if (st === 'Match Finished' || st === 'FT' || st === 'AET') {
              liveData[m.id] = {
                status: 'FT',
                homeScore: parseInt(ev.intHomeScore)||0,
                awayScore: parseInt(ev.intAwayScore)||0
              };
            } else if (st && !isNaN(parseInt(st))) {
              liveData[m.id] = {
                status: 'LIVE',
                minute: parseInt(st),
                homeScore: parseInt(ev.intHomeScore)||0,
                awayScore: parseInt(ev.intAwayScore)||0
              };
            }
            found++;
          }
        });
      });
      lastUpdated = new Date();
      updateApiStatus(found > 0 ? `Live: ${found} match(es) active • Updated ${lastUpdated.toLocaleTimeString('en-BD')}` : `Feed connected • No live matches right now • ${lastUpdated.toLocaleTimeString('en-BD')}`, found > 0);
    }
  } catch(e) {
    updateApiStatus('Live feed unavailable — showing scheduled times', false);
  }
}

async function fetchCompletedScores() {
  try {
    // Try to get recent World Cup results from TheSportsDB
    const r = await fetch('https://www.thesportsdb.com/api/v1/json/3/eventsseason.php?id=4429&s=2026');
    if (!r.ok) throw new Error();
    const data = await r.json();
    if (data && data.events) {
      data.events.forEach(ev => {
        if (ev.strStatus !== 'Match Finished' && ev.strStatus !== 'FT') return;
        GROUP_MATCHES.forEach(m => {
          const hMatch = ev.strHomeTeam && ev.strHomeTeam.toLowerCase().includes(m.home.toLowerCase().slice(0,5));
          const aMatch = ev.strAwayTeam && ev.strAwayTeam.toLowerCase().includes(m.away.toLowerCase().slice(0,5));
          if (hMatch && aMatch && !liveData[m.id]) {
            liveData[m.id] = {
              status: 'FT',
              homeScore: parseInt(ev.intHomeScore)||0,
              awayScore: parseInt(ev.intAwayScore)||0
            };
          }
        });
      });
    }
  } catch(e) {}
}

function updateApiStatus(msg, isLive) {
  const el = document.getElementById('apiStatusText');
  const icon = document.querySelector('.api-status i');
  if (el) el.textContent = msg;
  if (icon) icon.className = isLive ? 'fas fa-circle text-live' : 'fas fa-satellite-dish';
  if (isLive) document.getElementById('liveIndicator').style.display = 'inline-flex';
  else document.getElementById('liveIndicator').style.display = 'none';
}

function checkLiveIndicator() {
  const hasLive = Object.values(liveData).some(d => d.status === 'LIVE');
  document.getElementById('liveIndicator').style.display = hasLive ? 'inline-flex' : 'none';
}

// ═══════════════════════════════════════════════════════
//  REFRESH
// ═══════════════════════════════════════════════════════
async function refreshData() {
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('fa-spin');
  updateApiStatus('Refreshing live scores…', false);
  await fetchLiveScores();
  await fetchCompletedScores();
  renderAll();
  setTimeout(() => icon.classList.remove('fa-spin'), 800);
}

function renderAll() {
  renderFixtures();
  renderToday();
  renderGroups();
  renderKnockout();
}

// ═══════════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════════
function switchTab(tab, el) {
  ['fixtures','today','groups','knockout'].forEach(t => {
    document.getElementById('tab-' + t).style.display = 'none';
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).style.display = 'block';
  el.classList.add('active');
}

// ═══════════════════════════════════════════════════════
//  HERO DAYS LEFT
// ═══════════════════════════════════════════════════════
function calcDaysLeft() {
  const finalDate = new Date('2026-07-19T00:00:00+06:00');
  const now = getBDNow();
  const diff = finalDate - now;
  const days = Math.max(0, Math.ceil(diff / 86400000));
  const el = document.getElementById('daysLeft');
  if (el) el.textContent = days > 0 ? days : '🏆';
}

// ═══════════════════════════════════════════════════════
//  SCROLL TOP
// ═══════════════════════════════════════════════════════
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scrollTop');
  if (window.scrollY > 300) btn.classList.add('show');
  else btn.classList.remove('show');
});

// ═══════════════════════════════════════════════════════
//  LOGO: embed actual GOAT FC logo from upload
// ═══════════════════════════════════════════════════════
// We set the logo inline as base64 below at runtime

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  calcDaysLeft();
  renderAll();
  // Fetch live + completed scores
  await fetchLiveScores();
  await fetchCompletedScores();
  renderAll();
  // Auto refresh every 60 seconds
  autoRefreshTimer = setInterval(async () => {
    await fetchLiveScores();
    renderFixtures();
    renderToday();
  }, 60000);
});
</script>
