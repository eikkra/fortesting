<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ELITE ATHLETE</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
--bg:#0a0a0a;
--surface:#111111;
--surface2:#181818;
--surface3:#1f1f1f;
--border:#2a2a2a;
--border2:#333;
--accent:#e8ff47;
--accent2:#00d4ff;
--text:#f5f5f5;
--muted:#666;
--muted2:#444;
--red:#ff4444;
--green:#00cc66;
--draw:#f59e0b;
}

body{
background:var(--bg);
font-family:'DM Sans',sans-serif;
color:var(--text);
min-height:100vh;
overflow-x:hidden;
}

/* TOPBAR */
.topbar{
height:48px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
background:rgba(10,10,10,0.95);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:999;
backdrop-filter:blur(12px);
text-decoration:none;
}

.top-left{
display:flex;
align-items:center;
gap:8px;
}

.top-logo{
width:20px;
opacity:0.9;
}

.top-title{
font-family:'Bebas Neue',sans-serif;
font-size:15px;
letter-spacing:3px;
color:var(--accent);
}

.home-btn{
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
border-radius:8px;
border:1px solid var(--border);
color:var(--muted);
font-size:12px;
transition:all .2s;
}

.home-btn:hover{color:var(--text);}

/* HERO */
.hero{
text-align:center;
padding:20px 16px 12px;
}

.hero-tag{
display:inline-block;
font-family:'Space Mono',monospace;
font-size:9px;
letter-spacing:4px;
color:var(--muted);
border:1px solid var(--border2);
padding:4px 12px;
border-radius:2px;
margin-bottom:10px;
text-transform:uppercase;
}

.hero-title{
font-family:'Bebas Neue',sans-serif;
font-size:28px;
letter-spacing:8px;
color:var(--text);
line-height:1;
}

/* MAIN WRAP */
#app{
width:100%;
max-width:680px;
margin:0 auto;
padding:0 12px 40px;
}

/* PROFILE CARD */
.profile{
background:var(--surface);
border:1px solid var(--border);
border-radius:4px;
overflow:hidden;
}

/* COVER — stark editorial stripe */
.cover{
height:80px;
background:var(--accent);
position:relative;
overflow:hidden;
}

.cover::before{
content:"";
position:absolute;
inset:0;
background:
repeating-linear-gradient(
90deg,
transparent,
transparent 28px,
rgba(0,0,0,0.08) 28px,
rgba(0,0,0,0.08) 30px
);
}

.cover::after{
content:"GOAT FC";
font-family:'Bebas Neue',sans-serif;
font-size:80px;
letter-spacing:8px;
color:rgba(0,0,0,0.08);
position:absolute;
bottom:-10px;
right:12px;
line-height:1;
}

/* PROFILE TOP */
.profile-top{
display:flex;
align-items:flex-end;
gap:14px;
padding:0 16px;
margin-top:-32px;
position:relative;
z-index:2;
}

.avatar-frame{
flex-shrink:0;
width:72px;
height:72px;
border-radius:4px;
border:3px solid var(--accent);
overflow:hidden;
background:var(--surface2);
box-shadow:0 0 0 1px var(--bg);
}

.avatar-frame img{
width:100%;
height:100%;
object-fit:cover;
}

.avatar-info{
flex:1;
padding-bottom:10px;
min-width:0;
}

.player-name{
font-family:'Bebas Neue',sans-serif;
font-size:22px;
letter-spacing:2px;
line-height:1;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.player-meta{
display:flex;
align-items:center;
gap:8px;
margin-top:5px;
flex-wrap:wrap;
}

.pill{
font-family:'Space Mono',monospace;
font-size:9px;
letter-spacing:1px;
padding:3px 8px;
border-radius:2px;
background:var(--surface3);
border:1px solid var(--border2);
color:var(--muted);
}

.pill.active{
background:rgba(232,255,71,0.1);
border-color:rgba(232,255,71,0.3);
color:var(--accent);
}

/* STATUS DOT */
.status-dot{
width:7px;
height:7px;
border-radius:50%;
background:var(--green);
box-shadow:0 0 6px var(--green);
display:inline-block;
}

/* DIVIDER */
.divider{
height:1px;
background:var(--border);
margin:0 16px;
}

/* RANK + CP STRIP */
.rank-strip{
display:grid;
grid-template-columns:1fr 1fr;
}

.rank-cell{
padding:14px 16px;
display:flex;
align-items:center;
gap:12px;
}

.rank-cell:first-child{
border-right:1px solid var(--border);
}

.rank-icon-box{
width:36px;
height:36px;
display:flex;
align-items:center;
justify-content:center;
border-radius:3px;
background:rgba(232,255,71,0.08);
border:1px solid rgba(232,255,71,0.15);
font-size:14px;
color:var(--accent);
flex-shrink:0;
}

.rank-label{
font-family:'Space Mono',monospace;
font-size:8px;
letter-spacing:2px;
color:var(--muted);
text-transform:uppercase;
}

.rank-value{
font-family:'Bebas Neue',sans-serif;
font-size:22px;
letter-spacing:1px;
line-height:1.1;
color:var(--accent);
}

/* STATS GRID */
.stats-section{
padding:16px 16px 12px;
}

.stats-label{
font-family:'Space Mono',monospace;
font-size:8px;
letter-spacing:3px;
color:var(--muted2);
text-transform:uppercase;
margin-bottom:10px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:1px;
background:var(--border);
border:1px solid var(--border);
border-radius:3px;
overflow:hidden;
}

.stat-cell{
background:var(--surface2);
padding:12px 10px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
text-align:center;
transition:background .15s;
}

.stat-cell:hover{background:var(--surface3);}

.stat-num{
font-family:'Bebas Neue',sans-serif;
font-size:22px;
letter-spacing:1px;
line-height:1;
color:var(--text);
}

.stat-num.green{color:var(--green);}
.stat-num.red{color:var(--red);}
.stat-num.yellow{color:var(--draw);}
.stat-num.cyan{color:var(--accent2);}
.stat-num.accent{color:var(--accent);}

.stat-lbl{
font-family:'Space Mono',monospace;
font-size:7px;
letter-spacing:1.5px;
color:var(--muted);
text-transform:uppercase;
}

/* WLD ROW */
.wld-row{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-top:10px;
}

.wld-cell{
padding:10px 8px;
border-radius:3px;
display:flex;
align-items:center;
gap:8px;
background:var(--surface2);
border:1px solid var(--border);
}

.wld-bar{
width:3px;
height:28px;
border-radius:99px;
flex-shrink:0;
}

.wld-bar.w{background:var(--green);}
.wld-bar.l{background:var(--red);}
.wld-bar.d{background:var(--draw);}

.wld-info{}

.wld-n{
font-family:'Bebas Neue',sans-serif;
font-size:20px;
letter-spacing:1px;
line-height:1;
}

.wld-n.w{color:var(--green);}
.wld-n.l{color:var(--red);}
.wld-n.d{color:var(--draw);}

.wld-t{
font-family:'Space Mono',monospace;
font-size:7px;
letter-spacing:1px;
color:var(--muted);
margin-top:1px;
}

/* MATCHES */
.matches-section{
padding:0 16px 16px;
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px;
}

.section-title{
font-family:'Bebas Neue',sans-serif;
font-size:14px;
letter-spacing:4px;
color:var(--text);
}

.match-count-badge{
font-family:'Space Mono',monospace;
font-size:8px;
letter-spacing:1px;
padding:3px 8px;
border-radius:2px;
background:var(--surface3);
border:1px solid var(--border2);
color:var(--muted);
}

.match-row{
display:grid;
grid-template-columns:1fr 64px 1fr;
align-items:center;
gap:6px;
padding:10px 10px;
border-radius:3px;
background:var(--surface2);
border:1px solid var(--border);
margin-bottom:5px;
transition:background .15s, border-color .15s;
cursor:default;
}

.match-row:hover{
background:var(--surface3);
border-color:var(--border2);
}

.match-player{}

.match-player.right{text-align:right;}

.mp-name{
font-size:11px;
font-weight:500;
color:var(--text);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.mp-id{
font-family:'Space Mono',monospace;
font-size:8px;
letter-spacing:1px;
color:var(--muted);
margin-top:2px;
}

.match-center{
text-align:center;
}

.score-badge{
display:inline-block;
font-family:'Bebas Neue',sans-serif;
font-size:14px;
letter-spacing:2px;
padding:4px 8px;
border-radius:2px;
width:100%;
}

.score-badge.win{
background:rgba(0,204,102,0.1);
color:var(--green);
border:1px solid rgba(0,204,102,0.2);
}

.score-badge.loss{
background:rgba(255,68,68,0.1);
color:var(--red);
border:1px solid rgba(255,68,68,0.2);
}

.score-badge.draw{
background:rgba(245,158,11,0.1);
color:var(--draw);
border:1px solid rgba(245,158,11,0.2);
}

.match-type-lbl{
font-family:'Space Mono',monospace;
font-size:7px;
letter-spacing:1px;
color:var(--muted2);
margin-top:4px;
text-transform:uppercase;
}

/* FOOTER */
.card-footer{
padding:12px 16px;
border-top:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
}

.footer-text{
font-family:'Space Mono',monospace;
font-size:8px;
letter-spacing:2px;
color:var(--muted2);
}

.footer-dot{
width:5px;
height:5px;
border-radius:50%;
background:var(--accent);
opacity:0.5;
}

/* LOADER */
.loader{
padding:60px 20px;
text-align:center;
font-family:'Space Mono',monospace;
font-size:11px;
letter-spacing:3px;
color:var(--muted);
}

.loader i{color:var(--accent);}

/* MOBILE */
@media(max-width:480px){
.hero-title{font-size:22px;letter-spacing:5px;}
.player-name{font-size:18px;}
.stat-num{font-size:18px;}
.rank-value{font-size:18px;}
.stats-grid{grid-template-columns:repeat(3,1fr);}
.score-badge{font-size:12px;padding:3px 5px;}
.mp-name{font-size:10px;}
}

@media(min-width:769px){
#app{padding:16px 20px 60px;}
.cover{height:100px;}
.profile-top{padding:0 20px;margin-top:-38px;}
.avatar-frame{width:84px;height:84px;}
.player-name{font-size:26px;}
.rank-value{font-size:26px;}
.stat-num{font-size:26px;}
}
</style>
</head>

<body>

<a href="https://goatfcbd.com" class="topbar" style="text-decoration:none;">
<div class="top-left">
<img src="https://i.imgur.com/LY3Bb9m.png" class="top-logo">
<div class="top-title">GOAT FC</div>
</div>
<div class="home-btn">
<i class="fa-solid fa-house"></i>
</div>
</a>

<div class="hero">
<div class="hero-tag">Player Profile</div>
<div class="hero-title">ELITE ATHLETE</div>
</div>

<div id="app">
<div class="loader">
<i class="fa-solid fa-spinner fa-spin" style="font-size:18px;display:block;margin-bottom:14px;"></i>
LOADING PROFILE...
</div>
</div>

<script>
const MATCH_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv';
const MEMBER_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv';
const CP_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1252347749&single=true&output=csv';

const params=new URLSearchParams(location.search);
function normalize(x){return(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
const playerId=normalize(params.get('id')||'GFC-001');

function csvToArray(str){
const rows=[];
let quote=false,row=[],col='';
for(let i=0;i<str.length;i++){
const c=str[i];
if(c==='"'){quote=!quote;}
else if(c===','&&!quote){row.push(col);col='';}
else if((c==='\n'||c==='\r')&&!quote){
if(col||row.length){row.push(col);rows.push(row);row=[];col='';}
}else{col+=c;}
}
if(col||row.length){row.push(col);rows.push(row);}
return rows;
}

async function load(){
try{
const[matchRes,memberRes,cpRes]=await Promise.all([
fetch(MATCH_CSV+'&t='+Date.now()),
fetch(MEMBER_CSV+'&t='+Date.now()),
fetch(CP_CSV+'&t='+Date.now())
]);
const matchText=await matchRes.text();
const memberText=await memberRes.text();
const cpText=await cpRes.text();
const matchRows=csvToArray(matchText);
const memberRows=csvToArray(memberText);
const cpRows=csvToArray(cpText);

const members={};
memberRows.slice(1).forEach(r=>{
if(!r.length)return;
const id=normalize(r[1]);
members[id]={name:r[0]||'Unknown',pic:r[4]||'https://i.imgur.com/LY3Bb9m.png',club:r[1]||'N/A'};
});

const cpMap={};
cpRows.slice(1).forEach(r=>{
if(!r.length)return;
cpMap[normalize(r[0])]=r[7]||'0';
});

const board={};
const matches=[];

matchRows.slice(1).forEach(r=>{
if(!r.length)return;
if((r[9]||'').toLowerCase()!=='yes')return;
const p1=normalize(r[0]);
const p2=normalize(r[1]);
if(!board[p1])board[p1]={points:0,win:0,gs:0,gc:0,match:0};
if(!board[p2])board[p2]={points:0,win:0,gs:0,gc:0,match:0};
board[p1].points+=(+r[5]||0);
board[p2].points+=(+r[6]||0);
if(+r[3]>+r[4])board[p1].win++;
if(+r[4]>+r[3])board[p2].win++;
board[p1].gs+=(+r[3]||0);board[p1].gc+=(+r[4]||0);
board[p2].gs+=(+r[4]||0);board[p2].gc+=(+r[3]||0);
board[p1].match++;board[p2].match++;
if(p1===playerId||p2===playerId){
matches.push({p1:r[0],p2:r[1],type:r[2],s1:+r[3],s2:+r[4]});
}
});

const ranking=Object.entries(board)
.map(([id,v])=>({id,points:v.points,winPercent:v.match?(v.win/v.match)*100:0,gd:v.gs-v.gc}))
.sort((a,b)=>b.points-a.points||b.winPercent-a.winPercent||b.gd-a.gd);

const rank=ranking.findIndex(x=>x.id===playerId)+1;

let win=0,loss=0,draw=0,gs=0,gc=0,seven=0;
matches.forEach(m=>{
let me,op;
if(normalize(m.p1)===playerId){me=m.s1;op=m.s2;}
else{me=m.s2;op=m.s1;}
gs+=me;gc+=op;
if(me>=7)seven++;
if(me>op)win++;
else if(me<op)loss++;
else draw++;
});

const total=matches.length;
const wr=((win/(total||1))*100).toFixed(1);
const gr=(gs/(total||1)).toFixed(2);
const info=members[playerId]||{name:'Unknown Player',pic:'https://i.imgur.com/LY3Bb9m.png',club:'N/A'};
const netCP=cpMap[playerId]||'0';

const recentMatches=matches.slice().reverse().slice(0,5);

const html=`
<div class="profile">

  <div class="cover"></div>

  <div class="profile-top">
    <div class="avatar-frame">
      <img crossorigin="anonymous" src="${info.pic}" alt="${info.name}">
    </div>
    <div class="avatar-info">
      <div class="player-name">${info.name}</div>
      <div class="player-meta">
        <span class="pill active">${info.club}</span>
        <span class="pill"><span class="status-dot" style="margin-right:4px;"></span>ONLINE</span>
      </div>
    </div>
  </div>

  <div class="divider" style="margin-top:14px;"></div>

  <div class="rank-strip">
    <div class="rank-cell">
      <div class="rank-icon-box">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <div>
        <div class="rank-label">Overall Rank</div>
        <div class="rank-value">#${rank||'-'}</div>
      </div>
    </div>
    <div class="rank-cell">
      <div class="rank-icon-box">
        <i class="fa-solid fa-coins"></i>
      </div>
      <div>
        <div class="rank-label">Net CP</div>
        <div class="rank-value">${netCP}</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="stats-section">
    <div class="stats-label">Performance Stats</div>

    <div class="wld-row">
      <div class="wld-cell">
        <div class="wld-bar w"></div>
        <div class="wld-info">
          <div class="wld-n w">${win}</div>
          <div class="wld-t">WINS</div>
        </div>
      </div>
      <div class="wld-cell">
        <div class="wld-bar l"></div>
        <div class="wld-info">
          <div class="wld-n l">${loss}</div>
          <div class="wld-t">LOSS</div>
        </div>
      </div>
      <div class="wld-cell">
        <div class="wld-bar d"></div>
        <div class="wld-info">
          <div class="wld-n d">${draw}</div>
          <div class="wld-t">DRAW</div>
        </div>
      </div>
    </div>

    <div class="stats-grid" style="margin-top:10px;">
      <div class="stat-cell">
        <div class="stat-num accent">${total}</div>
        <div class="stat-lbl">Matches</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num cyan">${wr}%</div>
        <div class="stat-lbl">Win Rate</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num">${gr}</div>
        <div class="stat-lbl">Goal Ratio</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num green">${gs}</div>
        <div class="stat-lbl">Scored</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num red">${gc}</div>
        <div class="stat-lbl">Conceded</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num accent">${seven}</div>
        <div class="stat-lbl">7+ Goals</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="matches-section" style="padding-top:14px;">
    <div class="section-head">
      <div class="section-title">RECENT MATCHES</div>
      <div class="match-count-badge">LAST 5</div>
    </div>

    ${recentMatches.map(m=>{
      let me,op,cls;
      if(normalize(m.p1)===playerId){me=m.s1;op=m.s2;}
      else{me=m.s2;op=m.s1;}
      if(me>op)cls='win';
      else if(me<op)cls='loss';
      else cls='draw';
      return `
      <div class="match-row">
        <div class="match-player">
          <div class="mp-name">${members[normalize(m.p1)]?.name||m.p1}</div>
          <div class="mp-id">${m.p1}</div>
        </div>
        <div class="match-center">
          <div class="score-badge ${cls}">${m.s1}–${m.s2}</div>
          <div class="match-type-lbl">${m.type}</div>
        </div>
        <div class="match-player right">
          <div class="mp-name">${members[normalize(m.p2)]?.name||m.p2}</div>
          <div class="mp-id">${m.p2}</div>
        </div>
      </div>`;
    }).join('')}
  </div>

  <div class="card-footer">
    <div class="footer-text">POWERED BY GOAT FC</div>
    <div class="footer-dot"></div>
    <div class="footer-text">ELITE ATHLETE</div>
  </div>

</div>
`;

document.getElementById('app').innerHTML=html;

}catch(err){
console.error(err);
document.getElementById('app').innerHTML=`
<div class="loader">
