<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PLAYERS HUB</title>

<link rel="icon"
type="image/png"
href="https://i.imgur.com/LY3Bb9m.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

:root{
--bg:#050816;
--card:#0f172a;
--cyan:#00f5ff;
--green:#00ff88;
--white:#f8fafc;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
font-family:'Rajdhani',sans-serif;
color:var(--white);
overflow-x:hidden;
padding-bottom:20px;
}

body::before{
content:"";
position:fixed;
inset:0;

background:
radial-gradient(circle at top left,#00f5ff12,transparent 25%),
radial-gradient(circle at bottom right,#00ff8810,transparent 25%);

z-index:-1;
}

/* =====================
TOPBAR
===================== */

.topbar{
height:46px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 12px;

background:rgba(5,8,22,.88);

backdrop-filter:blur(10px);

border-bottom:1px solid #00f5ff15;

position:sticky;
top:0;
z-index:999;

text-decoration:none;
}

.top-left{
display:flex;
align-items:center;
gap:7px;
}

.top-logo{
width:22px;

filter:
drop-shadow(0 0 5px #00f5ff);
}

.top-title{
font-family:'Orbitron',sans-serif;
font-size:10px;
font-weight:700;
letter-spacing:1px;

background:
linear-gradient(90deg,var(--cyan),var(--green));

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.home-btn{
width:28px;
height:28px;

display:flex;
align-items:center;
justify-content:center;

border-radius:9px;

background:#111827;

border:1px solid #00f5ff20;

color:var(--cyan);

font-size:10px;
}

/* =====================
HEADER
===================== */

.hero{
padding:14px 10px 12px;
text-align:center;
}

.hero-title{
font-family:'Orbitron',sans-serif;
font-size:17px;
font-weight:800;
letter-spacing:2px;

background:
linear-gradient(
90deg,
#00f5ff,
#ffffff,
#00ff88
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-sub{
margin-top:5px;

font-size:9px;
font-weight:700;

letter-spacing:3px;

color:var(--muted);
}

/* =====================
MAIN WRAP
===================== */

.wrap{
width:min(100% - 10px,480px);
margin:auto;
}

/* =====================
SEARCH
===================== */

.search-box{
width:100%;

height:42px;

padding:0 14px;

border-radius:14px;

border:1px solid #00f5ff20;

background:
linear-gradient(145deg,#111827,#0f172a);

outline:none;

color:white;

font-size:12px;
font-weight:700;

font-family:'Rajdhani',sans-serif;

margin-bottom:12px;

box-shadow:
0 0 10px #00f5ff08;
}

.search-box::placeholder{
color:#94a3b8;
}

.search-box:focus{

border-color:#00f5ff55;

box-shadow:
0 0 12px #00f5ff22;
}

/* =====================
GRID
===================== */

.grid{
display:grid;

grid-template-columns:
repeat(2,1fr);

gap:10px;
}

/* =====================
CARD
===================== */

.card{
position:relative;

padding:12px 10px;

border-radius:18px;

background:
linear-gradient(145deg,#111827,#0f172a);

border:1px solid #00f5ff18;

overflow:hidden;

cursor:pointer;

transition:.25s;

text-align:center;

box-shadow:
0 0 10px #000;
}

.card::before{
content:"";

position:absolute;

inset:3px;

border-radius:14px;

border:1px solid #00f5ff10;

pointer-events:none;
}

.card:hover{
transform:translateY(-3px);

border-color:#00f5ff30;

box-shadow:
0 0 14px #00f5ff18;
}

/* IMAGE */

.card img{
width:68px;
height:68px;

border-radius:50%;

object-fit:cover;

border:2px solid #00f5ff;

background:#111827;

box-shadow:
0 0 10px #00f5ff22;
}

/* NAME */

.name{
margin-top:9px;

font-size:13px;
font-weight:800;

line-height:1.3;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* ID */

.id{
margin-top:5px;

display:inline-flex;
align-items:center;
justify-content:center;
gap:4px;

padding:5px 8px;

border-radius:999px;

background:#00f5ff10;

border:1px solid #00f5ff15;

font-size:8px;
font-weight:700;

color:var(--cyan);
}

/* EMPTY */

.empty{
padding:40px 10px;

text-align:center;

font-size:13px;
font-weight:700;

color:var(--muted);
}

/* MOBILE */

@media(max-width:420px){

.card{
padding:10px 8px;
}

.card img{
width:62px;
height:62px;
}

.name{
font-size:12px;
}

}

</style>
</head>

<body>

<!-- TOPBAR -->

<a href="https://goatfcbd.com"
class="topbar">

<div class="top-left">

<img src="https://i.imgur.com/LY3Bb9m.png"
class="top-logo">

<div class="top-title">
GOAT FC
</div>

</div>

<div class="home-btn">
<i class="fa-solid fa-house"></i>
</div>

</a>

<!-- HEADER -->

<div class="hero">

<div class="hero-title">
PLAYERS HUB
</div>

<div class="hero-sub">
SEARCH YOUR FAVORITE PLAYER
</div>

</div>

<!-- WRAP -->

<div class="wrap">

<!-- SEARCH -->

<input
type="text"
id="search"
class="search-box"
placeholder="Search Player Name / ID...">

<!-- GRID -->

<div id="grid"
class="grid">

</div>

</div>

<script>

const MEMBER_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let playersData=[];

/* CSV */

function parseCSV(text){

return text
.split("\n")
.map(r=>r.split(","));

}

/* NORMALIZE */

function normalize(x){

return (x||"")
.toLowerCase();

}

/* LOAD */

async function loadPlayers(){

const res =
await fetch(MEMBER_CSV);

const text =
await res.text();

const rows =
parseCSV(text);

rows.slice(1).forEach(r=>{

playersData.push({

name:r[0] || "Unknown",

id:r[1] || "N/A",

pic:r[4] ||
"https://i.imgur.com/LY3Bb9m.png"

});

});

render(playersData);

}

/* RENDER */

function render(data){

let html='';

if(data.length===0){

html=`

<div class="empty">
<i class="fa-solid fa-magnifying-glass"></i>
<br><br>
No Player Found
</div>

`;

document
.getElementById("grid")
.innerHTML=html;

return;

}

data.forEach(p=>{

html += `

<div class="card"
onclick="openProfile('${p.id}')">

<img src="${p.pic}">

<div class="name">
${p.name}
</div>

<div class="id">

<i class="fa-solid fa-shield-halved"></i>

${p.id}

</div>

</div>

`;

});

document
.getElementById("grid")
.innerHTML = html;

}

/* SEARCH */

document
.getElementById("search")

.addEventListener("input",function(){

const value =
normalize(this.value);

const filtered =
playersData.filter(p=>

normalize(p.name)
.includes(value)

||

normalize(p.id)
.includes(value)

);

render(filtered);

});

/* OPEN PROFILE */

function openProfile(id){

window.location.href =
"profile/?id="+id;

}

loadPlayers();

</script>

</body>
</html>
