<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number To Words Converter Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b, #111827);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .header p {
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .input-box {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .input-box input {
      flex: 1;
      min-width: 240px;
      padding: 18px 20px;
      border-radius: 14px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1.1rem;
      transition: 0.3s;
    }

    .input-box input:focus {
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.4);
    }

    .input-box button {
      padding: 16px 28px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .input-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(99,102,241,0.35);
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 22px;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.08);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to right, #38bdf8, #8b5cf6);
    }

    .card h3 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: #93c5fd;
    }

    .card p {
      color: #e2e8f0;
      line-height: 1.7;
      font-size: 0.96rem;
      word-wrap: break-word;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    @media(max-width: 600px) {
      .container {
        padding: 22px;
      }

      .header h1 {
        font-size: 1.9rem;
      }

      .input-box {
        flex-direction: column;
      }

      .input-box button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Number To Words Converter</h1>
      <p>Bangladesh • India • USA • International Numbering System</p>
    </div>

    <div class="input-box">
      <input type="number" id="numberInput" placeholder="Enter a number like 323691" />
      <button onclick="convertNumber()">Convert</button>
    </div>

    <div class="results">
      <div class="card">
        <h3>🇧🇩 Bangladesh Style</h3>
        <p id="bdResult">Waiting for input...</p>
      </div>

      <div class="card">
        <h3>🇮🇳 Indian Style</h3>
        <p id="indianResult">Waiting for input...</p>
      </div>

      <div class="card">
        <h3>🇺🇸 USA Style</h3>
        <p id="usaResult">Waiting for input...</p>
      </div>

      <div class="card">
        <h3>🌍 International Style</h3>
        <p id="intlResult">Waiting for input...</p>
      </div>
    </div>

    <div class="footer">
      Made with ❤️ for GitHub Pages Deployment
    </div>
  </div>

  <script>
    const ones = [
      '', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine',
      'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen',
      'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'
    ];

    const tens = [
      '', '', 'Twenty', 'Thirty', 'Forty', 'Fifty',
      'Sixty', 'Seventy', 'Eighty', 'Ninety'
    ];

    function convertHundreds(num) {
      let word = '';

      if (num > 99) {
        word += ones[Math.floor(num / 100)] + ' Hundred ';
        num %= 100;
      }

      if (num > 19) {
        word += tens[Math.floor(num / 10)] + ' ';
        num %= 10;
      }

      if (num > 0) {
        word += ones[num] + ' ';
      }

      return word.trim();
    }

    function numberToWordsInternational(num) {
      if (num === 0) return 'Zero';

      const units = ['', 'Thousand', 'Million', 'Billion', 'Trillion'];
      let words = '';
      let unitIndex = 0;

      while (num > 0) {
        let chunk = num % 1000;

        if (chunk !== 0) {
          words = convertHundreds(chunk) + ' ' + units[unitIndex] + ' ' + words;
        }

        num = Math.floor(num / 1000);
        unitIndex++;
      }

      return words.trim();
    }

    function numberToWordsIndian(num) {
      if (num === 0) return 'Zero';

      const units = ['', 'Thousand', 'Lakh', 'Crore', 'Arab'];

      let words = '';
      let unitIndex = 0;

      let firstPart = num % 1000;
      if (firstPart !== 0) {
        words = convertHundreds(firstPart);
      }

      num = Math.floor(num / 1000);
      unitIndex = 1;

      while (num > 0) {
        let chunk = num % 100;

        if (chunk !== 0) {
          words = convertHundreds(chunk) + ' ' + units[unitIndex] + ' ' + words;
        }

        num = Math.floor(num / 100);
        unitIndex++;
      }

      return words.trim();
    }

    function numberToWordsBangladesh(num) {
      return numberToWordsIndian(num);
    }

    function convertNumber() {
      const input = document.getElementById('numberInput').value;
      const number = parseInt(input);

      if (isNaN(number) || number < 0) {
        alert('Please enter a valid positive number');
        return;
      }

      document.getElementById('bdResult').innerText = numberToWordsBangladesh(number);
      document.getElementById('indianResult').innerText = numberToWordsIndian(number);
      document.getElementById('usaResult').innerText = numberToWordsInternational(number);
      document.getElementById('intlResult').innerText = numberToWordsInternational(number);
    }

    document.getElementById('numberInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        convertNumber();
      }
    });
  </script>

</body>
</html>
