<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GOAT FC — Precision Archery</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --g1:#00ff87;--g2:#00cc6a;--g3:#008844;--gd:#004422;
  --b1:#0a0f0a;--b2:#0d140d;--b3:#111a11;
  --w:#ffffff;--wd:rgba(255,255,255,.55);
  --acc:#39ff14;--acc2:#7fff00;
  --red:#ff3344;--gold:#ffd700;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--b1);
  font-family:'Rajdhani',sans-serif;color:var(--w);
  touch-action:none;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;}

/* ═══ BG CANVAS ═══ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ═══ SCREENS ═══ */
.scr{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.off{display:none!important;}

/* ══════════════════════════
   NAME SCREEN
══════════════════════════ */
#ns{overflow-y:auto;padding:1rem;}
.ns-inner{
  width:100%;max-width:480px;text-align:center;
  padding:1.5rem 0 2rem;
  animation:fadeUp .7s ease both;
}

/* Logo */
.logo-wrap{margin-bottom:clamp(.8rem,2.5vw,1.4rem);}
.logo-badge{
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--g2);color:#000;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(1.1rem,3.5vw,1.6rem);
  letter-spacing:.12em;padding:.3rem 1rem .25rem;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
.logo-dot{width:8px;height:8px;background:#000;border-radius:50%;}

.title-main{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2.8rem,12vw,6rem);
  letter-spacing:.06em;line-height:.9;
  color:var(--w);
  text-shadow:0 0 40px rgba(0,255,135,.25);
  margin-bottom:.05em;
}
.title-main span{color:var(--g1);}
.title-sub{
  font-family:'Orbitron',sans-serif;font-size:clamp(.45rem,1.5vw,.6rem);
  letter-spacing:.4em;color:var(--g3);text-transform:uppercase;
  margin-bottom:clamp(1rem,3vw,1.6rem);
}

/* stat strip */
.stat-strip{
  display:flex;justify-content:center;gap:1px;margin-bottom:clamp(1rem,3vw,1.5rem);
}
.sstrip{
  background:var(--b3);border-top:2px solid var(--g2);
  padding:.4rem .8rem;min-width:70px;text-align:center;
}
.sstrip-v{font-family:'Orbitron',sans-serif;font-size:clamp(.7rem,2.2vw,.9rem);color:var(--g1);}
.sstrip-l{font-size:clamp(.45rem,1.3vw,.55rem);letter-spacing:.2em;color:var(--wd);text-transform:uppercase;margin-top:.1rem;}

/* diff */
.diff-row{display:flex;gap:1px;justify-content:center;margin-bottom:clamp(1rem,3vw,1.4rem);}
.dbtn{
  background:var(--b3);border:none;color:var(--wd);
  font-family:'Rajdhani',sans-serif;font-size:clamp(.6rem,1.8vw,.75rem);
  font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  padding:.45rem clamp(.6rem,2vw,1rem);cursor:pointer;transition:all .2s;
  clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
}
.dbtn:hover{background:var(--gd);color:var(--g1);}
.dbtn.sel{background:var(--g2);color:#000;font-weight:700;}

/* name input */
.ninp-wrap{margin-bottom:clamp(.8rem,2.5vw,1.2rem);}
.ninp-lbl{font-size:clamp(.5rem,1.5vw,.6rem);letter-spacing:.28em;color:var(--g3);text-transform:uppercase;display:block;margin-bottom:.5rem;}
#pname{
  background:var(--b3);border:1px solid var(--g3);border-bottom:2px solid var(--g1);
  color:var(--w);font-family:'Rajdhani',sans-serif;font-size:clamp(.95rem,3vw,1.1rem);
  font-weight:600;text-align:center;width:clamp(200px,55vw,300px);
  padding:.5rem .8rem;outline:none;letter-spacing:.1em;transition:border-color .2s;
  -webkit-appearance:none;border-radius:0;
}
#pname:focus{border-color:var(--g1);box-shadow:0 0 0 1px rgba(0,255,135,.12);}
#pname::placeholder{color:rgba(0,255,135,.2);}
.nerr{color:var(--red);font-size:clamp(.55rem,1.6vw,.65rem);letter-spacing:.08em;min-height:1em;margin-top:.3rem;}

.btn-start{
  background:var(--g1);color:#000;border:none;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(.9rem,2.8vw,1.15rem);
  letter-spacing:.2em;padding:clamp(.6rem,2vw,.8rem) clamp(2rem,6vw,3rem);
  cursor:pointer;transition:all .2s;margin-top:.4rem;
  clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);
  position:relative;overflow:hidden;
}
.btn-start::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.15);
  transform:translateX(-100%);transition:transform .3s;}
.btn-start:hover::after{transform:translateX(0);}
.btn-start:active{transform:scale(.97);}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ══════════════════════════
   HUD
══════════════════════════ */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:stretch;height:clamp(44px,7vw,56px);
  background:rgba(5,10,5,.92);
  border-bottom:1px solid rgba(0,255,135,.12);
  pointer-events:none;
}
.hud-seg{
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:0 clamp(.6rem,2vw,1.2rem);border-right:1px solid rgba(0,255,135,.08);
  gap:1px;flex-shrink:0;
}
.hud-seg:last-child{border-right:none;margin-left:auto;}
.hl{font-size:clamp(.4rem,1.2vw,.5rem);letter-spacing:.28em;color:var(--g3);text-transform:uppercase;}
.hv{font-family:'Orbitron',sans-serif;font-size:clamp(.8rem,2.5vw,1.05rem);color:var(--g1);
  text-shadow:0 0 10px rgba(0,255,135,.35);transition:transform .15s;}
.hv.pop{animation:hpop .3s ease;}
@keyframes hpop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}

#pips{display:flex;gap:clamp(2px,.7vw,4px);align-items:center;padding:0 clamp(.5rem,1.5vw,1rem);}
.pip{width:clamp(10px,2vw,14px);height:clamp(10px,2vw,14px);
  border:1.5px solid var(--g2);border-radius:50%;background:var(--g1);
  transition:all .3s;box-shadow:0 0 6px rgba(0,255,135,.25);}
.pip.used{background:transparent;border-color:rgba(0,255,135,.18);box-shadow:none;}

#phud-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(.75rem,2.2vw,1rem);
  letter-spacing:.1em;color:rgba(0,255,135,.45);padding:0 clamp(.5rem,1.5vw,1rem);}

/* timer strip */
#tbar{position:fixed;top:clamp(44px,7vw,56px);left:0;right:0;height:3px;
  background:rgba(0,255,135,.06);z-index:59;opacity:0;transition:opacity .3s;}
#tbar.vis{opacity:1;}
#tfill{height:100%;width:100%;background:linear-gradient(to right,var(--g1),#ffd700,var(--red));transform-origin:left;transition:width .1s linear;}

/* ══════════════════════════
   GAME CANVAS
══════════════════════════ */
#gw{width:100vw;height:100vh;overflow:hidden;position:relative;}
#gc{display:block;width:100%;height:100%;}

/* ══════════════════════════
   OVERLAYS
══════════════════════════ */
/* Hit banner */
#hit-banner{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;z-index:300;opacity:0;text-align:center;width:90vw;
}
#hit-banner.show{animation:bannerPop 1s ease forwards;}
#hb-main{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,7vw,4.5rem);
  letter-spacing:.1em;text-shadow:0 0 30px currentColor;line-height:1;}
#hb-pts{font-family:'Orbitron',sans-serif;font-size:clamp(.7rem,2.2vw,1rem);
  letter-spacing:.3em;opacity:.8;margin-top:.2rem;}
@keyframes bannerPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) skewX(-5deg)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.1) skewX(-2deg)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(1) skewX(0)}
  100%{opacity:0;transform:translate(-50%,-55%) scale(.95)}
}

/* Combo bar */
#combo-bar{
  position:fixed;bottom:clamp(5rem,11vw,7rem);left:50%;transform:translateX(-50%);
  z-index:200;pointer-events:none;text-align:center;
  opacity:0;transition:opacity .25s;
}
#combo-bar.vis{opacity:1;}
#cb-num{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.4rem,5vw,2.5rem);color:var(--gold);
  text-shadow:0 0 20px rgba(255,215,0,.5);line-height:1;}
#cb-lbl{font-family:'Orbitron',sans-serif;font-size:clamp(.45rem,1.3vw,.55rem);
  letter-spacing:.35em;color:rgba(255,215,0,.6);text-transform:uppercase;}

/* Score pop */
.spop{position:fixed;font-family:'Bebas Neue',sans-serif;font-size:clamp(1.2rem,4vw,2rem);
  pointer-events:none;z-index:250;animation:spopA 1.3s ease forwards;letter-spacing:.05em;
  text-shadow:0 0 14px currentColor;}
@keyframes spopA{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  20%{opacity:1;transform:translate(-50%,-65%) scale(1.2)}
  65%{opacity:1;transform:translate(-50%,-115%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-165%) scale(.85)}
}

/* Wind */
#wind{
  position:fixed;bottom:clamp(4.5rem,10vw,6rem);right:clamp(.7rem,2.5vw,1.5rem);
  z-index:60;pointer-events:none;text-align:right;
}
#wl{font-size:clamp(.42rem,1.2vw,.52rem);letter-spacing:.22em;color:var(--g3);text-transform:uppercase;margin-bottom:.2rem;}
#wa{font-size:clamp(.85rem,2.6vw,1.1rem);color:rgba(0,255,135,.45);display:block;transition:transform .8s ease;}
#ws{font-size:clamp(.42rem,1.2vw,.52rem);letter-spacing:.14em;color:rgba(0,255,135,.3);margin-top:.12rem;}

/* aim hint */
#aimh{
  position:fixed;bottom:clamp(3.5rem,8vw,5rem);left:50%;transform:translateX(-50%);
  font-family:'Orbitron',sans-serif;font-size:clamp(.42rem,1.3vw,.52rem);
  letter-spacing:.3em;color:rgba(0,255,135,.2);text-transform:uppercase;
  pointer-events:none;z-index:50;transition:opacity .5s;white-space:nowrap;
}

/* power bar */
#pwrap{
  position:fixed;bottom:clamp(.8rem,2.5vw,1.4rem);left:50%;transform:translateX(-50%);
  z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:.25rem;
  opacity:0;transition:opacity .25s;
}
#pwrap.vis{opacity:1;}
#pwlbl{font-family:'Orbitron',sans-serif;font-size:clamp(.4rem,1.2vw,.5rem);letter-spacing:.3em;color:var(--g3);text-transform:uppercase;}
#pwbg{width:clamp(120px,30vw,180px);height:5px;background:rgba(0,255,135,.08);border-radius:0;overflow:hidden;border:1px solid rgba(0,255,135,.1);}
#pwf{height:100%;width:0%;background:linear-gradient(to right,var(--g1),var(--gold),var(--red));transition:width .05s;}

/* ══════════════════════════
   RESULT SCREEN
══════════════════════════ */
#rs{
  background:linear-gradient(160deg,#040c04 0%,#060f06 50%,#030803 100%);
  overflow-y:auto;overflow-x:hidden;
  padding:clamp(1rem,3vw,2rem) 1rem clamp(1.5rem,4vw,2.5rem);
  justify-content:flex-start;
  gap:0;
}
.rs-inner{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:0;}

.rs-badge{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(.6rem,1.8vw,.75rem);letter-spacing:.2em;
  background:var(--g2);color:#000;padding:.2rem .7rem;margin-bottom:.8rem;
  animation:fadeUp .6s ease both;
  clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
}
.rs-title{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(1.4rem,5vw,2.8rem);
  color:var(--w);letter-spacing:.08em;line-height:1.1;
  margin-bottom:.1em;animation:fadeUp .7s ease both;text-align:center;
}
.rs-name{
  font-family:'Orbitron',sans-serif;font-size:clamp(.5rem,1.6vw,.65rem);
  letter-spacing:.3em;color:var(--g3);text-transform:uppercase;
  margin-bottom:clamp(.8rem,2.5vw,1.2rem);animation:fadeUp .8s ease both;
}

/* score hex */
.score-hex{
  width:clamp(110px,24vw,155px);height:clamp(110px,24vw,155px);
  position:relative;margin-bottom:clamp(.8rem,2.2vw,1.1rem);
  animation:fadeUp .85s ease both;
}
.score-hex svg{width:100%;height:100%;}
.score-vals{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.s-big{font-family:'Orbitron',sans-serif;font-size:clamp(1.6rem,5.5vw,3rem);font-weight:900;color:var(--g1);line-height:1;}
.s-lbl{font-size:clamp(.42rem,1.2vw,.52rem);letter-spacing:.35em;color:var(--g3);text-transform:uppercase;margin-top:.15em;}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:100%;max-width:320px;
  margin-bottom:clamp(.8rem,2.2vw,1.1rem);animation:fadeUp .9s ease both;}
.sg{background:var(--b3);padding:clamp(.4rem,1.2vw,.6rem) .5rem;text-align:center;border-top:2px solid transparent;}
.sg.hi{border-color:var(--g1);}
.sg-v{font-family:'Orbitron',sans-serif;font-size:clamp(.7rem,2.2vw,.9rem);color:var(--g1);}
.sg-l{font-size:clamp(.4rem,1.2vw,.5rem);letter-spacing:.18em;color:var(--wd);text-transform:uppercase;margin-top:.15rem;}

/* accuracy bar */
.acc-row{width:100%;max-width:320px;margin-bottom:clamp(.8rem,2.2vw,1.1rem);animation:fadeUp .95s ease both;}
.acc-top{display:flex;justify-content:space-between;font-size:clamp(.42rem,1.3vw,.55rem);
  letter-spacing:.2em;color:var(--g3);text-transform:uppercase;margin-bottom:.4rem;}
.acc-bg{height:4px;background:rgba(0,255,135,.08);overflow:hidden;}
.acc-fill{height:100%;width:0%;background:linear-gradient(to right,var(--g1),var(--gold));transition:width 1.3s ease;}

/* hit chips */
.hchips{display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap;
  margin-bottom:clamp(.9rem,2.5vw,1.2rem);animation:fadeUp 1s ease both;max-width:100%;}
.hc{padding:.22rem .55rem;font-size:clamp(.48rem,1.4vw,.58rem);letter-spacing:.12em;
  font-family:'Rajdhani',sans-serif;font-weight:700;border:1px solid;border-radius:0;text-transform:uppercase;}
.cm{border-color:#333;color:#555;background:rgba(0,0,0,.4);}
.co{border-color:#2a4030;color:#4a7060;background:rgba(20,50,30,.2);}
.cmi{border-color:#3a5030;color:#7aaa60;background:rgba(30,60,20,.2);}
.ci{border-color:#5a8040;color:#aad060;background:rgba(50,90,20,.18);}
.cb{border-color:rgba(0,255,135,.4);color:var(--g1);background:rgba(0,255,135,.06);}

/* result btns */
.rbtns{display:flex;gap:1px;justify-content:center;animation:fadeUp 1.05s ease both;}
.rbtn{
  background:var(--b3);border:none;color:var(--wd);
  font-family:'Bebas Neue',sans-serif;font-size:clamp(.7rem,2.2vw,.9rem);
  letter-spacing:.15em;text-transform:uppercase;
  padding:clamp(.5rem,1.6vw,.65rem) clamp(1.2rem,4vw,2rem);
  cursor:pointer;transition:all .2s;
}
.rbtn:hover{background:var(--gd);color:var(--g1);}
.rbtn.pri{background:var(--g1);color:#000;font-weight:700;}
.rbtn.pri:hover{background:var(--g2);}

/* ═══ LANDSCAPE FIXES ═══ */
@media(max-height:500px) and (orientation:landscape){
  .title-main{font-size:2.5rem;}
  .ns-inner{padding:.4rem 0 .8rem;}
  #rs{padding-top:.6rem;}
  .score-hex{width:90px;height:90px;}
  .s-big{font-size:1.6rem;}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="hit-banner"><div id="hb-main"></div><div id="hb-pts"></div></div>
<div id="combo-bar"><div id="cb-num"></div><div id="cb-lbl">Combo</div></div>
<div id="pwrap"><div id="pwbg"><div id="pwf"></div></div><div id="pwlbl">Draw Power</div></div>
<div id="aimh">HOLD &amp; AIM · RELEASE TO FIRE</div>
<div id="tbar"><div id="tfill"></div></div>
<div id="wind"><div id="wl">Wind</div><span id="wa">→</span><div id="ws">0 mph</div></div>

<!-- ═══ NAME SCREEN ═══ -->
<div class="scr" id="ns">
  <div class="ns-inner">
    <div class="logo-wrap">
      <div class="logo-badge"><div class="logo-dot"></div>GOAT FC<div class="logo-dot"></div></div>
    </div>
    <div class="title-main">PRECISION<br><span>ARCHERY</span></div>
    <div class="title-sub">Pro Edition · Season 2025</div>
    <div class="stat-strip">
      <div class="sstrip"><div class="sstrip-v">10</div><div class="sstrip-l">Arrows</div></div>
      <div class="sstrip"><div class="sstrip-v">100</div><div class="sstrip-l">Max Pts</div></div>
      <div class="sstrip"><div class="sstrip-v">5</div><div class="sstrip-l">Zones</div></div>
    </div>
    <div class="diff-row">
      <button class="dbtn" data-d="normal">Rookie</button>
      <button class="dbtn sel" data-d="hard">Pro</button>
      <button class="dbtn" data-d="extreme">GOAT</button>
    </div>
    <div class="ninp-wrap">
      <span class="ninp-lbl">Player Name</span>
      <input type="text" id="pname" placeholder="Enter name..." maxlength="18" autocomplete="off" spellcheck="false" enterkeyhint="go">
      <div class="nerr" id="nerr"></div>
    </div>
    <button class="btn-start" id="bstart">▶ ENTER THE RANGE</button>
  </div>
</div>

<!-- ═══ GAME SCREEN ═══ -->
<div class="scr off" id="gs">
  <div id="hud">
    <div class="hud-seg"><div class="hl">Score</div><div class="hv" id="shud">0</div></div>
    <div id="pips"></div>
    <div class="hud-seg"><div class="hl">Mode</div><div class="hv" id="modhud" style="font-size:clamp(.55rem,1.6vw,.72rem)">PRO</div></div>
    <div id="phud-name"></div>
  </div>
  <div id="gw"><canvas id="gc"></canvas></div>
</div>

<!-- ═══ RESULT SCREEN ═══ -->
<div class="scr off" id="rs">
  <div class="rs-inner">
    <div class="rs-badge">GOAT FC · MATCH REPORT</div>
    <div class="rs-title" id="rt">Round Complete</div>
    <div class="rs-name" id="rn"></div>
    <div class="score-hex">
      <svg viewBox="0 0 120 120">
        <polygon points="60,4 108,28 108,92 60,116 12,92 12,28"
          fill="none" stroke="rgba(0,255,135,.15)" stroke-width="1.5"/>
        <polygon points="60,10 103,32 103,88 60,110 17,88 17,32"
          fill="none" stroke="rgba(0,255,135,.06)" stroke-width="1"/>
        <polygon id="hex-arc" points="60,4 108,28 108,92 60,116 12,92 12,28"
          fill="none" stroke="url(#hg)" stroke-width="3"
          stroke-dasharray="280" stroke-dashoffset="280"
          style="transition:stroke-dashoffset 1.5s ease;"/>
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00ff87"/>
            <stop offset="100%" stop-color="#ffd700"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="score-vals">
        <div class="s-big" id="rscore">0</div>
        <div class="s-lbl">Points</div>
      </div>
    </div>
    <div class="stat-grid" id="stgrid"></div>
    <div class="acc-row">
      <div class="acc-top"><span>Hit Accuracy</span><span id="apct">0%</span></div>
      <div class="acc-bg"><div class="acc-fill" id="afill"></div></div>
    </div>
    <div class="hchips" id="hchips"></div>
    <div class="rbtns">
      <button class="rbtn" id="bmenu">◀ MENU</button>
      <button class="rbtn pri" id="breplay">▶ PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
/* ══ OPTIMISED BG ══ */
const bgC=document.getElementById('bg');const bgX=bgC.getContext('2d');
let BW,BH;const STARS=[];let bgAF;
function initBg(){
  BW=bgC.width=window.innerWidth;BH=bgC.height=window.innerHeight;
  STARS.length=0;
  // field grid lines
  for(let i=0;i<80;i++)STARS.push({
    type:'star',x:Math.random()*BW,y:Math.random()*BH,
    r:Math.random()*.9+.1,o:Math.random()*.2+.03,s:Math.random()*.0004+.0001
  });
}
let bgt=0;
function drawBg(ts){
  bgAF=requestAnimationFrame(drawBg);
  if(ts-bgt<33){return;}bgt=ts; // cap at ~30fps for bg
  bgX.clearRect(0,0,BW,BH);
  // deep dark bg
  bgX.fillStyle='#04080404';
  bgX.fillRect(0,0,BW,BH);
  // subtle grid
  bgX.strokeStyle='rgba(0,255,135,.025)';bgX.lineWidth=.5;
  const gs=60;
  for(let x=0;x<BW;x+=gs){bgX.beginPath();bgX.moveTo(x,0);bgX.lineTo(x,BH);bgX.stroke();}
  for(let y=0;y<BH;y+=gs){bgX.beginPath();bgX.moveTo(0,y);bgX.lineTo(BW,y);bgX.stroke();}
  // stars
  STARS.forEach(s=>{
    s.o+=s.s*(Math.random()>.5?1:-1);s.o=Math.max(.02,Math.min(.3,s.o));
    bgX.beginPath();bgX.arc(s.x,s.y,s.r,0,Math.PI*2);
    bgX.fillStyle=`rgba(0,255,135,${s.o.toFixed(2)})`;bgX.fill();
  });
}
initBg();
// clear once then animate
bgX.fillStyle='#04080a';bgX.fillRect(0,0,BW,BH);
requestAnimationFrame(drawBg);
window.addEventListener('resize',initBg);

/* ══ GAME CONSTANTS ══ */
const ARROWS=10;
const ZONES=[
  {l:'BULLSEYE',r:.08,p:10,c:'#00ff87',fc:'#00ff87',cls:'cb',glow:'rgba(0,255,135,.5)'},
  {l:'INNER',   r:.2, p:8, c:'#39ff14',fc:'#39ff14',cls:'cb',glow:'rgba(57,255,20,.35)'},
  {l:'MID',     r:.34,p:6, c:'#2a7a3a',fc:'#5adb7a',cls:'ci',glow:'rgba(50,180,80,.25)'},
  {l:'OUTER',   r:.50,p:4, c:'#1a4a28',fc:'#3a9a58',cls:'cmi',glow:null},
  {l:'EDGE',    r:.66,p:2, c:'#0f2a18',fc:'#2a6038',cls:'co',glow:null},
  {l:'RIM',     r:.80,p:1, c:'#0a1a10',fc:'#1a4025',cls:'co',glow:null},
  {l:'MISS',    r:999,p:0, c:null,     fc:'#334433',cls:'cm',glow:null},
];
const DIFF_CFG={
  normal:{wobble:7,  windMax:0,  timerSec:0,  moveAmp:0,  moveFreq:0,   label:'ROOKIE'},
  hard:  {wobble:15, windMax:2.5,timerSec:0,  moveAmp:35, moveFreq:.35, label:'PRO'},
  extreme:{wobble:24,windMax:5,  timerSec:10, moveAmp:70, moveFreq:.65, label:'GOAT'},
};

/* ══ STATE ══ */
let S={
  scr:'name',name:'',score:0,fired:0,hits:[],arrows:[],stuck:[],
  tgt:{x:0,y:0,r:0},holding:false,mx:0,my:0,holdT:0,
  bowX:0,bowY:0,canFire:true,diff:'hard',
  wind:{dx:0,dy:0,angle:0,spd:0},
  combo:0,maxCombo:0,bulls:0,
  tBaseX:0,tBaseY:0,tPhase:0,
  timerLeft:0,timerActive:false,
  particles:[],
  glowPulse:0,
};

/* ══ UI REFS ══ */
const NSc=document.getElementById('ns'),GSc=document.getElementById('gs'),RSc=document.getElementById('rs');
const pname=document.getElementById('pname'),nerr=document.getElementById('nerr'),bstart=document.getElementById('bstart');
const shud=document.getElementById('shud'),pips=document.getElementById('pips'),phudN=document.getElementById('phud-name');
const hitBanner=document.getElementById('hit-banner'),hbMain=document.getElementById('hb-main'),hbPts=document.getElementById('hb-pts');
const comboBar=document.getElementById('combo-bar'),cbNum=document.getElementById('cb-num');
const pwrap=document.getElementById('pwrap'),pwf=document.getElementById('pwf');
const aimh=document.getElementById('aimh');
const waEl=document.getElementById('wa'),wsEl=document.getElementById('ws');
const tbar=document.getElementById('tbar'),tfill=document.getElementById('tfill');
const modhud=document.getElementById('modhud');

document.querySelectorAll('.dbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.dbtn').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');S.diff=b.dataset.d;

}));
bstart.addEventListener('click',go);
pname.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
function go(){
  const n=pname.value.trim();
  if(!n){nerr.textContent='✕ Name required';return;}
  S.name=n;nerr.textContent='';

}

/* ══ CANVAS ══ */
const gc=document.getElementById('gc'),gx=gc.getContext('2d');
let GW,GH;

function resize(){GW=gc.width=gc.offsetWidth;GH=gc.height=gc.offsetHeight;placeTarget();}
function placeTarget(){
  const mob=window.innerWidth<700;
  S.tgt.r=Math.min(GW,GH)*(mob?.13:.105)+Math.random()*Math.min(GW,GH)*.04;
  S.tBaseX=GW*(.44+Math.random()*.44);
  S.tBaseY=GH*(.2+Math.random()*.58);
  S.tgt.x=S.tBaseX;S.tgt.y=S.tBaseY;
  S.bowX=GW*(mob?.05:.06);S.bowY=GH*.5;
  S.tPhase=Math.random()*Math.PI*2;
  setWind();
}
function setWind(){
  const d=DIFF_CFG[S.diff];const spd=Math.random()*d.windMax;
  const ang=Math.random()*Math.PI*2;
  S.wind={dx:Math.cos(ang)*spd,dy:Math.sin(ang)*spd*.25,angle:ang,spd};
  const dirs=['→','↗','↑','↖','←','↙','↓','↘'];
  waEl.textContent=dirs[Math.round(ang/(Math.PI/4))%8];
  waEl.style.transform=`rotate(${ang}rad)`;
  wsEl.textContent=`${spd.toFixed(1)} mph`;
}

function initGame(){
  Object.assign(S,{score:0,fired:0,hits:[],arrows:[],stuck:[],holding:false,
    canFire:true,combo:0,maxCombo:0,bulls:0,particles:[],timerLeft:0,timerActive:false});
  const d=DIFF_CFG[S.diff];
  phudN.textContent=S.name;
  modhud.textContent=d.label;
  updateHud();aimh.style.opacity='1';
  comboBar.classList.remove('vis');
  if(d.timerSec>0){S.timerLeft=d.timerSec;tbar.classList.add('vis');}
  else tbar.classList.remove('vis');
  resize();
  gc.addEventListener('mousedown',onDown);gc.addEventListener('mousemove',onMove);gc.addEventListener('mouseup',onUp);
  gc.addEventListener('touchstart',onTS,{passive:false});
  gc.addEventListener('touchmove',onTM,{passive:false});
  gc.addEventListener('touchend',onTE,{passive:false});
  requestAnimationFrame(loop);
}
window.addEventListener('resize',()=>{if(S.scr==='game')resize();});

function updateHud(){
  shud.textContent=S.score;
  pips.innerHTML='';
  for(let i=0;i<ARROWS;i++){
    const p=document.createElement('div');
    p.className='pip'+(i<S.fired?' used':'');
    pips.appendChild(p);
  }
}

/* ══ INPUT ══ */
function gp(e){const r=gc.getBoundingClientRect();return{x:(e.clientX-r.left)*GW/r.width,y:(e.clientY-r.top)*GH/r.height};}
function tp(t){const r=gc.getBoundingClientRect();return{x:(t.clientX-r.left)*GW/r.width,y:(t.clientY-r.top)*GH/r.height};}
function onDown(e){if(!S.canFire)return;const p=gp(e);S.holding=true;S.holdT=Date.now();S.mx=p.x;S.my=p.y;pwrap.classList.add('vis');aimh.style.opacity='0';}
function onMove(e){if(S.holding){const p=gp(e);S.mx=p.x;S.my=p.y;}}
function onUp(e){if(!S.holding||!S.canFire)return;S.holding=false;pwrap.classList.remove('vis');fire(S.mx,S.my);}
function onTS(e){e.preventDefault();if(!S.canFire)return;const p=tp(e.touches[0]);S.holding=true;S.holdT=Date.now();S.mx=p.x;S.my=p.y;pwrap.classList.add('vis');aimh.style.opacity='0';}
function onTM(e){e.preventDefault();const p=tp(e.touches[0]);S.mx=p.x;S.my=p.y;}
function onTE(e){e.preventDefault();if(!S.holding||!S.canFire)return;S.holding=false;pwrap.classList.remove('vis');fire(S.mx,S.my);}

/* ══ FIRE ══ */
function fire(tx,ty){
  if(S.fired>=ARROWS)return;
  S.canFire=false;
  const d=DIFF_CFG[S.diff];
  tx+=(Math.random()-.5)*d.wobble+S.wind.dx*5;
  ty+=(Math.random()-.5)*d.wobble+S.wind.dy*5;
  const pwr=Math.min((Date.now()-S.holdT)/1500,1);
  S.arrows.push({
    sx:S.bowX,sy:S.bowY,tx,ty,t:0,
    dur:.32+.14*(1-pwr),done:false,
    cx:S.bowX+(tx-S.bowX)*.25+(Math.random()-.5)*80,
    cy:S.bowY+(ty-S.bowY)*.45-Math.abs(tx-S.bowX)*.17,
  });
  S.fired++;updateHud();
  if(DIFF_CFG[S.diff].timerSec>0&&S.fired===1)S.timerActive=true;
}

function calcPts(tx,ty){
  const dx=tx-S.tgt.x,dy=ty-S.tgt.y;
  const f=Math.sqrt(dx*dx+dy*dy)/S.tgt.r;
  for(let i=0;i<ZONES.length;i++)if(f<=ZONES[i].r)return{pts:ZONES[i].p,z:i};
  return{pts:0,z:6};
}

/* ══ DRAW TARGET — optimised ══ */
function drawTarget(x,y,r){
  S.glowPulse+=.025;
  const gAlpha=.06+.03*Math.sin(S.glowPulse);

  // outer glow ring
  const gl=gx.createRadialGradient(x,y,r*.6,x,y,r*1.4);
  gl.addColorStop(0,`rgba(0,255,135,${gAlpha})`);gl.addColorStop(1,'rgba(0,0,0,0)');
  gx.beginPath();gx.arc(x,y,r*1.4,0,Math.PI*2);gx.fillStyle=gl;gx.fill();

  // rings back to front
  for(let i=5;i>=0;i--){
    gx.beginPath();gx.arc(x,y,ZONES[i].r*r,0,Math.PI*2);
    gx.fillStyle=ZONES[i].c;gx.fill();
    gx.strokeStyle='rgba(0,0,0,.35)';gx.lineWidth=.8;gx.stroke();
  }
  // ring separators bright
  [.2,.34,.50,.66,.80].forEach(f=>{
    gx.beginPath();gx.arc(x,y,f*r,0,Math.PI*2);
    gx.strokeStyle='rgba(0,255,135,.18)';gx.lineWidth=.6;gx.stroke();
  });
  // crosshair
  gx.save();gx.strokeStyle='rgba(0,255,135,.12)';gx.lineWidth=.7;
  gx.beginPath();gx.moveTo(x-r,y);gx.lineTo(x+r,y);gx.stroke();
  gx.beginPath();gx.moveTo(x,y-r);gx.lineTo(x,y+r);gx.stroke();
  gx.restore();
  // center
  gx.beginPath();gx.arc(x,y,4,0,Math.PI*2);gx.fillStyle='#000';gx.fill();
  gx.beginPath();gx.arc(x,y,2,0,Math.PI*2);gx.fillStyle='rgba(0,255,135,.8)';gx.fill();
}

/* ══ BOW ══ */
function drawBow(x,y,ax,ay,held,pwr){
  const ang=Math.atan2(ay-y,ax-x);
  const sc=Math.min(GW,GH)/620,bH=55*sc,bc=(18+pwr*10)*sc,pull=held?-(7+pwr*17)*sc:0;
  gx.save();gx.translate(x,y);gx.rotate(ang);
  // limb
  gx.beginPath();gx.moveTo(0,-bH/2);gx.quadraticCurveTo(-bc,0,0,bH/2);
  gx.strokeStyle='#3a7a2a';gx.lineWidth=4*sc;gx.lineCap='round';gx.stroke();
  // limb highlight
  gx.beginPath();gx.moveTo(0,-bH/2);gx.quadraticCurveTo(-bc*.7,0,0,bH/2);
  gx.strokeStyle='rgba(0,255,135,.15)';gx.lineWidth=1.5*sc;gx.stroke();
  // string
  gx.beginPath();gx.moveTo(0,-bH/2);gx.lineTo(pull,0);gx.lineTo(0,bH/2);
  gx.strokeStyle=held?`rgba(0,255,135,${.4+pwr*.5})`:'rgba(0,255,135,.4)';
  gx.lineWidth=1.5*sc;gx.stroke();
  if(held){
    const al=22*sc;
    gx.beginPath();gx.moveTo(pull,0);gx.lineTo(al,0);
    gx.strokeStyle='rgba(0,255,135,.7)';gx.lineWidth=2*sc;gx.stroke();
    gx.beginPath();gx.moveTo(al,0);gx.lineTo(al-6*sc,-3*sc);gx.lineTo(al-6*sc,3*sc);
    gx.closePath();gx.fillStyle='#00ff87';gx.fill();
    gx.beginPath();gx.moveTo(pull,0);gx.lineTo(pull+4*sc,-5*sc);
    gx.moveTo(pull,0);gx.lineTo(pull+4*sc,5*sc);
    gx.strokeStyle='rgba(0,150,60,.7)';gx.lineWidth=1.2*sc;gx.stroke();
  }
  gx.restore();
}

/* ══ BEZIER ══ */
function bez(p0,p1,p2,t){return(1-t)**2*p0+2*(1-t)*t*p1+t*t*p2;}

function drawFly(arr){
  const sc=Math.min(GW,GH)/620;
  const t=arr.t,t2=Math.min(t+.05,1);
  const cx=bez(arr.sx,arr.cx,arr.tx,t),cy=bez(arr.sy,arr.cy,arr.ty,t);
  const cx2=bez(arr.sx,arr.cx,arr.tx,t2),cy2=bez(arr.sy,arr.cy,arr.ty,t2);
  const ang=Math.atan2(cy2-cy,cx2-cx);
  // trail
  for(let i=1;i<=4;i++){
    const ti=Math.max(0,t-i*.035);
    const bx=bez(arr.sx,arr.cx,arr.tx,ti),by=bez(arr.sy,arr.cy,arr.ty,ti);
    gx.save();gx.translate(bx,by);gx.rotate(ang);
    gx.globalAlpha=.07*(5-i);
    gx.beginPath();gx.moveTo(-12*sc,0);gx.lineTo(7*sc,0);
    gx.strokeStyle='#00ff87';gx.lineWidth=2*sc;gx.stroke();
    gx.restore();
  }
  gx.save();gx.translate(cx,cy);gx.rotate(ang);
  gx.beginPath();gx.moveTo(-14*sc,0);gx.lineTo(8*sc,0);
  gx.strokeStyle='#1a5a2a';gx.lineWidth=2*sc;gx.stroke();
  gx.beginPath();gx.moveTo(8*sc,0);gx.lineTo(2*sc,-3*sc);gx.lineTo(2*sc,3*sc);
  gx.closePath();gx.fillStyle='#00ff87';gx.fill();
  gx.beginPath();gx.moveTo(-14*sc,0);gx.lineTo(-18*sc,-4*sc);
  gx.moveTo(-14*sc,0);gx.lineTo(-18*sc,4*sc);
  gx.strokeStyle='rgba(0,150,60,.5)';gx.lineWidth=1.4*sc;gx.stroke();
  gx.restore();
}

function drawStuck(tx,ty,ang,zi){
  const sc=Math.min(GW,GH)/620;
  if(ZONES[zi].glow){
    const gl=gx.createRadialGradient(tx,ty,0,tx,ty,13*sc);
    gl.addColorStop(0,ZONES[zi].glow);gl.addColorStop(1,'rgba(0,0,0,0)');
    gx.beginPath();gx.arc(tx,ty,13*sc,0,Math.PI*2);gx.fillStyle=gl;gx.fill();
  }
  gx.save();gx.translate(tx,ty);gx.rotate(ang);
  gx.beginPath();gx.moveTo(-16*sc,0);gx.lineTo(6*sc,0);
  gx.strokeStyle='#1a5a2a';gx.lineWidth=2*sc;gx.stroke();
  gx.beginPath();gx.moveTo(6*sc,0);gx.lineTo(0,-3*sc);gx.lineTo(0,3*sc);
  gx.closePath();gx.fillStyle='#00ff87';gx.fill();
  gx.beginPath();gx.moveTo(-16*sc,0);gx.lineTo(-20*sc,-3.5*sc);
  gx.moveTo(-16*sc,0);gx.lineTo(-20*sc,3.5*sc);
  gx.strokeStyle='rgba(0,120,50,.5)';gx.lineWidth=1.3*sc;gx.stroke();
  gx.restore();
}

/* ══ AIM LINE ══ */
function drawAim(fx,fy,tx,ty){
  gx.save();
  const wx=S.wind.dx*4,wy=S.wind.dy*4;
  const midX=(fx+tx)*.5,midY=(fy+ty)*.5-28;
  gx.strokeStyle='rgba(0,255,135,.14)';gx.lineWidth=1;gx.setLineDash([5,8]);
  gx.beginPath();gx.moveTo(fx,fy);gx.quadraticCurveTo(midX,midY,tx+wx,ty+wy);gx.stroke();
  gx.setLineDash([]);
  if(S.wind.spd>1){
    gx.strokeStyle='rgba(0,180,255,.12)';gx.lineWidth=.8;gx.setLineDash([3,5]);
    gx.beginPath();gx.moveTo(tx,ty);gx.lineTo(tx+wx,ty+wy);gx.stroke();gx.setLineDash([]);
  }
  // crosshair at aim point
  const ex=tx+wx,ey=ty+wy,cr=10;
  gx.strokeStyle='rgba(0,255,135,.3)';gx.lineWidth=.8;
  gx.beginPath();gx.moveTo(ex-cr,ey);gx.lineTo(ex+cr,ey);gx.stroke();
  gx.beginPath();gx.moveTo(ex,ey-cr);gx.lineTo(ex,ey+cr);gx.stroke();
  gx.beginPath();gx.arc(ex,ey,cr*.6,0,Math.PI*2);gx.stroke();
  gx.restore();
}

/* ══ PARTICLES ══ */
function spawnFX(tx,ty,zi){
  const z=ZONES[zi];if(!z.glow)return;
  for(let i=0;i<15;i++){
    const a=Math.random()*Math.PI*2,spd=1+Math.random()*3.5;
    S.particles.push({x:tx,y:ty,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:1,dec:.038+Math.random()*.038,r:1.2+Math.random()*3.5,c:z.fc});
  }
}
function tickParticles(dt){
  for(let i=S.particles.length-1;i>=0;i--){
    const p=S.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=p.dec;
    if(p.life<=0)S.particles.splice(i,1);
  }
}
function drawParticles(){
  S.particles.forEach(p=>{
    gx.save();gx.globalAlpha=p.life;
    gx.beginPath();gx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    gx.fillStyle=p.c;gx.fill();gx.restore();
  });
}

/* ══ HIT BANNER ══ */
function showBanner(zi,pts){
  const z=ZONES[zi];
  const msgs={0:'BULLSEYE!',1:'PERFECT!',2:'GREAT!',3:'GOOD',4:'OK',5:'RIM',6:'MISS'};
  hbMain.textContent=msgs[zi]||'';hbMain.style.color=z.fc;
  hbPts.textContent=pts>0?`+${pts} POINTS`:'';hbPts.style.color=z.fc;
  hitBanner.className='';void hitBanner.offsetWidth;hitBanner.className='show';
}

/* ══ COMBO ══ */
function doCombo(zi){
  if(ZONES[zi].p>=6){S.combo++;if(S.combo>S.maxCombo)S.maxCombo=S.combo;}
  else S.combo=0;
  if(zi===0)S.bulls++;
  if(S.combo>=2){
    cbNum.textContent=`${S.combo}×`;
    cbNum.style.color=S.combo>=5?'#ff3344':S.combo>=3?'#ffd700':'#00ff87';
    comboBar.classList.add('vis');
  } else comboBar.classList.remove('vis');
}

/* ══ SCORE POP ══ */
function spawnPop(x,y,pts,zi){
  if(!pts)return;
  const el=document.createElement('div');el.className='spop';
  el.textContent=`+${pts}`;el.style.left=`${x}px`;el.style.top=`${y}px`;
  el.style.color=ZONES[zi].fc;document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}

/* ══ GAME LOOP — 60fps ══ */
let lt=0,mt=0,gAF;
function loop(ts){
  if(S.scr!=='game')return;
  gAF=requestAnimationFrame(loop);
  const dt=Math.min((ts-lt)/1000,.05);lt=ts;

  // target movement
  const d=DIFF_CFG[S.diff];
  if(d.moveAmp>0){
    mt+=dt;
    S.tgt.x=S.tBaseX+Math.sin(mt*d.moveFreq*Math.PI*2)*d.moveAmp;
    S.tgt.y=S.tBaseY+Math.cos(mt*d.moveFreq*Math.PI*1.4)*d.moveAmp*.38;
  }

  // timer
  if(S.timerActive&&S.timerLeft>0){
    S.timerLeft-=dt;
    tfill.style.width=`${Math.max(0,S.timerLeft/d.timerSec*100).toFixed(1)}%`;
    if(S.timerLeft<=0&&S.canFire&&S.fired<ARROWS){
      S.canFire=false;S.fired++;updateHud();
      S.hits.push({x:-1,y:-1,pts:0,z:6,ang:0});S.combo=0;
      comboBar.classList.remove('vis');
      showBanner(6,0);
      setTimeout(()=>{
        if(S.fired>=ARROWS)setTimeout(showResult,700);
        else{S.canFire=true;S.timerLeft=d.timerSec;aimh.style.opacity='1';}
      },500);
    }
  }

  /* DRAW */
  // bg
  gx.fillStyle='#04090404';gx.fillRect(0,0,GW,GH);
  // dark bg clear
  gx.fillStyle='#060d06';gx.fillRect(0,0,GW,GH);

  // stuck arrows behind target
  S.stuck.filter(s=>!inTgt(s.x,s.y)).forEach(s=>drawStuck(s.x,s.y,s.ang,s.z));
  drawTarget(S.tgt.x,S.tgt.y,S.tgt.r);
  S.stuck.filter(s=>inTgt(s.x,s.y)).forEach(s=>drawStuck(s.x,s.y,s.ang,s.z));

  if(S.holding)drawAim(S.bowX,S.bowY,S.mx,S.my);
  if(S.holding)pwf.style.width=`${Math.min((Date.now()-S.holdT)/1500,1)*100}%`;

  const pwr=S.holding?Math.min((Date.now()-S.holdT)/1500,1):0;
  drawBow(S.bowX,S.bowY,S.mx,S.my,S.holding,pwr);

  S.arrows.forEach(arr=>{
    if(arr.done)return;
    arr.t+=dt/arr.dur;
    if(arr.t>=1){
      arr.t=1;arr.done=true;
      const {pts,z}=calcPts(arr.tx,arr.ty);
      const ang=Math.atan2(arr.ty-arr.sy,arr.tx-arr.sx);
      S.score+=pts;S.hits.push({x:arr.tx,y:arr.ty,pts,z,ang});
      S.stuck.push({x:arr.tx,y:arr.ty,ang,z,pts});
      spawnFX(arr.tx,arr.ty,z);
      updateHud();shud.classList.add('pop');setTimeout(()=>shud.classList.remove('pop'),310);
      showBanner(z,pts);doCombo(z);
      const r=gc.getBoundingClientRect();
      spawnPop(r.left+arr.tx*(r.width/GW),r.top+arr.ty*(r.height/GH),pts,z);
      setTimeout(()=>{
        if(S.fired>=ARROWS)setTimeout(showResult,800);
        else{
          S.canFire=true;
          if(d.timerSec>0)S.timerLeft=d.timerSec;
          aimh.style.opacity='1';
        }
      },900);
    }
    if(!arr.done)drawFly(arr);
  });

  tickParticles(dt);drawParticles();
}

function inTgt(x,y){const dx=x-S.tgt.x,dy=y-S.tgt.y;return dx*dx+dy*dy<S.tgt.r*S.tgt.r;}

/* ══ RESULT ══ */
function showResult(){
  S.scr='result';
  cancelAnimationFrame(gAF);
  gc.removeEventListener('mousedown',onDown);gc.removeEventListener('mousemove',onMove);gc.removeEventListener('mouseup',onUp);
  gc.removeEventListener('touchstart',onTS);gc.removeEventListener('touchmove',onTM);gc.removeEventListener('touchend',onTE);
  tbar.classList.remove('vis');comboBar.classList.remove('vis');
  GSc.classList.add('off');RSc.classList.remove('off');

  const pct=S.score/(ARROWS*10);
  const hits=S.hits.filter(h=>h.pts>0).length;
  const acc=Math.round(hits/ARROWS*100);
  const titles=['PERFECT ARCHER','LEGENDARY AIM','MASTER SHOT','SKILLED ARCHER','APPRENTICE','KEEP TRAINING'];
  const ti=pct>=.98?0:pct>=.8?1:pct>=.65?2:pct>=.45?3:pct>=.25?4:5;
  document.getElementById('rt').textContent=titles[ti];
  document.getElementById('rn').textContent=S.name.toUpperCase()+' · '+DIFF_CFG[S.diff].label;

  // animate score
  let disp=0;const el=document.getElementById('rscore');
  const inc=Math.max(1,Math.ceil(S.score/45));
  const tic=setInterval(()=>{disp=Math.min(disp+inc,S.score);el.textContent=disp;if(disp>=S.score)clearInterval(tic);},25);

  // hex arc
  setTimeout(()=>{document.getElementById('hex-arc').style.strokeDashoffset=280*(1-pct);},200);

  // acc bar
  setTimeout(()=>{document.getElementById('afill').style.width=acc+'%';document.getElementById('apct').textContent=acc+'%';},350);

  // stats
  const sg=document.getElementById('stgrid');sg.innerHTML='';
  [{v:S.score,l:'Score',hi:true},{v:`${acc}%`,l:'Accuracy'},{v:S.bulls,l:'Bullseyes',hi:S.bulls>0},
   {v:S.maxCombo,l:'Best Combo',hi:S.maxCombo>=3},{v:hits,l:'Hits'},{v:ARROWS-hits,l:'Misses'}]
  .forEach(s=>{sg.innerHTML+=`<div class="sg${s.hi?' hi':''}"><div class="sg-v">${s.v}</div><div class="sg-l">${s.l}</div></div>`;});

  // hit chips
  const bc=document.getElementById('hchips');bc.innerHTML='';
  const ct={};S.hits.forEach(h=>{ct[h.z]=(ct[h.z]||0)+1;});
  Object.entries(ct).sort((a,b)=>+a[0]-+b[0]).forEach(([zi,cnt])=>{
    const z=ZONES[zi];const c=document.createElement('div');
    c.className=`hc ${z.cls}`;c.textContent=`${z.l} ×${cnt} (${z.p*cnt}pt)`;bc.appendChild(c);
  });
}

document.getElementById('breplay').addEventListener('click',()=>{RSc.classList.add('off');GSc.classList.remove('off');S.scr='game';initGame();});
document.getElementById('bmenu').addEventListener('click',()=>{RSc.classList.add('off');NSc.classList.remove('off');S.scr='name';pname.value='';});
</script>
