<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC BID</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Oswald',sans-serif;
}

body{
    background:#0a0014;
    color:#fff;
    padding:12px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.logo{
    width:80px;
    filter:drop-shadow(0 0 12px cyan);
}

.title{
    font-size:28px;
    font-weight:700;
    margin-top:8px;
    color:#00ffff;
    text-shadow:0 0 10px #00ffff;
}

.bid-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

@media(min-width:768px){
    .bid-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

.team-box{
    border:2px solid #111;
    box-shadow:0 0 15px rgba(0,255,255,.25);
}

.team-name{
    background:#ff00ff;
    color:#000;
    text-align:center;
    font-weight:700;
    padding:6px;
    font-size:17px;
}

.bid-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.bid-table td,
.bid-table th{
    border:1px solid #111;
    text-align:center;
    padding:5px 4px;
    font-size:13px;
    font-weight:600;
}

.sn-head,.player-head,.price-head{
    background:#00ff00;
    color:#000;
}

.sn-col{
    background:#f3d66b;
    color:#000;
    width:16%;
}

.player-col{
    background:#95c27c;
    color:#000;
    width:54%;
}

.price-col{
    background:#c89ab7;
    color:#000;
    width:30%;
}

.used-label{
    background:#660033;
}

.used-value{
    background:#ffff00;
    color:#000;
}

.total-label{
    background:#00d9e8;
    color:#000;
}

.total-value{
    background:#00ff00;
    color:#000;
}

.rem-label{
    background:#5a1200;
    color:#00ff00;
}

.rem-value{
    background:#ff0000;
    color:#fff;
    position:relative;
}

.alert-light{
    width:10px;
    height:10px;
    border-radius:50%;
    background:red;
    display:inline-block;
    margin-left:6px;
    box-shadow:0 0 8px red;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:.25;}
}
</style>
</head>
<body>

<div class="header">
    <img class="logo" src="https://i.imgur.com/LY3Bb9m.png">
    <div class="title">GOAT FC BID</div>
</div>

<div id="bidGrid" class="bid-grid"></div>

<script>
const SHEET_ID = "1TJ4rnD5p9D309JDgvC8VxbZwQ-KtELWZcS8F7tP8Uq4";
const GID = "1013280552";

const API = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json`;

fetch(API)
.then(res=>res.text())
.then(txt=>{

    const json = JSON.parse(txt.substr(47).slice(0,-2));
    const rows = json.table.rows;

    const getCell = (r,c)=>rows[r]?.c?.[c]?.v ?? "";

    const TEAM_POSITIONS = [
        {r:0,c:1},
        {r:0,c:5},
        {r:0,c:9},
        {r:13,c:1},
        {r:13,c:5},
        {r:13,c:9}
    ];

    const bidGrid = document.getElementById("bidGrid");

    TEAM_POSITIONS.forEach(pos=>{

        const teamName = getCell(pos.r,pos.c);
        if(!teamName) return;

        let playerRows = "";

        for(let i=1;i<=6;i++){

            const player = getCell(pos.r+i+1,pos.c);
            const price = getCell(pos.r+i+1,pos.c+1) || "";

            playerRows += `
            <tr>
                <td class="sn-col">${i}</td>
                <td class="player-col">${player}</td>
                <td class="price-col">${price}</td>
            </tr>`;
        }

        const used = getCell(pos.r+8,pos.c+1) || 0;
        const total = getCell(pos.r+9,pos.c+1) || 0;
        const remaining = parseInt(getCell(pos.r+10,pos.c+1)) || 0;

        const warning = remaining < 250
            ? '<span class="alert-light"></span>'
            : '';

        const box = document.createElement("div");
        box.className = "team-box";

        box.innerHTML = `
            <div class="team-name">${teamName}</div>

            <table class="bid-table">
                <tr>
                    <th class="sn-head">SN</th>
                    <th class="player-head">Player</th>
                    <th class="price-head">Price (CP)</th>
                </tr>

                ${playerRows}

                <tr>
                    <td colspan="2" class="used-label">Used</td>
                    <td class="used-value">${used}</td>
                </tr>

                <tr>
                    <td colspan="2" class="total-label">Total</td>
                    <td class="total-value">${total}</td>
                </tr>

                <tr>
                    <td colspan="2" class="rem-label">Remaining Balance</td>
                    <td class="rem-value">${remaining}${warning}</td>
                </tr>
            </table>
        `;

        bidGrid.appendChild(box);

    });

});
</script>

</body>
</html>
