
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Football Scene</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(#0f2027, #203a43, #2c5364);
    }
    h1 {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: #00ffcc;
      font-family: Arial, sans-serif;
      z-index: 10;
    }
  </style>
</head>
<body>
<h1>GOAT FC 3D Run</h1>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 6;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  // Light
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5,5,5);
  scene.add(light);
  // Ground
  const groundGeo = new THREE.PlaneGeometry(20, 10);
  const groundMat = new THREE.MeshPhongMaterial({ color: 0x228B22 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1;
  scene.add(ground);
  // Player 1
  const player1 = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.5, 0.6),
    new THREE.MeshPhongMaterial({ color: 0xff0000 })
  );
  player1.position.x = -1.5;
  scene.add(player1);
  // Player 2
  const player2 = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.5, 0.6),
    new THREE.MeshPhongMaterial({ color: 0x0000ff })
  );
  player2.position.x = 1.5;
  scene.add(player2);
  // Ball
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  ball.position.y = -0.5;
  scene.add(ball);
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.03;
    // Running animation
    player1.position.x = -1.5 + Math.sin(t) * 0.5;
    player2.position.x = 1.5 + Math.sin(t + Math.PI) * 0.5;
    // Ball moving
    ball.position.x = Math.sin(t) * 1.2;
    renderer.render(scene, camera);
  }
  animate();
  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
</script>
</body>
</html>
