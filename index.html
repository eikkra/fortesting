<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC BID</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    background:#050008;
    background-image:
    radial-gradient(circle at 20% 20%,#2b0044 0%,transparent 35%),
    radial-gradient(circle at 80% 0%,#001a44 0%,transparent 30%);
    min-height:100vh;
    color:#fff;
    padding:12px;
}

.header{
    text-align:center;
    margin-bottom:15px;
}

.logo{
    width:80px;
    filter:drop-shadow(0 0 12px cyan);
}

.title{
    margin-top:8px;
    font-size:28px;
    font-weight:900;
    background:linear-gradient(90deg,#00f7ff,#ff00ea,#00ff66);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sheet-wrapper{
    width:100%;
    height:85vh;
    border-radius:18px;
    overflow:hidden;
    border:2px solid rgba(0,255,255,.35);
    box-shadow:
        0 0 20px rgba(0,255,255,.25),
        0 0 40px rgba(255,0,255,.12);
    background:#111;
}

.sheet-frame{
    width:100%;
    height:100%;
    border:none;
    background:#fff;
}
</style>
</head>
<body>

<div class="header">
    <img class="logo" src="https://i.imgur.com/LY3Bb9m.png" alt="GOAT FC Logo">
    <div class="title">GOAT FC BID</div>
</div>

<div class="sheet-wrapper">
    <iframe
        class="sheet-frame"
        src="https://docs.google.com/spreadsheets/d/1TJ4rnD5p9D309JDgvC8VxbZwQ-KtELWZcS8F7tP8Uq4/edit?gid=1013280552&single=true&widget=true&headers=false">
    </iframe>
</div>

</body>
</html>
