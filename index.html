<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC BID</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    background:#050008;
    background-image:
    radial-gradient(circle at 20% 20%,#2b0044 0%,transparent 35%),
    radial-gradient(circle at 80% 0%,#001a44 0%,transparent 30%);
    color:#fff;
    padding:15px;
}

.header{text-align:center;margin-bottom:20px;}
.logo{
    width:75px;
    filter:drop-shadow(0 0 10px cyan);
}
.title{
    font-size:28px;
    font-weight:900;
    margin-top:8px;
    background:linear-gradient(90deg,#00f7ff,#ff00ea,#00ff66);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.grid{
    display:grid;
    gap:16px;
}

.card{
    border-radius:18px;
    overflow:hidden;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 0 20px rgba(0,255,255,.15);
}

.card-head{
    background:linear-gradient(90deg,#ff00ea,#6a00ff);
    padding:12px;
    text-align:center;
    font-weight:800;
    font-size:17px;
}

.players{padding:12px;}

.player{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
    font-size:13px;
}

.stats{
    padding:12px;
    background:rgba(0,0,0,.35);
}

.stat{
    display:flex;
    justify-content:space-between;
    margin:7px 0;
}

.remain{
    font-weight:900;
    font-size:16px;
}

.light{
    width:12px;
    height:12px;
    border-radius:50%;
    display:inline-block;
    margin-left:8px;
    background:#333;
}

.alert{
    background:red;
    box-shadow:0 0 10px red,0 0 20px red;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:.25;}
}

.loading{
    text-align:center;
    color:cyan;
    padding:40px 0;
}
</style>
</head>
<body>

<div class="header">
    <img class="logo" src="https://i.imgur.com/LY3Bb9m.png">
    <div class="title">GOAT FC BID</div>
</div>

<div id="loading" class="loading">Loading Bid Data...</div>
<div id="grid" class="grid"></div>

<script>
const SHEET_ID = "1TJ4rnD5p9D309JDgvC8VxbZwQ-KtELWZcS8F7tP8Uq4";
const GID = "1013280552";

const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json`;

fetch(url)
.then(res=>res.text())
.then(rep=>{

    const json = JSON.parse(rep.substr(47).slice(0,-2));
    const rows = json.table.rows;

    const getCell = (r,c)=>{
        return rows[r]?.c?.[c]?.v ?? "";
    }

    const TEAM_BLOCKS = [
        {r:0,c:1},
        {r:0,c:5},
        {r:0,c:9},
        {r:13,c:1},
        {r:13,c:5},
        {r:13,c:9}
    ];

    const grid = document.getElementById("grid");
    document.getElementById("loading").style.display="none";

    TEAM_BLOCKS.forEach(block=>{

        const teamName = getCell(block.r, block.c);
        if(!teamName) return;

        let players = [];
        let used = 0;

        for(let i=2;i<=7;i++){
            const player = getCell(block.r+i, block.c);
            const price = parseInt(getCell(block.r+i, block.c+1)) || 0;

            if(player){
                players.push({player,price});
                used += price;
            }
        }

        const total = parseInt(getCell(block.r+9, block.c+1)) || 0;
        const remaining = parseInt(getCell(block.r+10, block.c+1)) || (total-used);

        const card = document.createElement("div");
        card.className="card";

        card.innerHTML=`
            <div class="card-head">${teamName}</div>

            <div class="players">
                ${players.map(p=>`
                    <div class="player">
                        <span>${p.player}</span>
                        <span>${p.price} CP</span>
                    </div>
                `).join("")}
            </div>

            <div class="stats">
                <div class="stat"><span>Used CP</span><span>${used}</span></div>
                <div class="stat"><span>Total Budget</span><span>${total}</span></div>
                <div class="stat remain">
                    <span>Remaining</span>
                    <span>
                        ${remaining}
                        <span class="light ${remaining<250?'alert':''}"></span>
                    </span>
                </div>
            </div>
        `;

        grid.appendChild(card);

    });

})
.catch(err=>{
    document.getElementById("loading").innerHTML="Failed to Load Data";
    console.error(err);
});
</script>

</body>
</html>
