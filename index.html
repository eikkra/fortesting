<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOAT FC STATISTICS</title>
<link rel="icon" href="https://i.imgur.com/LY3Bb9m.png">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#050816;
--cyan:#00f5ff;
--green:#00ff88;
--muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
background:var(--bg);
font-family:'Rajdhani',sans-serif;
color:white;
}

/* HEADER */
.header{
text-align:center;
padding:14px;
}

.header img{
width:45px;
filter:drop-shadow(0 0 10px var(--cyan));
}

.header h1{
margin:5px 0;
font-size:22px;
color:var(--cyan);
text-shadow:0 0 10px var(--cyan);
}

.desc{
font-size:12px;
color:var(--muted);
}

/* SEARCH */
.search{
text-align:center;
padding:10px;
}

.search input{
width:92%;
max-width:400px;
padding:10px;
border-radius:10px;
border:1px solid var(--cyan);
background:#0b1220;
color:var(--cyan);
outline:none;
}

/* GRID */
#data{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:12px;
padding:12px;
}

/* CARD (MAIN STYLE) */
.card{
background:linear-gradient(145deg,#0b1220,#050816);
border:1px solid rgba(0,245,255,0.2);
border-radius:16px;
padding:12px;
box-shadow:0 0 12px rgba(0,245,255,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-3px);
border-color:var(--cyan);
}

/* TOP INFO */
.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.name{
font-weight:700;
font-size:15px;
color:white;
}

.id{
font-size:12px;
color:var(--cyan);
}

/* SECTION TITLE */
.section-title{
font-size:11px;
color:var(--muted);
margin:8px 0 4px;
letter-spacing:1px;
}

/* BOX GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}

.box{
padding:7px;
border-radius:10px;
background:rgba(0,245,255,0.05);
border:1px solid rgba(0,245,255,0.15);
font-size:12px;
text-align:center;
}

/* RANK COLORS */
.rank1{border:1px solid gold;}
.rank2{border:1px solid silver;}
.rank3{border:1px solid #cd7f32;}
.top10{border:1px solid #a855f7;}

/* BUTTON */
.btn{
margin-top:10px;
text-align:center;
}

button{
padding:6px 12px;
border:none;
border-radius:8px;
background:var(--cyan);
color:black;
cursor:pointer;
font-weight:700;
}

/* MOBILE */
@media(max-width:768px){
.grid{grid-template-columns:repeat(2,1fr);}
}

</style>
</head>

<body>

<div class="header">
<img src="https://i.imgur.com/LY3Bb9m.png">
<h1>GOAT FC STATISTICS</h1>
<div class="desc">Overall + Monthly Performance Dashboard</div>
</div>

<div class="search">
<input type="text" id="search" placeholder="Search Player or ID..." oninput="render()">
</div>

<div id="data"></div>

<script>

const MATCH_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";
const MEMBER_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let players={}, members={}, cache={};

function parseCSV(text){
let rows=[],cur=[],val="",q=false;
for(let i=0;i<text.length;i++){
let c=text[i];
if(c=='"'){q=!q;}
else if(c==','&&!q){cur.push(val);val="";}
else if((c=='\n'||c=='\r')&&!q){
if(val||cur.length){cur.push(val);rows.push(cur);cur=[];val="";}
}
else val+=c;
}
return rows;
}

function normalize(x){
return (x||"").toLowerCase().replace(/[^a-z0-9]/g,'');
}

async function load(){
let m=await fetch(MATCH_URL).then(r=>r.text());
let u=await fetch(MEMBER_URL).then(r=>r.text());

let match=parseCSV(m).slice(1);
let member=parseCSV(u).slice(1);

member.forEach(r=>{
members[normalize(r[1])] = r[0];
});

match.forEach(r=>{
let p1=r[0],p2=r[1];
let s1=+r[3],s2=+r[4];
let type=(r[2]||"").toLowerCase();

if(!players[p1]) players[p1]={w:0,l:0,d:0,m:0,gs:0,gc:0};
if(!players[p2]) players[p2]={w:0,l:0,d:0,m:0,gs:0,gc:0};

players[p1].m++;players[p2].m++;
players[p1].gs+=s1;players[p1].gc+=s2;
players[p2].gs+=s2;players[p2].gc+=s1;

if(s1>s2) players[p1].w++,players[p2].l++;
else if(s2>s1) players[p2].w++,players[p1].l++;
else players[p1].d++,players[p2].d++;
});

render();
}

function render(){
let q=normalize(document.getElementById("search").value);
let html="";

Object.keys(players).forEach((id,i)=>{

let p=players[id];
let name=members[normalize(id)]||"Unknown";

if(q && !(normalize(id).includes(q)||normalize(name).includes(q))) return;

let cls="card";
if(i==0) cls+=" rank1";
else if(i==1) cls+=" rank2";
else if(i==2) cls+=" rank3";
else if(i<10) cls+=" top10";

html+=`
<div class="${cls}">

<div class="top">
<div class="name">${name}</div>
<div class="id">${id}</div>
</div>

<div class="section-title">OVERALL</div>
<div class="grid">
<div class="box">Wins ${p.w}</div>
<div class="box">Loss ${p.l}</div>
<div class="box">Draw ${p.d}</div>
<div class="box">Match ${p.m}</div>
<div class="box">GS ${p.gs}</div>
<div class="box">GC ${p.gc}</div>
</div>

<div class="section-title">MONTHLY</div>
<div class="grid">
<div class="box">Win% ${(p.w/(p.m||1)*100).toFixed(1)}</div>
<div class="box">Avg GS ${(p.gs/(p.m||1)).toFixed(1)}</div>
<div class="box">Avg GC ${(p.gc/(p.m||1)).toFixed(1)}</div>
</div>

<div class="btn">
<button>Download</button>
</div>

</div>`;
});

document.getElementById("data").innerHTML=html;
}

load();

</script>

</body>
</html>
