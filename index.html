<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIFA World Cup 2026 – GOAT FC</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
:root{
  --c:#00f0ff;--p:#bf00ff;--g:#00ff88;--pk:#ff007a;--ye:#f5ff00;--or:#ff8800;
  --gold:#C8A415;--glt:#F0C040;--red:#C8102E;--live:#00E676;
  --bg:#04040e;--s1:#08081a;--s2:#0c0c20;--s3:#10102a;
  --tx:#eef0ff;--mu:#5060a0;--mu2:#2a2a50;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--tx);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── RGB AMBIENT ── */
body::before{content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.018) 2px,rgba(0,0,0,0.018) 4px);
  pointer-events:none;z-index:9998;}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(ellipse 40% 40% at 10% 10%,rgba(0,240,255,0.06) 0%,transparent 100%),
    radial-gradient(ellipse 40% 40% at 90% 90%,rgba(191,0,255,0.06) 0%,transparent 100%),
    radial-gradient(ellipse 30% 50% at 90% 10%,rgba(255,0,122,0.04) 0%,transparent 100%),
    radial-gradient(ellipse 30% 50% at 10% 90%,rgba(0,255,136,0.03) 0%,transparent 100%);}

/* ── HEADER ── */
.hdr{
  background:rgba(4,4,14,0.97);
  border-bottom:1px solid rgba(0,240,255,0.15);
  position:sticky;top:0;z-index:300;
  backdrop-filter:blur(24px);
  box-shadow:0 2px 40px rgba(0,0,0,0.7),0 0 1px rgba(0,240,255,0.1);
  padding:0 14px;
}
.hdr-inner{
  max-width:1200px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  height:54px;gap:10px;
}
/* Left */
.hdr-left{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.hdr-logo{
  width:36px;height:36px;border-radius:7px;
  object-fit:cover;flex-shrink:0;
  border:1.5px solid rgba(0,240,255,0.35);
  filter:drop-shadow(0 0 10px rgba(0,240,255,0.5));
}
.hdr-brand{display:flex;flex-direction:column;line-height:1;}
.hdr-name{
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,var(--c),var(--p));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hdr-url{font-size:8px;color:var(--mu);letter-spacing:1.5px;margin-top:2px;font-family:'Exo 2',sans-serif;}
/* Right */
.hdr-right{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.live-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.5);
  border-radius:20px;padding:3px 9px;
  font-size:9px;font-weight:800;color:var(--live);
  font-family:'Exo 2',sans-serif;letter-spacing:1px;
}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--live);animation:lp 1.2s ease-in-out infinite;}
@keyframes lp{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,230,118,0.6);}50%{opacity:0.4;box-shadow:0 0 0 5px rgba(0,230,118,0);}}
.ibtn{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:7px;border:1px solid rgba(0,240,255,0.18);
  background:rgba(0,240,255,0.05);color:var(--c);
  font-size:13px;cursor:pointer;transition:all .2s;
}
.ibtn:hover{background:rgba(0,240,255,0.13);box-shadow:0 0 16px rgba(0,240,255,0.25);border-color:rgba(0,240,255,0.4);}

/* ── TABS ── */
.tabs-wrap{
  background:rgba(4,4,14,0.95);
  border-bottom:1px solid rgba(0,240,255,0.08);
  position:sticky;top:54px;z-index:299;
  backdrop-filter:blur(20px);
}
.tabs{display:flex;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex-shrink:0;padding:13px 16px;
  font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;letter-spacing:1.5px;
  color:var(--mu);cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;transition:all .25s;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.tab:hover{color:var(--tx);}
.tab.active{color:var(--c);border-bottom-color:var(--c);text-shadow:0 0 14px rgba(0,240,255,0.6);}
.tab i{font-size:10px;}

/* ── MAIN ── */
.main{max-width:1200px;margin:0 auto;padding:14px 10px 70px;}

/* ═══ HERO (3 rows) ═══ */
.hero{
  margin-bottom:16px;
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(0,240,255,0.12);
  position:relative;
  background:var(--s1);
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(0,240,255,0.07) 0%,transparent 70%),
    radial-gradient(ellipse at 0% 100%,rgba(191,0,255,0.05) 0%,transparent 60%),
    radial-gradient(ellipse at 100% 100%,rgba(255,0,122,0.04) 0%,transparent 60%);
  pointer-events:none;
}
/* Row 1: Title */
.hero-r1{
  padding:16px 16px 12px;
  text-align:center;
  border-bottom:1px solid rgba(0,240,255,0.07);
  position:relative;
}
.hero-title{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(13px,4.5vw,24px);
  font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,var(--glt),#fff,var(--glt));
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:tsh 4s linear infinite;
  line-height:1.1;
}
@keyframes tsh{to{background-position:200% center;}}
.hero-sub{font-size:9px;color:var(--mu);letter-spacing:3px;margin-top:4px;font-family:'Exo 2',sans-serif;}

/* Row 2: Flags */
.hero-r2{
  padding:14px 16px;
  text-align:center;
  border-bottom:1px solid rgba(0,240,255,0.07);
  display:flex;align-items:center;justify-content:center;gap:6px;
  position:relative;
}
.hero-flag-item{display:flex;flex-direction:column;align-items:center;gap:4px;}
.hero-flag-emoji{font-size:clamp(28px,7vw,44px);line-height:1;filter:drop-shadow(0 0 8px rgba(255,255,255,0.2));}
.hero-flag-label{font-size:8px;color:var(--mu);letter-spacing:1.5px;font-family:'Exo 2',sans-serif;font-weight:700;}
.hero-flag-sep{font-size:18px;color:rgba(0,240,255,0.2);margin:0 4px;padding-bottom:12px;}

/* Row 3: Stats */
.hero-r3{
  display:grid;grid-template-columns:repeat(4,1fr);
  position:relative;
}
.hstat{
  padding:12px 8px;text-align:center;
  border-right:1px solid rgba(0,240,255,0.07);
  position:relative;transition:background .2s;
}
.hstat:last-child{border-right:none;}
.hstat:hover{background:rgba(0,240,255,0.03);}
.hstat-val{
  font-family:'Orbitron',sans-serif;font-size:clamp(18px,5vw,26px);font-weight:900;
  background:linear-gradient(135deg,var(--c),var(--p));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;line-height:1;
}
.hstat-ico{font-size:10px;margin-bottom:3px;}
.hstat-lbl{font-size:8px;color:var(--mu);letter-spacing:1.5px;margin-top:3px;font-family:'Exo 2',sans-serif;font-weight:700;}

/* ── API STATUS ── */
.api-bar{
  background:rgba(0,240,255,0.03);border:1px solid rgba(0,240,255,0.08);
  border-radius:7px;padding:7px 12px;
  font-size:11px;color:var(--mu);
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
  font-family:'Exo 2',sans-serif;
}

/* ── FILTER ── */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.fi{
  background:var(--s2);border:1px solid rgba(0,240,255,0.12);
  border-radius:7px;padding:9px 12px;color:var(--tx);
  font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;
  flex:1;min-width:130px;outline:none;transition:all .2s;
}
.fi::placeholder{color:var(--mu);}
.fi:focus{border-color:rgba(0,240,255,0.4);box-shadow:0 0 0 3px rgba(0,240,255,0.06);}
.fi option{background:#08081a;}

/* ── DATE DIVIDER ── */
.dd{
  display:flex;align-items:center;gap:8px;
  margin:16px 0 8px;
  font-size:9px;font-weight:800;letter-spacing:2px;
  font-family:'Exo 2',sans-serif;color:var(--c);
}
.dd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,240,255,0.3),transparent);}
.dd i{color:var(--red);}

/* ── MATCH CARD ── */
.mc{
  background:var(--s1);border:1px solid rgba(0,240,255,0.07);
  border-radius:11px;margin-bottom:8px;overflow:hidden;
  transition:all .22s;position:relative;
}
.mc:hover{
  border-color:rgba(0,240,255,0.22);transform:translateY(-1px);
  box-shadow:0 6px 30px rgba(0,0,0,0.5),0 0 0 1px rgba(0,240,255,0.06),inset 0 1px 0 rgba(0,240,255,0.04);
}
.mc.live{border-color:rgba(0,230,118,0.4);box-shadow:0 0 24px rgba(0,230,118,0.08);}
.mc.ft{border-color:rgba(200,164,21,0.15);}
.gstrip{position:absolute;left:0;top:0;bottom:0;width:3px;}

.mi{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding:12px 14px 12px 18px;gap:8px;
}
.ts{display:flex;align-items:center;gap:8px;}
.ts.aw{flex-direction:row-reverse;text-align:right;}
.tf{font-size:clamp(22px,5.5vw,32px);line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6));}
.tn{font-family:'Exo 2',sans-serif;font-size:clamp(11px,2.8vw,14px);font-weight:800;line-height:1.2;}
.tn.lg{font-size:clamp(9px,2.2vw,11px);}

.mcc{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:84px;}
.msc{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(18px,4.5vw,26px);font-weight:900;
  color:var(--glt);letter-spacing:3px;white-space:nowrap;
}
.msc.lv{color:var(--live);animation:sg 2s ease-in-out infinite;}
@keyframes sg{0%,100%{text-shadow:0 0 8px rgba(0,230,118,0.5);}50%{text-shadow:0 0 28px rgba(0,230,118,1);}}
.mt{font-family:'Orbitron',sans-serif;font-size:clamp(13px,3vw,17px);font-weight:700;color:var(--tx);white-space:nowrap;}
.sr{display:flex;align-items:center;gap:5px;justify-content:center;}
.pl{border-radius:20px;padding:2px 8px;font-size:8px;font-weight:800;letter-spacing:1.5px;font-family:'Exo 2',sans-serif;white-space:nowrap;}
.pl.lv{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.5);color:var(--live);}
.pl.ft{background:rgba(200,164,21,0.1);border:1px solid rgba(200,164,21,0.3);color:var(--glt);}
.pl.ns{background:rgba(80,96,160,0.1);border:1px solid rgba(80,96,160,0.25);color:var(--mu);}
.lmin{font-size:9px;font-weight:800;color:var(--live);display:flex;align-items:center;gap:3px;font-family:'Exo 2',sans-serif;}
.lmd{width:5px;height:5px;border-radius:50%;background:var(--live);animation:lp 1s ease-in-out infinite;}
.cd{font-family:'Orbitron',sans-serif;font-size:8px;color:var(--mu);text-align:center;}

.mm{
  display:flex;align-items:center;gap:10px;
  padding:5px 14px 7px 18px;
  border-top:1px solid rgba(255,255,255,0.04);
  font-size:10px;color:var(--mu);flex-wrap:wrap;
  font-family:'Exo 2',sans-serif;
}
.mm i{font-size:9px;color:var(--red);}
.gbadge{border-radius:3px;padding:1px 7px;font-size:8px;font-weight:800;letter-spacing:1px;font-family:'Exo 2',sans-serif;}

/* ── GROUPS ── */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.gcard{
  background:var(--s1);border:1px solid rgba(0,240,255,0.07);
  border-radius:11px;overflow:hidden;transition:all .2s;
}
.gcard:hover{border-color:rgba(0,240,255,0.2);box-shadow:0 4px 20px rgba(0,240,255,0.05);}
.ghead{
  padding:9px 14px;font-family:'Exo 2',sans-serif;
  font-size:11px;font-weight:900;letter-spacing:2px;color:#fff;
  display:flex;align-items:center;gap:6px;
}
.gt{
  display:flex;align-items:center;gap:9px;padding:8px 14px;
  border-top:1px solid rgba(255,255,255,0.04);transition:background .15s;
}
.gt:hover{background:rgba(255,255,255,0.025);}
.gtf{font-size:18px;}
.gtn{font-size:13px;font-weight:700;flex:1;}

/* ── KNOCKOUT CARDS ── */
.kos{margin-bottom:20px;}
.ptitle{
  font-family:'Exo 2',sans-serif;font-size:10px;font-weight:900;
  letter-spacing:2.5px;padding:9px 14px;border-radius:8px;
  margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.kog{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;}

/* ══════════════════════════════════
   BRACKET — Fotmob Pro Style
══════════════════════════════════ */
.bracket-outer{
  background:var(--s1);border:1px solid rgba(0,240,255,0.1);
  border-radius:12px;overflow:hidden;margin-bottom:20px;
}
.bracket-header{
  padding:12px 16px;border-bottom:1px solid rgba(0,240,255,0.08);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,240,255,0.03);
}
.bracket-header-title{
  font-family:'Exo 2',sans-serif;font-size:10px;font-weight:900;
  letter-spacing:2px;color:var(--c);display:flex;align-items:center;gap:7px;
}
.bracket-scroll-hint{font-size:9px;color:var(--mu);font-family:'Exo 2',sans-serif;letter-spacing:1px;display:flex;align-items:center;gap:5px;}
.bracket-scroll{
  overflow-x:auto;padding:16px 12px 16px;
  scrollbar-width:thin;scrollbar-color:rgba(0,240,255,0.2) transparent;
}
.bracket-scroll::-webkit-scrollbar{height:4px;}
.bracket-scroll::-webkit-scrollbar-track{background:transparent;}
.bracket-scroll::-webkit-scrollbar-thumb{background:rgba(0,240,255,0.2);border-radius:2px;}
.bracket-inner{
  display:flex;align-items:stretch;gap:0;
  min-width:1020px;
}
.bround{
  display:flex;flex-direction:column;
  min-width:158px;max-width:158px;
  position:relative;
}
.bround-title{
  font-family:'Exo 2',sans-serif;font-size:8px;font-weight:900;
  letter-spacing:2px;color:var(--mu);text-align:center;
  padding:0 6px 10px;
  white-space:nowrap;
  text-transform:uppercase;
}
.bmatches{
  display:flex;flex-direction:column;
  flex:1;padding:0 6px;
  justify-content:space-around;
}
/* connector lines */
.bround-connector{
  position:relative;width:20px;flex-shrink:0;
  display:flex;flex-direction:column;
  justify-content:space-around;
}
.bconn-group{
  display:flex;flex-direction:column;
  align-items:center;position:relative;flex:1;
}
.bconn-group::before{
  content:'';position:absolute;
  left:0;top:25%;bottom:25%;
  width:1px;background:linear-gradient(180deg,transparent,rgba(0,240,255,0.3),transparent);
}
.bconn-group::after{
  content:'';position:absolute;
  left:0;top:50%;
  width:100%;height:1px;
  background:linear-gradient(90deg,rgba(0,240,255,0.3),transparent);
}

/* bracket match card */
.bm{
  background:var(--s2);
  border:1px solid rgba(0,240,255,0.1);
  border-radius:7px;overflow:hidden;
  position:relative;margin:3px 0;
  transition:all .2s;
}
.bm:hover{border-color:rgba(0,240,255,0.3);box-shadow:0 0 12px rgba(0,240,255,0.08);}
.bm.final-card{
  border-color:rgba(200,164,21,0.4);
  box-shadow:0 0 20px rgba(200,164,21,0.1);
}
.bteam{
  display:flex;align-items:center;gap:5px;
  padding:5px 8px;
  border-bottom:1px solid rgba(255,255,255,0.04);
  font-family:'Exo 2',sans-serif;font-size:9px;font-weight:700;
  min-height:28px;
}
.bteam:last-child{border-bottom:none;}
.bteam.won{color:#fff;}
.bteam.lost{color:var(--mu2);text-decoration:line-through;}
.bteam.tbd{color:var(--mu);}
.bflag{font-size:12px;flex-shrink:0;width:16px;}
.bname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:0.3px;}
.bsc{
  font-family:'Orbitron',sans-serif;font-size:9px;font-weight:900;
  min-width:14px;text-align:right;flex-shrink:0;
}
.bsc.won{color:var(--glt);}
.bsc.tbd{color:var(--mu2);}
.bdate{
  padding:2px 8px;font-size:7px;color:var(--mu);
  font-family:'Exo 2',sans-serif;letter-spacing:0.5px;
  border-top:1px solid rgba(255,255,255,0.03);
  background:rgba(0,0,0,0.2);
}
/* champion box */
.champion-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:100px;padding:12px;
}
.champion-trophy{font-size:40px;animation:troph 3s ease-in-out infinite;}
@keyframes troph{0%,100%{filter:drop-shadow(0 0 8px rgba(200,164,21,0.5));}50%{filter:drop-shadow(0 0 24px rgba(200,164,21,0.9));transform:scale(1.05);}}
.champion-label{
  font-family:'Orbitron',sans-serif;font-size:8px;font-weight:900;
  letter-spacing:2px;color:var(--glt);margin-top:8px;text-align:center;
}
.champion-sub{font-size:8px;color:var(--mu);letter-spacing:1px;margin-top:3px;font-family:'Exo 2',sans-serif;}

/* bracket toggle btn */
.bk-toggle{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;cursor:pointer;
  background:rgba(0,240,255,0.04);
  border:1px solid rgba(0,240,255,0.1);border-radius:8px;
  margin-bottom:14px;transition:all .2s;
  font-family:'Exo 2',sans-serif;font-size:10px;font-weight:800;
  letter-spacing:2px;color:var(--c);
  width:fit-content;
}
.bk-toggle:hover{background:rgba(0,240,255,0.1);border-color:rgba(0,240,255,0.3);}
.bk-toggle i{font-size:11px;}

/* ── NO CONTENT / LOADING ── */
.nom{text-align:center;padding:50px 20px;color:var(--mu);}
.nom i{font-size:34px;display:block;margin-bottom:12px;color:var(--red);}
.nom p{font-size:12px;font-family:'Exo 2',sans-serif;letter-spacing:1.5px;}
.ldg{display:flex;flex-direction:column;align-items:center;padding:50px;gap:14px;}
.sp{width:36px;height:36px;border:3px solid rgba(0,240,255,0.1);border-top-color:var(--c);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ldg p{font-family:'Exo 2',sans-serif;font-size:10px;letter-spacing:2px;color:var(--c);}

/* ── FOOTER ── */
.foot{text-align:center;padding:28px 16px 20px;border-top:1px solid rgba(0,240,255,0.07);margin-top:30px;}
.foot-logo{height:42px;margin-bottom:8px;filter:drop-shadow(0 0 12px rgba(0,240,255,0.4));}
.foot-name{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:3px;color:var(--c);margin-bottom:3px;}
.foot-sub{font-size:10px;color:var(--mu);font-family:'Exo 2',sans-serif;}
.foot-links{display:flex;justify-content:center;gap:14px;margin-top:12px;flex-wrap:wrap;}
.foot-link{color:var(--mu);font-size:11px;text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .2s;font-family:'Exo 2',sans-serif;font-weight:700;}
.foot-link:hover{color:var(--c);}

/* ── SCROLL TOP ── */
.stb{
  position:fixed;bottom:18px;right:14px;background:var(--red);color:#fff;border:none;
  border-radius:50%;width:40px;height:40px;font-size:14px;cursor:pointer;
  box-shadow:0 4px 20px rgba(200,16,46,0.5);transition:all .2s;display:none;z-index:400;
  align-items:center;justify-content:center;
}
.stb.show{display:flex;}
.stb:hover{transform:scale(1.1);}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .mi{padding:10px 10px 10px 14px;gap:6px;}
  .mm{padding:5px 10px 6px 14px;}
  .mcc{min-width:72px;}
  .gg{grid-template-columns:1fr 1fr;}
  .tab{padding:11px 12px;font-size:9px;}
  .hdr-url{display:none;}
}
@media(min-width:900px){
  .main{padding:18px 20px 70px;}
  .mi{padding:14px 20px 14px 22px;}
}
</style>

  {ph:"FIN",lb:"🏆 Final",date:"2026-07-20",time:"01:00",home:"SF W1",away:"SF W2",venue:"New Jersey (MetLife)"}
];

let liveD={};

/* ── UTILS ── */
function fT(t){const[h,m]=t.split(':').map(Number);const p=h<12?'AM':'PM';const h2=h===0?12:h>12?h-12:h;return`${h2}:${m.toString().padStart(2,'0')} ${p}`;}
function fD(ds){return new Date(ds+'T00:00:00').toLocaleDateString('en-BD',{weekday:'short',month:'short',day:'numeric'});}
function getBD(){const n=new Date(),u=n.getTime()+n.getTimezoneOffset()*60000;return new Date(u+6*3600000);}
function getBDStr(){return getBD().toISOString().slice(0,10);}
function mDT(d,t){return new Date(d+'T'+t+':00+06:00');}
function gSt(m){
  if(liveD[m.id])return liveD[m.id];
  const ko=mDT(m.date,m.time),now=getBD(),diff=now-ko;
  if(diff>0&&diff<115*60000)return{st:'LIVE',min:Math.floor(diff/60000)};
  if(diff>=115*60000)return{st:'FT',hs:m.homeScore??null,as:m.awayScore??null};
  return{st:'NS'};
}
function cntD(d,t){
  const ko=mDT(d,t),now=getBD(),diff=ko-now;
  if(diff<=0)return'';
  const h=Math.floor(diff/3600000),min=Math.floor((diff%3600000)/60000);
  if(h>48){const days=Math.floor(h/24);return`${days}d ${h%24}h`;}
  return`${h}h ${min}m`;
}
function tnC(n){return n.length>14?'tn lg':'tn';}

/* ── CARD ── */
function mkC(m,isKO){
  const s=gSt(m);
  const isL=s.st==='LIVE',isFT=s.st==='FT';
  const hf=FL[m.home]||'🏳',af=FL[m.away]||'🏳';
  const gc=m.group?GC[m.group]:'#C8A415';
  let ctr='';
  if(isL){
    const hs=s.hs!==undefined?s.hs:'0',as=s.as!==undefined?s.as:'0';
    ctr=`<div class="msc lv">${hs}&nbsp;–&nbsp;${as}</div><div class="sr"><div class="lmin"><span class="lmd"></span>${s.min||0}'</div></div>`;
  }else if(isFT&&s.hs!==null&&s.hs!==undefined){
    ctr=`<div class="msc">${s.hs}&nbsp;–&nbsp;${s.as}</div><div class="sr"><span class="pl ft"><i class="fas fa-check"></i> FT</span></div>`;
  }else{
    const cd=cntD(m.date,m.time);
    ctr=`<div class="mt">${fT(m.time)}</div>${cd?`<div class="cd"><i class="fas fa-clock" style="font-size:7px;margin-right:2px;opacity:0.5"></i>${cd}</div>`:`<div class="sr"><span class="pl ns">UPCOMING</span></div>`}`;
  }
  const badge=m.ph
    ?`<span class="gbadge" style="background:rgba(200,164,21,0.1);border:1px solid rgba(200,164,21,0.25);color:var(--glt);">${m.lb||m.ph}</span>`
    :`<span class="gbadge" style="background:${gc}18;border:1px solid ${gc}44;color:${gc};">GRP ${m.group}</span>`;
  return`<div class="mc${isL?' live':isFT?' ft':''}">
    ${m.group?`<div class="gstrip" style="background:${gc}"></div>`:''}
    <div class="mi">
      <div class="ts hm"><div class="tf">${hf}</div><div class="${tnC(m.home)}">${m.home}</div></div>
      <div class="mcc">${ctr}</div>
      <div class="ts aw"><div class="${tnC(m.away)}">${m.away}</div><div class="tf">${af}</div></div>
    </div>
    <div class="mm">${badge}<span><i class="fas fa-map-marker-alt"></i>${m.venue}</span><span><i class="far fa-calendar"></i>${fD(m.date)}</span></div>
  </div>`;
}

/* ── FIXTURES ── */
function rFix(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const gf=document.getElementById('grpF').value;
  const fil=GM.filter(m=>{
    const gok=gf==='ALL'||m.group===gf;
    const sok=!q||m.home.toLowerCase().includes(q)||m.away.toLowerCase().includes(q);
    return gok&&sok;
  });
  const byD={};
  fil.forEach(m=>{if(!byD[m.date])byD[m.date]=[];byD[m.date].push(m);});
  let h='';
  if(!fil.length){h=`<div class="nom"><i class="fas fa-search"></i><p>NO MATCHES FOUND</p></div>`;}
  else{
    Object.entries(byD).sort(([a],[b])=>a.localeCompare(b)).forEach(([date,ms])=>{
      h+=`<div class="dd"><i class="fas fa-calendar-day"></i>${fD(date)}</div>`;
      ms.forEach(m=>{h+=mkC(m);});
    });
  }
  document.getElementById('fixList').innerHTML=h;
  chkLive();
}

/* ── TODAY ── */
function rToday(){
  const today=getBDStr();
  const now=getBD();
  // Find next date with unfinished matches (today or future)
  // Get all group+knockout matches, filter to not-yet-finished ones, group by date
  const allM=[...GM,...KO];
  // Today's matches first
  const todayMs=allM.filter(m=>m.date===today);
  // Unfinished = not past 115 min from kickoff
  const notDone=m=>{
    const diff=now-mDT(m.date,m.time);
    return diff<115*60000; // not yet finished
  };
  let h='';
  if(todayMs.length){
    const upcoming=todayMs.filter(notDone);
    const done=todayMs.filter(m=>!notDone(m));
    if(upcoming.length){
      h+=`<div class="dd"><i class="fas fa-bolt"></i>TODAY — ${fD(today)}</div>`;
      upcoming.forEach(m=>{h+=mkC(m,!!m.ph);});
    }
    if(done.length){
      h+=`<div class="dd"><i class="fas fa-check-circle" style="color:var(--g)"></i>COMPLETED TODAY</div>`;
      done.forEach(m=>{h+=mkC(m,!!m.ph);});
    }
    if(!upcoming.length&&!done.length){h='';}
  }
  // If no today matches or want to also show next upcoming days
  if(!h){
    // Find next upcoming dates (not today, future only)
    const futureMs=allM
      .filter(m=>m.date>today&&mDT(m.date,m.time)>now)
      .sort((a,b)=>mDT(a.date,a.time)-mDT(b.date,b.time));
    if(futureMs.length){
      // Group by date, show up to next 2 dates
      const byD={};
      futureMs.forEach(m=>{if(!byD[m.date])byD[m.date]=[];byD[m.date].push(m);});
      const dates=Object.keys(byD).sort().slice(0,2);
      dates.forEach(date=>{
        h+=`<div class="dd"><i class="fas fa-forward"></i>NEXT MATCH DAY — ${fD(date)}</div>`;
        byD[date].forEach(m=>{h+=mkC(m,!!m.ph);});
      });
    }else{
      h=`<div class="nom"><i class="fas fa-futbol"></i><p>NO UPCOMING MATCHES</p></div>`;
    }
  }
  document.getElementById('todayList').innerHTML=h;
}

/* ── GROUPS ── */
function rGrps(){
  let h='';
  Object.entries(GRPS).forEach(([g,ts])=>{
    const c=GC[g];
    h+=`<div class="gcard"><div class="ghead" style="background:linear-gradient(90deg,${c}cc,${c}22);"><i class="fas fa-shield-halved"></i>GROUP ${g}</div>`;
    ts.forEach(t=>{h+=`<div class="gt"><span class="gtf">${FL[t]||'🏳'}</span><span class="gtn">${t}</span></div>`;});
    h+=`</div>`;
  });
  document.getElementById('grpGrid').innerHTML=h;
}

/* ── KNOCKOUT ── */
function rKO(){
  const phases=[
    {ph:'R32',lb:'Round of 32',color:'#3498db',icon:'fa-list-ol'},
    {ph:'R16',lb:'Round of 16',color:'#1abc9c',icon:'fa-th-large'},
    {ph:'QF',lb:'Quarterfinal',color:'#e67e22',icon:'fa-crosshairs'},
    {ph:'SF',lb:'Semifinal',color:'#9b59b6',icon:'fa-star-half-stroke'},
    {ph:'3P',lb:'3rd Place',color:'#7f8c8d',icon:'fa-medal'},
    {ph:'FIN',lb:'Final',color:'#C8A415',icon:'fa-trophy'}
  ];

  let h=`
  <!-- BRACKET -->
  <div class="bracket-outer">
    <div class="bracket-header">
      <div class="bracket-header-title"><i class="fas fa-sitemap"></i>KNOCKOUT BRACKET — WC 2026</div>
      <div class="bracket-scroll-hint"><i class="fas fa-arrows-left-right"></i>SCROLL TO EXPLORE</div>
    </div>
    <div class="bracket-scroll">
      ${mkBracket()}
    </div>
  </div>

  <!-- PHASE CARDS -->
  `;

  phases.forEach(p=>{
    const ms=KO.filter(m=>m.ph===p.ph);
    if(!ms.length)return;
    h+=`<div class="kos"><div class="ptitle" style="background:${p.color}12;border:1px solid ${p.color}30;color:${p.color}"><i class="fas ${p.icon}"></i>${p.lb.toUpperCase()}</div><div class="kog">`;
    ms.forEach(m=>{h+=mkC(m,true);});
    h+=`</div></div>`;
  });
  document.getElementById('koContent').innerHTML=h;
}

/* ── BRACKET ── */
function mkBracket(){
  const r32=KO.filter(m=>m.ph==='R32');
  const r16=KO.filter(m=>m.ph==='R16');
  const qf=KO.filter(m=>m.ph==='QF');
  const sf=KO.filter(m=>m.ph==='SF');
  const fin=KO.filter(m=>m.ph==='FIN');

  function bm(home,away,date,isFin){
    const hf=FL[home]||'';
    const af=FL[away]||'';
    const isKnown=h=>!h.startsWith('R')&&!h.startsWith('Q')&&!h.startsWith('S')&&!h.startsWith('B')&&!h.startsWith('1')&&!h.startsWith('2');
    const hClass=isKnown(home)?'bteam':'bteam tbd';
    const aClass=isKnown(away)?'bteam':'bteam tbd';
    const ds=fD(date);
    return`<div class="bm${isFin?' final-card':''}">
      <div class="${hClass}"><span class="bflag">${hf}</span><span class="bname">${home}</span><span class="bsc tbd">—</span></div>
      <div class="${aClass}"><span class="bflag">${af}</span><span class="bname">${away}</span><span class="bsc tbd">—</span></div>
      <div class="bdate"><i class="far fa-calendar" style="margin-right:4px;opacity:0.5"></i>${ds}</div>
    </div>`;
  }

  // Connector lines between rounds
  function connectors(n){
    let h='<div class="bround-connector" style="display:flex;flex-direction:column;justify-content:space-around;padding:0 0 18px;">';
    for(let i=0;i<n;i++){
      h+=`<div style="flex:1;position:relative;display:flex;align-items:center;">
        <div style="position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(0,240,255,0.25),transparent);"></div>
        <div style="position:absolute;left:0;top:50%;width:100%;height:1px;background:linear-gradient(90deg,rgba(0,240,255,0.25),transparent);"></div>
      </div>`;
    }
    h+=`</div>`;
    return h;
  }

  let h=`<div class="bracket-inner">`;

  // R32 round
  h+=`<div class="bround"><div class="bround-title" style="color:#3498db">ROUND OF 32</div><div class="bmatches" style="gap:4px;">`;
  r32.forEach(m=>{h+=bm(m.home,m.away,m.date,false);});
  h+=`</div></div>`;
  h+=connectors(8);

  // R16
  h+=`<div class="bround"><div class="bround-title" style="color:#1abc9c">ROUND OF 16</div><div class="bmatches" style="gap:8px;">`;
  r16.forEach(m=>{h+=bm(m.home,m.away,m.date,false);});
  h+=`</div></div>`;
  h+=connectors(4);

  // QF
  h+=`<div class="bround"><div class="bround-title" style="color:#e67e22">QUARTERFINAL</div><div class="bmatches" style="gap:20px;">`;
  qf.forEach(m=>{h+=bm(m.home,m.away,m.date,false);});
  h+=`</div></div>`;
  h+=connectors(2);

  // SF
  h+=`<div class="bround"><div class="bround-title" style="color:#9b59b6">SEMIFINAL</div><div class="bmatches" style="gap:60px;">`;
  sf.forEach(m=>{h+=bm(m.home,m.away,m.date,false);});
  h+=`</div></div>`;
  h+=connectors(1);

  // FINAL
  h+=`<div class="bround"><div class="bround-title" style="color:var(--glt)">🏆 FINAL</div><div class="bmatches" style="justify-content:center;">`;
  fin.forEach(m=>{h+=bm(m.home,m.away,m.date,true);});
  h+=`</div></div>`;

  // Champion trophy
  h+=`<div class="champion-box">
    <div class="champion-trophy">🏆</div>
    <div class="champion-label">CHAMPION</div>
    <div class="champion-sub">19 JULY 2026</div>
  </div>`;

  h+=`</div>`;
  return h;
}

/* ── LIVE API ── */
async function fetchLive(){
  try{
    const r=await fetch('https://www.thesportsdb.com/api/v1/json/3/latestsoccer.php');
    if(!r.ok)throw new Error();
    const d=await r.json();
    if(d&&d.events){
      let found=0;
      d.events.forEach(ev=>{
        GM.forEach(m=>{
          const hm=ev.strHomeTeam&&(ev.strHomeTeam.toLowerCase().includes(m.home.toLowerCase())||m.home.toLowerCase().includes(ev.strHomeTeam.toLowerCase()));
          const am=ev.strAwayTeam&&(ev.strAwayTeam.toLowerCase().includes(m.away.toLowerCase())||m.away.toLowerCase().includes(ev.strAwayTeam.toLowerCase()));
          if(hm&&am){
            const s=ev.strStatus;
            if(s==='Match Finished'||s==='FT'||s==='AET'){
              liveD[m.id]={st:'FT',hs:parseInt(ev.intHomeScore)||0,as:parseInt(ev.intAwayScore)||0};
            }else if(s&&!isNaN(parseInt(s))){
              liveD[m.id]={st:'LIVE',min:parseInt(s),hs:parseInt(ev.intHomeScore)||0,as:parseInt(ev.intAwayScore)||0};
            }
            found++;
          }
        });
      });
      const t=getBD().toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit'});
      updAPI(found>0
        ?`<i class="fas fa-circle" style="color:var(--live);font-size:8px"></i> ${found} LIVE now · Updated ${t}`
        :`<i class="fas fa-satellite-dish" style="color:var(--c);font-size:10px"></i> Feed connected · No live matches · ${t}`,found>0);
    }
  }catch(e){
    updAPI(`<i class="fas fa-exclamation-triangle" style="color:var(--red)"></i> Live feed unavailable`,false);
  }
}
async function fetchDone(){
  try{
    const r=await fetch('https://www.thesportsdb.com/api/v1/json/3/eventsseason.php?id=4429&s=2026');
    if(!r.ok)throw new Error();
    const d=await r.json();
    if(d&&d.events)d.events.forEach(ev=>{
      if(ev.strStatus!=='Match Finished'&&ev.strStatus!=='FT')return;
      GM.forEach(m=>{
        const hm=ev.strHomeTeam&&ev.strHomeTeam.toLowerCase().includes(m.home.toLowerCase().slice(0,5));
        const am=ev.strAwayTeam&&ev.strAwayTeam.toLowerCase().includes(m.away.toLowerCase().slice(0,5));
        if(hm&&am&&!liveD[m.id])liveD[m.id]={st:'FT',hs:parseInt(ev.intHomeScore)||0,as:parseInt(ev.intAwayScore)||0};
      });
    });
  }catch(e){}
}
function updAPI(html,live){
  const el=document.getElementById('apiTxt');if(el)el.innerHTML=html;
  const lb=document.getElementById('liveBadge');if(lb)lb.style.display=live?'inline-flex':'none';
}
function chkLive(){
  const h=Object.values(liveD).some(d=>d.st==='LIVE');
  const lb=document.getElementById('liveBadge');if(lb)lb.style.display=h?'inline-flex':'none';
}

/* ── REFRESH ── */
async function doRef(){
  const ic=document.getElementById('refIco');
  ic.classList.add('fa-spin');
  updAPI('<i class="fas fa-sync-alt fa-spin" style="color:var(--c)"></i> Refreshing…',false);
  await fetchLive();await fetchDone();
  rAll();
  setTimeout(()=>ic.classList.remove('fa-spin'),800);
}

/* ── TABS ── */
function goTab(t,el){
  ['fixtures','today','groups','knockout'].forEach(x=>{document.getElementById('tab-'+x).style.display='none';});
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+t).style.display='block';
  el.classList.add('active');
}

/* ── DAYS LEFT ── */
function calcDays(){
  const fin=new Date('2026-07-20T00:00:00+06:00'),now=getBD();
  const d=Math.max(0,Math.ceil((fin-now)/86400000));
  const el=document.getElementById('daysLeft');
  if(el)el.textContent=d>0?d:'🏆';
}

/* ── SCROLL TOP ── */
window.addEventListener('scroll',()=>{
  const b=document.getElementById('stb');
  if(b)b.className='stb'+(window.scrollY>300?' show':'');
});

/* ── ALL RENDER ── */
function rAll(){rFix();rToday();rGrps();rKO();}

/* ── INIT ── */
document.addEventListener('DOMContentLoaded',async()=>{
  calcDays();
  rAll();
  await fetchLive();
  await fetchDone();
  rAll();
  setInterval(async()=>{await fetchLive();rFix();rToday();},60000);
});

window.goTab=goTab;window.doRef=doRef;window.rFix=rFix;
})();
</script>
</body>
</html>
