
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.wrap { padding: 1.5rem 0; }
.header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
.badge { background: #1a1a2e; color: #f0c040; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.5px; }
.title { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
.sub { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
.label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; letter-spacing: 0.3px; }
textarea { width: 100%; min-height: 180px; resize: vertical; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; padding: 10px 12px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-primary); }
textarea:focus { outline: none; border-color: #f0c040; box-shadow: 0 0 0 2px rgba(240,192,64,0.15); }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn-primary { background: #1a1a2e; color: #f0c040; border: none; border-radius: var(--border-radius-md); padding: 9px 20px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: opacity 0.15s; }
.btn-primary:hover { opacity: 0.85; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-clear { background: transparent; color: var(--color-text-secondary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 9px 16px; font-size: 13px; cursor: pointer; }
.btn-clear:hover { background: var(--color-background-secondary); }
.preview { display: none; }
.preview.show { display: block; }
.preview-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; }
.match-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 13px; }
.match-row:last-child { border-bottom: none; }
.player-name { font-weight: 500; color: var(--color-text-primary); flex: 1; }
.score-box { display: flex; align-items: center; gap: 6px; margin: 0 12px; }
.score { font-size: 14px; font-weight: 500; padding: 2px 8px; border-radius: 4px; min-width: 24px; text-align: center; }
.score.goat { background: #1a1a2e; color: #f0c040; }
.score.opp { background: var(--color-background-secondary); color: var(--color-text-primary); }
.vs-sep { font-size: 11px; color: var(--color-text-tertiary); }
.result-badge { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; min-width: 46px; text-align: center; }
.result-badge.win { background: #EAF3DE; color: #3B6D11; }
.result-badge.loss { background: #FCEBEB; color: #A32D2D; }
.result-badge.draw { background: #FAEEDA; color: #854F0B; }
.session-label { font-size: 11px; color: var(--color-text-tertiary); padding: 6px 0 2px; font-style: italic; }
.status-bar { padding: 10px 14px; border-radius: var(--border-radius-md); font-size: 13px; margin-top: 10px; display: none; }
.status-bar.success { background: #EAF3DE; color: #3B6D11; display: flex; align-items: center; gap: 6px; }
.status-bar.error { background: #FCEBEB; color: #A32D2D; display: flex; align-items: center; gap: 6px; }
.status-bar.loading { background: var(--color-background-secondary); color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; }
.spin { animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px; text-align: center; }
.stat-num { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
.stat-lbl { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
.stat-num.win-c { color: #3B6D11; }
.stat-num.draw-c { color: #854F0B; }
.stat-num.loss-c { color: #A32D2D; }
.opp-player { color: var(--color-text-secondary); flex: 1; text-align: right; }
</style>

<div class="wrap">
  <div class="header">
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <span class="badge">GOAT FC</span>
        <span style="font-size:12px;color:var(--color-text-tertiary)">Match Data Submitter</span>
      </div>
      <div class="title">Match Result Submission</div>
      <div class="sub">Paste COBEG match text → auto-detect GOAT FC results → send to Google Sheet</div>
    </div>
  </div>

  <div class="card">
    <div class="label">Match text paste করো</div>
    <textarea id="matchText" placeholder="COBEG World Cup Qualifiers — GRP12-R6 / 29
𝐃𝐇𝐀𝐊𝐀 𝐄𝐋𝐈𝐓𝐄 𝐒𝐐𝐔𝐀𝐃 ⚒️ 𝐆𝐎𝐀𝐓 𝐅𝐂
𝗙𝗶𝗿𝘀𝘁 𝗗𝗮𝘆: May 23 | Response 12:20am-12:30am
Meherab Hossain Sakib 🔑 0🆚2 Faiaz ur Rahman
..."></textarea>
    <div class="btn-row">
      <button class="btn-primary" id="previewBtn" onclick="doPreview()">
        <i class="ti ti-eye" aria-hidden="true"></i> Preview
      </button>
      <button class="btn-primary" id="submitBtn" onclick="doSubmit()" style="display:none;">
        <i class="ti ti-upload" aria-hidden="true"></i> Submit to Sheet
      </button>
      <button class="btn-clear" onclick="doClear()">Clear</button>
    </div>
    <div class="status-bar" id="statusBar"></div>
  </div>

  <div class="card preview" id="previewCard">
    <div class="preview-title">Preview — GOAT FC matches detected</div>
    <div id="statRow" class="stat-row"></div>
    <div style="margin-top:12px;" id="matchList"></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwo_Ov7hGowzvzY6qe308MBYaayATQFe4NkCK_NNPMVFWCiLigXhke4kNeQ5bZ6rfv9pw/exec";

let parsedMatches = [];

function detectGoatSide(text) {
  const headerMatch = text.match(/([^\n]*GOAT[^\n]*FC[^\n]*|[^\n]*FC[^\n]*GOAT[^\n]*)/i);
  if (!headerMatch) return "right";
  const line = headerMatch[0];
  const goatIdx = line.search(/GOAT/i);
  const sepIdx = line.search(/⚒️|🆚/);
  if (sepIdx !== -1 && goatIdx < sepIdx) return "left";
  return "right";
}

function parseMatches(text) {
  const goatSide = detectGoatSide(text);
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const results = [];
  let session = "General";

  const sessionMap = [
    { r: /first\s*day/i, l: "First Day" },
    { r: /star[^\n]*(may|response)/i, l: "Star" },
    { r: /mid\s*night/i, l: "Mid Night" },
    { r: /late\s*night/i, l: "Late Night" },
    { r: /morning/i, l: "Morning" },
    { r: /evening/i, l: "Evening" },
  ];

  lines.forEach(line => {
    for (const s of sessionMap) {
      if (s.r.test(line)) { session = s.l; return; }
    }
    const m = line.match(/^(.+?)\s+(\d+)\s*🆚\s*(\d+)\s+(.+)$/);
    if (!m) return;

    let p1 = m[1].replace(/🔑/g, "").trim();
    let s1 = parseInt(m[2]);
    let s2 = parseInt(m[3]);
    let p2 = m[4].replace(/🔑/g, "").trim();

    const goatPlayer = goatSide === "right" ? p2 : p1;
    const oppPlayer  = goatSide === "right" ? p1 : p2;
    const goatScore  = goatSide === "right" ? s2 : s1;
    const oppScore   = goatSide === "right" ? s1 : s2;

    let result = "Draw";
    if (goatScore > oppScore) result = "Win";
    else if (goatScore < oppScore) result = "Loss";

    results.push({ goatPlayer, oppPlayer, goatScore, oppScore, result, session });
  });

  return results;
}

function doPreview() {
  const text = document.getElementById("matchText").value.trim();
  if (!text) { showStatus("error", "Match text paste করো আগে"); return; }

  parsedMatches = parseMatches(text);
  if (!parsedMatches.length) { showStatus("error", "কোনো match line detect হয়নি। Format ঠিক আছে কিনা দেখো।"); return; }

  const wins = parsedMatches.filter(m => m.result === "Win").length;
  const draws = parsedMatches.filter(m => m.result === "Draw").length;
  const losses = parsedMatches.filter(m => m.result === "Loss").length;

  document.getElementById("statRow").innerHTML = `
    <div class="stat-card"><div class="stat-num win-c">${wins}</div><div class="stat-lbl">Wins</div></div>
    <div class="stat-card"><div class="stat-num draw-c">${draws}</div><div class="stat-lbl">Draws</div></div>
    <div class="stat-card"><div class="stat-num loss-c">${losses}</div><div class="stat-lbl">Losses</div></div>
  `;

  let html = "";
  let lastSession = "";
  parsedMatches.forEach(m => {
    if (m.session !== lastSession) {
      html += `<div class="session-label"><i class="ti ti-clock" aria-hidden="true"></i> ${m.session}</div>`;
      lastSession = m.session;
    }
    const rc = m.result.toLowerCase();
    html += `<div class="match-row">
      <span class="player-name">${m.goatPlayer}</span>
      <div class="score-box">
        <span class="score goat">${m.goatScore}</span>
        <span class="vs-sep">vs</span>
        <span class="score opp">${m.oppScore}</span>
      </div>
      <span class="opp-player">${m.oppPlayer}</span>
      <span class="result-badge ${rc}" style="margin-left:10px;">${m.result}</span>
    </div>`;
  });

  document.getElementById("matchList").innerHTML = html;
  document.getElementById("previewCard").classList.add("show");
  document.getElementById("submitBtn").style.display = "flex";
  clearStatus();
}

async function doSubmit() {
  if (!parsedMatches.length) { showStatus("error", "আগে Preview করো"); return; }

  const text = document.getElementById("matchText").value.trim();
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  showStatus("loading", '<span class="spin"><i class="ti ti-loader"></i></span> Google Sheet এ submit হচ্ছে...');

  try {
    const formData = new FormData();
    formData.append("text", text);

    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: formData,
      mode: "no-cors"
    });

    showStatus("success", '<i class="ti ti-check"></i> ' + parsedMatches.length + 'টি match successfully submit হয়েছে Google Sheet এ!');
    submitBtn.style.display = "none";
  } catch (err) {
    showStatus("error", '<i class="ti ti-alert-circle"></i> Error: ' + err.message);
  }

  submitBtn.disabled = false;
}

function doClear() {
  document.getElementById("matchText").value = "";
  document.getElementById("previewCard").classList.remove("show");
  document.getElementById("submitBtn").style.display = "none";
  parsedMatches = [];
  clearStatus();
}

function showStatus(type, msg) {
  const bar = document.getElementById("statusBar");
  bar.className = "status-bar " + type;
  bar.innerHTML = msg;
}

function clearStatus() {
  const bar = document.getElementById("statusBar");
  bar.className = "status-bar";
  bar.innerHTML = "";
}
</script>
