<!DOCTYPE html>
<html lang="en">
<head>
<title>PLAYER RANK SYSTEM – GOAT FC</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
--c:#00f5ff;
--g:#00ff88;
--p:#bf5fff;
--bg:#020817;
--bg2:#0b1120;
--gold:#ffd700;
--silver:#c0c0c0;
--bronze:#cd7f32;
--cyan:#00f5ff;
--row:rgba(255,255,255,0.03);
--border:rgba(255,255,255,0.07);
--font-head:'Orbitron',sans-serif;
--font-body:'Rajdhani',sans-serif;
}

html{scroll-behavior:smooth}

body{
background:var(--bg);
color:#fff;
font-family:var(--font-body);
min-height:100vh;
overflow-x:hidden;
display:flex;
flex-direction:column;
}

/* ── RGB scanline bg ── */
body::before{
content:'';
position:fixed;inset:0;
background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,255,0.012) 2px,rgba(0,245,255,0.012) 4px);
pointer-events:none;
z-index:0;
}

/* ── TOPBAR ── */
.topbar{
position:sticky;top:0;z-index:9999;
height:46px;padding:0 16px;
display:flex;align-items:center;justify-content:space-between;
background:rgba(2,8,23,.92);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(0,245,255,.15);
text-decoration:none;
}
.topbar::after{
content:'';
position:absolute;bottom:0;left:0;right:0;height:1px;
background:linear-gradient(90deg,transparent,var(--c),var(--g),var(--p),transparent);
animation:scanbar 3s linear infinite;
}
@keyframes scanbar{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
.topbar-left{display:flex;align-items:center;gap:9px}
.topbar-logo{width:26px;filter:drop-shadow(0 0 6px var(--c))}
.topbar-text{
font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:2px;
background:linear-gradient(90deg,var(--c),var(--g));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.topbar-right{
width:28px;height:28px;display:flex;align-items:center;justify-content:center;
border-radius:50%;border:1px solid rgba(0,245,255,.3);
color:var(--c);font-size:12px;
background:rgba(0,245,255,.07);
transition:box-shadow .2s,transform .2s;
}
.topbar-right:hover{transform:scale(1.1);box-shadow:0 0 14px rgba(0,245,255,.5)}

/* ── MAIN CONTENT ── */
.main{
position:relative;z-index:1;
flex:1;
}

/* ── WRAPPER ── */
.wrapper{
max-width:920px;margin:0 auto;padding:0 12px 24px;
}

/* ── TITLE ── */
.title-block{
padding:18px 0 6px;
text-align:center;
}
.title-block h1{
font-family:var(--font-head);
font-size:clamp(15px,3.5vw,24px);
font-weight:900;
letter-spacing:4px;
text-transform:uppercase;
background:linear-gradient(90deg,var(--c),var(--g),var(--p),var(--c));
background-size:300%;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation:titleShift 4s linear infinite;
}
@keyframes titleShift{0%{background-position:0%}100%{background-position:300%}}
.subtitle{
font-size:10px;letter-spacing:2px;opacity:.4;margin-top:4px;
font-family:var(--font-body);
}

/* ── TABS ── */
.tabs{
display:flex;gap:8px;justify-content:center;
margin:12px 0 10px;
}
.tab-btn{
padding:7px 22px;border:1px solid rgba(255,255,255,.1);
border-radius:4px;
background:rgba(255,255,255,.04);
color:rgba(255,255,255,.5);
font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:2px;
cursor:pointer;transition:all .2s;
clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
.tab-btn:hover{color:#fff;border-color:var(--c);box-shadow:0 0 10px rgba(0,245,255,.2)}
.tab-btn.active{
background:linear-gradient(90deg,rgba(0,245,255,.2),rgba(0,255,136,.15));
border-color:var(--c);color:var(--c);
box-shadow:0 0 16px rgba(0,245,255,.25);
}

/* ── STATS ROW ── */
.stats{
display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
margin-bottom:12px;
}
.stat{
padding:5px 13px;border-radius:4px;
background:rgba(0,245,255,.06);
border:1px solid rgba(0,245,255,.12);
font-size:11px;font-family:var(--font-body);font-weight:600;letter-spacing:1px;
color:rgba(255,255,255,.6);
}
.stat span{color:var(--c);font-weight:700}

/* ── TABLE CARD ── */
.card{
background:rgba(11,17,32,.8);
border:1px solid var(--border);
border-radius:8px;
overflow:hidden;
position:relative;
}
.card::before{
content:'';
position:absolute;inset:0;border-radius:8px;
background:linear-gradient(135deg,rgba(0,245,255,.04),transparent 60%);
pointer-events:none;z-index:0;
}
.card::after{
content:'';
position:absolute;top:0;left:0;right:0;height:2px;
background:linear-gradient(90deg,var(--c),var(--g),var(--p),var(--c));
background-size:300%;
animation:titleShift 3s linear infinite;
border-radius:8px 8px 0 0;
}

.tbl-wrap{overflow-x:auto;position:relative;z-index:1;}

table{width:100%;border-collapse:collapse;}
thead{background:rgba(0,0,0,.35)}

th{
font-family:var(--font-head);
font-size:9px;
letter-spacing:1px;
color:var(--c);
padding:9px 6px;
border-bottom:1px solid rgba(0,245,255,.15);
white-space:nowrap;
text-align:center;
}
th:nth-child(2){text-align:left;padding-left:10px;}

td{
padding:7px 6px;
font-size:12px;font-weight:500;
border-bottom:1px solid var(--border);
text-align:center;
vertical-align:middle;
}
td:nth-child(2){text-align:left;padding-left:10px;}

/* ── RANK BADGE ── */
.rank-num{
display:inline-flex;align-items:center;justify-content:center;
width:20px;height:20px;border-radius:3px;
font-family:var(--font-head);font-size:9px;font-weight:700;
background:rgba(255,255,255,.07);
clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);
}

/* ── PLAYER CELL ── */
.player-name{
display:flex;flex-direction:column;gap:1px;
}
.p-name{font-weight:600;font-size:12px;line-height:1.2}
.p-id{font-size:9px;opacity:.38;letter-spacing:.5px;font-family:var(--font-head)}

/* ── ROW STYLES ── */
tbody tr{
background:var(--row);
transition:background .15s;
}
tbody tr:hover{background:rgba(0,245,255,.05)}

/* ── RANK 1 – GOLD ── */
.rank1{
background:linear-gradient(90deg,rgba(255,215,0,.16),rgba(255,215,0,.03),transparent) !important;
border-left:3px solid var(--gold) !important;
animation:goldPulse 2.5s ease-in-out infinite;
}
@keyframes goldPulse{
0%,100%{box-shadow:inset 2px 0 12px rgba(255,215,0,.1)}
50%{box-shadow:inset 2px 0 22px rgba(255,215,0,.25)}
}
.rank1 td{color:#ffe97a;}
.rank1 .p-id{color:rgba(255,233,122,.4)!important;-webkit-text-fill-color:rgba(255,233,122,.4)!important;}
.rank1 .rank-num{
background:rgba(255,215,0,.28);color:var(--gold);
box-shadow:0 0 10px rgba(255,215,0,.55);
}

/* ── RANK 2 – SILVER ── */
.rank2{
background:linear-gradient(90deg,rgba(192,192,192,.13),rgba(192,192,192,.02),transparent) !important;
border-left:3px solid var(--silver) !important;
animation:silverPulse 2.5s ease-in-out infinite;
}
@keyframes silverPulse{
0%,100%{box-shadow:inset 2px 0 10px rgba(192,192,192,.08)}
50%{box-shadow:inset 2px 0 20px rgba(192,192,192,.2)}
}
.rank2 td{color:#e0e0e0;}
.rank2 .p-id{color:rgba(224,224,224,.4)!important;-webkit-text-fill-color:rgba(224,224,224,.4)!important;}
.rank2 .rank-num{
background:rgba(192,192,192,.22);color:var(--silver);
box-shadow:0 0 8px rgba(192,192,192,.45);
}

/* ── RANK 3 – BRONZE ── */
.rank3{
background:linear-gradient(90deg,rgba(205,127,50,.15),rgba(205,127,50,.03),transparent) !important;
border-left:3px solid var(--bronze) !important;
animation:bronzePulse 2.5s ease-in-out infinite;
}
@keyframes bronzePulse{
0%,100%{box-shadow:inset 2px 0 10px rgba(205,127,50,.1)}
50%{box-shadow:inset 2px 0 20px rgba(205,127,50,.25)}
}
.rank3 td{color:#e8a87c;}
.rank3 .p-id{color:rgba(232,168,124,.4)!important;-webkit-text-fill-color:rgba(232,168,124,.4)!important;}
.rank3 .rank-num{
background:rgba(205,127,50,.25);color:var(--bronze);
box-shadow:0 0 8px rgba(205,127,50,.45);
}

/* ── TOP 4-10 – CYAN ── */
.top10{border-left:3px solid rgba(0,245,255,.3) !important;}
.top10 td{color:#a0f0ff;}
.top10 .p-id{color:rgba(160,240,255,.38)!important;-webkit-text-fill-color:rgba(160,240,255,.38)!important;}
.top10 .rank-num{color:var(--c);background:rgba(0,245,255,.1);}

/* ── LOADING ── */
.loading-cell{
padding:40px 20px;
font-family:var(--font-head);font-size:11px;letter-spacing:3px;
color:var(--c);opacity:.7;
animation:pulse 1s ease-in-out infinite alternate;
text-align:center;
}
@keyframes pulse{from{opacity:.3}to{opacity:.8}}

/* ── FOOTER ── */
footer{
position:relative;z-index:1;
text-align:center;
padding:14px 0 16px;
border-top:1px solid rgba(0,245,255,.08);
background:rgba(2,8,23,.6);
}
.footer-text{
font-family:var(--font-head);
font-size:9px;
letter-spacing:2.5px;
background:linear-gradient(90deg,var(--c),var(--g));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
opacity:.55;
}

/* ── MOBILE ── */
@media(max-width:600px){
.wrapper{padding:0 6px 20px}
th{font-size:8px;padding:8px 4px;letter-spacing:.5px}
td{font-size:11px;padding:6px 4px}
.p-name{font-size:11px}
.p-id{font-size:8px}
.rank-num{width:18px;height:18px;font-size:8px}
.topbar{height:42px;padding:0 10px}
}
</style>
</head>
<body>

<a href="https://goatfcbd.com" class="topbar">
  <div class="topbar-left">
    <img src="https://i.imgur.com/LY3Bb9m.png" class="topbar-logo">
    <span class="topbar-text">GOAT FC</span>
  </div>
  <div class="topbar-right"><i class="fa-solid fa-house"></i></div>
</a>

<div class="main">
<div class="wrapper">

  <div class="title-block">
    <h1>PLAYER RANK SYSTEM</h1>
    <div class="subtitle">GOAT FC · LIVE COMPETITIVE RANKING</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="monthlyBtn" onclick="loadData('monthly')">MONTHLY</button>
    <button class="tab-btn" id="overallBtn" onclick="loadData('overall')">OVERALL</button>
  </div>

  <div class="stats">
    <div class="stat">Matches <span id="m">—</span></div>
    <div class="stat">Goals <span id="g">—</span></div>
    <div class="stat">Goals/Match <span id="pm">—</span></div>
  </div>

  <div class="card">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>PLAYER</th>
            <th>PTS</th>
            <th>M</th>
            <th>WIN%</th>
            <th>GF</th>
            <th>GA</th>
            <th>GD</th>
          </tr>
        </thead>
        <tbody id="table">
          <tr><td colspan="8" class="loading-cell">LOADING DATA...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</div>

<footer>
  <div class="footer-text">POWERED BY GOAT FC</div>
</footer>

<script>
const L="https://opensheet.elk.sh/1DSPKPaU1ZQYbFM4iYbE1VXgDAXU-FCT7--QhYJsNf1M/Leaderboard%20Goat%20FC";
const M="https://opensheet.elk.sh/1DSPKPaU1ZQYbFM4iYbE1VXgDAXU-FCT7--QhYJsNf1M/CLUB%20MEMBERS";

let currentType="monthly";
let timer=null;
let memberMap=null;

async function getMembers(){
  if(memberMap) return memberMap;
  const d=await fetch(M).then(r=>r.json());
  memberMap={};
  d.forEach(x=>{if(x["Club ID Number"]) memberMap[x["Club ID Number"].trim()]=x["Full Name"]});
  return memberMap;
}

async function loadData(t){
  currentType=t;
  document.getElementById("overallBtn").classList.toggle("active",t==="overall");
  document.getElementById("monthlyBtn").classList.toggle("active",t==="monthly");

  try{
    const [ld,map]=await Promise.all([
      fetch(L).then(r=>r.json()),
      getMembers()
    ]);

    let rows=ld.filter(r=>r["Club_ID"]&&map[r["Club_ID"].trim()]);

    rows.sort((a,b)=>{
      const am=+(t==="overall"?a["Overall_PL"]:a["Monthly_PL"])||0;
      const bm=+(t==="overall"?b["Overall_PL"]:b["Monthly_PL"])||0;
      if(am===0&&bm>0) return 1;
      if(bm===0&&am>0) return -1;
      const ap=+(t==="overall"?a["Overall_Point"]:a["Monthly_Point"])||0;
      const bp=+(t==="overall"?b["Overall_Point"]:b["Monthly_Point"])||0;
      if(bp!==ap) return bp-ap;
      const aw=+(t==="overall"?a["Overall_Win%"]:a["Monthly_Win%"])||0;
      const bw=+(t==="overall"?b["Overall_Win%"]:b["Monthly_Win%"])||0;
      if(bw!==aw) return bw-aw;
      const agd=+(t==="overall"?a["Total GD"]:a["Montly GD"])||0;
      const bgd=+(t==="overall"?b["Total GD"]:b["Montly GD"])||0;
      return bgd-agd;
    });

    let html="";
    let totalM=0,totalG=0;

    rows.forEach((r,i)=>{
      const cls=i===0?"rank1":i===1?"rank2":i===2?"rank3":i<10?"top10":"";
      const m=+(t==="overall"?r["Overall_PL"]:r["Monthly_PL"])||0;
      const gf=+(t==="overall"?r["Total GF"]:r["Montly GF"])||0;
      const pt=+(t==="overall"?r["Overall_Point"]:r["Monthly_Point"])||0;
      const win=((+(t==="overall"?r["Overall_Win%"]:r["Monthly_Win%"])||0)*100).toFixed(1);
      const ga=r[t==="overall"?"Total GA":"Montly GA"]||0;
      const gd=r[t==="overall"?"Total GD":"Montly GD"]||0;
      totalM+=m; totalG+=gf;
      html+=`<tr class="${cls}"><td><span class="rank-num">${i+1}</span></td><td><div class="player-name"><span class="p-name">${map[r["Club_ID"].trim()]}</span><span class="p-id">${r["Club_ID"]}</span></div></td><td>${pt}</td><td>${m}</td><td>${win}%</td><td>${gf}</td><td>${ga}</td><td>${gd}</td></tr>`;
    });

    document.getElementById("table").innerHTML=html||`<tr><td colspan="8" style="padding:20px;opacity:.4;font-size:11px;letter-spacing:2px;font-family:var(--font-head);text-align:center">NO DATA</td></tr>`;
    const match=Math.round(totalM/2);
    document.getElementById("m").textContent=match;
    document.getElementById("g").textContent=totalG;
    document.getElementById("pm").textContent=match?(totalG/match).toFixed(2):"0";

  }catch(e){
    document.getElementById("table").innerHTML=`<tr><td colspan="8" style="padding:20px;color:#ff4466;font-size:11px;letter-spacing:1px;font-family:var(--font-head);text-align:center">ERROR LOADING DATA</td></tr>`;
  }
}

function startAutoRefresh(){
  if(timer) clearInterval(timer);
  timer=setInterval(()=>loadData(currentType),30000);
}

loadData("monthly");
startAutoRefresh();
</script>
</body>
</html>
