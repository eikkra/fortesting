<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Schedule & Fixture</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#06110b;
    --card:#0d1f16;
    --green:#00ff88;
    --green2:#00cc66;
    --home:#00ffd0;
    --away:#ff4d6d;
    --border:rgba(0,255,136,.2);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Poppins;
    background:radial-gradient(circle,#0b1f15,#020705);
    color:#eafff2;
    padding:12px;
}

.container{max-width:950px;margin:auto;}

.title{
    text-align:center;
    font-family:Orbitron;
    font-size:24px;
    color:var(--green);
    margin-bottom:18px;
}

/* SELECT */
select{
    width:100%;
    padding:11px;
    border-radius:10px;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--green);
    margin-bottom:14px;
}

/* CARD */
.match-card{
    background:linear-gradient(145deg,#0d1f16,#11281c);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    margin-bottom:12px;
}

/* ROW FIX */
.match-row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
}

/* TEAM */
.team{
    display:flex;
    align-items:center;
    gap:6px;
    overflow:hidden;
}

.team.right{
    justify-content:flex-end;
}

.team img{
    width:28px;
    height:28px;
    border-radius:6px;
    object-fit:cover;
    background:#fff;
    flex-shrink:0;
}

.team-name{
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:90px;
}

/* TAG FIX */
.tag{
    font-size:9px;
    padding:2px 6px;
    border-radius:6px;
    display:inline-block;
    width:auto;
}

.home-tag{
    background:rgba(0,255,208,.15);
    color:var(--home);
}

.away-tag{
    background:rgba(255,77,109,.15);
    color:var(--away);
}

/* VS PERFECT CENTER */
.vs{
    font-family:Orbitron;
    font-size:14px;
    color:var(--green);
    text-align:center;
    min-width:40px;
}

/* BUTTON AREA */
.btn-row{
    margin-top:10px;
    display:flex;
    justify-content:center;
}

/* MATCH GROUP CENTER */
.group-btn{
    display:inline-block;
    padding:9px 16px;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
    background:rgba(0,255,136,.1);
    color:var(--green);
    border:1px solid var(--border);
    box-shadow:0 0 10px rgba(0,255,136,.2);
    text-align:center;
}

/* FIXTURE BTN */
.fixture-btn{
    margin-top:8px;
    width:100%;
    padding:9px;
    border:none;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
    background:linear-gradient(90deg,var(--green),var(--green2));
    color:#03140a;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.modal-box{
    background:#08150f;
    border:1px solid var(--border);
    padding:14px;
    border-radius:12px;
    width:100%;
    max-width:600px;
}

textarea{
    width:100%;
    height:360px;
    background:#06110b;
    color:#dffff0;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    font-size:12px;
}

.copy-btn{
    margin-top:10px;
    width:100%;
    padding:10px;
    background:var(--green);
    border:none;
    border-radius:8px;
    font-weight:800;
}
</style>
</head>

<body>

<div class="container">
    <div class="title">MATCH SCHEDULE & FIXTURE</div>
    <select id="roundSelect"></select>
    <div id="fixture"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <textarea id="output"></textarea>
        <button class="copy-btn" onclick="copyText()">COPY</button>
    </div>
</div>

<script>
const TEAM_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=467352529&single=true&output=csv";
const MEMBER_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let fixtures=[],members={};

async function getCSV(url){
    let r=await fetch(url);
    let t=await r.text();
    return t.trim().split("\n").map(r=>r.split(","));
}

async function load(){
    let m=await getCSV(MEMBER_CSV);
    m.shift();
    m.forEach(r=>members[r[1]]=r[0]);

    let t=await getCSV(TEAM_CSV);
    t.shift();
    let teams=t.map(r=>({
        name:r[0],
        logo:r[1],
        ids:r[3],
        link:r[7]
    }));

    fixtures=doubleRoundRobin(teams);
    initUI();
}

function doubleRoundRobin(teams){
    let n=teams.length;
    let arr=[...teams];
    let rounds=n-1;
    let half=n/2;
    let first=[];

    for(let r=0;r<rounds;r++){
        let matches=[];
        for(let i=0;i<half;i++){
            let t1=arr[i];
            let t2=arr[n-1-i];
            let flip=(r+i)%2===0;
            matches.push({home:flip?t1:t2,away:flip?t2:t1});
        }
        first.push(matches);
        arr.splice(1,0,arr.pop());
    }

    let second=first.map(r=>r.map(m=>({home:m.away,away:m.home})));
    return [...first,...second];
}

function initUI(){
    let select=document.getElementById("roundSelect");
    fixtures.forEach((_,i)=>{
        select.innerHTML+=`<option value="${i}">Round ${i+1}</option>`;
    });
    select.onchange=e=>render(e.target.value);
    render(0);
}

function render(r){
    let box=document.getElementById("fixture");
    box.innerHTML="";
    fixtures[r].forEach(m=>{
        box.innerHTML+=`
        <div class="match-card">

            <div class="match-row">

                <div class="team">
                    <img src="${m.home.logo}">
                    <div>
                        <div class="team-name">${m.home.name}</div>
                        <span class="tag home-tag">HOME</span>
                    </div>
                </div>

                <div class="vs">VS</div>

                <div class="team right">
                    <div style="text-align:right">
                        <div class="team-name">${m.away.name}</div>
                        <span class="tag away-tag">AWAY</span>
                    </div>
                    <img src="${m.away.logo}">
                </div>

            </div>

            <div class="btn-row">
                <a href="${m.home.link}" target="_blank" class="group-btn">Match Group</a>
            </div>

            <button class="fixture-btn" onclick='gen(${JSON.stringify(m.home)},${JSON.stringify(m.away)})'>
                Fixture Generate
            </button>

        </div>`;
    });
}

function players(ids){
    return ids.split(",").map((id,i)=>members[id.trim()]||"undefined");
}

function gen(h,a){
    let hp=players(h.ids), ap=players(a.ids);

    let txt=`Powered by GOAT FC

${h.name} (Home) VS ${a.name} (Away)


First Day: 12:00 AM
1. ${hp[0]} VS ${ap[0]}
2. ${hp[1]} VS ${ap[1]}


Last Day: 12:00 AM
3. ${hp[2]} VS ${ap[2]}
4. ${hp[3]} VS ${ap[3]}


Sub Player List:
${hp[4]} (Home)
${hp[5]} (Home)

${ap[4]} (Away)
${ap[5]} (Away)

Tournament Rules:
https://docs.google.com/document/d/1T7p7AjuFfk-DtVbJgdGFcwsH0ipDfG3wg05qv8Y0fJ4/edit

Visit: www.goatfcbd.com`;

    document.getElementById("output").value=txt;
    document.getElementById("modal").style.display="flex";
}

function copyText(){
    let t=document.getElementById("output");
    t.select();
    document.execCommand("copy");
}

document.getElementById("modal").onclick=e=>{
    if(e.target.id==="modal") e.target.style.display="none";
};

load();
</script>

</body>
</html>
