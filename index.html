<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --cyan: #00f0ff;
  --green: #00ff88;
  --yellow: #ffd700;
  --red: #ff2244;
  --purple: #7c3aed;
  --pink: #ec4899;
  --bg0: #020510;
  --bg1: #040c1a;
  --bg2: #071424;
  --bg3: #0a1c32;
  --glass: rgba(255,255,255,0.03);
  --border: rgba(0,240,255,0.12);
  --text: #e4f0ff;
  --muted: #4a6a8a;
  --gold: #ffd700;
}

*{margin:0;padding:0;box-sizing:border-box;}

html{scroll-behavior:smooth;}

body {
  font-family:'Rajdhani',sans-serif;
  background:var(--bg0);
  color:var(--text);
  overflow-x:hidden;
  min-height:100vh;
}

/* ===== GLOBAL BG FIELD LINES ===== */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0,240,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(124,58,237,0.06) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

/* ===== FIELD GRID OVERLAY ===== */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,240,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,0.025) 1px, transparent 1px);
  background-size:48px 48px;
  animation:gridDrift 30s linear infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes gridDrift {
  0%{background-position:0 0;}
  100%{background-position:48px 48px;}
}

/* ===== NAVBAR ===== */
.navbar {
  position:sticky;
  top:0;
  z-index:999;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  height:58px;
  background:rgba(2,5,16,0.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.navbar::after {
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity:0.4;
}
.logo {
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
}
.logo img {
  height:36px;
  filter:drop-shadow(0 0 10px var(--cyan));
  transition:filter 0.3s;
}
.logo:hover img {filter:drop-shadow(0 0 18px var(--cyan));}
.logo-text {
  font-family:'Orbitron',sans-serif;
  font-size:16px;
  font-weight:900;
  background:linear-gradient(90deg, var(--cyan), var(--green));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:2px;
}
.nav-links {
  display:flex;
  align-items:center;
  gap:4px;
  flex-wrap:wrap;
}
.nav-links a {
  font-family:'Rajdhani',sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:1px;
  padding:6px 12px;
  color:var(--muted);
  text-decoration:none;
  border-radius:6px;
  transition:all 0.2s;
  text-transform:uppercase;
}
.nav-links a:hover {
  color:var(--cyan);
  background:rgba(0,240,255,0.07);
}
.nav-reg {
  background:linear-gradient(135deg, var(--purple), var(--pink)) !important;
  color:white !important;
  padding:6px 14px !important;
  border-radius:20px !important;
  font-weight:700 !important;
  box-shadow:0 0 18px rgba(124,58,237,0.4);
}
.nav-reg:hover {
  box-shadow:0 0 28px rgba(124,58,237,0.7) !important;
  background:rgba(0,0,0,0) !important;
  transform:translateY(-1px);
}

/* ===== HERO ===== */
.hero {
  position:relative;
  height:300px;
  overflow:hidden;
}
.slide-box {
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity 1s ease;
}
.slide-box.active{opacity:1;}
.slide-box img {
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(0.35) saturate(1.2);
}
/* Green field vignette overlay */
.slide-box::after {
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top, var(--bg0) 0%, transparent 40%),
    linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 30%);
}
.slide-content {
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90%;
  z-index:5;
}
.slide-content h1 {
  font-family:'Orbitron',sans-serif;
  font-size:clamp(18px,4vw,32px);
  font-weight:900;
  letter-spacing:3px;
  color:var(--cyan);
  text-shadow:0 0 30px var(--cyan), 0 0 60px rgba(0,240,255,0.3);
  margin-bottom:8px;
  text-transform:uppercase;
}
.slide-content p {
  font-size:14px;
  color:rgba(255,255,255,0.7);
  letter-spacing:1px;
  margin-bottom:14px;
}
.slide-btn {
  display:inline-block;
  padding:10px 28px;
  background:linear-gradient(135deg, var(--purple), var(--cyan));
  border-radius:25px;
  color:white;
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  text-decoration:none;
  text-transform:uppercase;
  box-shadow:0 0 24px rgba(0,240,255,0.4);
  transition:all 0.3s;
}
.slide-btn:hover {box-shadow:0 0 40px rgba(0,240,255,0.7); transform:scale(1.04);}
.arrow {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:10;
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.25);
  border-radius:50%;
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  color:var(--cyan);
  font-size:16px;
  cursor:pointer;
  transition:all 0.2s;
}
.arrow:hover{background:rgba(0,240,255,0.2); box-shadow:0 0 16px rgba(0,240,255,0.4);}
.arrow.left{left:14px;}
.arrow.right{right:14px;}

/* Slide dots */
.slide-dots {
  position:absolute;
  bottom:14px;left:50%;
  transform:translateX(-50%);
  z-index:10;
  display:flex;gap:6px;
}
.dot {
  width:6px;height:6px;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
  border:1px solid rgba(0,240,255,0.3);
  cursor:pointer;
  transition:all 0.3s;
}
.dot.active{background:var(--cyan); box-shadow:0 0 8px var(--cyan); width:18px; border-radius:3px;}

/* ===== SECTION WRAPPER ===== */
.section {
  position:relative;
  z-index:2;
  padding:32px 16px;
  max-width:1100px;
  margin:auto;
}
.section-title {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}
.section-title h2 {
  font-family:'Orbitron',sans-serif;
  font-size:16px;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text);
}
.title-accent {
  flex:1;
  height:1px;
  background:linear-gradient(90deg, var(--cyan), transparent);
  opacity:0.3;
}
.title-icon {
  width:32px;height:32px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,240,255,0.1);
  border:1px solid rgba(0,240,255,0.25);
  color:var(--cyan);
  font-size:14px;
}

/* ===== LIVE SCORE SECTION ===== */
.live-header {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}
.live-pill {
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 12px;
  background:rgba(255,34,68,0.12);
  border:1px solid rgba(255,34,68,0.35);
  border-radius:20px;
  font-family:'Orbitron',sans-serif;
  font-size:9px;
  font-weight:700;
  letter-spacing:2px;
  color:#ff6680;
  text-transform:uppercase;
}
.live-dot {
  width:7px;height:7px;
  background:var(--red);
  border-radius:50%;
  animation:pulseLive 1.2s infinite;
  box-shadow:0 0 8px var(--red);
}
@keyframes pulseLive {
  0%,100%{opacity:1; transform:scale(1);}
  50%{opacity:0.4; transform:scale(1.6);}
}
.live-track {
  display:flex;
  gap:12px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  scroll-behavior:smooth;
  padding-bottom:4px;
}
.live-track::-webkit-scrollbar{display:none;}

/* ===== MATCH CARD ===== */
.live-card {
  min-width:100%;
  scroll-snap-align:start;
  background:linear-gradient(135deg, rgba(0,240,255,0.04) 0%, rgba(124,58,237,0.06) 100%);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;
  padding:18px 16px 14px;
  position:relative;
  overflow:hidden;
}
/* Top accent stripe */
.live-card::before {
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
  animation:cardStripe 4s linear infinite;
  background-size:200% 100%;
}
@keyframes cardStripe {
  0%{background-position:100% 0;}
  100%{background-position:-100% 0;}
}
/* Corner field lines decorative */
.live-card::after {
  content:'';
  position:absolute;
  right:-30px;bottom:-30px;
  width:100px;height:100px;
  border-radius:50%;
  border:1px solid rgba(0,240,255,0.06);
  pointer-events:none;
}

@media(min-width:640px){.live-card{min-width:calc(50% - 6px);}}
@media(min-width:1024px){.live-card{min-width:calc(33.33% - 8px);}}

.match-type-badge {
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 10px;
  background:linear-gradient(90deg, rgba(124,58,237,0.25), rgba(0,240,255,0.15));
  border:1px solid rgba(124,58,237,0.4);
  border-radius:4px;
  font-family:'Orbitron',sans-serif;
  font-size:9px;
  font-weight:700;
  letter-spacing:1.5px;
  color:rgba(180,140,255,0.9);
  text-transform:uppercase;
  margin-bottom:14px;
}
.match-layout {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
}
.match-player {
  display:flex;
  flex-direction:column;
  gap:2px;
}
.match-player.right {text-align:right;}
.player-rank {
  font-family:'Orbitron',sans-serif;
  font-size:9px;
  font-weight:700;
  color:var(--yellow);
  letter-spacing:1px;
  text-shadow:0 0 10px rgba(255,215,0,0.4);
  min-height:13px;
}
.player-name {
  font-family:'Rajdhani',sans-serif;
  font-size:14px;
  font-weight:700;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:110px;
}
.player-id {
  font-size:10px;
  font-weight:600;
  color:var(--pink);
  letter-spacing:0.5px;
}
.score-center {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}
.score-box {
  font-family:'Orbitron',sans-serif;
  font-size:22px;
  font-weight:900;
  letter-spacing:4px;
  display:flex;
  align-items:center;
  gap:6px;
}
.score-sep {color:rgba(255,255,255,0.2); font-size:18px;}
.score-win {color:var(--green); text-shadow:0 0 12px rgba(0,255,136,0.6);}
.score-loss {color:var(--red); text-shadow:0 0 12px rgba(255,34,68,0.5);}
.score-draw {color:var(--yellow); text-shadow:0 0 12px rgba(255,215,0,0.5);}
.match-date {
  font-family:'Exo 2',sans-serif;
  font-size:9px;
  font-weight:600;
  color:var(--cyan);
  letter-spacing:0.5px;
  opacity:0.7;
}

/* ===== CLUB HUB QUICK LINKS ===== */
.hub-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(130px,1fr));
  gap:10px;
}
.hub-card {
  background:linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
  border:1px solid rgba(255,215,0,0.18);
  border-radius:12px;
  padding:16px 10px 14px;
  text-align:center;
  cursor:pointer;
  transition:all 0.25s;
  position:relative;
  overflow:hidden;
}
.hub-card::before {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,215,0,0.06), transparent);
  opacity:0;
  transition:opacity 0.25s;
}
.hub-card:hover {
  transform:translateY(-4px);
  border-color:rgba(255,215,0,0.5);
  box-shadow:0 8px 28px rgba(255,215,0,0.12);
}
.hub-card:hover::before{opacity:1;}
.hub-icon {
  font-size:24px;
  margin-bottom:8px;
  display:block;
}
.hub-title {
  font-family:'Orbitron',sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--text);
  text-transform:uppercase;
}

/* ===== COMING SOON / STORE ===== */
.store-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(170px,1fr));
  gap:14px;
}
.store-card {
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(0,240,255,0.15);
  border-radius:14px;
  overflow:hidden;
  transition:all 0.3s;
  position:relative;
}
.store-card::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:14px;
  padding:1px;
  background:linear-gradient(135deg, var(--cyan), var(--purple));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:0;
  transition:opacity 0.3s;
}
.store-card:hover {
  transform:translateY(-5px);
  box-shadow:0 12px 40px rgba(0,240,255,0.12);
}
.store-card:hover::before{opacity:1;}
.store-card img {
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}
.store-btn {
  display:block;
  margin:10px;
  padding:10px;
  text-align:center;
  background:linear-gradient(135deg, var(--purple), var(--cyan));
  border-radius:8px;
  color:white;
  font-family:'Orbitron',sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  text-decoration:none;
  text-transform:uppercase;
  transition:box-shadow 0.2s;
}
.store-btn:hover{box-shadow:0 0 20px rgba(0,240,255,0.4);}

/* ===== HALL OF CHAMPIONS ===== */
.champ-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:12px;
}
.champ-card {
  background:linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
  border:1px solid rgba(255,215,0,0.2);
  border-radius:14px;
  overflow:hidden;
  transition:all 0.3s;
  cursor:pointer;
}
.champ-card:hover {
  transform:translateY(-5px) scale(1.02);
  border-color:rgba(255,215,0,0.6);
  box-shadow:0 10px 32px rgba(255,215,0,0.15);
}
.champ-img-wrap {
  position:relative;
  overflow:hidden;
}
.champ-img-wrap img {
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  transition:transform 0.4s;
}
.champ-card:hover .champ-img-wrap img{transform:scale(1.08);}
.champ-overlay {
  position:absolute;
  bottom:0;left:0;right:0;
  height:50%;
  background:linear-gradient(to top, rgba(2,5,16,0.9), transparent);
}
.champ-crown {
  position:absolute;
  top:8px;right:8px;
  background:rgba(255,215,0,0.15);
  border:1px solid rgba(255,215,0,0.4);
  border-radius:6px;
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
}
.champ-info {
  padding:10px 10px 12px;
}
.champ-title {
  font-family:'Orbitron',sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:0.5px;
  color:var(--text);
  margin-bottom:3px;
}
.champ-sub {
  font-size:11px;
  color:var(--yellow);
  opacity:0.8;
  font-weight:600;
}
.champ-desc {
  text-align:center;
  font-size:12px;
  color:var(--muted);
  letter-spacing:0.5px;
  margin-top:18px;
  padding:12px;
  border-top:1px solid rgba(255,215,0,0.1);
}

/* ===== SOCIAL ===== */
.social-section {
  position:relative;
  z-index:2;
  text-align:center;
  padding:30px 16px;
  max-width:600px;
  margin:auto;
}
.social-links {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:18px;
}
.social-btn {
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:10px 20px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(0,240,255,0.2);
  border-radius:10px;
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:1px;
  text-decoration:none;
  text-transform:uppercase;
  transition:all 0.25s;
}
.social-btn:hover {
  border-color:var(--cyan);
  color:var(--cyan);
  background:rgba(0,240,255,0.06);
  box-shadow:0 0 18px rgba(0,240,255,0.2);
  transform:translateY(-2px);
}

/* ===== DIVIDER ===== */
.field-divider {
  position:relative;
  z-index:2;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(0,240,255,0.15), transparent);
  margin:0 16px;
}

/* ===== FOOTER ===== */
.footer {
  position:relative;
  z-index:2;
  text-align:center;
  padding:20px 16px 28px;
  font-size:12px;
  font-family:'Exo 2',sans-serif;
  color:var(--muted);
  letter-spacing:1px;
  border-top:1px solid rgba(0,240,255,0.06);
}
.footer a {
  color:var(--cyan);
  text-decoration:none;
}
.footer a:hover{text-shadow:0 0 10px var(--cyan);}
.footer-logo {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:10px;
}
.footer-logo img{height:22px; opacity:0.5; filter:drop-shadow(0 0 5px var(--cyan));}
.footer-logo span {
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:3px;
}

/* ===== PARTICLE FIELD ===== */
#particles {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  overflow:hidden;
}
.particle {
  position:absolute;
  border-radius:50%;
  animation:particleFloat linear infinite;
  opacity:0;
}
@keyframes particleFloat {
  0%{transform:translateY(100vh) scale(0); opacity:0;}
  10%{opacity:1;}
  90%{opacity:0.5;}
  100%{transform:translateY(-100px) scale(1); opacity:0;}
}

/* ===== LOADING SCREEN ===== */
#loader {
  position:fixed;
  inset:0;
  background:var(--bg0);
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  transition:opacity 0.5s;
}
.loader-ball {
  width:50px;height:50px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 35%, rgba(255,255,255,0.3), transparent 55%),
    radial-gradient(circle at 65% 65%, rgba(0,0,0,0.3), transparent 55%),
    conic-gradient(#111 0deg 60deg, var(--cyan) 60deg 120deg, #111 120deg 180deg, var(--cyan) 180deg 240deg, #111 240deg 300deg, var(--cyan) 300deg 360deg);
  animation:ballSpin 1.5s linear infinite;
  box-shadow:0 0 30px rgba(0,240,255,0.4);
}
@keyframes ballSpin{to{transform:rotate(360deg);}}
.loader-text {
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  letter-spacing:4px;
  color:var(--cyan);
  animation:blinkTxt 1s ease-in-out infinite;
}
@keyframes blinkTxt{0%,100%{opacity:0.3;}50%{opacity:1;}}

/* ===== MOBILE ===== */
@media(max-width:640px){

<script>
/* ─── PARTICLES ─────────────────────────────────────── */
(function(){
  const wrap = document.getElementById('particles');
  const colors = ['rgba(0,240,255,0.5)','rgba(0,255,136,0.5)','rgba(124,58,237,0.4)','rgba(255,215,0,0.4)'];
  for(let i=0;i<22;i++){
    const p = document.createElement('div');
    p.className='particle';
    const size = Math.random()*3+1;
    p.style.cssText=`
      width:${size}px;height:${size}px;
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${Math.random()*15+10}s;
      animation-delay:${Math.random()*10}s;
    `;
    wrap.appendChild(p);
  }
})();

/* ─── SHARED VARS ─────────────────────────────────────── */
const SHEET_ID = "1ZoXNHa5sYiP_HaPRyL5RDML7l3kC2IaGuQCAmYkERf8";
const MATCH_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";
const MEMBER_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";
const LEADER_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1033046915&single=true&output=csv";

/* ─── CSV PARSER ─────────────────────────────────────── */
function parseCSV(text){
  const rows=[];
  let row=[],cell='',inside=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c=='"'&&inside&&n=='"'){cell+='"';i++;}
    else if(c=='"'){inside=!inside;}
    else if(c==','&&!inside){row.push(cell);cell='';}
    else if((c=='\n'||c=='\r')&&!inside){
      if(cell||row.length){row.push(cell);rows.push(row);row=[];cell='';}
      if(c=='\r'&&n=='\n')i++;
    }else cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  const headers=rows.shift();
  return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h.trim(),(r[i]||'').trim()])));
}

/* ─── DATE FORMAT ─────────────────────────────────────── */
function formatBDTime(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  if(isNaN(d)) return dateStr;
  return d.toLocaleString('en-BD',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Dhaka'});
}

/* ─── HERO SLIDER ─────────────────────────────────────── */
let slides=[],current=0,autoTimer;

fetch(`https://opensheet.elk.sh/${SHEET_ID}/SLIDES`)
  .then(r=>r.json())
  .then(data=>{
    slides=data;
    renderSlides();
    startAuto();
  });

function renderSlides(){
  const hero = document.getElementById('heroWrap');
  const dotsWrap = document.getElementById('slideDots');
  hero.innerHTML = `
    <button class="arrow left" onclick="changeSlide(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="arrow right" onclick="changeSlide(1)"><i class="fa-solid fa-chevron-right"></i></button>
    <div class="slide-dots" id="slideDots"></div>`;
  slides.forEach((s,i)=>{
    const box = document.createElement('div');
    box.className='slide-box'+(i===0?' active':'');
    box.innerHTML=`
      <img src="${s.image}" alt="">
      <div class="slide-content">
        <h1>${s.title}</h1>
        <p>${s.desc}</p>
        <a class="slide-btn" href="${s.link}" target="_blank">${s.button}</a>
      </div>`;
    hero.insertBefore(box, hero.querySelector('.arrow.left'));
  });
  renderDots();
}

function renderDots(){
  const d = document.getElementById('slideDots');
  if(!d) return;
  d.innerHTML = slides.map((_,i)=>`<div class="dot ${i===current?'active':''}" onclick="goToSlide(${i})"></div>`).join('');
}

function goToSlide(n){
  const boxes = document.querySelectorAll('.slide-box');
  if(!boxes.length) return;
  boxes[current].classList.remove('active');
  current = (n+boxes.length)%boxes.length;
  boxes[current].classList.add('active');
  renderDots();
}

function changeSlide(dir){goToSlide(current+dir);}

function startAuto(){
  clearInterval(autoTimer);
  autoTimer = setInterval(()=>changeSlide(1), 6000);
}

/* ─── LIVE SCORE (RANK from CSV leaderboard, same sorting logic) ── */
Promise.all([
  fetch(MATCH_CSV+"&t="+Date.now()).then(r=>r.text()),
  fetch(MEMBER_CSV+"&t="+Date.now()).then(r=>r.text()),
  fetch(LEADER_CSV+"&t="+Date.now()).then(r=>r.text())
]).then(([matchCSV, memberCSV, leaderCSV])=>{

  const members = parseCSV(memberCSV);
  const nameMap = {};
  members.forEach(m=>{
    if(m["Club ID Number"]) nameMap[m["Club ID Number"].trim()] = m["Full Name"];
  });

  /* Build rank from leaderboard CSV — same sorting as player-statistics:
     1) inactive last  2) pts DESC  3) win% DESC  4) GD DESC  */
  const leaderRows = parseCSV(leaderCSV);
  // filter only members, then sort
  const validLeader = leaderRows.filter(r=>nameMap[r["Club_ID"]?.trim()]);
  validLeader.sort((a,b)=>{
    const am=+(a["Overall_PL"]||0), bm=+(b["Overall_PL"]||0);
    if(am===0&&bm>0) return 1;
    if(bm===0&&am>0) return -1;
    const ap=+(a["Overall_Point"]||0), bp=+(b["Overall_Point"]||0);
    if(bp!==ap) return bp-ap;
    const aw=+(a["Overall_Win%"]||0), bw=+(b["Overall_Win%"]||0);
    if(bw!==aw) return bw-aw;
    const agd=+(a["Total GD"]||0), bgd=+(b["Total GD"]||0);
    return bgd-agd;
  });
  const rankMap={};
  validLeader.forEach((r,i)=>{ rankMap[r["Club_ID"]?.trim()] = i+1; });

  const matches = parseCSV(matchCSV)
    .filter(m=>
      m.Approved?.toLowerCase()==='yes' &&
      !isNaN(parseFloat(m.P1_Score)) &&
      !isNaN(parseFloat(m.P2_Score))
    )
    .slice(-12).reverse();

  document.getElementById('liveTrack').innerHTML = matches.map(m=>{
    const p1name = nameMap[m.P1_ID]||m.P1_ID;
    const p2name = nameMap[m.P2_ID]||m.P2_ID;
    const p1rank = rankMap[m.P1_ID] ? `#${rankMap[m.P1_ID]} RANK` : '';
    const p2rank = rankMap[m.P2_ID] ? `#${rankMap[m.P2_ID]} RANK` : '';
    const s1=+m.P1_Score, s2=+m.P2_Score;
    let c1='score-draw',c2='score-draw';
    if(s1>s2){c1='score-win';c2='score-loss';}
    if(s1<s2){c1='score-loss';c2='score-win';}
    return `
    <div class="live-card">
      <div class="match-type-badge">
        <i class="fa-solid fa-shield-halved" style="font-size:9px;"></i>
        ${m.Match_Type}
      </div>
      <div class="match-layout">
        <div class="match-player">
          <div class="player-rank">${p1rank}</div>
          <div class="player-name">${p1name}</div>
          <div class="player-id">${m.P1_ID}</div>
        </div>
        <div class="score-center">
          <div class="score-box">
            <span class="${c1}">${m.P1_Score}</span>
            <span class="score-sep">:</span>
            <span class="${c2}">${m.P2_Score}</span>
          </div>
          <div class="match-date">${formatBDTime(m.Match_Date)}</div>
        </div>
        <div class="match-player right">
          <div class="player-rank" style="text-align:right;">${p2rank}</div>
          <div class="player-name" style="text-align:right;">${p2name}</div>
          <div class="player-id" style="text-align:right;">${m.P2_ID}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  /* Auto scroll live cards */
  const track = document.getElementById('liveTrack');
  setInterval(()=>{
    const card = track.querySelector('.live-card');
    if(!card) return;
    track.scrollBy({left: card.offsetWidth + 12, behavior:'smooth'});
    if(track.scrollLeft + track.clientWidth >= track.scrollWidth - 20){
      setTimeout(()=>track.scrollTo({left:0,behavior:'smooth'}),600);
    }
  },4000);

  /* Hide loader */
  const loader = document.getElementById('loader');
  loader.style.opacity='0';
  setTimeout(()=>loader.style.display='none',500);
});

/* ─── CLUB HUB LINKS ─────────────────────────────────── */
fetch(`https://opensheet.elk.sh/${SHEET_ID}/LINKS`)
  .then(r=>r.json())
  .then(data=>{
    document.getElementById('hubGrid').innerHTML = data.map(l=>`

        <div class="hub-title">${l.title}</div>

/* ─── CHAMPIONS ──────────────────────────────────────── */
fetch(`https://opensheet.elk.sh/${SHEET_ID}/CHAMPIONS`)
  .then(r=>r.json())
  .then(data=>{
    document.getElementById('champGrid').innerHTML = data.map(c=>`
      <div class="champ-card">
        <div class="champ-img-wrap">
          <img src="${c.image}" alt="${c.title}">
          <div class="champ-overlay"></div>

        <div class="champ-info">

          <div class="champ-sub">${c.subtitle}</div>
        </div>
      </div>`).join('');
  });

/* ─── SOCIAL ─────────────────────────────────────────── */
fetch(`https://opensheet.elk.sh/${SHEET_ID}/SOCIAL`)
  .then(r=>r.json())
  .then(data=>{
    document.getElementById('socialLinks').innerHTML = data.map(s=>`
      <a class="social-btn" href="${s.link}" target="_blank">
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:11px;"></i>
        ${s.name}
      </a>`).join('');
  });

/* ─── GOAT STORE ─────────────────────────────────────── */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vS3VQ-e6O8uHjlq8Lsdp5j0vxxOMZH1O17Nbo1ISGXDU_EFsuBEXNWydPbuhJ46lnxqJmevXaN2xPiL/pub?gid=1152972554&single=true&output=csv")
  .then(r=>r.text())
  .then(csv=>{
    const items = parseCSV(csv);
    document.getElementById('storeContainer').innerHTML = items.map(item=>`
      <div class="store-card">
        <img src="${item['Image Url']}" alt="">
        <a class="store-btn" href="${item['Link Url']}" target="_blank">${item['Botton Name']}</a>
      </div>`).join('');
  });
</script>
