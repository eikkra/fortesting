<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC — Ranking System</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
:root{
  --c:#00f5ff;--g:#00ff88;--p:#bf5fff;
  --neon-gold:#ffd700;--neon-pink:#ff006e;
  --bg:#020817;--bg-card:#0a1628;--bg-panel:#0d1f3c;
  --gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;
  --border:rgba(255,255,255,0.07);
  --text-primary:#e8f4f8;--text-dim:#7fa8c0;
  --font-head:'Orbitron',sans-serif;
  --font-body:'Rajdhani',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text-primary);font-family:var(--font-body);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,245,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.025) 1px,transparent 1px);
  background-size:40px 40px;animation:gridPulse 4s ease-in-out infinite;pointer-events:none;z-index:0;}
@keyframes gridPulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ORBS */
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.1;pointer-events:none;z-index:0;animation:orbFloat 8s ease-in-out infinite;}
.orb1{width:400px;height:400px;background:var(--c);top:-100px;left:-100px;}
.orb2{width:300px;height:300px;background:var(--p);bottom:-100px;right:-100px;animation-delay:3s;}
.orb3{width:250px;height:250px;background:var(--g);top:50%;left:50%;animation-delay:6s;}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.1)}}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:9999;height:46px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(2,8,23,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,245,255,.15);text-decoration:none;}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--c),var(--g),var(--p),transparent);animation:scanbar 3s linear infinite;}
@keyframes scanbar{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
.topbar-left{display:flex;align-items:center;gap:9px}
.topbar-logo{width:26px;filter:drop-shadow(0 0 6px var(--c))}
.topbar-title{font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,var(--c),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.live-dot-wrap{display:flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid rgba(255,0,110,.4);border-radius:20px;background:rgba(255,0,110,.08);}
.live-dot{width:6px;height:6px;background:var(--neon-pink);border-radius:50%;animation:blink 1s ease-in-out infinite;}
.live-txt{font-size:9px;letter-spacing:2px;color:var(--neon-pink);font-family:var(--font-head);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* MAIN */
.main{position:relative;z-index:1;}
.wrapper{max-width:960px;margin:0 auto;padding:0 12px 40px;}

/* TITLE */
.title-block{padding:16px 0 4px;text-align:center;}
.title-block h1{font-family:var(--font-head);font-size:clamp(15px,3.5vw,22px);font-weight:900;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(90deg,var(--c),var(--g),var(--p),var(--c));background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:titleShift 4s linear infinite;}
@keyframes titleShift{0%{background-position:0%}100%{background-position:300%}}
.subtitle-small{font-size:9px;letter-spacing:2px;opacity:.4;margin-top:3px;font-family:var(--font-body);}

/* MAIN TABS */
.main-tabs{display:flex;gap:6px;justify-content:center;margin:12px 0 6px;flex-wrap:wrap;padding:0 8px;}
.main-tab{padding:8px 18px;border:1px solid rgba(255,255,255,.1);border-radius:4px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-family:var(--font-head);font-size:10px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
.main-tab:hover{color:#fff;border-color:var(--c);box-shadow:0 0 10px rgba(0,245,255,.2)}
.main-tab.active{background:linear-gradient(90deg,rgba(0,245,255,.2),rgba(0,255,136,.15));border-color:var(--c);color:var(--c);box-shadow:0 0 16px rgba(0,245,255,.25);}

/* PERIOD TABS (inside ranking tab) */
.period-tabs{display:flex;gap:5px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap;}
.period-btn{padding:6px 16px;border:1px solid rgba(0,245,255,.2);border-radius:3px;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.period-btn:hover{color:var(--c);border-color:var(--c);}
.period-btn.active{border-color:var(--c);color:var(--c);background:rgba(0,245,255,.1);box-shadow:0 0 12px rgba(0,245,255,.25);}

/* TEAM FILTER */
.team-filter{display:flex;gap:5px;justify-content:center;margin:0 0 10px;}
.team-btn{padding:5px 14px;border:1px solid rgba(0,255,136,.2);border-radius:3px;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.team-btn:hover{color:var(--g);border-color:var(--g);}
.team-btn.active{border-color:var(--g);color:var(--g);background:rgba(0,255,136,.1);}

/* WEEK SELECT */
.week-bar{display:none;justify-content:center;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap;}
.week-bar.visible{display:flex;}
.week-lbl{font-family:var(--font-head);font-size:9px;color:var(--text-dim);letter-spacing:1px;}
.week-sel{background:var(--bg-panel);border:1px solid rgba(0,245,255,.3);color:var(--c);font-family:var(--font-head);font-size:10px;padding:5px 10px;border-radius:4px;cursor:pointer;outline:none;}

/* TABLE CARD */
.card{background:rgba(11,17,32,.85);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative;}
.card::before{content:'';position:absolute;inset:0;border-radius:8px;background:linear-gradient(135deg,rgba(0,245,255,.04),transparent 60%);pointer-events:none;z-index:0;}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--c),var(--g),var(--p),var(--c));background-size:300%;animation:titleShift 3s linear infinite;border-radius:8px 8px 0 0;}
.tbl-wrap{overflow-x:auto;position:relative;z-index:1;}
table{width:100%;border-collapse:collapse;}
thead{background:rgba(0,0,0,.4)}
th{font-family:var(--font-head);font-size:8px;letter-spacing:1px;color:var(--c);padding:9px 5px;border-bottom:1px solid rgba(0,245,255,.15);white-space:nowrap;text-align:center;}
th:nth-child(2){text-align:left;padding-left:8px;}
td{padding:7px 5px;font-size:12px;font-weight:500;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle;}
td:nth-child(2){text-align:left;padding-left:8px;}

/* ROW STYLES */
.rank-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:3px;font-family:var(--font-head);font-size:9px;font-weight:700;background:rgba(255,255,255,.07);clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);}
.player-cell{display:flex;flex-direction:column;gap:1px;cursor:pointer;}
.player-cell:hover .p-name{color:var(--c);text-shadow:0 0 8px rgba(0,245,255,.5);}
.p-name{font-weight:600;font-size:11px;line-height:1.2;transition:color .2s;display:flex;align-items:center;gap:4px;}
.p-name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;}
.p-id-lbl{font-size:8px;letter-spacing:.5px;font-family:var(--font-head);}
tbody tr{background:rgba(255,255,255,.025);transition:background .15s;}
tbody tr:hover{background:rgba(0,245,255,.05)}
.rank1{background:linear-gradient(90deg,rgba(255,215,0,.14),rgba(255,215,0,.03),transparent)!important;border-left:3px solid var(--gold)!important;animation:goldPulse 2.5s ease-in-out infinite;}
@keyframes goldPulse{0%,100%{box-shadow:inset 2px 0 12px rgba(255,215,0,.1)}50%{box-shadow:inset 2px 0 22px rgba(255,215,0,.25)}}
.rank1 td{color:#ffe97a;}.rank1 .rank-num{background:rgba(255,215,0,.25);color:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.5);}
.rank2{background:linear-gradient(90deg,rgba(192,192,192,.12),rgba(192,192,192,.02),transparent)!important;border-left:3px solid var(--silver)!important;}
.rank2 td{color:#e0e0e0;}.rank2 .rank-num{background:rgba(192,192,192,.2);color:var(--silver);}
.rank3{background:linear-gradient(90deg,rgba(205,127,50,.13),rgba(205,127,50,.02),transparent)!important;border-left:3px solid var(--bronze)!important;}
.rank3 td{color:#e8a87c;}.rank3 .rank-num{background:rgba(205,127,50,.22);color:var(--bronze);}
.top10{border-left:3px solid rgba(0,245,255,.25)!important;}
.top10 td{color:#a0f0ff;}.top10 .rank-num{color:var(--c);background:rgba(0,245,255,.1);}
.rank1 .p-id-lbl{color:rgba(255,233,122,.5)!important;}
.rank2 .p-id-lbl{color:rgba(210,210,210,.5)!important;}
.rank3 .p-id-lbl{color:rgba(220,160,100,.5)!important;}
.top10 .p-id-lbl{color:rgba(140,230,255,.5)!important;}
tbody tr:not(.rank1):not(.rank2):not(.rank3):not(.top10) .p-id-lbl{color:rgba(180,200,220,.4)!important;}

/* REF / ICON BADGE */
.ref-badge{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:rgba(0,245,255,.15);border:1px solid rgba(0,245,255,.4);font-size:9px;cursor:help;flex-shrink:0;vertical-align:middle;}
.pts-cell{font-family:var(--font-head);font-weight:900;font-size:13px;color:var(--c);}
.motm-cell{color:var(--neon-gold);font-weight:700;}

/* LOADING */
.loading-cell{padding:40px;font-family:var(--font-head);font-size:11px;letter-spacing:3px;color:var(--c);opacity:.7;animation:pulse 1s ease-in-out infinite alternate;text-align:center;}
@keyframes pulse{from{opacity:.3}to{opacity:.8}}
.no-data-cell{padding:30px;font-family:var(--font-head);font-size:10px;letter-spacing:3px;color:var(--text-dim);text-align:center;}

/* ═══ POTW TAB ═══ */
.potw-section{padding:6px 0;}
.potw-sub-tabs{display:flex;gap:5px;justify-content:center;margin:0 0 10px;flex-wrap:wrap;}
.potw-sub-btn{padding:5px 14px;border:1px solid rgba(191,95,255,.25);border-radius:3px;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.potw-sub-btn:hover{color:var(--p);border-color:var(--p);}
.potw-sub-btn.active{border-color:var(--p);color:var(--p);background:rgba(191,95,255,.1);}

.potw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px 0;}
@media(max-width:500px){.potw-grid{grid-template-columns:repeat(2,1fr);gap:10px;}}

/* POTW CARD */
.potw-card{position:relative;background:linear-gradient(160deg,#0a1628,#050d1e);border:1px solid rgba(0,255,136,.25);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s;}
.potw-card:hover{transform:translateY(-5px);box-shadow:0 0 25px rgba(0,255,136,.25);}
.potw-card.winner{border-color:var(--p);box-shadow:0 0 20px rgba(191,95,255,.3);animation:potwPulse 2.5s ease-in-out infinite;}
@keyframes potwPulse{0%,100%{box-shadow:0 0 20px rgba(191,95,255,.3)}50%{box-shadow:0 0 40px rgba(191,95,255,.6)}}

.potw-card-top{position:relative;background:rgba(0,0,0,.5);}
.potw-card-week-banner{background:linear-gradient(90deg,rgba(191,95,255,.3),rgba(0,245,255,.2));border-bottom:1px solid rgba(191,95,255,.3);padding:5px 8px;display:flex;align-items:center;justify-content:space-between;}
.potw-week-label{font-family:var(--font-head);font-size:8px;letter-spacing:1.5px;color:var(--p);}
.potw-date-range{font-family:var(--font-body);font-size:8px;color:rgba(255,255,255,.5);}

.potw-img-wrap{width:100%;aspect-ratio:1/1.1;overflow:hidden;position:relative;background:radial-gradient(circle,rgba(191,95,255,.08),#000);}
.potw-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .4s;}
.potw-card:hover .potw-img-wrap img{transform:scale(1.06);}
.potw-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;color:rgba(191,95,255,.3);}

/* gradient fade at bottom of image */
.potw-img-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(transparent,#050d1e);pointer-events:none;}

.potw-winner-crown{position:absolute;top:6px;left:6px;z-index:5;font-size:16px;filter:drop-shadow(0 0 6px rgba(255,215,0,.8));animation:crownBob .8s ease-in-out infinite alternate;}
@keyframes crownBob{from{transform:translateY(0)}to{transform:translateY(-3px)}}

.potw-pts-badge{position:absolute;top:6px;right:6px;z-index:5;background:rgba(191,95,255,.3);border:1px solid rgba(191,95,255,.6);border-radius:12px;padding:2px 8px;font-family:var(--font-head);font-size:9px;color:#fff;}

.potw-card-body{padding:8px 10px 10px;}
.potw-player-name{font-family:var(--font-head);font-size:10px;font-weight:700;letter-spacing:1px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px rgba(191,95,255,.4);}
.potw-team-type{font-size:9px;color:var(--text-dim);letter-spacing:.5px;margin-top:2px;}
.potw-mini-stats{display:flex;gap:4px;margin-top:6px;}
.potw-ms{flex:1;text-align:center;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-radius:4px;padding:4px 2px;}
.potw-ms-val{font-family:var(--font-head);font-size:10px;font-weight:700;color:var(--c);line-height:1;}
.potw-ms-lbl{font-size:7px;letter-spacing:.5px;color:var(--text-dim);margin-top:1px;}

/* POTW title card header */
.potw-header{text-align:center;margin-bottom:12px;padding:8px;}
.potw-title-big{font-family:var(--font-head);font-size:clamp(11px,2.5vw,16px);font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--p),var(--c),var(--p));background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:titleShift 3s linear infinite;text-transform:uppercase;}
.potw-subtitle{font-size:9px;letter-spacing:2px;color:var(--text-dim);margin-top:3px;}

/* PAGINATION */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap;}
.page-btn{padding:5px 12px;border:1px solid rgba(0,245,255,.2);border-radius:3px;background:transparent;color:var(--text-dim);font-family:var(--font-head);font-size:9px;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.page-btn:hover{color:var(--c);border-color:var(--c);}
.page-btn.active{border-color:var(--c);color:var(--c);background:rgba(0,245,255,.1);}
.page-btn:disabled{opacity:.3;cursor:not-allowed;}

/* ═══ PLAYER MODAL ═══ */
.modal-overlay{position:fixed;inset:0;z-index:99999;background:rgba(2,8,23,.88);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;padding:16px;}
.modal-overlay.show{opacity:1;pointer-events:all;}

.player-modal{
  position:relative;width:100%;max-width:400px;
  background:linear-gradient(160deg,#0a1628,#050d1e);
  border:1px solid rgba(0,245,255,.3);
  border-radius:12px;overflow:hidden;
  box-shadow:0 0 60px rgba(0,245,255,.15);
  transform:scale(.9) translateY(20px);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  animation:rgbBorderModal 4s linear infinite;
}
@keyframes rgbBorderModal{
  0%{box-shadow:0 0 0 1px rgba(0,245,255,.4),0 0 40px rgba(0,245,255,.1);}
  33%{box-shadow:0 0 0 1px rgba(0,255,136,.4),0 0 40px rgba(0,255,136,.1);}
  66%{box-shadow:0 0 0 1px rgba(191,95,255,.4),0 0 40px rgba(191,95,255,.1);}
  100%{box-shadow:0 0 0 1px rgba(0,245,255,.4),0 0 40px rgba(0,245,255,.1);}
}
.modal-overlay.show .player-modal{transform:scale(1) translateY(0);}

.modal-close{position:absolute;top:10px;right:10px;z-index:20;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.modal-close:hover{background:rgba(255,50,50,.25);color:#fff;border-color:rgba(255,50,50,.5);}

/* Photo section */
.modal-photo-wrap{position:relative;width:100%;height:200px;overflow:hidden;background:linear-gradient(135deg,#0a1628,#111e35);}
.modal-photo{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block;}
.modal-photo-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px;color:rgba(0,245,255,.2);}
.modal-photo-fade{position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(transparent,#050d1e);pointer-events:none;}
.modal-rank-overlay{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-family:var(--font-head);font-size:10px;letter-spacing:2px;padding:4px 16px;border-radius:20px;white-space:nowrap;}
.modal-rank-overlay.r1{background:rgba(255,215,0,.25);color:var(--gold);border:1px solid rgba(255,215,0,.5);}
.modal-rank-overlay.r2{background:rgba(192,192,192,.2);color:var(--silver);border:1px solid rgba(192,192,192,.4);}
.modal-rank-overlay.r3{background:rgba(205,127,50,.22);color:var(--bronze);border:1px solid rgba(205,127,50,.4);}
.modal-rank-overlay.rx{background:rgba(0,245,255,.12);color:var(--c);border:1px solid rgba(0,245,255,.35);}

/* Modal body */
.modal-body{padding:12px 16px 16px;}
.modal-player-name{font-family:var(--font-head);font-size:16px;font-weight:900;letter-spacing:2px;color:#fff;text-transform:uppercase;}
.modal-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;}
.modal-team-chip{background:rgba(0,245,255,.1);border:1px solid rgba(0,245,255,.3);border-radius:4px;padding:2px 8px;font-size:10px;letter-spacing:1.5px;color:var(--c);}
.modal-id{font-size:10px;color:var(--text-dim);letter-spacing:1px;font-family:var(--font-head);}
.modal-pts-big{font-family:var(--font-head);font-size:26px;font-weight:900;color:var(--neon-gold);text-shadow:0 0 20px rgba(255,215,0,.4);margin-top:8px;line-height:1;}
.modal-pts-lbl{font-size:9px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;}
.modal-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,245,255,.3),transparent);margin:10px 0;}
.modal-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.mstat{background:rgba(0,0,0,.3);border:1px solid rgba(0,245,255,.1);border-radius:6px;padding:8px 6px;text-align:center;}
.mstat-val{font-family:var(--font-head);font-size:15px;font-weight:900;color:var(--c);line-height:1;}
.mstat-lbl{font-size:8px;letter-spacing:1px;color:var(--text-dim);margin-top:3px;text-transform:uppercase;}
.modal-ref-box{margin-top:10px;padding:10px 12px;background:rgba(0,245,255,.05);border:1px solid rgba(0,245,255,.2);border-radius:6px;}
.modal-ref-title{font-family:var(--font-head);font-size:9px;letter-spacing:2px;color:var(--c);margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.modal-ref-breakdown{font-size:12px;color:var(--text-dim);}
.modal-ref-breakdown span{color:var(--c);}

/* FOOTER */
footer{position:relative;z-index:1;text-align:center;padding:14px 0 16px;border-top:1px solid rgba(0,245,255,.08);background:rgba(2,8,23,.6);}
.footer-text{font-family:var(--font-head);font-size:9px;letter-spacing:2.5px;background:linear-gradient(90deg,var(--c),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:.55;}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}

<script>
// ═══════════════════════════════════
// CONFIG
// ═══════════════════════════════════
const CSV = {
  playerSummary: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBY2ORgmyKXCM-OFDvL3B63y0fe_1CgS3NvrG7VHQ5TcSrkEn1pV8VvCdXCLDmbWFI_xx4fJ9pxVeu/pub?gid=2117536811&single=true&output=csv',
  rawMatches:    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBY2ORgmyKXCM-OFDvL3B63y0fe_1CgS3NvrG7VHQ5TcSrkEn1pV8VvCdXCLDmbWFI_xx4fJ9pxVeu/pub?gid=1272733514&single=true&output=csv',
  referee:       'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBY2ORgmyKXCM-OFDvL3B63y0fe_1CgS3NvrG7VHQ5TcSrkEn1pV8VvCdXCLDmbWFI_xx4fJ9pxVeu/pub?gid=895725044&single=true&output=csv',
  members:       'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv'
};
const PROXY = 'https://corsproxy.io/?';
const POTW_PER_PAGE = 10;

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
const S = {
  tab: 'ranking',
  period: 'weekly',
  team: 'all',
  potwTeam: 'all',
  potwPage: 0,
  weekKey: null,
  monthKey: null,
  players: [], matches: [], refs: [], members: [],
  weeks: [], months: [],
  weeklyHistory: [], // [{weekKey, dateRange, topAll, topMain, topAcademy}]
  loaded: false
};

// ═══════════════════════════════════
// CSV
// ═══════════════════════════════════
function parseCSVLine(line) {
  const r=[]; let c='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){q=!q;}
    else if(ch===','&&!q){r.push(c);c='';}
    else{c+=ch;}
  }
  r.push(c); return r;
}
function parseCSV(text) {
  const lines=text.trim().split('\n');
  if(lines.length<2) return [];
  const hdrs=parseCSVLine(lines[0]);
  return lines.slice(1).map(l=>{
    const vals=parseCSVLine(l);
    const o={};
    hdrs.forEach((h,i)=>{o[h.trim()]=(vals[i]||'').trim();});
    return o;
  }).filter(r=>Object.values(r).some(v=>v));
}
async function fetchCSV(url) {
  try {
    const r=await fetch(PROXY+encodeURIComponent(url));
    if(!r.ok) throw new Error();
    return parseCSV(await r.text());
  } catch {
    try { return parseCSV(await (await fetch(url)).text()); }
    catch { return []; }
  }
}

// ═══════════════════════════════════
// DATE HELPERS
// ═══════════════════════════════════
function getWeekKey(date) {
  // Returns Mon–Sun week key: YYYY-WNN (ISO week)
  const d=new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-(d.getDay()+6)%7);
  const w1=new Date(d.getFullYear(),0,4);
  const wn=1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7);
  return `${d.getFullYear()}-W${String(wn).padStart(2,'0')}`;
}
function getMonthKey(date) {
  const d=new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function getWeekDateRange(weekKey) {
  // ISO week to Mon-Sun dates
  const [yr,wn]=weekKey.split('-W').map(Number);
  const simple=new Date(yr,0,1+((wn-1)*7));
  const dow=simple.getDay(); // 0=Sun
  const mon=new Date(simple);
  mon.setDate(simple.getDate()-(dow===0?6:dow-1));
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const fmt=d=>`${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
  return `${fmt(mon)} – ${fmt(sun)}`;
}
function friendlyMonth(key) {
  if(!key) return '';
  const [y,m]=key.split('-');
  const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${mn[parseInt(m)-1]} ${y}`;
}

// ═══════════════════════════════════
// DATA LOAD
// ═══════════════════════════════════
async function loadData() {
  const [players,matches,refs,members]=await Promise.all([
    fetchCSV(CSV.playerSummary),fetchCSV(CSV.rawMatches),
    fetchCSV(CSV.referee),fetchCSV(CSV.members)
  ]);
  S.players=players; S.matches=matches; S.refs=refs; S.members=members;

  const wSet=new Set(), mSet=new Set();
  matches.forEach(m=>{
    const ts=m['Timestamp']||''; if(!ts) return;
    const d=new Date(ts); if(isNaN(d)) return;
    wSet.add(getWeekKey(d)); mSet.add(getMonthKey(d));
  });
  S.weeks=[...wSet].sort().reverse();
  S.months=[...mSet].sort().reverse();
  S.weekKey=S.weeks[0]||null;
  S.monthKey=S.months[0]||null;

  buildWeeklyHistory();
  S.loaded=true;
}

// ═══════════════════════════════════
// MEMBER / REF HELPERS
// ═══════════════════════════════════
function getMemberPic(clubId) {
  const m=S.members.find(m=>String(m['Club ID Number']).trim()===String(clubId).trim());
  return m?(m['Profile Picture (For Web)']||m['Profile Picture']||''):'';
}
function getRefData(name,clubId) {
  const r=S.refs.find(r=>
    (r['Player']&&r['Player'].trim().toLowerCase()===(name||'').trim().toLowerCase())||
    (r['Club ID']&&String(r['Club ID']).trim()===String(clubId).trim())
  );
  if(!r) return {pts:0,isRef:false};
  const pts=parseFloat(r['Points Earned']||r['Points']||0)||0;
  return {pts,isRef:pts>0};
}

// ═══════════════════════════════════
// ENRICH PLAYERS
// ═══════════════════════════════════
function buildEnrichedPlayers(filterFn) {
  return S.players
    .filter(p=>p['Player'])
    .filter(filterFn||_=>true)
    .map(p=>{
      const name=(p['Player']||'').trim();
      const clubId=(p['Club ID']||'').trim();
      const {pts:refPts,isRef}=getRefData(name,clubId);
      const basePts=parseFloat(p['Points']||0)||0;
      return {
        name,clubId,teamType:(p['Team Type']||'').trim(),
        matches:+p['Matches']||0,wins:+p['Wins']||0,draws:+p['Draws']||0,losses:+p['Losses']||0,
        gf:+p['Goals For']||0,ga:+p['Goals Against']||0,gd:+p['Goal Diff']||0,
        motm:+p['MOTM']||0,yellow:+(p['Yellow']||p['Yellow Card']||0)||0,red:+(p['Red']||p['Red Card']||0)||0,
        basePts,refPts,totalPts:basePts+refPts,
        pic:getMemberPic(clubId),isRef
      };
    })
    .sort((a,b)=>b.totalPts-a.totalPts)
    .map((p,i)=>({...p,rank:i+1}));
}

// ═══════════════════════════════════
// PERIOD FILTERS
// ═══════════════════════════════════
function matchesInWeek(wk) {
  return S.matches.filter(m=>{
    const ts=m['Timestamp']||''; if(!ts) return false;
    const d=new Date(ts); return !isNaN(d)&&getWeekKey(d)===wk;
  });
}
function matchesInMonth(mk) {
  return S.matches.filter(m=>{
    const ts=m['Timestamp']||''; if(!ts) return false;
    const d=new Date(ts); return !isNaN(d)&&getMonthKey(d)===mk;
  });
}
function computeFromMatches(filteredMatches) {
  const pm={};
  filteredMatches.forEach(m=>{
    const player=(m['GOAT FC Player']||'').trim();
    if(!player) return;
    if(!pm[player]) pm[player]={name:player,matches:0,wins:0,draws:0,losses:0,gf:0,ga:0,gd:0,motm:0,yellow:0,red:0,basePts:0};
    const r=pm[player];
    r.matches++;
    const res=(m['Result']||'').trim().toLowerCase();
    const gs=+m['GOAT Score']||0,os=+m['Opp Score']||0;
    r.gf+=gs;r.ga+=os;r.gd+=(gs-os);
    if(res==='win'||res==='w'){r.wins++;r.basePts+=3;}
    else if(res==='draw'||res==='d'){r.draws++;r.basePts+=1;}
    else r.losses++;
    const motm=(m['MOTM']||'').trim();
    if(motm&&motm.toLowerCase()===player.toLowerCase()) r.motm++;
    r.yellow+=+m['Yellow Card']||0;
    r.red+=+m['Red Card']||0;
  });
  return Object.values(pm).map(p=>{
    const sp=S.players.find(x=>x['Player']&&x['Player'].trim().toLowerCase()===p.name.toLowerCase());
    const clubId=sp?(sp['Club ID']||'').trim():'';
    const teamType=sp?(sp['Team Type']||'').trim():'';
    const {pts:refPts,isRef}=getRefData(p.name,clubId);
    return {...p,clubId,teamType,refPts,totalPts:p.basePts+refPts,pic:getMemberPic(clubId),isRef};
  }).sort((a,b)=>b.totalPts-a.totalPts).map((p,i)=>({...p,rank:i+1}));
}

// ═══════════════════════════════════
// WEEKLY HISTORY (POTW)
// ═══════════════════════════════════
function buildWeeklyHistory() {
  S.weeklyHistory=[];
  S.weeks.forEach(wk=>{
    const ms=matchesInWeek(wk);
    if(!ms.length) return;
    const all=computeFromMatches(ms);
    const main=all.filter(p=>p.teamType==='Main');
    const acad=all.filter(p=>p.teamType==='Academy');
    S.weeklyHistory.push({
      weekKey:wk,
      dateRange:getWeekDateRange(wk),
      topAll:all[0]||null,
      topMain:main[0]||null,
      topAcademy:acad[0]||null,
      allPlayers:all
    });
  });
}

// ═══════════════════════════════════
// GET CURRENT RANKED LIST
// ═══════════════════════════════════
function getRankedList() {
  let list;
  if(S.period==='overall') {
    list=buildEnrichedPlayers(p=>(p['Team Type']||'').trim());
  } else if(S.period==='weekly') {
    list=computeFromMatches(matchesInWeek(S.weekKey));
  } else {
    list=computeFromMatches(matchesInMonth(S.monthKey));
  }
  if(S.team!=='all') list=list.filter(p=>p.teamType===S.team).map((p,i)=>({...p,rank:i+1}));
  return list;
}

// ═══════════════════════════════════
// RENDER RANKING TABLE
// ═══════════════════════════════════
function renderRanking() {
  const tb=document.getElementById('rankTable');
  if(!S.loaded){tb.innerHTML='<tr><td colspan="9" class="loading-cell">LOADING DATA...</td></tr>';return;}
  const list=getRankedList();
  if(!list.length){tb.innerHTML='<tr><td colspan="9" class="no-data-cell">⚽ NO DATA FOUND</td></tr>';return;}
  tb.innerHTML=list.map(p=>{
    const cls=p.rank===1?'rank1':p.rank===2?'rank2':p.rank===3?'rank3':p.rank<=10?'top10':'';
    const gdColor=p.gd>0?'#00ff88':p.gd<0?'#ff4444':'rgba(255,255,255,.5)';
    const pSafe=escObj(p);
    let refIcon='';
    if(p.isRef) refIcon=`<span class="ref-badge" title="Referee Contribution: +${p.refPts} pts"><i class="fa-solid fa-whistle" style="font-size:7px;color:var(--c)"></i></span>`;
    return `<tr class="${cls}">
      <td><span class="rank-num">${p.rank}</span></td>
      <td>
        <div class="player-cell" onclick='showPlayerModal(${pSafe})'>
          <div class="p-name">
            <span class="p-name-text">${p.name}</span>
            ${refIcon}
          </div>
          <span class="p-id-lbl">${p.clubId||p.teamType}</span>
        </div>
      </td>
      <td>${p.matches}</td>
      <td style="color:#00ff88">${p.wins}</td>
      <td style="color:rgba(255,255,255,.5)">${p.draws}</td>
      <td style="color:#ff4444">${p.losses}</td>
      <td style="color:${gdColor}">${p.gd>0?'+':''}${p.gd}</td>
      <td class="motm-cell">${p.motm}</td>
      <td class="pts-cell">${p.totalPts}</td>
    </tr>`;
  }).join('');
}

// ═══════════════════════════════════
// RENDER POTW
// ═══════════════════════════════════
function renderPOTW() {
  const grid=document.getElementById('potwGrid');
  const pg=document.getElementById('potwPagination');
  if(!S.loaded){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;font-family:var(--font-head);font-size:10px;letter-spacing:3px;color:var(--c);opacity:.6;">LOADING...</div>';return;}

  // Get relevant top player per week based on team filter
  let histItems=S.weeklyHistory.map(h=>{
    let p=null;
    if(S.potwTeam==='all') p=h.topAll;
    else if(S.potwTeam==='Main') p=h.topMain;
    else p=h.topAcademy;
    return {weekKey:h.weekKey,dateRange:h.dateRange,player:p};
  }).filter(x=>x.player);

  if(!histItems.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;font-family:var(--font-head);font-size:10px;letter-spacing:3px;color:var(--text-dim);">NO DATA FOUND</div>';
    pg.innerHTML=''; return;
  }

  const totalPages=Math.ceil(histItems.length/POTW_PER_PAGE);
  const start=S.potwPage*POTW_PER_PAGE;
  const pageItems=histItems.slice(start,start+POTW_PER_PAGE);

  grid.innerHTML=pageItems.map((item,idx)=>{
    const p=item.player;
    const isFirst=(start+idx===0);
    const pSafe=escObj(p);
    const wLabel=item.weekKey.replace('W','WEEK ');
    const imgHtml=p.pic&&p.pic.startsWith('http')
      ?`<img src="${p.pic}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
      :'';
    return `
    <div class="potw-card${isFirst?' winner':''}" onclick='showPlayerModal(${pSafe})'>
      <div class="potw-card-top">
        <div class="potw-card-week-banner">
          <span class="potw-week-label">${wLabel}</span>
          <span class="potw-date-range">${item.dateRange}</span>
        </div>
        <div class="potw-img-wrap">
          ${imgHtml}
          <div class="potw-img-ph" style="display:${(p.pic&&p.pic.startsWith('http'))?'none':'flex'}"><i class="fa-solid fa-user"></i></div>
        </div>
        ${isFirst?'<div class="potw-winner-crown">👑</div>':''}
        <div class="potw-pts-badge">${p.totalPts} PTS</div>
      </div>
      <div class="potw-card-body">
        <div class="potw-player-name">${p.name}</div>
        <div class="potw-team-type">${p.teamType||'GOAT FC'}</div>
        <div class="potw-mini-stats">
          <div class="potw-ms"><div class="potw-ms-val">${p.wins}</div><div class="potw-ms-lbl">WIN</div></div>
          <div class="potw-ms"><div class="potw-ms-val">${p.draws}</div><div class="potw-ms-lbl">DRW</div></div>
          <div class="potw-ms"><div class="potw-ms-val">${p.losses}</div><div class="potw-ms-lbl">LST</div></div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Pagination
  pg.innerHTML='';
  if(totalPages>1){
    const prev=document.createElement('button');
    prev.className='page-btn'; prev.textContent='◀';
    prev.disabled=S.potwPage===0;
    prev.onclick=()=>{S.potwPage--;renderPOTW();};
    pg.appendChild(prev);
    for(let i=0;i<totalPages;i++){
      const b=document.createElement('button');
      b.className='page-btn'+(i===S.potwPage?' active':'');
      b.textContent=i+1;
      b.onclick=(()=>{const pg2=i;return()=>{S.potwPage=pg2;renderPOTW();}})();
      pg.appendChild(b);
    }
    const next=document.createElement('button');
    next.className='page-btn'; next.textContent='▶';
    next.disabled=S.potwPage===totalPages-1;
    next.onclick=()=>{S.potwPage++;renderPOTW();};
    pg.appendChild(next);
  }
}

// ═══════════════════════════════════
// PLAYER MODAL
// ═══════════════════════════════════
function showPlayerModal(p) {
  const img=document.getElementById('mPhoto'),ph=document.getElementById('mPhotoPh');
  if(p.pic&&p.pic.startsWith('http')){
    img.src=p.pic;img.style.display='block';ph.style.display='none';
    img.onerror=()=>{img.style.display='none';ph.style.display='flex';};
  } else {img.style.display='none';ph.style.display='flex';}

  const badge=document.getElementById('mRankBadge');
  badge.textContent=`RANK #${p.rank}`;
  badge.className='modal-rank-overlay '+(p.rank===1?'r1':p.rank===2?'r2':p.rank===3?'r3':'rx');

  document.getElementById('mName').textContent=p.name;
  document.getElementById('mTeam').textContent=p.teamType||'GOAT FC';
  document.getElementById('mId').textContent='ID: '+(p.clubId||'—');
  document.getElementById('mPts').textContent=p.totalPts;

  const gdColor=p.gd>0?'#00ff88':p.gd<0?'#ff4444':'rgba(255,255,255,.5)';
  document.getElementById('mStats').innerHTML=`
    <div class="mstat"><div class="mstat-val">${p.matches}</div><div class="mstat-lbl">Matches</div></div>
    <div class="mstat"><div class="mstat-val" style="color:#00ff88">${p.wins}</div><div class="mstat-lbl">Wins</div></div>
    <div class="mstat"><div class="mstat-val" style="color:rgba(255,255,255,.5)">${p.draws}</div><div class="mstat-lbl">Draws</div></div>
    <div class="mstat"><div class="mstat-val" style="color:#ff4444">${p.losses}</div><div class="mstat-lbl">Losses</div></div>
    <div class="mstat"><div class="mstat-val">${p.gf}</div><div class="mstat-lbl">Goals For</div></div>
    <div class="mstat"><div class="mstat-val" style="color:${gdColor}">${p.gd>0?'+':''}${p.gd}</div><div class="mstat-lbl">Goal Diff</div></div>
    <div class="mstat"><div class="mstat-val" style="color:var(--neon-gold)">${p.motm}</div><div class="mstat-lbl">MOTM</div></div>
    <div class="mstat"><div class="mstat-val" style="color:#ffd700">${p.yellow}</div><div class="mstat-lbl">Yellow</div></div>
    <div class="mstat"><div class="mstat-val" style="color:#ff4444">${p.red}</div><div class="mstat-lbl">Red Card</div></div>
  `;
  document.getElementById('mRefBox').innerHTML=p.isRef?`
    <div class="modal-ref-box">
      <div class="modal-ref-title"><i class="fa-solid fa-whistle"></i> REFEREE CONTRIBUTION</div>
      <div class="modal-ref-breakdown">Base: <span>${p.basePts}</span> + Ref: <span>${p.refPts}</span> = <span style="color:var(--g)">${p.totalPts} pts</span></div>
    </div>`:'' ;

  document.getElementById('playerModal').classList.add('show');
  document.body.style.overflow='hidden';
}
function closePlayerModalDirect(){
  document.getElementById('playerModal').classList.remove('show');
  document.body.style.overflow='';
}
function closePlayerModal(e){if(e.target===document.getElementById('playerModal'))closePlayerModalDirect();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayerModalDirect();});

// ═══════════════════════════════════
// CONTROLS
// ═══════════════════════════════════
function switchMainTab(tab, btn) {
  S.tab=tab;
  document.querySelectorAll('.main-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('sectionRanking').style.display=tab==='ranking'?'':'none';
  document.getElementById('sectionPOTW').style.display=tab==='potw'?'':'none';
  if(tab==='potw') renderPOTW();
}
function setPeriod(period, btn) {
  S.period=period;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const bar=document.getElementById('weekBar');
  bar.classList.toggle('visible', period!=='overall');
  populatePeriodSelect();
  renderRanking();
}
function setTeam(team, btn) {
  S.team=team;
  document.querySelectorAll('.team-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderRanking();
}
function setPotwTeam(team, btn) {
  S.potwTeam=team; S.potwPage=0;
  document.querySelectorAll('.potw-sub-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderPOTW();
}
function populatePeriodSelect() {
  const sel=document.getElementById('wbSelect');
  const lbl=document.getElementById('wbLabel');
  if(S.period==='weekly'){
    lbl.textContent='📅 WEEK:';
    sel.innerHTML=S.weeks.map(w=>`<option value="${w}"${w===S.weekKey?' selected':''}>${w} (${getWeekDateRange(w)})</option>`).join('')||'<option>No data</option>';
  } else {
    lbl.textContent='📆 MONTH:';
    sel.innerHTML=S.months.map(m=>`<option value="${m}"${m===S.monthKey?' selected':''}>${friendlyMonth(m)}</option>`).join('')||'<option>No data</option>';
  }
}
function onPeriodSelChange() {
  const v=document.getElementById('wbSelect').value;
  if(S.period==='weekly') S.weekKey=v;
  else S.monthKey=v;
  renderRanking();
}

// ═══════════════════════════════════
// UTIL: safe JSON for onclick attrs
// ═══════════════════════════════════
function escObj(obj) {
  return JSON.stringify(obj).replace(/'/g,"&#39;").replace(/"/g,'&quot;');
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
async function init() {
  await loadData();
  populatePeriodSelect();
  renderRanking();
}
init();
</script>
</body>
</html>
