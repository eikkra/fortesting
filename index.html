<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:radial-gradient(circle at top,#020617,#0f172a);
color:white;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
display:flex;justify-content:space-between;align-items:center;
padding:10px 12px;flex-wrap:wrap;
background:rgba(15,23,42,0.85);backdrop-filter:blur(10px);
}
.logo{display:flex;align-items:center;gap:8px;min-width:160px;}
.logo img{height:38px;filter:drop-shadow(0 0 10px #7c3aed);}
.logo span{font-size:16px;font-weight:700;}
.nav-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
.nav-links a{
font-size:12px;padding:6px 8px;color:#cbd5f5;
text-decoration:none;white-space:nowrap;
}

/* HERO */
.hero{position:relative;height:240px;overflow:hidden;}
.slide-box{
position:absolute;width:100%;height:100%;
opacity:0;transition:.9s ease;
}
.slide-box.active{opacity:1;}
.slide-box img{
width:100%;height:100%;object-fit:cover;
filter:brightness(.45);
}
.slide-content{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
text-align:center;width:90%;
}
.slide-content h1{font-size:18px;}
.slide-content p{font-size:12px;color:#cbd5f5;}
.btn{
display:inline-block;margin-top:6px;
padding:7px 16px;font-size:12px;
background:linear-gradient(45deg,#7c3aed,#ec4899);
border-radius:25px;color:#fff;text-decoration:none;
}

.arrow{
position:absolute;top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,.4);
border:none;color:#fff;
font-size:18px;padding:6px 10px;
cursor:pointer;z-index:10;border-radius:50%;
}
.arrow.left{left:8px;}
.arrow.right{right:8px;}

/* LIVE SCORE */
.live-wrap{padding:18px 10px 8px;max-width:1200px;margin:auto;overflow:hidden;}
.live-title{
display:flex;justify-content:center;align-items:center;gap:8px;
font-size:16px;font-weight:700;margin-bottom:14px;
color:#22d3ee;
}
.live-dot{
width:10px;height:10px;background:#ef4444;
border-radius:50%;animation:pulseLive 1s infinite;
}
@keyframes pulseLive{
50%{transform:scale(1.5);opacity:.5;}
}

.live-track{
display:flex;gap:12px;overflow-x:auto;
scrollbar-width:none;scroll-snap-type:x mandatory;
}
.live-track::-webkit-scrollbar{display:none;}

.live-card{
min-width:100%;scroll-snap-align:start;
background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(124,58,237,.10));
border:1px solid rgba(34,211,238,.25);
border-radius:16px;padding:14px;
}
@media(min-width:768px){.live-card{min-width:calc(50% - 6px);}}
@media(min-width:1100px){.live-card{min-width:calc(33.33% - 8px);}}

/* SECTION */
.section{text-align:center;padding:25px 10px;}
.glow{color:#a78bfa;}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;padding:0 10px;
max-width:900px;margin:auto;
}
.card{
background:rgba(255,255,255,.05);
padding:12px;border-radius:12px;
text-align:center;position:relative;
cursor:pointer;
}

/* STORE */
.store-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:14px;
padding:0 10px;
max-width:1000px;
margin:auto;
}
.store-card{
background:rgba(255,255,255,.04);
border:1px solid rgba(124,58,237,.25);
border-radius:14px;
overflow:hidden;
box-shadow:0 0 15px rgba(124,58,237,.15);
transition:.3s;
}
.store-card:hover{
transform:translateY(-4px);
box-shadow:0 0 25px rgba(124,58,237,.3);
}
.store-card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
display:block;
}
.store-btn{
display:block;
margin:10px;
padding:10px;
font-size:12px;
font-weight:700;
text-align:center;
background:linear-gradient(45deg,#7c3aed,#ec4899);
border-radius:10px;
color:#fff;
text-decoration:none;
}
@media(max-width:600px){
.store-grid{
grid-template-columns:repeat(2,1fr);
}
}

/* CHAMP */
.champ img{width:100%;border-radius:10px;}
.desc{font-size:12px;color:#cbd5f5;max-width:700px;margin:auto;}

/* SOCIAL */
.social a{
display:inline-block;margin:5px;padding:8px 12px;
background:linear-gradient(45deg,#06b6d4,#3b82f6);
border-radius:8px;color:white;text-decoration:none;
}

.footer{
text-align:center;padding:15px;
font-size:12px;color:#94a3b8;
border-top:1px solid rgba(255,255,255,.1);
}
.footer a{color:#a78bfa;}

@media(max-width:600px){
.navbar{flex-direction:column;}
.hero{height:200px;}
}
</style>
</head>
<body>

<div class="navbar">
<div class="logo">
<img src="https://i.imgur.com/LY3Bb9m.png">
<span>GOAT FC</span>
</div>
<div class="nav-links">
<a href="#" target="_blank">Club Rules</a>
<a href="#" target="_blank">About</a>
<a href="#" target="_blank">Contact</a>
<a href="#" target="_blank">Registration</a>
</div>
</div>

<div class="hero">
<button class="arrow left" onclick="changeSlide(-1)">‹</button>
<button class="arrow right" onclick="changeSlide(1)">›</button>
</div>

<div class="live-wrap">
<div class="live-title"><div class="live-dot"></div>LIVE SCORE</div>
<div class="live-track" id="liveTrack"></div>
</div>

<div class="section">
<h2 class="glow">Club Hub</h2>
<div class="grid quick-container"></div>
</div>

<!-- GOAT STORE -->
<div class="section" style="padding-top:5px;">
<h2 class="glow">GOAT STORE</h2>
<div class="store-grid" id="storeContainer"></div>
</div>

<div class="section" style="margin-top:-10px;">
<h2 class="glow">Hall of Champions</h2>
<div class="grid champ-container"></div>
<div class="desc">🏆 This zone represents champions, top scorers, and elite performers of Goat FC.</div>
</div>

<div class="section social">
<h2 class="glow">JOIN WITH US</h2>
</div>

<div class="footer">
Design By <a href="#">Md Rashedul Hasan</a>
</div>

<script>
const sheetID="1ZoXNHa5sYiP_HaPRyL5RDML7l3kC2IaGuQCAmYkERf8";

/* STORE FETCH */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vS3VQ-e6O8uHjlq8Lsdp5j0vxxOMZH1O17Nbo1ISGXDU_EFsuBEXNWydPbuhJ46lnxqJmevXaN2xPiL/pub?gid=1152972554&single=true&output=csv")
.then(r=>r.text())
.then(csv=>{
const rows=parseCSV(csv);

document.getElementById("storeContainer").innerHTML=rows.map(item=>`
<div class="store-card">
<img src="${item['Image Url']}">
<a class="store-btn" href="${item['Link Url']}" target="_blank">
${item['Botton Name']}
</a>
</div>
`).join('');
});

/* CSV Parser */
function parseCSV(text){
const rows=[];
let row=[],cell='',inside=false;
for(let i=0;i<text.length;i++){
const c=text[i],n=text[i+1];
if(c=='"'&&inside&&n=='"'){cell+='"';i++;}
else if(c=='"'){inside=!inside;}
else if(c==','&&!inside){row.push(cell);cell='';}
else if((c=='\n'||c=='\r')&&!inside){
if(cell||row.length){row.push(cell);rows.push(row);row=[];cell='';}
if(c=='\r'&&n=='\n')i++;
}else cell+=c;
}
if(cell||row.length){row.push(cell);rows.push(row);}
const headers=rows.shift();
return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h.trim(),(r[i]||'').trim()])));
}
</script>

</body>
</html>
