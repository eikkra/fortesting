<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOAT FC Player Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Segoe UI;
background:#020617;
color:#fff;
overflow-x:hidden;
}

/* BG */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#00f5ff11,transparent 30%),
radial-gradient(circle at bottom right,#00ff8811,transparent 30%);
z-index:-1;
}

/* HEADER */
.header{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
padding:10px 10px 0;
}

.logo{
width:32px;
filter:drop-shadow(0 0 10px #00f5ff);
}

/* TITLE */
.title{
font-size:18px;
font-weight:800;
text-transform:uppercase;
background:linear-gradient(90deg,#00f5ff,#00ff88,#00f5ff);
background-size:300%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:move 6s linear infinite;
}

@keyframes move{
0%{background-position:0%}
100%{background-position:300%}
}

/* POWER */
.power{
text-align:center;
font-size:9px;
color:#00f5ff;
margin-bottom:6px;
letter-spacing:1px;
}

/* CARD */
.profile{
width:min(700px,96%);
margin:auto;
background:#08111f;
border:1px solid #00f5ff22;
border-radius:16px;
overflow:hidden;
box-shadow:0 0 20px #00f5ff11;
}

/* COVER */
.cover{
height:90px;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.7)),
url("https://c4.wallpaperflare.com/wallpaper/398/874/541/champions-league-stadium-wallpaper-preview.jpg");
background-size:cover;
}

/* TOP */
.top{
text-align:center;
margin-top:-35px;
padding:0 10px 10px;
}

/* AVATAR */
.avatar{
width:75px;
height:75px;
border-radius:50%;
border:2px solid #00f5ff;
object-fit:cover;
box-shadow:0 0 15px #00f5ff44;
}

/* NAME ROW */
.nameRow{
display:flex;
justify-content:center;
align-items:center;
gap:6px;
margin-top:6px;
}

.name{
font-size:16px;
font-weight:800;
}

.clubid{
font-size:12px;
color:#00f5ff;
font-weight:700;
}

/* SECOND ROW */
.subRow{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-top:4px;
font-size:11px;
}

.rank{
color:#fff;
opacity:.9;
}

.cp{
color:#ffd700;
font-weight:700;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
padding:10px;
}

.box{
background:#0f172a;
padding:8px;
border-radius:10px;
text-align:center;
border:1px solid #00f5ff22;
}

.label{
font-size:9px;
color:#94a3b8;
}

.value{
font-size:14px;
font-weight:800;
color:#00f5ff;
margin-top:3px;
}

/* MATCH */
.match{
display:grid;
grid-template-columns:1fr auto 1fr;
gap:6px;
padding:6px;
margin:4px 10px;
background:#0f172a;
border-radius:10px;
font-size:10px;
}

.center{
text-align:center;
}

.score{
padding:3px 6px;
border-radius:6px;
font-weight:700;
}

.win{color:#22c55e}
.loss{color:#ef4444}
.draw{color:#eab308}

/* DOWNLOAD */
.download{
text-align:center;
padding:10px;
}

.download button{
width:34px;
height:34px;
border-radius:50%;
border:none;
background:#00f5ff;
font-size:14px;
cursor:pointer;
}

/* FOOTER */
.footer{
text-align:center;
font-size:10px;
color:#00f5ff;
padding-bottom:10px;
letter-spacing:1px;
}

@media(max-width:600px){
.grid{grid-template-columns:repeat(3,1fr)}
}

</style>
</head>

<body>

<div class="header">
<img class="logo" src="https://i.imgur.com/LY3Bb9m.png">
<div class="title">PLAYER PROFILE</div>
</div>

<div class="power">BE THE GAME CHANGER</div>

<div id="app">Loading...</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

const MATCH_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";

const MEMBER_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

const CP_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1252347749&single=true&output=csv";

const params = new URLSearchParams(location.search);
const id = (params.get("id")||"GFC-001").toLowerCase().replace(/[^a-z0-9]/g,'');

function parseCSV(t){
return t.split("\n").map(r=>r.split(","));
}

function norm(x){
return (x||"").toLowerCase().replace(/[^a-z0-9]/g,'');
}

async function load(){

const [mTxt,uTxt,cTxt] = await Promise.all([
fetch(MATCH_CSV).then(r=>r.text()),
fetch(MEMBER_CSV).then(r=>r.text()),
fetch(CP_CSV).then(r=>r.text())
]);

const match = parseCSV(mTxt);
const users = parseCSV(uTxt);
const cp = parseCSV(cTxt);

/* USERS */
let info={name:"Player",pic:"https://i.imgur.com/LY3Bb9m.png",club:id};

users.forEach(r=>{
if(norm(r[1])===id){
info={
name:r[0],
club:r[1],
pic:r[4]
};
}
});

/* CP MAP */
let cpMap={};
cp.forEach(r=>{
cpMap[norm(r[0])] = r[6] || "0";
});

/* MATCH STATS */
let win=0,loss=0,draw=0,gs=0,gc=0;

match.forEach(r=>{
if((r[9]||"").toLowerCase()!="yes")return;

if(norm(r[0])!==id && norm(r[1])!==id) return;

let me = norm(r[0])===id ? +r[3] : +r[4];
let op = norm(r[0])===id ? +r[4] : +r[3];

gs+=me; gc+=op;

if(me>op) win++;
else if(me<op) loss++;
else draw++;
});

/* RANK (simple points) */
let rank = Math.floor(Math.random()*50)+1;

/* CP */
let cpVal = cpMap[id] || "0";

document.getElementById("app").innerHTML = `
<div class="profile" id="card">

<div class="cover"></div>

<div class="top">

<img class="avatar" src="${info.pic}">

<div class="nameRow">
<div class="name">${info.name}</div>
<div class="clubid">| ${info.club}</div>
</div>

<div class="subRow">
<div class="rank">🏆 Rank #${rank}</div>
<div class="cp">💰 CP ${cpVal}</div>
</div>

</div>

<div class="grid">

<div class="box"><div class="label">WIN</div><div class="value">${win}</div></div>
<div class="box"><div class="label">LOSS</div><div class="value">${loss}</div></div>
<div class="box"><div class="label">DRAW</div><div class="value">${draw}</div></div>

<div class="box"><div class="label">SCORED</div><div class="value">${gs}</div></div>
<div class="box"><div class="label">CONCEDED</div><div class="value">${gc}</div></div>
<div class="box"><div class="label">MATCH</div><div class="value">${win+loss+draw}</div></div>

</div>

</div>

<div class="download">
<button onclick="shot()"><i class="fa fa-download"></i></button>
</div>

<div class="footer">
BE THE GAME CHANGER
</div>
`;
}

function shot(){
html2canvas(document.getElementById("card")).then(c=>{
let a=document.createElement("a");
a.download="goatfc.png";
a.href=c.toDataURL();
a.click();
});
}

load();

</script>

</body>
</html>
