<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC STATISTICS</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --cyan: #00f5ff;
  --cyan-dim: rgba(0,245,255,0.15);
  --cyan-glow: rgba(0,245,255,0.4);
  --green: #39ff14;
  --red: #ff2d55;
  --yellow: #ffd700;
  --purple: #bf00ff;
  --orange: #ff6b00;
  --bg: #020812;
  --bg2: #050f1a;
  --bg3: #071524;
  --surface: rgba(0,245,255,0.04);
  --border: rgba(0,245,255,0.2);
  --text: #e2f4ff;
  --muted: #4a7a8a;
  --gold: #ffd700;
  --silver: #c0c0c0;
  --bronze: #cd7f32;
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  font-family:'Exo 2',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ─── SCANLINE OVERLAY ─── */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,245,255,0.012) 2px,
    rgba(0,245,255,0.012) 4px
  );
  pointer-events:none;
  z-index:1000;
}

/* ─── ANIMATED BG GRID ─── */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,245,255,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,0.04) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridMove 20s linear infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes gridMove {
  0%{background-position:0 0;}
  100%{background-position:40px 40px;}
}

/* ─── HEADER ─── */
.header {
  position:relative;
  z-index:10;
  text-align:center;
  padding:28px 16px 20px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, rgba(0,245,255,0.05) 0%, transparent 100%);
}

.header-badge {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(0,245,255,0.08);
  border:1px solid rgba(0,245,255,0.3);
  border-radius:4px;
  padding:3px 10px;
  font-size:10px;
  letter-spacing:3px;
  color:var(--cyan);
  text-transform:uppercase;
  margin-bottom:14px;
  animation:pulse-badge 3s ease-in-out infinite;
}
@keyframes pulse-badge {
  0%,100%{box-shadow:0 0 6px rgba(0,245,255,0.3);}
  50%{box-shadow:0 0 16px rgba(0,245,255,0.6);}
}

.header-main {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}

.header-logo {
  width:52px;
  filter:drop-shadow(0 0 12px var(--cyan)) drop-shadow(0 0 24px var(--cyan));
  animation:logo-pulse 4s ease-in-out infinite;
}
@keyframes logo-pulse {
  0%,100%{filter:drop-shadow(0 0 12px var(--cyan)) drop-shadow(0 0 24px var(--cyan));}
  50%{filter:drop-shadow(0 0 20px var(--cyan)) drop-shadow(0 0 40px var(--cyan)) drop-shadow(0 0 60px rgba(0,245,255,0.3));}
}

.header h1 {
  font-family:'Orbitron',sans-serif;
  font-size:clamp(20px,5vw,34px);
  font-weight:900;
  letter-spacing:2px;
  color:var(--cyan);
  text-shadow:
    0 0 8px var(--cyan),
    0 0 20px var(--cyan),
    0 0 40px rgba(0,245,255,0.5);
  line-height:1.1;
}

.header-desc {
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
  letter-spacing:1.5px;
  text-transform:uppercase;
}

/* ─── SEARCH ─── */
.search-wrap {
  position:relative;
  z-index:10;
  padding:16px 14px;
  display:flex;
  justify-content:center;
}

.search-box {
  position:relative;
  width:100%;
  max-width:440px;
}

.search-box i {
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--cyan);
  font-size:14px;
  opacity:0.7;
}

.search-box input {
  width:100%;
  padding:12px 16px 12px 40px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--cyan);
  font-family:'Exo 2',sans-serif;
  font-size:14px;
  letter-spacing:1px;
  outline:none;
  transition:all 0.3s;
}
.search-box input::placeholder { color:var(--muted); }
.search-box input:focus {
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,245,255,0.12), 0 0 20px rgba(0,245,255,0.15);
}

/* ─── GRID ─── */
#data {
  position:relative;
  z-index:10;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(310px, 1fr));
  gap:14px;
  padding:10px 14px 30px;
}

/* ─── CARD ─── */
.card {
  background:linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
  border:1px solid var(--border);
  border-radius:12px;
  padding:0;
  overflow:hidden;
  transition:transform 0.25s, box-shadow 0.25s;
  animation:fadeIn 0.5s ease both;
  position:relative;
}
@keyframes fadeIn {
  from{opacity:0; transform:translateY(16px);}
  to{opacity:1; transform:translateY(0);}
}

.card:hover {
  transform:translateY(-3px);
  box-shadow:0 8px 32px rgba(0,245,255,0.15);
}

/* Rank glow strips */
.card::before {
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:var(--border);
  border-radius:12px 12px 0 0;
}
.rank1::before { background:linear-gradient(90deg,transparent,var(--gold),transparent); box-shadow:0 0 12px var(--gold); }
.rank2::before { background:linear-gradient(90deg,transparent,var(--silver),transparent); box-shadow:0 0 10px var(--silver); }
.rank3::before { background:linear-gradient(90deg,transparent,var(--bronze),transparent); box-shadow:0 0 10px var(--bronze); }
.top10::before { background:linear-gradient(90deg,transparent,var(--purple),transparent); }

.rank1 { border-color:rgba(255,215,0,0.35); box-shadow:0 0 14px rgba(255,215,0,0.2); }
.rank2 { border-color:rgba(192,192,192,0.35); box-shadow:0 0 14px rgba(192,192,192,0.15); }
.rank3 { border-color:rgba(205,127,50,0.35); box-shadow:0 0 12px rgba(205,127,50,0.2); }
.top10 { border-color:rgba(191,0,255,0.3); }

/* ─── CARD HEADER ─── */
.card-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px 10px;
  border-bottom:1px solid rgba(0,245,255,0.08);
  gap:8px;
}

.rank-badge {
  display:flex;
  align-items:center;
  justify-content:center;
  width:30px; height:30px;
  border-radius:6px;
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  font-weight:700;
  flex-shrink:0;
}
.rank-badge.r1 { background:rgba(255,215,0,0.15); color:var(--gold); border:1px solid rgba(255,215,0,0.4); }
.rank-badge.r2 { background:rgba(192,192,192,0.12); color:var(--silver); border:1px solid rgba(192,192,192,0.35); }
.rank-badge.r3 { background:rgba(205,127,50,0.12); color:var(--bronze); border:1px solid rgba(205,127,50,0.35); }
.rank-badge.rn { background:rgba(0,245,255,0.08); color:var(--muted); border:1px solid var(--border); }

.player-info { flex:1; min-width:0; }
.player-name {
  font-family:'Orbitron',sans-serif;
  font-size:13px;
  font-weight:700;
  color:var(--green);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.player-id {
  font-size:11px;
  color:var(--cyan);
  opacity:0.7;
  letter-spacing:0.5px;
  margin-top:2px;
}

.rank-icon { font-size:20px; }

/* ─── STATS GRID ─── */
.stats-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:12px 14px;
}

.stat-box {
  background:rgba(0,0,0,0.3);
  border:1px solid rgba(0,245,255,0.13);
  border-radius:8px;
  padding:9px 6px 7px;
  text-align:center;
  transition:border-color 0.2s, background 0.2s;
  position:relative;
  overflow:hidden;
}
.stat-box:hover {
  border-color:rgba(0,245,255,0.35);
  background:rgba(0,245,255,0.07);
}

.stat-box .stat-icon {
  font-size:13px;
  margin-bottom:4px;
  display:block;
}
.stat-box .stat-val {
  font-family:'Orbitron',sans-serif;
  font-size:15px;
  font-weight:700;
  line-height:1;
  display:block;
}
.stat-box .stat-lbl {
  font-size:9px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:3px;
  display:block;
}

/* Coloring specific stats */
.stat-win .stat-icon { color:var(--green); }
.stat-win .stat-val  { color:var(--green); }
.stat-loss .stat-icon { color:var(--red); }
.stat-loss .stat-val  { color:var(--red); }
.stat-draw .stat-icon { color:var(--yellow); }
.stat-draw .stat-val  { color:var(--yellow); }
.stat-match .stat-val { color:var(--cyan); }
.stat-winp .stat-val  { color:#f97316; }
.stat-rate .stat-val  { color:#38bdf8; }
.stat-gs .stat-val    { color:var(--green); }
.stat-gc .stat-val    { color:var(--red); }
.stat-diff .stat-val  { color:var(--cyan); }
.stat-seven .stat-val { color:var(--gold); }
.stat-friendly .stat-val { color:#a78bfa; }
.stat-tour .stat-val  { color:#f472b6; }

/* ─── WIN RATE BAR ─── */
.winbar-wrap {
  padding:0 14px 4px;
}
.winbar-label {
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:var(--muted);
  letter-spacing:1px;
  margin-bottom:5px;
  text-transform:uppercase;
}
.winbar-track {
  height:5px;
  background:rgba(0,0,0,0.4);
  border-radius:3px;
  overflow:hidden;
  border:1px solid rgba(0,245,255,0.1);
}
.winbar-fill {
  height:100%;
  background:linear-gradient(90deg, var(--green), #00ff88);
  border-radius:3px;
  transition:width 0.8s cubic-bezier(.23,1,.32,1);
  box-shadow:0 0 8px rgba(57,255,20,0.6);
}

/* ─── CARD FOOTER ─── */
.card-foot {
  padding:10px 14px 13px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
}

.dl-btn {
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 16px;
  background:transparent;
  border:1px solid rgba(0,245,255,0.35);
  border-radius:6px;
  color:var(--cyan);
  font-family:'Exo 2',sans-serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.2s;
}
.dl-btn:hover {
  background:var(--cyan);
  color:#000;
  box-shadow:0 0 16px rgba(0,245,255,0.4);
}
.dl-btn i { font-size:11px; }

/* ─── LOADING STATE ─── */
#loading {
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:9999;
  gap:20px;
}
.loader-ring {
  width:60px;height:60px;
  border:3px solid rgba(0,245,255,0.15);
  border-top-color:var(--cyan);
  border-radius:50%;
  animation:spin 0.9s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg);} }
.loader-text {
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  letter-spacing:3px;
  color:var(--cyan);
  opacity:0.7;
  animation:blink 1.5s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:0.4;} 50%{opacity:0.9;} }

/* ─── EMPTY STATE ─── */
.empty {
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  font-size:14px;
  letter-spacing:1px;
  grid-column:1/-1;
}
.empty i { font-size:36px; margin-bottom:12px; display:block; opacity:0.4; }

/* ─── MOBILE ─── */
@media(max-width:600px) {
  .header { padding:20px 12px 16px; }
  #data { grid-template-columns:1fr; gap:10px; padding:8px 10px 20px; }
  .stats-grid { grid-template-columns:repeat(3,1fr); gap:6px; }
  .stat-box { padding:8px 4px 6px; }
  .stat-box .stat-val { font-size:13px; }
  .header h1 { font-size:20px; }
}
</style>
</head>

<body>

<div id="loading">
  <div class="loader-ring"></div>
  <div class="loader-text">LOADING MATCH DATA...</div>
</div>

<div class="header">
  <div class="header-badge">
    <i class="fa-solid fa-circle" style="font-size:6px; color:var(--green); animation:blink 1.2s infinite;"></i>
    LIVE DASHBOARD
  </div>
  <div class="header-main">
    <img class="header-logo" src="https://i.imgur.com/LY3Bb9m.png" alt="GOAT FC">
    <h1>GOAT FC STATISTICS</h1>
  </div>
  <div class="header-desc">
    <i class="fa-solid fa-shield-halved" style="color:var(--cyan); margin-right:5px;"></i>
    Official Performance Dashboard &mdash; Approved Matches Only
  </div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="search" placeholder="Search player name or club ID..." oninput="render()">
  </div>
</div>

<div id="data"></div>

<script>
const MATCH_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";
const MEMBER_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let players={}, members={}, cache={};

function parseCSV(text){
  const rows=[]; let cur=[], val="", q=false;
  for(let i=0;i<text.length;i++){
    let c=text[i];
    if(c==='"'){ if(q && text[i+1]==='"'){val+='"';i++;} else q=!q; }
    else if(c===','&&!q){ cur.push(val); val=""; }
    else if((c==='\n'||c==='\r')&&!q){
      if(val||cur.length){ cur.push(val); rows.push(cur); cur=[]; val=""; }
    } else val+=c;
  }
  if(val||cur.length) rows.push([...cur, val]);
  return rows;
}

function normalize(id){ return (id||"").toLowerCase().replace(/[^a-z0-9]/g,''); }

async function getData(url){
  if(cache[url]) return cache[url];
  let t=await fetch(url+"&t="+Date.now()).then(r=>r.text());
  cache[url]=t; return t;
}

async function loadMembers(){
  let rows=parseCSV(await getData(MEMBER_URL)).slice(1);
  rows.forEach(c=>{
    if(c[1]&&!c[1].includes("#VALUE")) members[normalize(c[1])]=c[0];
  });
}

async function loadMatches(){
  let rows=parseCSV(await getData(MATCH_URL)).slice(1);
  rows.forEach(c=>{
    let P1=c[0], P2=c[1];
    let s1=Number(c[3]), s2=Number(c[4]);
    let approved=(c[9]||"").toLowerCase();
    if(!P1||!P2||P1.includes("#VALUE")||P2.includes("#VALUE")||isNaN(s1)||isNaN(s2)||approved!=="yes") return;
    update(P1,s1,s2,c[2]);
    update(P2,s2,s1,c[2]);
  });
}

function update(id,s,c,t){
  if(!players[id]) players[id]={match:0,win:0,loss:0,draw:0,gs:0,gc:0,diff:0,rate:0,seven:0,friendly:0,other:0};
  let p=players[id];
  p.match++; p.gs+=s; p.gc+=c; p.diff=p.gs-p.gc;
  if(t==="Friendly") p.friendly++; else p.other++;
  if(s>c) p.win++;
  else if(s<c) p.loss++;
  else p.draw++;
  if(s>=7) p.seven++;
  p.winp=(p.win/p.match)*100;
  p.rate=(p.gs/p.match);
}

const RANK_ICONS = ['🥇','🥈','🥉'];

function rankBadge(i){
  if(i===0) return `<div class="rank-badge r1"><i class="fa-solid fa-crown"></i></div>`;
  if(i===1) return `<div class="rank-badge r2">#2</div>`;
  if(i===2) return `<div class="rank-badge r3">#3</div>`;
  return `<div class="rank-badge rn">#${i+1}</div>`;
}

function rankIcon(i){
  if(i===0) return `<span class="rank-icon">🥇</span>`;
  if(i===1) return `<span class="rank-icon">🥈</span>`;
  if(i===2) return `<span class="rank-icon">🥉</span>`;
  return '';
}

function diffColor(d){ return d>0?'var(--green)':d<0?'var(--red)':'var(--muted)'; }

function render(){
  let q=normalize(document.getElementById("search").value);
  let sorted=Object.entries(players).sort((a,b)=>b[1].win-a[1].win);
  let filtered=sorted.filter(([id,p],i)=>{
    let name=members[normalize(id)]||"";
    return !q||(normalize(id).includes(q)||normalize(name).includes(q));
  });

  if(!filtered.length){
    document.getElementById("data").innerHTML=`
      <div class="empty">
        <i class="fa-solid fa-user-slash"></i>
        No players found matching "<strong>${document.getElementById("search").value}</strong>"
      </div>`;
    return;
  }

  let html="";
  filtered.forEach(([id,p],fi)=>{
    // use original sorted rank for badge
    let rank=sorted.findIndex(([sid])=>sid===id);
    let name=members[normalize(id)]||"Unknown Player";

    let cls="card";
    if(rank===0) cls+=" rank1";
    else if(rank===1) cls+=" rank2";
    else if(rank===2) cls+=" rank3";
    else if(rank<10) cls+=" top10";

    let barW=Math.min(p.winp,100).toFixed(1);
    let diffSign=p.diff>0?'+':'';

    html+=`
    <div class="${cls}" style="animation-delay:${fi*0.04}s">
      <div class="card-head">
        ${rankBadge(rank)}
        <div class="player-info">
          <div class="player-name">${name}</div>
          <div class="player-id"><i class="fa-solid fa-id-badge" style="margin-right:4px;"></i>${id}</div>
        </div>
        ${rankIcon(rank)}
      </div>

      <div class="winbar-wrap">
        <div class="winbar-label">
          <span><i class="fa-solid fa-chart-line" style="margin-right:4px;"></i>Win Rate</span>
          <span>${p.winp.toFixed(1)}%</span>
        </div>
        <div class="winbar-track">
          <div class="winbar-fill" style="width:${barW}%"></div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box stat-win">
          <span class="stat-icon"><i class="fa-solid fa-trophy"></i></span>
          <span class="stat-val">${p.win}</span>
          <span class="stat-lbl">Wins</span>
        </div>
        <div class="stat-box stat-loss">
          <span class="stat-icon"><i class="fa-solid fa-circle-xmark"></i></span>
          <span class="stat-val">${p.loss}</span>
          <span class="stat-lbl">Loss</span>
        </div>
        <div class="stat-box stat-draw">
          <span class="stat-icon"><i class="fa-solid fa-handshake"></i></span>
          <span class="stat-val">${p.draw}</span>
          <span class="stat-lbl">Draw</span>
        </div>
        <div class="stat-box stat-match">
          <span class="stat-icon"><i class="fa-solid fa-gamepad"></i></span>
          <span class="stat-val">${p.match}</span>
          <span class="stat-lbl">Matches</span>
        </div>
        <div class="stat-box stat-winp">
          <span class="stat-icon"><i class="fa-solid fa-percent"></i></span>
          <span class="stat-val">${p.winp.toFixed(1)}</span>
          <span class="stat-lbl">Win %</span>
        </div>
        <div class="stat-box stat-rate">
          <span class="stat-icon"><i class="fa-solid fa-bolt"></i></span>
          <span class="stat-val">${p.rate.toFixed(2)}</span>
          <span class="stat-lbl">Goal/G</span>
        </div>
        <div class="stat-box stat-gs">
          <span class="stat-icon"><i class="fa-solid fa-futbol"></i></span>
          <span class="stat-val">${p.gs}</span>
          <span class="stat-lbl">Scored</span>
        </div>
        <div class="stat-box stat-gc">
          <span class="stat-icon"><i class="fa-solid fa-shield"></i></span>
          <span class="stat-val">${p.gc}</span>
          <span class="stat-lbl">Conced.</span>
        </div>
        <div class="stat-box stat-diff">
          <span class="stat-icon"><i class="fa-solid fa-arrow-trend-up"></i></span>
          <span class="stat-val" style="color:${diffColor(p.diff)}">${diffSign}${p.diff}</span>
          <span class="stat-lbl">GD</span>
        </div>
        <div class="stat-box stat-seven">
          <span class="stat-icon"><i class="fa-solid fa-star"></i></span>
          <span class="stat-val">${p.seven}</span>
          <span class="stat-lbl">7+ Goals</span>
        </div>
        <div class="stat-box stat-friendly">
          <span class="stat-icon"><i class="fa-solid fa-people-arrows"></i></span>
          <span class="stat-val">${p.friendly}</span>
          <span class="stat-lbl">Friendly</span>
        </div>
        <div class="stat-box stat-tour">
          <span class="stat-icon"><i class="fa-solid fa-medal"></i></span>
          <span class="stat-val">${p.other}</span>
          <span class="stat-lbl">Tourney</span>
        </div>
      </div>

      <div class="card-foot">
        <button class="dl-btn" onclick="downloadCard(this)">
          <i class="fa-solid fa-download"></i> Download
        </button>
      </div>
    </div>`;
  });

  document.getElementById("data").innerHTML=html;
}

function downloadCard(btn){
  html2canvas(btn.closest(".card"),{backgroundColor:'#050f1a', scale:2}).then(c=>{
    let a=document.createElement("a");
    a.download="GOAT_FC_STATS.jpg";
    a.href=c.toDataURL("image/jpeg",0.95);
    a.click();
  });
}

async function init(){
  await Promise.all([loadMembers(), loadMatches()]);
  document.getElementById("loading").style.display="none";
  render();
}
init();
</script>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>
