<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC BID</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif}

body{
    background:#050008;
    background-image:
    radial-gradient(circle at 20% 20%,#2b0044 0%,transparent 35%),
    radial-gradient(circle at 80% 0%,#001a44 0%,transparent 30%);
    color:#fff;
    padding:15px;
}

.header{text-align:center;margin-bottom:20px}
.logo{
    width:75px;
    filter:drop-shadow(0 0 10px cyan);
}
.title{
    font-size:28px;
    font-weight:900;
    margin-top:8px;
    background:linear-gradient(90deg,#00f7ff,#ff00ea,#00ff66);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.grid{
    display:grid;
    gap:16px;
}

.card{
    border-radius:18px;
    overflow:hidden;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 0 20px rgba(0,255,255,.12);
    backdrop-filter:blur(12px);
}

.card-head{
    background:linear-gradient(90deg,#ff00ea,#6a00ff);
    padding:12px;
    text-align:center;
    font-weight:800;
    font-size:17px;
}

.players{padding:12px}

.player{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
    font-size:13px;
}

.stats{
    padding:12px;
    background:rgba(0,0,0,.35);
}

.stat{
    display:flex;
    justify-content:space-between;
    margin:7px 0;
    font-size:14px;
}

.remain{
    font-weight:900;
    font-size:16px;
}

.light{
    width:12px;
    height:12px;
    border-radius:50%;
    display:inline-block;
    margin-left:8px;
    background:#333;
}

.alert{
    background:red;
    box-shadow:0 0 10px red,0 0 20px red;
    animation:blink .7s infinite;
}

@keyframes blink{
    50%{opacity:.25}
}

.loading{
    text-align:center;
    color:cyan;
    padding:50px 0;
}
</style>
</head>
<body>

<div class="header">
    <img class="logo" src="https://i.imgur.com/LY3Bb9m.png">
    <div class="title">GOAT FC BID</div>
</div>

<div id="loading" class="loading">Loading Bid Data...</div>
<div id="grid" class="grid"></div>

<script>
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTPyxMtkK2IgbGLlmqXBmNRYcwk6USIMs-88NMmGB98_TWcUQdG4CyC6QbNnT17SXiUwYIIVqRsbhQC/pub?gid=1013280552&single=true&output=csv";

fetch(CSV_URL + "&t=" + Date.now())
.then(r=>r.text())
.then(text=>{

    const rows = text.trim().split("\n").map(r =>
        r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').trim())
    );

    const TEAM_BLOCKS = [
        {titleRow:0,nameCol:1,priceCol:2},
        {titleRow:0,nameCol:5,priceCol:6},
        {titleRow:0,nameCol:9,priceCol:10},

        {titleRow:13,nameCol:1,priceCol:2},
        {titleRow:13,nameCol:5,priceCol:6},
        {titleRow:13,nameCol:9,priceCol:10},
    ];

    const grid = document.getElementById("grid");
    document.getElementById("loading").style.display="none";

    TEAM_BLOCKS.forEach(block=>{

        const teamName = rows[block.titleRow][block.nameCol];
        if(!teamName) return;

        let players = [];
        let used = 0;

        for(let i=2;i<=7;i++){
            const row = rows[block.titleRow+i] || [];
            const player = row[block.nameCol] || "";
            const price = parseInt(row[block.priceCol]) || 0;

            if(player){
                players.push({player,price});
                used += price;
            }
        }

        const total = parseInt(rows[block.titleRow+9]?.[block.priceCol]) || 0;
        const remaining = parseInt(rows[block.titleRow+10]?.[block.priceCol]) || (total-used);

        const card = document.createElement("div");
        card.className="card";

        card.innerHTML=`
            <div class="card-head">${teamName}</div>

            <div class="players">
                ${players.map(p=>`
                    <div class="player">
                        <span>${p.player}</span>
                        <span>${p.price} CP</span>
                    </div>
                `).join("")}
            </div>

            <div class="stats">
                <div class="stat"><span>Used</span><span>${used}</span></div>
                <div class="stat"><span>Total</span><span>${total}</span></div>
                <div class="stat remain">
                    <span>Remaining</span>
                    <span>
                        ${remaining}
                        <span class="light ${remaining<250?'alert':''}"></span>
                    </span>
                </div>
            </div>
        `;

        grid.appendChild(card);

    });

})
.catch(err=>{
    document.getElementById("loading").innerHTML="Failed to Load Sheet";
    console.error(err);
});
</script>

</body>
</html>
