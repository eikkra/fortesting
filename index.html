<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CP SYSTEM</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
:root {
  --bg:     #06040e;
  --bg2:    #0d0a1a;
  --bg3:    #120e22;
  --gold:   #ffd700;
  --gold2:  #ffb300;
  --gold3:  #ffe066;
  --cyan:   #00f5ff;
  --green:  #39ff14;
  --red:    #ff3b3b;
  --purple: #c084fc;
  --border: rgba(255,215,0,0.18);
  --text:   #f0e6c8;
  --muted:  #7a6a4a;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Exo 2',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:30px;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background:repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(255,215,0,0.012) 2px, rgba(255,215,0,0.012) 4px
  );
  pointer-events:none; z-index:1000;
}

body::after {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(255,215,0,0.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,215,0,0.035) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridMove 22s linear infinite;
  pointer-events:none; z-index:0;
}
@keyframes gridMove {
  0%{background-position:0 0;}
  100%{background-position:40px 40px;}
}

.orb {
  position:fixed; border-radius:50%;
  pointer-events:none; z-index:1; filter:blur(80px);
}
.orb1 {
  width:380px; height:380px; top:-100px; left:-80px;
  background:radial-gradient(circle,rgba(255,215,0,0.07) 0%,transparent 70%);
  animation:orbFloat 9s ease-in-out infinite;
}
.orb2 {
  width:300px; height:300px; top:35%; right:-80px;
  background:radial-gradient(circle,rgba(255,140,0,0.06) 0%,transparent 70%);
  animation:orbFloat 12s ease-in-out infinite; animation-delay:-4s;
}
.orb3 {
  width:260px; height:260px; bottom:-60px; left:30%;
  background:radial-gradient(circle,rgba(192,132,252,0.055) 0%,transparent 70%);
  animation:orbFloat 14s ease-in-out infinite; animation-delay:-7s;
}
@keyframes orbFloat {
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-26px) scale(1.06);}
}
@keyframes blink {
  0%,100%{opacity:0.35;} 50%{opacity:1;}
}

/* ── TOPBAR ── */
.topbar {
  position:sticky; top:0; z-index:999;
  height:50px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px;
  background:rgba(6,4,14,0.93);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,215,0,0.13);
  box-shadow:0 2px 20px rgba(0,0,0,0.6);
  text-decoration:none; color:inherit;
}
.topbar-glow {
  position:absolute; bottom:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0.35;
}
.top-left { display:flex; align-items:center; gap:9px; }
.top-logo {
  width:26px;
  filter:drop-shadow(0 0 7px var(--gold));
}
.top-title {
  font-family:'Orbitron',sans-serif;
  font-size:12px; font-weight:700; letter-spacing:1.5px;
  background:linear-gradient(90deg,var(--gold),var(--gold3));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.home-btn {
  width:32px; height:32px;
  display:flex; align-items:center; justify-content:center;
  border-radius:8px;
  background:rgba(255,215,0,0.07);
  border:1px solid rgba(255,215,0,0.2);
  color:var(--gold); font-size:12px;
  transition:all 0.2s;
}
.home-btn:hover {
  background:rgba(255,215,0,0.15);
  box-shadow:0 0 12px rgba(255,215,0,0.3);
}

/* ── HEADER ── */
.header {
  position:relative; z-index:10;
  text-align:center;
  padding:26px 16px 18px;
  border-bottom:1px solid rgba(255,215,0,0.1);
  background:linear-gradient(180deg,rgba(255,215,0,0.04) 0%,transparent 100%);
}
.header-badge {
  display:inline-flex; align-items:center; gap:7px;
  background:rgba(255,215,0,0.07);
  border:1px solid rgba(255,215,0,0.28);
  border-radius:4px; padding:3px 12px;
  font-size:15px; font-weight:800; letter-spacing:3px;
  color:var(--gold); text-transform:uppercase;
  margin-bottom:14px;
  animation:pulseBadge 3s ease-in-out infinite;
}
@keyframes pulseBadge {
  0%,100%{box-shadow:0 0 6px rgba(255,215,0,0.2);}
  50%{box-shadow:0 0 18px rgba(255,215,0,0.5);}
}
.header h1 {
  font-family:'Orbitron',sans-serif;
  font-size:clamp(17px,4.5vw,30px);
  font-weight:900; letter-spacing:2px;
  background:linear-gradient(90deg,var(--gold2),var(--gold3),var(--gold2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,215,0,0.4));
  line-height:1.1;
}
.header-desc {
  margin-top:10px; font-size:11px;
  color:var(--muted); letter-spacing:1.5px; text-transform:uppercase;
}

/* ── WRAP ── */
.wrap {
  position:relative; z-index:10;
  max-width:960px; margin:auto;
  padding:14px 12px 0;
}

/* ── SEARCH BOX ── */
.search-wrapper {
  margin-bottom:12px;
  display:flex; align-items:center; gap:8px;
}
.search-box {
  flex:1;
  display:flex; align-items:center; gap:8px;
  background:rgba(255,215,0,0.05);
  border:1px solid rgba(255,215,0,0.2);
  border-radius:8px;
  padding:7px 12px;
  transition:all 0.2s;
}
.search-box:focus-within {
  border-color:rgba(255,215,0,0.5);
  background:rgba(255,215,0,0.08);
  box-shadow:0 0 14px rgba(255,215,0,0.15);
}
.search-box i {
  color:var(--muted); font-size:12px; flex-shrink:0;
}
.search-box input {
  flex:1; background:none; border:none; outline:none;
  color:var(--text); font-family:'Exo 2',sans-serif;
  font-size:12px; font-weight:600; letter-spacing:0.5px;
}
.search-box input::placeholder { color:var(--muted); }
.search-clear {
  background:none; border:none; cursor:pointer;
  color:var(--muted); font-size:11px; padding:0;
  transition:color 0.2s; display:none;
}
.search-clear:hover { color:var(--gold); }
.search-count {
  font-family:'Orbitron',sans-serif;
  font-size:9px; letter-spacing:1px;
  color:var(--muted); white-space:nowrap;
  background:rgba(255,215,0,0.06);
  border:1px solid rgba(255,215,0,0.12);
  border-radius:5px; padding:5px 9px;
}

/* ── TABLE CARD ── */
.table-card {
  background:linear-gradient(145deg,var(--bg2),var(--bg3));
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(255,215,0,0.07), 0 0 60px rgba(0,0,0,0.5);
}

/* ── TABLE CONTAINER (for sticky header) ── */
.table-scroll {
  overflow-x:auto;
  max-height:calc(100vh - 260px);
  overflow-y:auto;
}
.table-scroll::-webkit-scrollbar { width:4px; height:4px; }
.table-scroll::-webkit-scrollbar-track { background:rgba(255,215,0,0.03); }
.table-scroll::-webkit-scrollbar-thumb { background:rgba(255,215,0,0.2); border-radius:4px; }

table {
  width:100%;
  border-collapse:collapse;
}

thead tr {
  background:rgba(13,10,26,0.98);
  border-bottom:1px solid rgba(255,215,0,0.2);
  position:sticky; top:0; z-index:20;
}

th {
  padding:12px 8px;
  font-family:'Orbitron',sans-serif;
  font-size:10px; font-weight:700;
  letter-spacing:1px; text-transform:uppercase;
  color:var(--gold);
  text-align:center;
  white-space:nowrap;
  background:rgba(13,10,26,0.98);
}
th:first-child { text-align:left; padding-left:14px; }

td {
  padding:10px 8px;
  font-size:12px; font-weight:600;
  text-align:center;
  border-bottom:1px solid rgba(255,215,0,0.06);
  white-space:nowrap;
  transition:background 0.2s;
}
td:first-child { text-align:left; padding-left:14px; }

tbody tr {
  animation:fadeRow 0.4s ease both;
  cursor:pointer;
}
@keyframes fadeRow {
  from{opacity:0; transform:translateY(8px);}
  to{opacity:1; transform:translateY(0);}
}
tbody tr:hover td {
  background:rgba(255,215,0,0.05);
}
tbody tr:last-child td { border-bottom:none; }

/* ── PLAYER CELL ── */
.club-cell {
  display:flex; align-items:center; gap:8px;
}
.club-avatar {
  width:28px; height:28px; border-radius:50%;
  object-fit:cover;
  border:1.5px solid rgba(255,215,0,0.25);
  flex-shrink:0;
  background:rgba(255,215,0,0.05);
}
.club-avatar-placeholder {
  width:28px; height:28px; border-radius:50%;
  background:rgba(255,215,0,0.08);
  border:1.5px solid rgba(255,215,0,0.15);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; font-size:10px; color:var(--muted);
}
.club-info { min-width:0; }
.player-name {
  font-size:11px; font-weight:700; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:130px; line-height:1.2;
}
.club-id-sub {
  font-size:9px; color:var(--muted); letter-spacing:0.5px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:130px;
}

/* ── BID COMBINED ── */
.bid-combined {
  display:flex; flex-direction:column; align-items:center; gap:1px;
  line-height:1.2;
}
.bid-earn { color:#39ff14; font-size:10px; font-weight:700; }
.bid-deduct { color:#ff3b3b; font-size:10px; font-weight:700; }
.bid-divider { width:1px; height:10px; background:rgba(255,255,255,0.12); display:none; }

/* ── CP VALUES ── */
.val-base    { color:#a0d4ff; }
.val-tour    { color:#c084fc; }
.val-bonus   { color:var(--gold3); }
.val-sell    { color:#38bdf8; }

.val-net-pos {
  color:var(--gold);
  font-family:'Orbitron',sans-serif;
  font-size:11px; font-weight:700;
  text-shadow:0 0 8px rgba(255,215,0,0.5);
}
.val-net-neg {
  color:var(--red);
  font-family:'Orbitron',sans-serif;
  font-size:11px; font-weight:700;
}

/* ── ACTION BUTTON ── */
.btn-claim {
  display:inline-flex; align-items:center; gap:5px;
  padding:6px 12px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#000; border:none;
  border-radius:6px; font-family:'Exo 2',sans-serif;
  font-size:11px; font-weight:700; letter-spacing:0.5px;
  cursor:pointer; transition:all 0.2s;
  box-shadow:0 0 10px rgba(255,215,0,0.4);
}
.btn-claim:hover {
  transform:scale(1.06);
  box-shadow:0 0 18px rgba(255,215,0,0.65);
}
.btn-locked {
  display:inline-flex; align-items:center; gap:5px;
  padding:6px 12px;
  background:rgba(255,255,255,0.05);
  color:var(--muted); border:1px solid rgba(255,255,255,0.08);
  border-radius:6px; font-family:'Exo 2',sans-serif;
  font-size:11px; font-weight:600; letter-spacing:0.5px;
  cursor:not-allowed;
}

/* ── LOADING ── */
#loading {
  position:fixed; inset:0; background:var(--bg);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:9999; gap:20px;
}
.loader-ring {
  width:60px; height:60px;
  border:3px solid rgba(255,215,0,0.12);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{ to{transform:rotate(360deg);} }
.loader-text {
  font-family:'Orbitron',sans-serif;
  font-size:11px; letter-spacing:3px; color:var(--gold);
  animation:blink 1.5s ease-in-out infinite;
}

/* ── WITHDRAW POPUP ── */
.popup {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.8);
  display:flex; align-items:center; justify-content:center;
  visibility:hidden; z-index:9998;
  backdrop-filter:blur(6px);
}
.popup-content {
  background:linear-gradient(145deg,var(--bg2),var(--bg3));
  border:1px solid rgba(255,215,0,0.3);
  border-radius:16px; padding:28px 24px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,215,0,0.2);
  width:90%; max-width:320px;
  animation:popIn 0.25s ease;
}
@keyframes popIn {
  from{transform:scale(0.85); opacity:0;}
  to{transform:scale(1); opacity:1;}
}
.popup-icon { font-size:36px; margin-bottom:10px; }
.popup-content h2 {
  font-family:'Orbitron',sans-serif;
  font-size:16px; color:var(--gold); margin-bottom:12px;
}
.popup-content p {
  font-size:12px; color:var(--muted); margin:4px 0; letter-spacing:0.5px;
}
.popup-contact {
  margin-top:14px; padding:12px;
  background:rgba(255,215,0,0.06);
  border:1px solid rgba(255,215,0,0.15);
  border-radius:8px; font-size:12px; color:var(--text);
  line-height:1.8;
}
.popup-close {
  margin-top:16px;
  padding:8px 20px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#000; border:none; border-radius:8px;
  font-family:'Exo 2',sans-serif;
  font-size:13px; font-weight:700; cursor:pointer;
  transition:all 0.2s;
}
.popup-close:hover { transform:scale(1.05); box-shadow:0 0 16px rgba(255,215,0,0.5); }

/* ── PLAYER MODAL ── */
.player-modal {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.85);
  display:flex; align-items:center; justify-content:center;
  visibility:hidden; opacity:0;
  z-index:9997;
  backdrop-filter:blur(10px);
  transition:opacity 0.25s, visibility 0.25s;
}
.player-modal.show {
  visibility:visible; opacity:1;
}
.player-modal-content {
  background:linear-gradient(145deg,var(--bg2),var(--bg3));
  border:1px solid rgba(255,215,0,0.3);
  border-radius:20px; padding:32px 28px;
  text-align:center;
  box-shadow:0 0 60px rgba(255,215,0,0.15), 0 0 120px rgba(0,0,0,0.8);
  width:90%; max-width:300px;
  animation:popIn 0.25s ease;
  position:relative;
}
.modal-close-btn {
  position:absolute; top:12px; right:14px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  color:var(--muted); border-radius:6px;
  width:26px; height:26px;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; cursor:pointer; transition:all 0.2s;
}
.modal-close-btn:hover { color:var(--gold); border-color:rgba(255,215,0,0.3); }
.modal-avatar {
  width:80px; height:80px; border-radius:50%;
  object-fit:cover;
  border:2px solid var(--gold);
  box-shadow:0 0 20px rgba(255,215,0,0.3);
  margin:0 auto 12px;
  display:block;
}
.modal-avatar-placeholder {
  width:80px; height:80px; border-radius:50%;
  background:rgba(255,215,0,0.08);
  border:2px solid rgba(255,215,0,0.3);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 12px; font-size:28px; color:var(--muted);
}
.modal-name {
  font-family:'Orbitron',sans-serif;
  font-size:14px; font-weight:700; color:var(--text);
  margin-bottom:4px; letter-spacing:0.5px;
}
.modal-clubid {
  font-size:11px; color:var(--muted); letter-spacing:1px;
  text-transform:uppercase; margin-bottom:18px;
}
.modal-cp-box {
  background:rgba(255,215,0,0.06);
  border:1px solid rgba(255,215,0,0.18);
  border-radius:10px; padding:14px;
  margin-bottom:18px;
}
.modal-cp-label {
  font-size:9px; letter-spacing:2px; color:var(--muted);
  text-transform:uppercase; margin-bottom:4px;
}
.modal-cp-val-pos {
  font-family:'Orbitron',sans-serif;
  font-size:22px; font-weight:900; color:var(--gold);
  text-shadow:0 0 14px rgba(255,215,0,0.5);
}
.modal-cp-val-neg {
  font-family:'Orbitron',sans-serif;
  font-size:22px; font-weight:900; color:var(--red);
}
.modal-cp-sub {
  font-size:9px; color:var(--muted); margin-top:3px; letter-spacing:1px;
}

/* ── FOOTER ── */
.powered-by {
  position:relative; z-index:10;
  text-align:center; padding:16px 0 20px;
  font-family:'Orbitron',sans-serif;
  font-size:9px; letter-spacing:3px;
  color:var(--muted); text-transform:uppercase; opacity:0.45;
}

/* ── EMPTY ── */
.empty-row td {
  text-align:center; padding:40px;
  color:var(--muted); font-size:13px; letter-spacing:1px;
}

/* ── MOBILE ── */
@media(max-width:600px) {
  .wrap { padding:8px 4px 0; }
  .table-card { border-radius:10px; }
  .table-scroll { max-height:calc(100vh - 240px); }
  table { font-size:9px; }
  th { font-size:8px; padding:8px 5px; letter-spacing:0; }
  td { font-size:9px; padding:8px 5px; }
  td:first-child { padding-left:8px; }
  th:first-child { padding-left:8px; }
  .player-name { max-width:72px; font-size:9px; }
  .club-id-sub { max-width:72px; font-size:8px; }
  .club-avatar { width:24px; height:24px; }
  .club-avatar-placeholder { width:24px; height:24px; font-size:9px; }
  .club-cell { gap:5px; }
  .val-net-pos, .val-net-neg { font-size:9px; }
  .btn-claim { padding:4px 7px; font-size:9px; gap:3px; border-radius:5px; }
  .btn-locked { padding:4px 7px; font-size:9px; gap:3px; border-radius:5px; }
  .btn-claim i, .btn-locked i { display:none; }
  .header h1 { font-size:16px; }
  .header-desc { font-size:10px; }
  .bid-earn, .bid-deduct { font-size:9px; }
  .search-box input { font-size:11px; }
  .search-count { font-size:8px; padding:4px 7px; }
}
</style>
</head>

<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- LOADING -->
<div id="loading">
  <div class="loader-ring"></div>
  <div class="loader-text">LOADING CP DATA...</div>
</div>

<!-- TOPBAR -->
<a href="https://goatfcbd.com" class="topbar">
  <div class="top-left">
    <img src="https://i.imgur.com/LY3Bb9m.png" class="top-logo" alt="GOAT FC">
    <div class="top-title">GOAT FC</div>
  </div>
  <div class="home-btn"><i class="fa-solid fa-house"></i></div>
  <div class="topbar-glow"></div>
</a>

<!-- HEADER -->
<div class="header">
  <div class="header-badge">
    <i class="fa-solid fa-coins" style="font-size:19px;"></i>
    CP SYSTEM
  </div>
  <div class="header-desc">
    <i class="fa-solid fa-fire" style="color:var(--gold); margin-right:5px;"></i>
    Earn CP &bull; Manage Bids &bull; Claim Rewards &bull; Only the strongest rise
  </div>
</div>

<!-- TABLE -->
<div class="wrap">

  <!-- SEARCH -->
  <div class="search-wrapper">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Search Club ID... (GFC-001 or GFC001)" autocomplete="off">
      <button class="search-clear" id="search-clear" title="Clear"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="search-count" id="search-count">— CLUBS</div>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="text-align:left">Club ID</th>
            <th>Base</th>
            <th>Reward</th>
            <th>Bonus</th>
            <th>Sell</th>
            <th>Bid+/-</th>
            <th>Net CP</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="powered-by"><i class="fa-solid fa-bolt" style="margin-right:5px;"></i>POWERED BY GOAT FC</div>

<!-- WITHDRAW POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <div class="popup-icon">✅</div>
    <h2>Withdraw Request Sent!</h2>
    <p>Your request has been submitted.</p>
    <div class="popup-contact">
      <div><i class="fa-solid fa-envelope" style="color:var(--gold); margin-right:6px;"></i>goatfcbd@gmail.com</div>
      <div><i class="fa-brands fa-whatsapp" style="color:var(--green); margin-right:6px;"></i>+8801521253995</div>
    </div>
    <button class="popup-close" onclick="closePopup()">Close</button>
  </div>
</div>

<!-- PLAYER MODAL -->
<div class="player-modal" id="player-modal" onclick="closePlayerModal(event)">
  <div class="player-modal-content" id="player-modal-content">
    <button class="modal-close-btn" onclick="closePlayerModalDirect()"><i class="fa-solid fa-xmark"></i></button>
    <div id="modal-avatar-wrap"></div>
    <div class="modal-name" id="modal-name">—</div>
    <div class="modal-clubid" id="modal-clubid">—</div>
    <div class="modal-cp-box">
      <div class="modal-cp-label">Net CP Balance</div>
      <div id="modal-cp-val">—</div>
      <div class="modal-cp-sub" id="modal-cp-sub"></div>
    </div>
    <div id="modal-action"></div>
  </div>
</div>

<script>
const CP_URL     = "https://opensheet.elk.sh/1DSPKPaU1ZQYbFM4iYbE1VXgDAXU-FCT7--QhYJsNf1M/CP_System";
const MEMBERS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

let allRows = [];        // sorted CP data
let membersMap = {};     // clubIdNorm -> { name, pic }
let currentRows = [];    // filtered rows

/* ── Normalise club ID for matching ── */
function normId(id) {
  return String(id).toUpperCase().replace(/[^A-Z0-9]/g,'');
}

/* ── Parse CSV ── */
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    // Handle quoted fields
    const vals = [];
    let inQ = false, cur = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { vals.push(cur); cur = ''; }
      else cur += c;
    }
    vals.push(cur);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (vals[i]||'').trim(); });
    return obj;
  });
}

/* ── Load members ── */
async function loadMembers() {
  try {
    const res  = await fetch(MEMBERS_CSV);
    const text = await res.text();
    const rows = parseCSV(text);
    rows.forEach(r => {
      const raw = r["Club ID Number"] || r["Club ID"] || '';
      if (!raw) return;
      const key = normId(raw);
      membersMap[key] = {
        name: r["Full Name"] || '',
        pic:  r["Profile Picture (For Web)"] || ''
      };
    });
  } catch(e) { console.warn("Members load failed", e); }
}

/* ── Build avatar element ── */
function buildAvatar(clubId, size='sm') {
  const member = membersMap[normId(clubId)];
  if (member && member.pic) {
    const img = document.createElement('img');
    img.className = 'club-avatar';
    img.src = member.pic;
    img.alt = '';
    img.onerror = () => {
      const ph = document.createElement('div');
      ph.className = 'club-avatar-placeholder';
      ph.innerHTML = '<i class="fa-solid fa-user"></i>';
      img.replaceWith(ph);
    };
    return img;
  }
  const ph = document.createElement('div');
  ph.className = 'club-avatar-placeholder';
  ph.innerHTML = '<i class="fa-solid fa-user"></i>';
  return ph;
}

/* ── Render rows ── */
function renderRows(data) {
  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  if (!data.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="8"><i class="fa-solid fa-magnifying-glass" style="opacity:0.3; margin-right:8px;"></i>No clubs found</td></tr>`;
    updateCount(0);
    return;
  }

  data.forEach((club, i) => {
    const net    = parseInt(club["Net CP"]) || 0;
    const base   = club["Base CP"] || 0;
    const tour   = club["Tournamnet CP"] || 0;
    const bonus  = club["Bonus CP"] || 0;
    const earn   = club["Earn By Bid"] || 0;
    const sell   = club["Sell CP"] || 0;
    const deduct = club["Deduct By Bid"] || 0;
    const clubId = club["Player Club ID"] || "—";

    const member = membersMap[normId(clubId)] || {};
    const playerName = member.name || clubId;

    const netCls = net >= 0 ? 'val-net-pos' : 'val-net-neg';

    const actionBtn = (net >= 1000)
      ? `<button class="btn-claim" onclick="event.stopPropagation();withdraw('${clubId}')"><i class="fa-solid fa-coins"></i> Claim</button>`
      : `<button class="btn-locked" disabled><i class="fa-solid fa-lock"></i> Locked</button>`;

    const tr = document.createElement("tr");
    tr.style.animationDelay = `${i * 0.04}s`;
    tr.setAttribute('data-clubid', clubId);
    tr.setAttribute('data-net', net);
    tr.onclick = () => openPlayerModal(clubId, playerName, net, member.pic);

    // Avatar cell
    const tdClub = document.createElement('td');
    const cellDiv = document.createElement('div');
    cellDiv.className = 'club-cell';
    cellDiv.appendChild(buildAvatar(clubId));
    const infoDiv = document.createElement('div');
    infoDiv.className = 'club-info';
    infoDiv.innerHTML = `<div class="player-name">${playerName}</div><div class="club-id-sub">${clubId}</div>`;
    cellDiv.appendChild(infoDiv);
    tdClub.appendChild(cellDiv);

    tr.appendChild(tdClub);
    tr.innerHTML += `
      <td><span class="val-base">${base}</span></td>
      <td><span class="val-tour">${tour}</span></td>
      <td><span class="val-bonus">${bonus}</span></td>
      <td><span class="val-sell">${sell}</span></td>
      <td>
        <div class="bid-combined">
          <span class="bid-earn">+${earn}</span>
          <span class="bid-deduct">-${deduct}</span>
        </div>
      </td>
      <td><span class="${netCls}">${net}</span></td>
      <td>${actionBtn}</td>
    `;
    tbody.appendChild(tr);
  });

  updateCount(data.length);
}

function updateCount(n) {
  document.getElementById('search-count').textContent = `${n} CLUB${n !== 1 ? 'S' : ''}`;
}

/* ── Search ── */
function applySearch(q) {
  const norm = normId(q);
  if (!norm) {
    currentRows = allRows;
  } else {
    currentRows = allRows.filter(club => {
      const id = normId(club["Player Club ID"] || '');
      return id.includes(norm);
    });
  }
  renderRows(currentRows);

  const clearBtn = document.getElementById('search-clear');
  clearBtn.style.display = q ? 'block' : 'none';
}

document.getElementById('search-input').addEventListener('input', function() {
  applySearch(this.value);
});
document.getElementById('search-clear').addEventListener('click', function() {
  document.getElementById('search-input').value = '';
  applySearch('');
  document.getElementById('search-input').focus();
});

/* ── Player Modal ── */
function openPlayerModal(clubId, name, net, pic) {
  const modal = document.getElementById('player-modal');

  document.getElementById('modal-name').textContent = name || clubId;
  document.getElementById('modal-clubid').textContent = clubId;

  // Avatar
  const wrap = document.getElementById('modal-avatar-wrap');
  wrap.innerHTML = '';
  if (pic) {
    const img = document.createElement('img');
    img.className = 'modal-avatar';
    img.src = pic;
    img.alt = '';
    img.onerror = () => {
      const ph = document.createElement('div');
      ph.className = 'modal-avatar-placeholder';
      ph.innerHTML = '<i class="fa-solid fa-user"></i>';
      img.replaceWith(ph);
    };
    wrap.appendChild(img);
  } else {
    wrap.innerHTML = '<div class="modal-avatar-placeholder"><i class="fa-solid fa-user"></i></div>';
  }

  // Net CP
  const cpEl = document.getElementById('modal-cp-val');
  cpEl.className = net >= 0 ? 'modal-cp-val-pos' : 'modal-cp-val-neg';
  cpEl.textContent = net;
  document.getElementById('modal-cp-sub').textContent = net >= 1000 ? '✅ Eligible to claim' : `Need ${1000 - net} more CP to claim`;

  // Action
  const actEl = document.getElementById('modal-action');
  if (net >= 1000) {
    actEl.innerHTML = `<button class="btn-claim" style="width:100%;justify-content:center;padding:10px;" onclick="withdraw('${clubId}')"><i class="fa-solid fa-coins"></i> Claim Reward</button>`;
  } else {
    actEl.innerHTML = `<button class="btn-locked" style="width:100%;justify-content:center;padding:10px;" disabled><i class="fa-solid fa-lock"></i> Locked</button>`;
  }

  modal.classList.add('show');
}

function closePlayerModal(e) {
  if (e.target === document.getElementById('player-modal')) {
    document.getElementById('player-modal').classList.remove('show');
  }
}
function closePlayerModalDirect() {
  document.getElementById('player-modal').classList.remove('show');
}

/* ── Withdraw ── */
function withdraw(id) {
  const email   = "goatfcbd@gmail.com";
  const subject = "GOAT FC CP Withdraw Request";
  const body    = `Club ID: ${id} requesting 1000 CP withdraw`;
  window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  document.getElementById("popup").style.visibility = "visible";
}

function closePopup() {
  document.getElementById("popup").style.visibility = "hidden";
}

/* ── Main Load ── */
async function loadData() {
  try {
    const [cpData] = await Promise.all([
      fetch(CP_URL).then(r => r.json()),
      loadMembers()
    ]);

    cpData.sort((a, b) => (parseInt(b["Net CP"]) || 0) - (parseInt(a["Net CP"]) || 0));
    allRows = cpData;
    currentRows = cpData;

    if (!cpData.length) {
      document.getElementById("table-body").innerHTML =
        `<tr class="empty-row"><td colspan="8"><i class="fa-solid fa-coins" style="opacity:0.3; margin-right:8px;"></i>No data available</td></tr>`;
      updateCount(0);
      return;
    }

    renderRows(allRows);
  } catch(e) {
    document.getElementById("table-body").innerHTML =
      `<tr class="empty-row"><td colspan="8">Failed to load data. Please refresh.</td></tr>`;
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}

loadData();
</script>
</body>
</html>
