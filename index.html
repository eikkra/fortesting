<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GOAT FC Statistics</title>

<link rel="icon" href="https://i.imgur.com/LY3Bb9m.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
:root{
--bg:#030712;
--card:#071426;
--cyan:#00f5ff;
--green:#00ff88;
--red:#ff4d6d;
--yellow:#ffd60a;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
font-family:'Rajdhani',sans-serif;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#00f5ff18,transparent 30%),
radial-gradient(circle at bottom right,#00ff8810,transparent 30%);
z-index:-1;
}

.topbar{
height:50px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
background:#020617ee;
backdrop-filter:blur(10px);
border-bottom:1px solid #00f5ff15;
position:sticky;
top:0;
z-index:999;
}

.top-left{
display:flex;
align-items:center;
gap:8px;
}

.top-logo{
width:24px;
filter:drop-shadow(0 0 6px #00f5ff);
}

.top-title{
font-family:'Orbitron',sans-serif;
font-size:11px;
font-weight:700;
letter-spacing:1px;
color:var(--cyan);
}

.home-btn{
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
background:#0f172a;
border:1px solid #00f5ff20;
color:var(--cyan);
}

.hero{
padding:18px 12px 10px;
text-align:center;
}

.hero-title{
font-family:'Orbitron',sans-serif;
font-size:28px;
font-weight:800;
background:linear-gradient(90deg,#00f5ff,#ffffff,#00ff88);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-sub{
margin-top:8px;
font-size:12px;
letter-spacing:2px;
color:var(--muted);
}

.search-wrap{
padding:10px 14px 18px;
display:flex;
justify-content:center;
}

.search{
width:100%;
max-width:550px;
padding:13px 16px;
border-radius:16px;
background:#071426;
border:1px solid #00f5ff35;
color:white;
outline:none;
font-size:14px;
font-family:'Rajdhani';
}

.filters{
display:flex;
justify-content:center;
gap:10px;
padding-bottom:20px;
flex-wrap:wrap;
}

.filter-btn{
padding:10px 18px;
border:none;
border-radius:12px;
background:#071426;
border:1px solid #00f5ff25;
color:#00f5ff;
font-weight:700;
font-family:'Rajdhani';
cursor:pointer;
}

.filter-btn.active{
background:#00f5ff;
color:#001018;
}

#data{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:16px;
padding:0 14px 25px;
}

.card{
background:linear-gradient(145deg,#071426,#08111f);
border-radius:24px;
padding:14px;
border:1px solid #00f5ff20;
box-shadow:0 0 15px #000,0 0 10px #00f5ff10;
position:relative;
overflow:hidden;
}

.rank1{
border-color:gold;
box-shadow:0 0 20px gold;
}

.rank2{
border-color:silver;
box-shadow:0 0 18px silver;
}

.rank3{
border-color:#cd7f32;
box-shadow:0 0 18px #cd7f32;
}

.top10{
border-color:#a855f7;
box-shadow:0 0 16px #a855f7;
}

.top-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.badge{
padding:7px 12px;
border-radius:12px;
font-size:12px;
font-weight:800;
}

.rank-badge{
background:#00f5ff15;
border:1px solid #00f5ff30;
color:#00f5ff;
}

.mode-badge{
background:#00ff8815;
border:1px solid #00ff8830;
color:#00ff88;
}

.player{
text-align:center;
margin-bottom:14px;
}

.player-name{
font-size:22px;
font-weight:800;
color:#00ff88;
}

.player-id{
margin-top:3px;
font-size:13px;
font-weight:700;
color:#00f5ff;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.box{
padding:10px 6px;
border-radius:14px;
background:#081a2d;
border:1px solid #00f5ff20;
text-align:center;
}

.box-title{
font-size:10px;
font-weight:700;
letter-spacing:1px;
color:#94a3b8;
}

.box-value{
margin-top:4px;
font-size:17px;
font-weight:800;
font-family:'Orbitron';
}

.win{color:#00ff88;}
.loss{color:#ff4d6d;}
.draw{color:#ffd60a;}
.cyan{color:#00f5ff;}

.download{
margin-top:14px;
text-align:center;
}

.download button{
padding:10px 18px;
border:none;
border-radius:14px;
background:#00f5ff;
color:#001018;
font-weight:800;
font-family:'Rajdhani';
cursor:pointer;
}

.loader{
padding:50px 20px;
text-align:center;
font-size:18px;
color:#00f5ff;
}

@media(max-width:768px){
.hero-title{font-size:22px;}
#data{grid-template-columns:1fr;padding:0 10px 20px;}
.box-value{font-size:14px;}
}
</style>
</head>
<body>

<div class="topbar">
<div class="top-left">
<img src="https://i.imgur.com/LY3Bb9m.png" class="top-logo">
<div class="top-title">GOAT FC</div>
</div>
<div class="home-btn">🏠</div>
</div>

<div class="hero">
<div class="hero-title">GOAT FC STATISTICS</div>
<div class="hero-sub">ELITE PERFORMANCE DASHBOARD</div>
</div>

<div class="search-wrap">
<input type="text" id="search" class="search" placeholder="Search Player Name or Club ID..." oninput="render()">
</div>

<div class="filters">
<button class="filter-btn active" onclick="changeMode('overall',this)">OVERALL</button>
<button class="filter-btn" onclick="changeMode('monthly',this)">MONTHLY</button>
</div>

<div id="data">
<div class="loader">Loading Statistics...</div>
</div>

<script>

const MATCH_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv';

const MEMBER_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=133947099&single=true&output=csv';

let overallData={};
let monthlyData={};
let members={};
let currentMode='overall';

function changeMode(mode,btn){
currentMode=mode;
document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
btn.classList.add('active');
render();
}

function normalize(x){
return (x||'').toString().toLowerCase().replace(/[^a-z0-9]/g,'');
}

function parseCSV(text){
const rows=[];
let row=[];
let col='';
let insideQuote=false;

for(let i=0;i<text.length;i++){
const char=text[i];

if(char==='"'){
insideQuote=!insideQuote;
}
else if(char===',' && !insideQuote){
row.push(col);
col='';
}
else if((char==='\n' || char==='\r') && !insideQuote){
if(col || row.length){
row.push(col);
rows.push(row);
row=[];
col='';
}
}
else{
col+=char;
}
}

if(col || row.length){
row.push(col);
rows.push(row);
}

return rows;
}

function createPlayer(store,id){
if(!store[id]){
store[id]={
match:0,
win:0,
loss:0,
draw:0,
gs:0,
gc:0,
diff:0,
seven:0,
winp:0,
rate:0
};
}
}

function updateStats(store,id,scored,conceded){
createPlayer(store,id);

const p=store[id];

p.match++;
p.gs+=scored;
p.gc+=conceded;
p.diff=p.gs-p.gc;

if(scored>conceded) p.win++;
else if(scored<conceded) p.loss++;
else p.draw++;

if(scored>=7) p.seven++;

p.winp=((p.win/p.match)*100)||0;
p.rate=(p.gs/p.match)||0;
}

async function load(){

try{

const [matchRes,memberRes]=await Promise.all([
fetch(MATCH_URL+'&t='+Date.now()),
fetch(MEMBER_URL+'&t='+Date.now())
]);

const matchText=await matchRes.text();
const memberText=await memberRes.text();

const matchRows=parseCSV(matchText);
const memberRows=parseCSV(memberText);

memberRows.slice(1).forEach(r=>{
if(!r.length) return;

const id=normalize(r[1]);

members[id]={
name:r[0]||'Unknown Player'
};
});

const now=new Date();
const currentMonth=now.getMonth()+1;
const currentYear=now.getFullYear();

matchRows.slice(1).forEach(r=>{

if(!r.length) return;

const approved=(r[9]||'').toLowerCase().trim();
if(approved!=='yes') return;

const p1=normalize(r[0]);
const p2=normalize(r[1]);

const s1=parseInt(r[3])||0;
const s2=parseInt(r[4])||0;

if(!p1 || !p2) return;

updateStats(overallData,p1,s1,s2);
updateStats(overallData,p2,s2,s1);

const dateStr=r[11]||'';
const matchDate=new Date(dateStr);

if(!isNaN(matchDate)){

const m=matchDate.getMonth()+1;
const y=matchDate.getFullYear();

if(m===currentMonth && y===currentYear){
updateStats(monthlyData,p1,s1,s2);
updateStats(monthlyData,p2,s2,s1);
}

}

});

render();

}catch(err){
console.error(err);
document.getElementById('data').innerHTML=`<div class="loader">Failed To Load Data</div>`;
}

}

function render(){

const q=normalize(document.getElementById('search').value);

const source=currentMode==='overall'
?overallData
:monthlyData;

const sorted=Object.entries(source)
.sort((a,b)=>{

if(b[1].win!==a[1].win)
return b[1].win-a[1].win;

if(b[1].diff!==a[1].diff)
return b[1].diff-a[1].diff;

return b[1].gs-a[1].gs;

});

let html='';

sorted.forEach(([id,p],index)=>{

const name=members[id]?.name||'Unknown Player';

if(q){
if(!normalize(name).includes(q) && !normalize(id).includes(q)){
return;
}
}

let cls='card';

if(index===0) cls+=' rank1';
else if(index===1) cls+=' rank2';
else if(index===2) cls+=' rank3';
else if(index<10) cls+=' top10';

html+=`
<div class="${cls}">

<div class="top-row">
<div class="badge rank-badge">RANK #${index+1}</div>
<div class="badge mode-badge">${currentMode.toUpperCase()}</div>
</div>

<div class="player">
<div class="player-name">${name}</div>
<div class="player-id">${id.toUpperCase()}</div>
</div>

<div class="grid">

<div class="box">
<div class="box-title">WINS</div>
<div class="box-value win">${p.win}</div>
</div>

<div class="box">
<div class="box-title">LOSS</div>
<div class="box-value loss">${p.loss}</div>
</div>

<div class="box">
<div class="box-title">DRAW</div>
<div class="box-value draw">${p.draw}</div>
</div>

<div class="box">
<div class="box-title">MATCH</div>
<div class="box-value cyan">${p.match}</div>
</div>

<div class="box">
<div class="box-title">WIN%</div>
<div class="box-value cyan">${p.winp.toFixed(1)}</div>
</div>

<div class="box">
<div class="box-title">RATE</div>
<div class="box-value cyan">${p.rate.toFixed(2)}</div>
</div>

<div class="box">
<div class="box-title">SCORED</div>
<div class="box-value win">${p.gs}</div>
</div>

<div class="box">
<div class="box-title">CONCEDED</div>
<div class="box-value loss">${p.gc}</div>
</div>

<div class="box">
<div class="box-title">DIFF</div>
<div class="box-value cyan">${p.diff}</div>
</div>

<div class="box">
<div class="box-title">7+ GOALS</div>
<div class="box-value draw">${p.seven}</div>
</div>

</div>

<div class="download">
<button onclick="downloadCard(this)">Download Card</button>
</div>

</div>`;

});

if(!html){
html='<div class="loader">No Data Found</div>';
}

document.getElementById('data').innerHTML=html;

}

function downloadCard(btn){
html2canvas(btn.closest('.card')).then(canvas=>{
const a=document.createElement('a');
a.download='GOAT_FC_STATISTICS.jpg';
a.href=canvas.toDataURL('image/jpeg');
a.click();
});
}

load();

</script>
</body>
</html>
