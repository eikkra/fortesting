<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GOAT FC PRO DASHBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

:root{
--bg:#050816;
--card:#0b1220;
--cyan:#00f5ff;
--green:#00ff88;
--yellow:#ffd60a;
--red:#ff4d6d;
--muted:#94a3b8;
}

body{
margin:0;
font-family:'Rajdhani';
background:var(--bg);
color:white;
}

.header{
text-align:center;
padding:18px;
}

.header h1{
font-family:'Orbitron';
color:var(--cyan);
font-size:22px;
margin:0;
}

.toggle{
display:flex;
justify-content:center;
gap:10px;
margin:10px;
}

.toggle button{
padding:6px 12px;
border-radius:10px;
border:1px solid #00f5ff40;
background:#0b1220;
color:#00f5ff;
cursor:pointer;
}

.toggle button.active{
background:#00f5ff;
color:black;
}

#grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:10px;
padding:10px;
}

.card{
background:linear-gradient(145deg,#0b1220,#060a14);
border:1px solid #00f5ff30;
border-radius:14px;
padding:10px;
box-shadow:0 0 10px #000;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:6px;
}

.name{
font-weight:700;
font-size:14px;
}

.id{
color:var(--cyan);
font-size:12px;
}

.badge{
font-size:11px;
padding:3px 8px;
border-radius:20px;
background:#00f5ff15;
border:1px solid #00f5ff30;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}

.box{
background:#0a1020;
border:1px solid #00f5ff20;
border-radius:8px;
padding:5px 6px;   /* 🔥 compact */
font-size:11px;
text-align:center;
}

.rank{color:gold}
.cp{color:#ffd60a}

</style>
</head>

<body>

<div class="header">
<h1>GOAT FC STATISTICS</h1>
</div>

<div class="toggle">
<button class="active" onclick="setMode('overall')">Overall</button>
<button onclick="setMode('monthly')">Monthly</button>
</div>

<div id="grid"></div>

<script>

const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLEME9M9cSy9FvfHvcx2gMPkp1H5Dj4YaKufPRsAyon8Tf-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";

let mode="overall";
let data={};

function csvToArray(str){
let rows=[],row=[],val="",q=false;
for(let c of str){
if(c=='"') q=!q;
else if(c==','&&!q){row.push(val);val=""}
else if(c=='\n'){row.push(val);rows.push(row);row=[];val=""}
else val+=c;
}
return rows;
}

function normalize(x){
return (x||"").toLowerCase().replace(/[^a-z0-9]/g,'');
}

async function load(){
let txt=await fetch(CSV).then(r=>r.text());
let rows=csvToArray(txt).slice(1);

rows.forEach(r=>{
let p1=r[0], p2=r[1];
let type=r[2];
let s1=+r[3], s2=+r[4];
let p1pt=+r[5], p2pt=+r[6];
let date=r[11];

if(!p1||!p2||isNaN(s1)||isNaN(s2)) return;

add(p1,s1,s2,p1pt,type,date);
add(p2,s2,s1,p2pt,type,date);
});

render();
}

function add(id,gs,gc,pt,type,date){

if(!data[id]){
data[id]={win:0,loss:0,draw:0,gs:0,gc:0,pt:0,match:0};
}

let d=data[id];

d.match++;
d.gs+=gs;
d.gc+=gc;
d.pt+=pt;

if(gs>gc) d.win++;
else if(gs<gc) d.loss++;
else d.draw++;

d.diff=d.gs-d.gc;
d.wr=(d.win/d.match*100).toFixed(1);
d.rate=(d.gs/d.match).toFixed(2);
}

function render(){

let arr=Object.entries(data)
.sort((a,b)=>b[1].pt-a[1].pt||b[1].win-a[1].win||b[1].diff-a[1].diff);

let html="";

arr.forEach(([id,p],i)=>{

let rankClass=i==0?"rank":"";

html+=`
<div class="card">

<div class="top">
<div>
<div class="name">${id}</div>
<div class="id">${id}</div>
</div>
<div class="badge ${rankClass}">#${i+1}</div>
</div>

<div class="stats">

<div class="box">🏆 ${p.win}</div>
<div class="box">❌ ${p.loss}</div>
<div class="box">🤝 ${p.draw}</div>

<div class="box">🎮 ${p.match}</div>
<div class="box">📊 ${p.wr}%</div>
<div class="box">⚽ ${p.rate}</div>

<div class="box">⚽ ${p.gs}</div>
<div class="box">🛡 ${p.gc}</div>
<div class="box">📈 ${p.diff}</div>

</div>

</div>
`;
});

document.getElementById("grid").innerHTML=html;
}

function setMode(m){
mode=m;
document.querySelectorAll(".toggle button").forEach(b=>b.classList.remove("active"));
event.target.classList.add("active");
}

load();

</script>

</body>
</html>
