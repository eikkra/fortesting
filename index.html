<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC Score Submit</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4134818762312221"
     crossorigin="anonymous"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    background:#05070d;
    min-height:100vh;
    padding:15px;
}

/* AD BOX */
.ad-box{
    max-width:1100px;
    margin:0 auto 20px;
    padding:14px;
    border-radius:18px;
    background:linear-gradient(90deg,#00ffff22,#8b5cf622,#ff00ff22);
    border:1px solid rgba(0,255,255,.25);
    box-shadow:0 0 25px rgba(0,255,255,.12);
    backdrop-filter:blur(8px);
}

/* FORM BUTTON */
.open-btn{
    width:100%;
    max-width:1100px;
    margin:auto;
    display:block;
    padding:22px;
    border:none;
    border-radius:18px;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
    color:#fff;
    letter-spacing:1px;
    background:linear-gradient(90deg,#00ffff,#8b5cf6,#ff00ff);
    background-size:300%;
    animation:rgbFlow 6s linear infinite;
    box-shadow:
        0 0 20px rgba(0,255,255,.3),
        0 0 35px rgba(139,92,246,.2);
    transition:.3s;
}

.open-btn:hover{
    transform:translateY(-2px) scale(1.01);
}

.preview-box{
    max-width:1100px;
    margin:20px auto 0;
    padding:30px;
    border-radius:18px;
    background:#0b0f18;
    text-align:center;
    color:#9ca3af;
    border:1px solid rgba(255,255,255,.05);
}

@keyframes rgbFlow{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
}

@media(max-width:768px){
    .open-btn{
        font-size:16px;
        padding:18px;
    }
}
</style>
</head>
<body>

<!-- TOP AD -->
<div class="ad-box">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-4134818762312221"
         data-ad-slot="9931450669"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</div>

<!-- FORM BUTTON -->
<button class="open-btn"
onclick="window.open('https://forms.gle/Ye9pfHMbs35AqQnW6','scoreSubmitWindow','width=900,height=900')">
    OPEN SCORE SUBMIT FORM
</button>

<div class="preview-box">
    Click the button above to submit your score.<br>
    Form opens in popup for image upload compatibility.
</div>

</body>
</html>
