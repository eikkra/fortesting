<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GOAT FC — Match Center</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#060610;
  --neon-cyan:#00f0ff;
  --neon-purple:#bf00ff;
  --neon-green:#00ff88;
  --neon-pink:#ff007a;
  --header-h:48px;
  --footer-h:56px;
}

/* ── KEYFRAMES ── */
@keyframes logoGlow{
  0%,100%{filter:drop-shadow(0 0 6px #00f0ff) brightness(1.1);}
  50%{filter:drop-shadow(0 0 14px #00f0ff) drop-shadow(0 0 28px rgba(191,0,255,0.4)) brightness(1.2);}
}
@keyframes titleShimmer{
  0%{background-position:0% center;}
  100%{background-position:300% center;}
}
@keyframes scanLine{
  0%{transform:translateY(-100%);}
  100%{transform:translateY(400%);}
}
@keyframes borderPulse{
  0%,100%{opacity:0.15;}
  50%{opacity:0.4;}
}
@keyframes activeTabGlow{
  0%,100%{box-shadow:0 0 8px rgba(0,240,255,0.3),inset 0 0 8px rgba(0,240,255,0.05);}
  50%{box-shadow:0 0 16px rgba(0,240,255,0.5),inset 0 0 12px rgba(0,240,255,0.08);}
}
@keyframes activeDot{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.5;transform:scale(1.5);}
}
@keyframes iframeReveal{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes spinnerRing{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
@keyframes ripple{
  0%{transform:scale(0);opacity:0.5;}
  100%{transform:scale(4);opacity:0;}
}
@keyframes headerScan{
  0%{left:-100%;}
  100%{left:200%;}
}

/* ── BODY ── */
html,body{
  height:100%;
  overflow:hidden;
  background:var(--bg);
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 10% 0%,rgba(0,240,255,0.06) 0%,transparent 40%),
    radial-gradient(ellipse at 90% 100%,rgba(191,0,255,0.06) 0%,transparent 40%);
  pointer-events:none;z-index:0;
}
/* Subtle grid */
body::after{
  content:"";
  position:fixed;inset:0;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(0,240,255,0.007) 59px,rgba(0,240,255,0.007) 60px),
    repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(0,240,255,0.005) 59px,rgba(0,240,255,0.005) 60px);
  pointer-events:none;z-index:0;
}

/* ── HEADER ── */
.header{
  position:fixed;top:0;left:0;right:0;
  height:var(--header-h);
  z-index:1000;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(4,4,14,0.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,240,255,0.12);
  overflow:hidden;
}
/* Animated scan line on header */
.header::before{
  content:"";
  position:absolute;
  top:0;bottom:0;
  width:60px;
  background:linear-gradient(90deg,transparent,rgba(0,240,255,0.06),transparent);
  animation:headerScan 4s ease-in-out infinite;
  pointer-events:none;
}
/* Bottom border glow */
.header::after{
  content:"";
  position:absolute;
  bottom:0;left:10%;right:10%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,240,255,0.5),rgba(191,0,255,0.3),rgba(0,240,255,0.5),transparent);
  animation:borderPulse 3s ease-in-out infinite;
}

/* Logo area */
.header-logo{
  display:flex;align-items:center;gap:9px;
  text-decoration:none;flex-shrink:0;
}
.header-logo img{
  height:25px;
  animation:logoGlow 3s ease-in-out infinite;
}
.header-logo-text{
  font-family:'Orbitron',sans-serif;
  font-size:13px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

/* Match Center badge */
.header-badge{
  font-family:'Exo 2',sans-serif;
  font-size:8px;font-weight:800;letter-spacing:2px;
  color:rgba(0,240,255,0.7);
  text-transform:uppercase;
  padding:3px 8px;
  border:1px solid rgba(0,240,255,0.2);
  border-radius:3px;
  background:rgba(0,240,255,0.04);
  white-space:nowrap;
}

/* Home icon */
.header-home{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;
  border-radius:5px;
  border:1px solid rgba(0,240,255,0.18);
  background:rgba(0,240,255,0.04);
  color:rgba(0,240,255,0.7);
  font-size:13px;
  text-decoration:none;
  transition:all .2s;
  flex-shrink:0;
}
.header-home:hover{
  color:#00f0ff;
  border-color:rgba(0,240,255,0.45);
  background:rgba(0,240,255,0.1);
  box-shadow:0 0 12px rgba(0,240,255,0.2);
}

/* ── IFRAME AREA ── */
.main{
  position:fixed;
  top:var(--header-h);
  bottom:var(--footer-h);
  left:0;right:0;
  z-index:1;
  background:var(--bg);
}
iframe{
  width:100%;height:100%;
  border:none;
  display:block;
  animation:iframeReveal .5s ease;
}

/* Loading overlay */
.iframe-loader{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;
  background:var(--bg);
  z-index:10;
  transition:opacity .4s ease;
}
.iframe-loader.hidden{opacity:0;pointer-events:none;}
.spinner{
  position:relative;width:44px;height:44px;
}
.spinner-ring{
  position:absolute;inset:0;
  border-radius:50%;
  border:2px solid transparent;
  border-top-color:var(--neon-cyan);
  animation:spinnerRing 1s linear infinite;
}
.spinner-ring2{
  position:absolute;inset:5px;
  border-radius:50%;
  border:2px solid transparent;
  border-top-color:var(--neon-purple);
  animation:spinnerRing .7s linear infinite reverse;
}
.spinner-dot{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:6px;height:6px;
  border-radius:50%;
  background:var(--neon-cyan);
  box-shadow:0 0 8px var(--neon-cyan);
}
.loader-text{
  font-family:'Orbitron',sans-serif;
  font-size:8px;font-weight:900;letter-spacing:4px;
  color:rgba(0,240,255,0.5);
  text-transform:uppercase;
}

/* ── FOOTER ── */
.footer{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--footer-h);
  z-index:1000;
  display:flex;align-items:center;
  justify-content:space-around;
  background:rgba(4,4,14,0.97);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,240,255,0.1);
  padding:0 4px;
  overflow:hidden;
}
/* Top border glow */
.footer::before{
  content:"";
  position:absolute;
  top:0;left:10%;right:10%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,240,255,0.4),rgba(191,0,255,0.25),rgba(0,240,255,0.4),transparent);
  animation:borderPulse 3s ease-in-out infinite;
}

/* Nav tab */
.nav-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;
  padding:6px 10px;
  border-radius:6px;
  text-decoration:none;
  cursor:pointer;
  position:relative;
  flex:1;max-width:70px;
  border:1px solid transparent;
  background:transparent;
  transition:all .22s ease;
  overflow:hidden;
  /* Ripple origin */
  -webkit-tap-highlight-color:transparent;
}
.nav-tab-icon{
  font-size:15px;
  color:rgba(180,200,220,0.45);
  transition:all .22s;
  line-height:1;
}
.nav-tab-label{
  font-family:'Exo 2',sans-serif;
  font-size:7.5px;font-weight:800;letter-spacing:0.8px;
  color:rgba(180,200,220,0.4);
  text-transform:uppercase;
  transition:all .22s;
  white-space:nowrap;
}

/* Active state */
.nav-tab.active{
  border-color:rgba(0,240,255,0.22);
  background:rgba(0,240,255,0.05);
  animation:activeTabGlow 2.5s ease-in-out infinite;
}
.nav-tab.active .nav-tab-icon{
  color:var(--neon-cyan);
  text-shadow:0 0 10px var(--neon-cyan),0 0 20px rgba(0,240,255,0.4);
}
.nav-tab.active .nav-tab-label{
  color:rgba(0,240,255,0.85);
  text-shadow:0 0 8px rgba(0,240,255,0.4);
}
/* Active dot indicator */
.nav-tab.active::after{
  content:"";
  position:absolute;
  bottom:3px;
  width:4px;height:4px;
  border-radius:50%;
  background:var(--neon-cyan);
  box-shadow:0 0 6px var(--neon-cyan);
  animation:activeDot 1.5s ease-in-out infinite;
}

/* Hover */
.nav-tab:hover .nav-tab-icon{
  color:rgba(0,240,255,0.7);
  text-shadow:0 0 8px rgba(0,240,255,0.3);
  transform:translateY(-1px);
}
.nav-tab:hover .nav-tab-label{
  color:rgba(0,240,255,0.6);
}

/* Ripple */
.nav-ripple{
  position:absolute;
  border-radius:50%;
  width:50px;height:50px;
  margin-top:-25px;margin-left:-25px;
  background:radial-gradient(circle,rgba(0,240,255,0.25) 0%,transparent 70%);
  transform:scale(0);opacity:0;
  pointer-events:none;
}
.nav-tab:active .nav-ripple{
  animation:ripple .5s ease-out forwards;
}

/* ── MOBILE ── */
@media(max-width:480px){
  :root{--header-h:44px;--footer-h:52px;}
  .header-logo-text{font-size:11px;letter-spacing:2px;}
  .header-logo img{height:22px;}
  .header-badge{font-size:7px;padding:2px 6px;letter-spacing:1.5px;}
  .nav-tab{padding:5px 6px;max-width:62px;}
  .nav-tab-icon{font-size:14px;}
  .nav-tab-label{font-size:7px;}
}
@media(max-width:360px){
  .header-badge{display:none;}
  .nav-tab-label{font-size:6.5px;letter-spacing:0.5px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <a href="https://goatfcbd.com" class="header-logo">
    <img src="https://i.imgur.com/LY3Bb9m.png" alt="GOAT FC">
    <span class="header-logo-text">GOAT FC</span>
  </a>

  <div class="header-badge">⚽ Match Center</div>

  <a href="https://goatfcbd.com" class="header-home" title="Home">
    <i class="fa-solid fa-house"></i>
  </a>
</header>

<!-- IFRAME AREA -->
<div class="main">
  <!-- Loading spinner -->
  <div class="iframe-loader" id="iframeLoader">
    <div class="spinner">
      <div class="spinner-ring"></div>
      <div class="spinner-ring2"></div>
      <div class="spinner-dot"></div>
    </div>
    <div class="loader-text">Loading...</div>
  </div>
  <iframe id="mainFrame" onload="hideLoader()" src="about:blank"></iframe>
</div>

<!-- FOOTER NAV -->
<nav class="footer" id="footerNav">

  <a class="nav-tab" id="tab-register" href="https://forms.gle/DQ9KhxWL3bkrBMNSA" target="_blank">
    <span class="nav-ripple"></span>
    <i class="nav-tab-icon fa-solid fa-user-plus"></i>
    <span class="nav-tab-label">Register</span>
  </a>

  <a class="nav-tab" id="tab-icard" href="https://goatfcbd.com/roster/" target="_blank">
    <span class="nav-ripple"></span>
    <i class="nav-tab-icon fa-solid fa-id-card"></i>
    <span class="nav-tab-label">iCard</span>
  </a>

  <a class="nav-tab active" id="tab-score" href="#" onclick="loadFrame(event,'score')">
    <span class="nav-ripple"></span>
    <i class="nav-tab-icon fa-solid fa-arrow-up-from-bracket"></i>
    <span class="nav-tab-label">Score Up</span>
  </a>

  <a class="nav-tab" id="tab-matchlog" href="https://goatfcbd.com/matchlog/" target="_blank">
    <span class="nav-ripple"></span>
    <i class="nav-tab-icon fa-solid fa-list-check"></i>
    <span class="nav-tab-label">Match Log</span>
  </a>

  <a class="nav-tab" id="tab-rules" href="https://goatfcbd.com/rules/" target="_blank">
    <span class="nav-ripple"></span>
    <i class="nav-tab-icon fa-solid fa-scale-balanced"></i>
    <span class="nav-tab-label">Rules</span>
  </a>

</nav>

<script>
/* ── CONFIG ── */
/* Links are hardcoded below; sheet still loads main_link for the iframe default */
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS3VQ-e6O8uHjlq8Lsdp5j0vxxOMZH1O17Nbo1ISGXDU_EFsuBEXNWydPbuhJ46lnxqJmevXaN2xPiL/pub?gid=368635247&single=true&output=csv";

/* Parse CSV key/value */
function parseKV(csv) {
  const lines = csv.trim().split('\n');
  const obj = {};
  lines.slice(1).forEach(line => {
    const parts = line.split(',');
    const k = (parts[0] || '').trim().replace(/"/g,'');
    const v = (parts.slice(1).join(',') || '').trim().replace(/"/g,'');
    if(k) obj[k] = v;
  });
  return obj;
}

/* Load sheet config — only use main_link from sheet; all nav links are hardcoded */
fetch(SHEET_CSV)
  .then(r => r.text())
  .then(csv => {
    const cfg = parseKV(csv);
    /* If sheet has a main_link, use it; else default to score form */
    const defaultSrc = cfg.main_link || cfg.score_link || 'https://forms.gle/Ye9pfHMbs35AqQnW6';
    document.getElementById('mainFrame').src = defaultSrc;
    /* Also update score tab href if sheet provides it */
    if(cfg.score_link) document.getElementById('tab-score').dataset.src = cfg.score_link;
  })
  .catch(() => {
    /* Fallback: load score form directly */
    document.getElementById('mainFrame').src = 'https://forms.gle/Ye9pfHMbs35AqQnW6';
  });

/* ── IFRAME LOADER ── */
function hideLoader() {
  const loader = document.getElementById('iframeLoader');
  loader.classList.add('hidden');
  setTimeout(() => loader.style.display = 'none', 500);
}

/* ── LOAD FRAME (for tabs that open inside iframe) ── */
function loadFrame(e, tabId) {
  e.preventDefault();
  const tab = document.getElementById('tab-' + tabId);
  const src = tab.dataset.src || tab.href;
  if(!src || src === '#') return;

  /* Show loader */
  const loader = document.getElementById('iframeLoader');
  loader.style.display = 'flex';
  loader.classList.remove('hidden');

  document.getElementById('mainFrame').src = src;

  /* Set active */
  setActive('tab-' + tabId);
}

/* ── SET ACTIVE TAB ── */
function setActive(id) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  const el = document.getElementById(id);
  if(el) el.classList.add('active');
}

/* ── RIPPLE on touch/click ── */
document.querySelectorAll('.nav-tab').forEach(tab => {
  function fireRipple(e) {
    const rip = tab.querySelector('.nav-ripple');
    const rect = tab.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    rip.style.left = x + 'px';
    rip.style.top  = y + 'px';
    rip.style.animation = 'none';
    void rip.offsetWidth;
    rip.style.animation = '';
  }
  tab.addEventListener('mousedown', fireRipple);
  tab.addEventListener('touchstart', fireRipple, {passive:true});
});
</script>
</body>
</html>
