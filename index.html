<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC Match Fixture</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#07110b;
    --card:#0d1f16;
    --green:#00ff88;
    --green2:#00d96f;
    --border:rgba(0,255,136,.22);
    --text:#e9fff4;
    --muted:#8ab39c;
    --shadow:0 0 20px rgba(0,255,136,.18);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:
        radial-gradient(circle at top left,#0d2517 0%,#07110b 40%,#030805 100%);
    color:var(--text);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

/* HEADER */
.header{
    text-align:center;
    margin-bottom:30px;
}

.logo{
    width:85px;
    height:85px;
    object-fit:contain;
    margin-bottom:10px;
    filter:drop-shadow(0 0 12px rgba(0,255,136,.4));
}

.club-name{
    font-family:'Orbitron',sans-serif;
    font-size:34px;
    font-weight:800;
    color:var(--green);
    text-shadow:0 0 18px rgba(0,255,136,.45);
}

.title{
    font-size:16px;
    color:var(--muted);
    margin-top:6px;
    letter-spacing:1px;
}

/* ROUND SELECTOR */
.round-selector{
    display:flex;
    justify-content:center;
    margin-bottom:25px;
}

select{
    background:var(--card);
    color:var(--green);
    border:1px solid var(--border);
    padding:14px 18px;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    outline:none;
    box-shadow:var(--shadow);
    cursor:pointer;
}

/* FIXTURE GRID */
.fixture-grid{
    display:grid;
    gap:18px;
}

.match-card{
    background:linear-gradient(135deg,#0d1f16,#10281c);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    box-shadow:var(--shadow);
    transition:.25s ease;
}

.match-card:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px rgba(0,255,136,.25);
}

.match-main{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
}

.team{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.team.away{
    justify-content:flex-end;
    text-align:right;
}

.team img{
    width:54px;
    height:54px;
    object-fit:cover;
    border-radius:14px;
    border:2px solid rgba(255,255,255,.08);
    background:#fff;
}

.team-name{
    font-size:17px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.vs{
    font-family:'Orbitron',sans-serif;
    font-size:22px;
    font-weight:800;
    color:var(--green);
    text-shadow:0 0 12px rgba(0,255,136,.45);
    min-width:70px;
    text-align:center;
}

.match-meta{
    margin-top:14px;
    display:flex;
    justify-content:center;
}

.join-btn{
    text-decoration:none;
    background:linear-gradient(90deg,var(--green),var(--green2));
    color:#03140a;
    font-weight:700;
    padding:10px 18px;
    border-radius:12px;
    font-size:14px;
    box-shadow:0 0 15px rgba(0,255,136,.35);
    transition:.2s ease;
}

.join-btn:hover{
    transform:scale(1.05);
}

.home-label{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-top:10px;
}

/* MOBILE */
@media(max-width:768px){
    .club-name{
        font-size:26px;
    }

    .team-name{
        font-size:14px;
    }

    .team img{
        width:44px;
        height:44px;
    }

    .vs{
        font-size:18px;
        min-width:50px;
    }

    .match-card{
        padding:14px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <img class="logo" src="https://i.imgur.com/LY3Bb9m.png" alt="GOAT FC Logo">
        <div class="club-name">GOAT FC</div>
        <div class="title">MATCH FIXTURE</div>
    </div>

    <div class="round-selector">
        <select id="roundSelect"></select>
    </div>

    <div class="fixture-grid" id="fixtureGrid">
        Loading Fixture...
    </div>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=467352529&single=true&output=csv";

let fixtures = [];

async function fetchCSV(){
    const res = await fetch(CSV_URL);
    const text = await res.text();

    const rows = text.trim().split("\n").map(r=>r.split(","));

    const headers = rows.shift();

    return rows.map(row=>({
        teamName: row[0]?.trim(),
        teamLogo: row[1]?.trim(),
        managerName: row[2]?.trim(),
        playerIds: row[3]?.trim(),
        startDate: row[4]?.trim(),
        endDate: row[5]?.trim(),
        matchType: row[6]?.trim(),
        matchGroup: row[7]?.trim()
    }));
}

/* ROUND ROBIN GENERATOR */
function generateFixtures(teams){

    let arr = [...teams];

    if(arr.length % 2 !== 0){
        arr.push({bye:true});
    }

    const rounds = arr.length - 1;
    const matchesPerRound = arr.length / 2;

    let allRounds = [];

    for(let round=0; round<rounds; round++){

        let roundMatches = [];

        for(let i=0; i<matchesPerRound; i++){

            const t1 = arr[i];
            const t2 = arr[arr.length-1-i];

            if(!t1.bye && !t2.bye){

                const homeAwayFlip = (round + i) % 2 === 0;

                roundMatches.push({
                    home: homeAwayFlip ? t1 : t2,
                    away: homeAwayFlip ? t2 : t1
                });
            }
        }

        allRounds.push(roundMatches);

        arr.splice(1,0,arr.pop());
    }

    return allRounds;
}

function renderRound(roundIndex){

    const grid = document.getElementById("fixtureGrid");
    grid.innerHTML = "";

    fixtures[roundIndex].forEach(match=>{

        grid.innerHTML += `
            <div class="match-card">
                <div class="match-main">

                    <div class="team home">
                        <img src="${match.home.teamLogo}" alt="">
                        <div class="team-name">${match.home.teamName}</div>
                    </div>

                    <div class="vs">VS</div>

                    <div class="team away">
                        <div class="team-name">${match.away.teamName}</div>
                        <img src="${match.away.teamLogo}" alt="">
                    </div>

                </div>

                <div class="match-meta">
                    <a href="${match.home.matchGroup}" target="_blank" class="join-btn">
                        JOIN MATCH GROUP
                    </a>
                </div>

                <div class="home-label">
                    Home Team: ${match.home.teamName}
                </div>
            </div>
        `;
    });
}

async function init(){

    const teams = await fetchCSV();

    fixtures = generateFixtures(teams);

    const roundSelect = document.getElementById("roundSelect");

    fixtures.forEach((_,i)=>{
        roundSelect.innerHTML += `
            <option value="${i}">Round ${i+1}</option>
        `;
    });

    roundSelect.addEventListener("change",e=>{
        renderRound(+e.target.value);
    });

    renderRound(0);
}

init();
</script>

</body>
</html>
