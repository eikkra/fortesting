<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PLAYERS HUB — GOAT FC</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Exo+2:wght@700;800;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
--bg:#060610;
--surface:#0d0d1a;
--surface2:#111122;
--surface3:#161628;
--border:#1e1e3a;
--border2:#252548;
--neon-cyan:#00f0ff;
--neon-purple:#bf00ff;
--neon-green:#00ff88;
--neon-pink:#ff007a;
--neon-yellow:#f5ff00;
--text:#eef0ff;
--muted:#5a5a80;
--muted2:#383860;
}

@keyframes shimmer{
0%{background-position:200% center;}
100%{background-position:-200% center;}
}

@keyframes rgbBorder{
0%{border-color:#00f0ff;box-shadow:0 0 14px #00f0ff50;}
33%{border-color:#bf00ff;box-shadow:0 0 14px #bf00ff50;}
66%{border-color:#ff007a;box-shadow:0 0 14px #ff007a50;}
100%{border-color:#00f0ff;box-shadow:0 0 14px #00f0ff50;}
}

@keyframes pulse{
0%,100%{opacity:1;}50%{opacity:0.3;}
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(18px);}
to{opacity:1;transform:translateY(0);}
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

@keyframes gradMove{
0%{background-position:0%;}
100%{background-position:200%;}
}

body{
background:var(--bg);
font-family:'Rajdhani',sans-serif;
color:var(--text);
min-height:100vh;
overflow-x:hidden;
padding-bottom:40px;
}

body::before{
content:"";
position:fixed;inset:0;
background:
radial-gradient(ellipse at 15% 15%,rgba(0,240,255,0.055) 0%,transparent 45%),
radial-gradient(ellipse at 85% 85%,rgba(191,0,255,0.055) 0%,transparent 45%),
radial-gradient(ellipse at 50% 50%,rgba(0,255,136,0.02) 0%,transparent 60%);
pointer-events:none;z-index:-1;
}

/* ── TOPBAR ── */
.topbar{
height:46px;
display:flex;align-items:center;justify-content:space-between;
padding:0 14px;
background:rgba(6,6,16,0.97);
border-bottom:1px solid rgba(0,240,255,0.12);
position:sticky;top:0;z-index:999;
backdrop-filter:blur(14px);
text-decoration:none;
box-shadow:0 2px 20px rgba(0,240,255,0.05);
}

.top-left{display:flex;align-items:center;gap:8px;}

.top-logo{
width:20px;
filter:drop-shadow(0 0 7px #00f0ff) brightness(1.1);
}

.top-title{
font-family:'Orbitron',sans-serif;
font-size:12px;font-weight:900;letter-spacing:3px;
background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.home-btn{
width:30px;height:30px;
display:flex;align-items:center;justify-content:center;
border-radius:6px;
border:1px solid rgba(0,240,255,0.15);
color:var(--neon-cyan);font-size:11px;
transition:all .2s;
}
.home-btn:hover{background:rgba(0,240,255,0.08);box-shadow:0 0 10px rgba(0,240,255,0.2);}

/* ── HERO ── */
.hero{
text-align:center;
padding:20px 16px 14px;
}

.hero-title{
font-family:'Orbitron',sans-serif;
font-size:26px;font-weight:900;letter-spacing:7px;
background:linear-gradient(90deg,#00f0ff,#bf00ff,#ff007a,#f5ff00,#00f0ff);
background-size:300% auto;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation:shimmer 4s linear infinite;
line-height:1;
}

.hero-slogan{
margin-top:6px;
font-family:'Exo 2',sans-serif;
font-size:10px;font-weight:700;
letter-spacing:5px;
color:var(--muted);
text-transform:uppercase;
}

/* ── WRAP ── */
.wrap{
width:100%;max-width:900px;
margin:0 auto;
padding:0 10px;
}

/* ── SEARCH ── */
.search-wrap{
position:relative;
margin-bottom:18px;
}

.search-icon{
position:absolute;left:14px;top:50%;transform:translateY(-50%);
color:var(--neon-cyan);font-size:12px;
opacity:0.7;pointer-events:none;
}

.search-box{
width:100%;
height:46px;
padding:0 16px 0 38px;
border-radius:6px;
border:1px solid rgba(0,240,255,0.18);
background:var(--surface);
outline:none;
color:var(--text);
font-size:13px;font-weight:700;
font-family:'Rajdhani',sans-serif;
letter-spacing:0.5px;
transition:all .25s;
box-shadow:0 0 12px rgba(0,240,255,0.03);
}

.search-box::placeholder{color:var(--muted);font-weight:600;}

.search-box:focus{
border-color:rgba(0,240,255,0.45);
box-shadow:0 0 20px rgba(0,240,255,0.12),inset 0 0 8px rgba(0,240,255,0.04);
}

/* ── STATS BAR ── */
.stats-bar{
display:flex;align-items:center;justify-content:space-between;
margin-bottom:14px;
padding:0 2px;
}

.stats-bar-left{
font-family:'Exo 2',sans-serif;
font-size:9px;font-weight:800;
letter-spacing:2px;color:var(--muted);
text-transform:uppercase;
}

.stats-bar-left span{
color:var(--neon-cyan);
text-shadow:0 0 8px rgba(0,240,255,0.6);
}

.stats-bar-right{
font-family:'Exo 2',sans-serif;
font-size:8px;font-weight:800;
letter-spacing:2px;color:var(--muted2);
text-transform:uppercase;
}

/* ── GRID ── */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
}

/* ── CARD ── */
.card{
position:relative;
background:var(--surface);
border:1px solid var(--border);
border-radius:6px;
overflow:hidden;
cursor:pointer;
transition:all .22s;
text-align:center;
padding:16px 10px 14px;
animation:fadeUp .35s ease both;
}

.card::after{
content:"";
position:absolute;inset:0;
background:linear-gradient(135deg,rgba(0,240,255,0.03),transparent 60%,rgba(191,0,255,0.03));
pointer-events:none;
}

.card:hover{
transform:translateY(-3px);
border-color:rgba(0,240,255,0.3);
box-shadow:0 0 24px rgba(0,240,255,0.1),0 8px 30px rgba(0,0,0,0.4);
background:var(--surface2);
}

/* AVATAR */
.card-avatar{
width:68px;height:68px;
border-radius:5px;
border:2px solid var(--neon-cyan);
overflow:hidden;
background:var(--surface2);
margin:0 auto 10px;
animation:rgbBorder 4s linear infinite;
flex-shrink:0;
}

.card-avatar img{
width:100%;height:100%;
object-fit:cover;
}

/* NAME */
.card-name{
font-family:'Exo 2',sans-serif;
font-size:13px;font-weight:900;
letter-spacing:0.5px;
line-height:1.2;
color:var(--text);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
margin-bottom:7px;
}

/* ID PILL */
.card-id{
display:inline-flex;align-items:center;gap:5px;
padding:4px 10px;
border-radius:3px;
border:1px solid rgba(0,240,255,0.3);
background:rgba(0,240,255,0.07);
font-family:'Exo 2',sans-serif;
font-size:9px;font-weight:800;
letter-spacing:1.5px;
color:var(--neon-cyan);
text-shadow:0 0 8px rgba(0,240,255,0.6);
text-transform:uppercase;
}

.card-id i{font-size:8px;opacity:0.8;}

/* VIEW BUTTON */
.card-view{
margin-top:9px;
display:flex;align-items:center;justify-content:center;gap:5px;
padding:5px 0;
border-radius:3px;
border:1px solid rgba(191,0,255,0.25);
background:rgba(191,0,255,0.07);
font-family:'Exo 2',sans-serif;
font-size:8px;font-weight:800;
letter-spacing:2px;
color:#bf00ff;
text-shadow:0 0 8px rgba(191,0,255,0.6);
text-transform:uppercase;
opacity:0;
transform:translateY(4px);
transition:all .2s;
}

.card:hover .card-view{
opacity:1;transform:translateY(0);
}

/* ── EMPTY ── */
.empty{
grid-column:1/-1;
padding:60px 20px;
text-align:center;
font-family:'Orbitron',sans-serif;
font-size:10px;letter-spacing:4px;color:var(--muted);
}
.empty i{
display:block;font-size:22px;margin-bottom:14px;
color:var(--neon-pink);
text-shadow:0 0 12px var(--neon-pink);
}

/* ── LOADER ── */
.loader{
grid-column:1/-1;
padding:60px 20px;text-align:center;
font-family:'Orbitron',sans-serif;
font-size:10px;letter-spacing:4px;color:var(--muted);
}
.loader i{
color:var(--neon-cyan);
text-shadow:0 0 12px var(--neon-cyan);
display:block;font-size:22px;margin-bottom:14px;
}

/* ══ AVAILABLE CLUB IDs SECTION ══ */
.club-section{
margin-top:36px;
}

.sec-hd{
display:flex;align-items:center;gap:10px;
margin-bottom:14px;
}

.sec-title{
font-family:'Orbitron',sans-serif;
font-size:10px;font-weight:700;letter-spacing:3.5px;
color:var(--neon-cyan);text-transform:uppercase;white-space:nowrap;
}

.sec-line{
flex:1;height:1px;
background:linear-gradient(90deg,rgba(0,240,255,0.35),transparent);
}

.sec-count{
font-family:'JetBrains Mono',monospace;
font-size:8px;color:var(--muted2);letter-spacing:1px;
padding:2px 8px;
border:1px solid rgba(0,240,255,0.1);border-radius:10px;
}

.club-id-box{
background:var(--surface);
border:1px solid var(--border);
border-radius:12px;
padding:16px;
position:relative;overflow:hidden;
}

.club-id-box::before{
content:'';position:absolute;top:0;left:0;right:0;height:2px;
background:linear-gradient(90deg,var(--neon-green),var(--neon-cyan),var(--neon-purple));
}

.club-id-header{
display:flex;align-items:center;justify-content:space-between;
margin-bottom:14px;flex-wrap:wrap;gap:8px;
}

.club-id-label{
font-family:'JetBrains Mono',monospace;
font-size:9px;letter-spacing:2px;color:var(--muted);
text-transform:uppercase;
display:flex;align-items:center;gap:6px;
}

.club-id-label i{color:var(--neon-green);font-size:9px;}

.club-id-refresh{
display:flex;align-items:center;gap:5px;padding:4px 10px;
background:rgba(0,240,255,0.05);border:1px solid rgba(0,240,255,0.15);
border-radius:6px;color:var(--neon-cyan);
font-family:'JetBrains Mono',monospace;font-size:8px;
letter-spacing:1px;cursor:pointer;transition:all .2s;
text-transform:uppercase;border:none;outline:none;
}

.club-id-refresh:hover{
background:rgba(0,240,255,0.12);
box-shadow:0 0 10px rgba(0,240,255,0.2);
}

.club-id-refresh i{font-size:9px;}
.club-id-refresh.spinning i{animation:spin .6s linear infinite;}

.club-id-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
gap:6px;
}

.club-id-pill{
padding:6px 4px;border-radius:7px;
background:rgba(0,255,136,0.04);
border:1px solid rgba(0,255,136,0.14);
text-align:center;
font-family:'JetBrains Mono',monospace;
font-size:9.5px;
color:var(--neon-green);
letter-spacing:.5px;
transition:all .2s;
cursor:default;
}

.club-id-pill:hover{
background:rgba(0,255,136,0.1);
border-color:rgba(0,255,136,0.35);
box-shadow:0 0 10px rgba(0,255,136,0.15);
}

.club-id-loading{
display:flex;align-items:center;justify-content:center;gap:8px;
padding:24px;
color:var(--muted);
font-family:'JetBrains Mono',monospace;
font-size:10px;letter-spacing:1px;
}

.club-id-loading i{
animation:spin 1s linear infinite;
color:var(--neon-cyan);
}

.club-id-error{
display:flex;align-items:center;gap:8px;
padding:12px;
background:rgba(255,0,122,0.05);
border:1px solid rgba(255,0,122,0.15);
border-radius:8px;
color:#ff5599;
font-family:'JetBrains Mono',monospace;
font-size:10px;letter-spacing:1px;
}

.club-id-stats{
display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;
}

.cis{
display:flex;align-items:center;gap:5px;padding:3px 9px;
border-radius:10px;
font-family:'JetBrains Mono',monospace;
font-size:7.5px;letter-spacing:1px;
}

.cis-free{
background:rgba(0,255,136,0.05);
border:1px solid rgba(0,255,136,0.14);
color:var(--neon-green);
}

.cis-used{
background:rgba(245,255,0,0.05);
border:1px solid rgba(245,255,0,0.14);
color:var(--neon-yellow);
}

/* ── RESPONSIVE ── */
@media(max-width:480px){
.hero-title{font-size:19px;letter-spacing:4px;}
.grid{grid-template-columns:repeat(2,1fr);gap:8px;}
.card{padding:13px 8px 12px;}
.card-avatar{width:56px;height:56px;}
.card-name{font-size:11px;}
.card-id{font-size:8px;padding:3px 8px;}
.card-view{font-size:7px;}
.club-id-grid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));}
}

@media(min-width:600px){
.grid{grid-template-columns:repeat(3,1fr);}
.card-avatar{width:72px;height:72px;}
}

@media(min-width:900px){
.grid{grid-template-columns:repeat(4,1fr);}
.wrap{padding:0 20px;}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<a href="https://goatfcbd.com" class="topbar" style="text-decoration:none;">
<div class="top-left">
<img src="https://i.imgur.com/LY3Bb9m.png" class="top-logo">
<div class="top-title">GOAT FC</div>
</div>
<div class="home-btn"><i class="fa-solid fa-house"></i></div>
</a>

<!-- HERO -->
<div class="hero">
<div class="hero-title">PLAYERS HUB</div>
<div class="hero-slogan">SEARCH YOUR FAVORITE PLAYER</div>
</div>

<!-- WRAP -->
<div class="wrap">

<div class="search-wrap">
<i class="fa-solid fa-magnifying-glass search-icon"></i>
<input type="text" id="search" class="search-box" placeholder="Search Player Name / ID...">
</div>

<div class="stats-bar">
<div class="stats-bar-left">Total Players: <span id="count">—</span></div>
<div class="stats-bar-right">GOAT FC ROSTER</div>
</div>

<div id="grid" class="grid">
<div class="loader">
<i class="fa-solid fa-spinner fa-spin"></i>
LOADING PLAYERS...
</div>
</div>

<!-- ══ AVAILABLE CLUB IDs ══ -->
<div class="club-section">
  <div class="sec-hd">
    <div class="sec-title"><i class="fa-solid fa-id-card" style="margin-right:6px"></i>Available Club IDs</div>
    <div class="sec-line"></div>
    <div class="sec-count" id="freeCount">GFC-001 → GFC-128</div>
  </div>

  <div class="club-id-box">
    <div class="club-id-header">
      <div class="club-id-label">
        <i class="fa-solid fa-circle-check"></i>
        Unregistered IDs — Available for Assignment
      </div>
      <button class="club-id-refresh" id="refreshBtn" onclick="loadClubIds()">
        <i class="fa-solid fa-rotate"></i> Refresh
      </button>
    </div>

    <div id="clubIdContent">
      <div class="club-id-loading">
        <i class="fa-solid fa-circle-notch"></i> Loading ID data…
      </div>
    </div>

    <div class="club-id-stats" id="clubIdStats" style="display:none;">
      <div class="cis cis-free"><i class="fa-solid fa-circle-dot"></i> <span id="statFree">0</span> Available</div>
      <div class="cis cis-used"><i class="fa-solid fa-circle-dot"></i> <span id="statUsed">0</span> Registered</div>
    </div>
  </div>
</div>

</div><!-- /wrap -->

<script>
/* ── PLAYERS ── */
const MEMBER_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv';

/* ── CLUB ID CSV ── */
const CLUB_ID_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vQtkoOu5zsfPZBPfMfqXfFW8v0EbYKE-O2lWWuImHqsjkclSAuNk-yoYzalwtNq5_FAu8Lavc89kpVU/pub?gid=1443111548&single=true&output=csv';

let playersData=[];

/* ── CSV helpers ── */
function parseCSVLine(line){
  const result=[];
  let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){result.push(cur.trim());cur='';}
    else{cur+=ch;}
  }
  result.push(cur.trim());
  return result;
}

function normalize(x){return(x||'').toLowerCase();}
function pad(n){return String(n).padStart(3,'0');}

/* ── PLAYERS LOADER ── */
async function loadPlayers(){
  try{
    const res=await fetch(MEMBER_CSV+'&t='+Date.now());
    const text=await res.text();
    const rows=text.split('\n').map(r=>r.split(','));
    playersData=[];
    rows.slice(1).forEach(r=>{
      if(!r[0])return;
      playersData.push({
        name:(r[0]||'Unknown').trim(),
        id:(r[1]||'N/A').trim(),
        pic:(r[4]||'https://i.imgur.com/LY3Bb9m.png').trim()
      });
    });
    document.getElementById('count').textContent=playersData.length;
    render(playersData);
  }catch(err){
    document.getElementById('grid').innerHTML=`
      <div class="loader">
        <i class="fa-solid fa-triangle-exclamation" style="color:#ff007a;text-shadow:0 0 12px #ff007a;"></i>
        FAILED TO LOAD
      </div>`;
  }
}

function render(data){
  if(!data.length){
    document.getElementById('grid').innerHTML=`
      <div class="empty">
        <i class="fa-solid fa-user-slash"></i>
        NO PLAYER FOUND
      </div>`;
    return;
  }
  let html='';
  data.forEach((p,i)=>{
    html+=`
      <div class="card" style="animation-delay:${Math.min(i*0.04,0.5)}s" onclick="openProfile('${p.id}')">
        <div class="card-avatar">
          <img src="${p.pic}" alt="${p.name}" crossorigin="anonymous" onerror="this.src='https://i.imgur.com/LY3Bb9m.png'">
        </div>
        <div class="card-name">${p.name}</div>
        <div class="card-id"><i class="fa-solid fa-shield-halved"></i>${p.id}</div>
        <div class="card-view"><i class="fa-solid fa-arrow-up-right-from-square"></i> VIEW PROFILE</div>
      </div>`;
  });
  document.getElementById('grid').innerHTML=html;
}

document.getElementById('search').addEventListener('input',function(){
  const v=normalize(this.value);
  const filtered=playersData.filter(p=>
    normalize(p.name).includes(v)||normalize(p.id).includes(v)
  );
  render(filtered);
});

function openProfile(id){
  window.location.href='profile/?id='+id;
}

/* ── CLUB ID LOADER ── */
async function loadClubIds(){
  const content=document.getElementById('clubIdContent');
  const statsEl=document.getElementById('clubIdStats');
  const btn=document.getElementById('refreshBtn');
  const freeCount=document.getElementById('freeCount');

  content.innerHTML='<div class="club-id-loading"><i class="fa-solid fa-circle-notch"></i> Fetching sheet data…</div>';
  statsEl.style.display='none';
  if(btn) btn.classList.add('spinning');

  try{
    const resp=await fetch(CLUB_ID_CSV+'&_='+Date.now());
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const text=await resp.text();

    /* find Club ID column */
    const lines=text.trim().split('\n');
    const headers=parseCSVLine(lines[0]).map(h=>h.replace(/"/g,'').trim().toLowerCase());
    const clubIdCol=headers.findIndex(h=>h.includes('club id'));

    const usedIds=new Set();
    if(clubIdCol!==-1){
      for(let i=1;i<lines.length;i++){
        const cols=parseCSVLine(lines[i]);
        const raw=(cols[clubIdCol]||'').replace(/"/g,'').trim().toUpperCase();
        if(raw) usedIds.add(raw);
      }
    }

    /* build all IDs */
    const allIds=[];
    for(let i=1;i<=128;i++) allIds.push('GFC-'+pad(i));
    const freeIds=allIds.filter(id=>!usedIds.has(id));
    const usedCount=allIds.length-freeIds.length;

    freeCount.textContent=freeIds.length+' Free · '+usedCount+' Used';

    if(freeIds.length===0){
      content.innerHTML='<div class="club-id-error"><i class="fa-solid fa-circle-xmark"></i> All Club IDs (GFC-001 to GFC-128) are currently assigned.</div>';
    } else {
      const grid=document.createElement('div');
      grid.className='club-id-grid';
      freeIds.forEach(id=>{
        const pill=document.createElement('div');
        pill.className='club-id-pill';
        pill.textContent=id;
        grid.appendChild(pill);
      });
      content.innerHTML='';
      content.appendChild(grid);
    }

    document.getElementById('statFree').textContent=freeIds.length;
    document.getElementById('statUsed').textContent=usedCount;
    statsEl.style.display='flex';

  }catch(err){
    content.innerHTML='<div class="club-id-error"><i class="fa-solid fa-triangle-exclamation"></i> Failed to load data. Check network or sheet permissions.</div>';
  }

  if(btn) btn.classList.remove('spinning');
}

/* ── INIT ── */
loadPlayers();
loadClubIds();
</script>
