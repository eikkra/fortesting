<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:radial-gradient(circle at top,#020617,#0f172a);
color:white;
overflow-x:hidden;
}

/* ===== NAVBAR ===== */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 12px;
flex-wrap:wrap;
background:rgba(15,23,42,0.85);
backdrop-filter:blur(10px);
}
.logo{display:flex;align-items:center;gap:8px;min-width:160px;}
.logo img{height:38px;filter:drop-shadow(0 0 10px #7c3aed);}
.logo span{font-size:16px;font-weight:700;white-space:nowrap;}
.nav-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
.nav-links a{
font-size:12px;padding:6px 8px;color:#cbd5f5;
text-decoration:none;white-space:nowrap;
}
.nav-links a:hover{color:#a78bfa;text-shadow:0 0 10px #a78bfa;}

/* ===== HERO ===== */
.hero{position:relative;height:240px;overflow:hidden;}
.slide-box{position:absolute;width:100%;height:100%;opacity:0;transition:.9s;}
.slide-box.active{opacity:1;}
.slide-box img{width:100%;height:100%;object-fit:cover;filter:brightness(.45);}
.slide-content{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
text-align:center;width:90%;
}
.slide-content h1{font-size:18px;margin:4px 0;text-shadow:0 0 10px #8b5cf6;}
.slide-content p{font-size:12px;margin:5px 0;color:#cbd5f5;}
.btn{
display:inline-block;margin-top:6px;
padding:7px 16px;font-size:12px;
background:linear-gradient(45deg,#7c3aed,#ec4899);
border-radius:25px;text-decoration:none;color:white;
}
.arrow{
position:absolute;top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,.4);
border:none;color:white;
font-size:18px;padding:6px 10px;
cursor:pointer;z-index:10;
border-radius:50%;
}
.arrow.left{left:8px;}
.arrow.right{right:8px;}

/* ===== LIVE SCORE (UPDATED) ===== */
.live-wrap{
padding:18px 10px 8px;
max-width:1200px;
margin:auto;
overflow:hidden;
}

.live-title{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
font-size:15px;
font-weight:700;
margin-bottom:12px;
color:#22d3ee;
text-shadow:0 0 10px #22d3ee;
}

.live-dot{
width:9px;height:9px;
background:#ef4444;
border-radius:50%;
animation:pulseLive 1s infinite;
box-shadow:0 0 10px #ef4444;
}

@keyframes pulseLive{
0%{transform:scale(1);opacity:1;}
50%{transform:scale(1.4);opacity:.5;}
100%{transform:scale(1);opacity:1;}
}

.live-track{
display:flex;
gap:12px;
overflow-x:auto;
scrollbar-width:none;
scroll-behavior:smooth;
scroll-snap-type:x mandatory;
}
.live-track::-webkit-scrollbar{display:none;}

.live-card{
min-width:100%;
scroll-snap-align:start;
background:linear-gradient(135deg,rgba(34,211,238,.10),rgba(124,58,237,.10));
border:1px solid rgba(34,211,238,.25);
border-radius:16px;
padding:12px;
box-shadow:0 0 18px rgba(34,211,238,.10);
}

@media(min-width:768px){
.live-card{min-width:calc(50% - 6px);}
}
@media(min-width:1100px){
.live-card{min-width:calc(33.333% - 8px);}
}

/* MATCH TYPE (NOW BELOW SCORE) */
.match-type{
display:inline-block;
padding:4px 10px;
border-radius:18px;
font-size:9px;
font-weight:700;
background:linear-gradient(45deg,#7c3aed,#06b6d4);
margin-top:8px;
opacity:.95;
}

/* MID LAYOUT */
.live-mid{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:6px;
}

/* PLAYER */
.player{text-align:center;min-width:0;}
.player-name{
font-size:10px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.player-id{
font-size:9px;
color:#94a3b8;
}

/* SCORE (SMALLER) */
.score-box{
font-size:18px;
font-weight:800;
display:flex;
align-items:center;
gap:5px;
letter-spacing:1px;
}

.score-win{color:#22c55e;}
.score-loss{color:#ef4444;}
.score-draw{color:#eab308;}

/* ===== REST (UNCHANGED) ===== */
.section{text-align:center;padding:25px 10px;}
.section h2{
margin-bottom:15px;
font-size:16px;
animation:glowPulse 2.5s infinite alternate;
}
@keyframes glowPulse{
0%{text-shadow:0 0 5px #7c3aed;}
100%{text-shadow:0 0 20px #a78bfa;}
}
.glow{color:#a78bfa;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
padding:0 10px;
max-width:900px;
margin:auto;
}

.card{
background:rgba(255,255,255,.05);
padding:12px;
border-radius:12px;
transition:.3s;
cursor:pointer;
text-align:center;
position:relative;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
<div class="logo">
<img src="https://i.imgur.com/LY3Bb9m.png">
<span>GOAT FC</span>
</div>
<div class="nav-links">
<a href="#">Rules</a>
<a href="#">About</a>
<a href="#">Contact</a>
<a href="#">Register</a>
</div>
</div>

<!-- HERO -->
<div class="hero">
<button class="arrow left" onclick="changeSlide(-1)">‹</button>
<button class="arrow right" onclick="changeSlide(1)">›</button>
</div>

<!-- LIVE SCORE -->
<div class="live-wrap">
<div class="live-title">
<div class="live-dot"></div>
LIVE SCORE
</div>
<div class="live-track" id="liveTrack"></div>
</div>

<script>
/* SAME JS LOGIC (UNCHANGED CORE) */

const sheetID="1ZoXNHa5sYiP_HaPRyL5RDML7l3kC2IaGuQCAmYkERf8";

let slides=[],current=0;

fetch(`https://opensheet.elk.sh/${sheetID}/SLIDES`)
.then(r=>r.json())
.then(data=>{
slides=data;
renderSlides();
setInterval(()=>changeSlide(1),7000);
});

function renderSlides(){
let hero=document.querySelector(".hero");
hero.innerHTML=`
<button class="arrow left" onclick="changeSlide(-1)">‹</button>
<button class="arrow right" onclick="changeSlide(1)">›</button>`;
hero.innerHTML+=slides.map((s,i)=>`
<div class="slide-box ${i==0?'active':''}">
<img src="${s.image}">
<div class="slide-content">
<h1>${s.title}</h1>
<p>${s.desc}</p>
<a class="btn" href="${s.link}" target="_blank">${s.button}</a>
</div></div>`).join('');
}

function changeSlide(dir){
let boxes=document.querySelectorAll(".slide-box");
boxes[current].classList.remove("active");
current=(current+dir+boxes.length)%boxes.length;
boxes[current].classList.add("active");
}

/* LIVE SCORE (ONLY UI IMPROVED) */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv")
.then(r=>r.text())
.then(text=>{
const rows=text.trim().split("\n").slice(1).map(r=>r.split(","));

const track=document.getElementById("liveTrack");

track.innerHTML=rows.slice(-10).map(m=>{
let p1=m[0],p2=m[1],type=m[2];
let s1=+m[3],s2=+m[4];

let c1='score-draw',c2='score-draw';
if(s1>s2){c1='score-win';c2='score-loss';}
if(s1<s2){c1='score-loss';c2='score-win';}

return `
<div class="live-card">
<div class="live-mid">
<div class="player">
<div class="player-name">${p1}</div>
<div class="player-id">${m[0]}</div>
</div>

<div class="score-box">
<span class="${c1}">${s1}</span>
-
<span class="${c2}">${s2}</span>
</div>

<div class="player">
<div class="player-name">${p2}</div>
<div class="player-id">${m[1]}</div>
</div>
</div>

<div style="text-align:center">
<div class="match-type">${type}</div>
</div>

</div>`;
}).join('');
});
</script>

</body>
</html>
