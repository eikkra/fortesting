<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT FC ELITE BOARD</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c:#00f5ff;--g:#00ff88;--p:#bf5fff;--bg:#020817;
  --gold:#ffd700;--border:rgba(255,255,255,0.07);
  --fh:'Orbitron',sans-serif;--fb:'Rajdhani',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:#fff;font-family:var(--fb);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,255,0.01) 2px,rgba(0,245,255,0.01) 4px);pointer-events:none;z-index:0;}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:9999;height:46px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(2,8,23,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,245,255,.15);text-decoration:none;}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--c),var(--g),var(--p),transparent);animation:scanbar 3s linear infinite;}
@keyframes scanbar{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
.topbar-left{display:flex;align-items:center;gap:9px}
.topbar-logo{width:26px;filter:drop-shadow(0 0 6px var(--c))}
.topbar-text{font-family:var(--fh);font-size:12px;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,var(--c),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.topbar-right{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(0,245,255,.3);color:var(--c);font-size:12px;background:rgba(0,245,255,.07);}

/* ── HERO HEADER ── */
.hero{position:relative;z-index:1;text-align:center;padding:20px 16px 10px;}
.hero h1{font-family:var(--fh);font-size:clamp(14px,4vw,22px);font-weight:900;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(90deg,var(--c),var(--g),var(--p),var(--c));background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shift 4s linear infinite;}
@keyframes shift{0%{background-position:0%}100%{background-position:300%}}
.hero-sub{font-size:10px;letter-spacing:2.5px;opacity:.4;margin-top:3px;font-family:var(--fb);}

/* ── TABS ── */
.tabs{display:flex;justify-content:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:10px 12px 6px;scrollbar-width:none;position:relative;z-index:1;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:4px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-family:var(--fh);font-size:10px;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:all .2s;white-space:nowrap;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);}
.tab:hover{color:#fff;border-color:var(--c);box-shadow:0 0 10px rgba(0,245,255,.2)}
.tab.active{background:linear-gradient(90deg,rgba(0,245,255,.2),rgba(0,255,136,.15));border-color:var(--c);color:var(--c);box-shadow:0 0 16px rgba(0,245,255,.25);}

/* team accent tabs */
.tab[data-t="Main"].active{background:linear-gradient(90deg,rgba(0,245,255,.2),rgba(0,245,255,.08));border-color:var(--c);color:var(--c);}
.tab[data-t="Academy"].active{background:linear-gradient(90deg,rgba(0,255,136,.2),rgba(0,255,136,.08));border-color:var(--g);color:var(--g);box-shadow:0 0 16px rgba(0,255,136,.25);}
.tab[data-t="Youth"].active{background:linear-gradient(90deg,rgba(191,95,255,.2),rgba(191,95,255,.08));border-color:var(--p);color:var(--p);box-shadow:0 0 16px rgba(191,95,255,.25);}
.tab[data-t="Goat"].active{background:linear-gradient(90deg,rgba(255,77,77,.2),rgba(255,77,77,.08));border-color:#ff4d4d;color:#ff4d4d;box-shadow:0 0 16px rgba(255,77,77,.25);}

/* ── FILTERS ── */
.filter-box{display:flex;justify-content:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none;position:relative;z-index:1;}
.filter-box::-webkit-scrollbar{display:none;}
.filter-box select{flex:0 0 auto;padding:5px 8px;background:rgba(0,0,0,.6);color:rgba(255,255,255,.7);border:1px solid rgba(0,245,255,.2);border-radius:4px;font-size:10px;font-family:var(--fb);outline:none;cursor:pointer;}
.filter-box select:focus{border-color:var(--c);box-shadow:0 0 8px rgba(0,245,255,.2);}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;padding:6px 12px 24px;position:relative;z-index:1;}

/* ── CARD ── */
.card{
  background:rgba(11,17,32,.85);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  transition:transform .2s,box-shadow .2s;
  display:flex;
  flex-direction:column;
}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,245,255,.12);}

/* team border accents */
.card.management{border-color:rgba(255,215,0,.35);}
.card.management.available-card{border-color:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.15);}
.card.main{border-color:rgba(0,245,255,.25);}
.card.main.available-card{border-color:var(--c);box-shadow:0 0 10px rgba(0,245,255,.15);}
.card.academy{border-color:rgba(0,255,136,.25);}
.card.academy.available-card{border-color:var(--g);box-shadow:0 0 10px rgba(0,255,136,.15);}
.card.youth{border-color:rgba(191,95,255,.25);}
.card.youth.available-card{border-color:var(--p);box-shadow:0 0 10px rgba(191,95,255,.15);}
.card.goat{border-color:rgba(255,77,77,.25);}
.card.goat.available-card{border-color:#ff4d4d;box-shadow:0 0 10px rgba(255,77,77,.15);}

/* card top color bar */
.card::before{content:'';display:block;height:2px;width:100%;}
.card.management::before{background:linear-gradient(90deg,var(--gold),transparent);}
.card.main::before{background:linear-gradient(90deg,var(--c),transparent);}
.card.academy::before{background:linear-gradient(90deg,var(--g),transparent);}
.card.youth::before{background:linear-gradient(90deg,var(--p),transparent);}
.card.goat::before{background:linear-gradient(90deg,#ff4d4d,transparent);}

/* photo */
.card-img-wrap{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:#0a1220;}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}

/* status dot on photo */
.status-dot{position:absolute;bottom:6px;right:6px;width:8px;height:8px;border-radius:50%;border:1px solid rgba(0,0,0,.5);}
.dot-avail{background:#00ff88;box-shadow:0 0 6px #00ff88;animation:dotpulse 1.5s infinite;}
.dot-busy{background:#ff4d4d;}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.3}}

/* card info row — all in one line */
.card-info{padding:7px 8px 5px;display:flex;flex-direction:column;gap:3px;flex:1;}

/* name + role in ONE line */
.info-row1{display:flex;align-items:center;gap:5px;overflow:hidden;}
.p-name{font-family:var(--fh);font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.p-role{font-size:8px;font-family:var(--fb);font-weight:600;color:#ffcc00;white-space:nowrap;flex-shrink:0;}

/* pos + time in ONE line */
.info-row2{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:hidden;}
.p-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 5px;border-radius:3px;font-size:8px;font-family:var(--fh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%;}
.p-pos{background:rgba(0,245,255,.1);border:1px solid rgba(0,245,255,.2);color:var(--c);}
.p-time{background:rgba(191,95,255,.1);border:1px solid rgba(191,95,255,.2);color:#cf9fff;}

/* status text */
.info-row3{display:flex;align-items:center;gap:4px;}
.p-status{font-size:8px;font-family:var(--fb);font-weight:600;}
.p-status.avail{color:#00ff88;}
.p-status.busy{color:#ff6b6b;}
.p-status i{font-size:7px;}

/* action buttons */
.card-btns{display:flex;gap:5px;padding:0 8px 8px;}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:5px 4px;border-radius:4px;font-size:9px;font-family:var(--fh);font-weight:700;letter-spacing:.5px;text-decoration:none;transition:all .2s;border:none;cursor:pointer;}
.btn-msg{background:rgba(0,245,255,.15);border:1px solid rgba(0,245,255,.3);color:var(--c);}
.btn-msg:hover{background:rgba(0,245,255,.3);box-shadow:0 0 10px rgba(0,245,255,.3);}
.btn-call{background:rgba(0,255,136,.15);border:1px solid rgba(0,255,136,.3);color:var(--g);}
.btn-call:hover{background:rgba(0,255,136,.3);box-shadow:0 0 10px rgba(0,255,136,.3);}

/* empty */
.empty{grid-column:1/-1;text-align:center;padding:40px 20px;font-family:var(--fh);font-size:11px;letter-spacing:3px;color:rgba(0,245,255,.4);}

/* loading pulse */
.loading{grid-column:1/-1;text-align:center;padding:40px;font-family:var(--fh);font-size:11px;letter-spacing:3px;color:var(--c);animation:lp 1s ease-in-out infinite alternate;}
@keyframes lp{from{opacity:.2}to{opacity:.8}}

/* footer */
footer{position:relative;z-index:1;text-align:center;padding:14px 0 16px;border-top:1px solid rgba(0,245,255,.08);}
.footer-text{font-family:var(--fh);font-size:9px;letter-spacing:2.5px;background:linear-gradient(90deg,var(--c),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:.5;}
</style>
</head>
<body>

<!-- TOPBAR -->
<a href="https://goatfcbd.com" class="topbar" style="text-decoration:none;">
  <div class="topbar-left">
    <img src="https://i.imgur.com/LY3Bb9m.png" class="topbar-logo" alt="GOAT FC">
    <span class="topbar-text">GOAT FC</span>
  </div>
  <div class="topbar-right"><i class="fa-solid fa-house"></i></div>
</a>

<!-- HERO -->
<div class="hero">
  <h1>GOAT FC ELITE BOARD</h1>
  <div class="hero-sub">OUR HONORABLE MANAGEMENT &amp; TEAM MEMBERS</div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" data-t="management" onclick="showTab(event,'management')"><i class="fa-solid fa-crown" style="font-size:9px;margin-right:4px;"></i>Management</div>
  <div class="tab" data-t="Main" onclick="showTab(event,'Main')"><i class="fa-solid fa-shield-halved" style="font-size:9px;margin-right:4px;"></i>Main</div>
  <div class="tab" data-t="Academy" onclick="showTab(event,'Academy')"><i class="fa-solid fa-graduation-cap" style="font-size:9px;margin-right:4px;"></i>Academy</div>
  <div class="tab" data-t="Youth" onclick="showTab(event,'Youth')"><i class="fa-solid fa-star" style="font-size:9px;margin-right:4px;"></i>Youth</div>
  <div class="tab" data-t="Goat" onclick="showTab(event,'Goat')"><i class="fa-solid fa-bolt" style="font-size:9px;margin-right:4px;"></i>Goat</div>
</div>

<!-- FILTER -->
<div class="filter-box">
  <select id="statusFilter"><option value="">All Status</option><option>Available</option><option>Busy (1-2 Days)</option><option>Busy (3-7 Days)</option><option>Busy (7-15 Days)</option><option>Busy (15-30 Days)</option></select>
  <select id="posFilter"><option value="">All Position</option></select>
  <select id="timeFilter"><option value="">All Time</option></select>
</div>

<!-- GRID -->
<div id="content" class="grid">
  <div class="loading">LOADING DATA...</div>
</div>

<footer><div class="footer-text">POWERED BY GOAT FC</div></footer>

<script>
const SHEET="https://docs.google.com/spreadsheets/d/1j8HRakCsKmB-GTdfKJ3kd7XNEwBfNEg3AvtWTpPpKK0/gviz/tq?tqx=out:json&sheet=Dashboard";
let data=[],currentTab="management";

function loadData(){
  fetch(SHEET)
    .then(r=>r.text())
    .then(d=>{
      const j=JSON.parse(d.substring(47).slice(0,-2));
      data=j.table.rows.map((r,i)=>({
        index:i,
        name:r.c[0]?.v||"",
        role:r.c[1]?.v||"",
        status:r.c[3]?.v||"",
        fb:r.c[4]?.v||"#",
        phone:r.c[5]?.v||"",
        img:r.c[7]?.v||"",
        manage:r.c[8]?.v||"",
        team:(r.c[9]?.v||"").trim(),
        pos:r.c[10]?.v||"",
        time:r.c[11]?.v||""
      }));
      initFilters();
      renderCurrent();
    })
    .catch(()=>{
      document.getElementById("content").innerHTML='<div class="empty" style="color:#ff4466;">ERROR LOADING DATA</div>';
    });
}

function showTab(e,t){
  currentTab=t;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  e.currentTarget.classList.add("active");
  renderCurrent();
}

function initFilters(){
  const posSet=new Set(),timeSet=new Set();
  data.forEach(p=>{
    if(p.pos&&p.pos.length<=15&&p.pos!="Position") posSet.add(p.pos.trim());
    if(p.time&&p.time.length<=30&&p.time!="Time") timeSet.add(p.time.trim());
  });
  const pEl=document.getElementById("posFilter"),tEl=document.getElementById("timeFilter");
  pEl.innerHTML='<option value="">All Position</option>';
  tEl.innerHTML='<option value="">All Time</option>';
  [...posSet].sort().forEach(p=>pEl.innerHTML+=`<option>${p}</option>`);
  [...timeSet].sort().forEach(t=>tEl.innerHTML+=`<option>${t}</option>`);
}

function renderCurrent(){
  let f=data.filter(p=>currentTab==="management"?p.manage==="YES":p.team===currentTab);
  const s=document.getElementById("statusFilter").value;
  const p=document.getElementById("posFilter").value;
  const t=document.getElementById("timeFilter").value;
  f=f.filter(x=>(!s||x.status===s)&&(!p||x.pos===p)&&(!t||x.time===t));
  f.sort((a,b)=>{
    const A=a.status.includes("Available"),B=b.status.includes("Available");
    return A===B?a.index-b.index:A?-1:1;
  });
  render(f);
}

function teamClass(p){
  if(p.manage==="YES") return "management";
  if(p.team==="Main") return "main";
  if(p.team==="Academy") return "academy";
  if(p.team==="Youth") return "youth";
  if(p.team==="Goat") return "goat";
  return "";
}

function render(arr){
  const c=document.getElementById("content");
  if(!arr.length){c.innerHTML='<div class="empty">NO MEMBERS FOUND</div>';return;}
  c.innerHTML=arr.map(p=>{
    const tc=teamClass(p);
    const avail=p.status.includes("Available");
    return `<div class="card ${tc}${avail?' available-card':''}">
  <div class="card-img-wrap">
    <img src="${p.img}" loading="lazy" onerror="this.src='https://placehold.co/300x300/0a1220/00f5ff?text=GFC'">
    <div class="status-dot ${avail?'dot-avail':'dot-busy'}"></div>
  </div>
  <div class="card-info">
    <div class="info-row1">
      <span class="p-name">${p.name}</span>
      <span class="p-role">${p.role}</span>
    </div>
    <div class="info-row2">
      ${p.pos?`<span class="p-badge p-pos"><i class="fa-solid fa-futbol" style="font-size:7px;"></i>${p.pos}</span>`:''}
      ${p.time?`<span class="p-badge p-time"><i class="fa-solid fa-clock" style="font-size:7px;"></i>${p.time}</span>`:''}
    </div>
    <div class="info-row3">
      <span class="p-status ${avail?'avail':'busy'}">
        <i class="fa-solid ${avail?'fa-circle-check':'fa-circle-xmark'}"></i> ${p.status}
      </span>
    </div>
  </div>
  <div class="card-btns">
    <a href="${p.fb}" target="_blank" class="btn btn-msg"><i class="fa-brands fa-facebook-messenger"></i> MSG</a>
    <a href="tel:${p.phone}" class="btn btn-call"><i class="fa-solid fa-phone"></i> CALL</a>
  </div>
</div>`;
  }).join("");
}

document.querySelectorAll("select").forEach(s=>s.addEventListener("change",renderCurrent));
loadData();
setInterval(loadData,30000);
</script>
</body>
</html>
