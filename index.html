<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GOAT FC PLAY CARD</title>

<link rel="icon"
type="image/png"
href="https://i.imgur.com/LY3Bb9m.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

:root{
--bg:#050816;
--card:#0f172a;
--cyan:#00f5ff;
--green:#00ff88;
--white:#f8fafc;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
font-family:'Rajdhani',sans-serif;
color:var(--white);
overflow-x:hidden;
padding-bottom:20px;
}

body::before{
content:"";
position:fixed;
inset:0;

background:
radial-gradient(circle at top left,#00f5ff12,transparent 25%),
radial-gradient(circle at bottom right,#00ff8810,transparent 25%);

z-index:-1;
}

/* =====================
TOPBAR
===================== */

.topbar{
height:46px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 12px;

background:rgba(5,8,22,.88);

backdrop-filter:blur(10px);

border-bottom:1px solid #00f5ff15;

position:sticky;
top:0;
z-index:999;

text-decoration:none;
}

.top-left{
display:flex;
align-items:center;
gap:7px;
}

.top-logo{
width:22px;

filter:
drop-shadow(0 0 5px #00f5ff);
}

.top-title{
font-family:'Orbitron',sans-serif;
font-size:10px;
font-weight:700;
letter-spacing:1px;

background:
linear-gradient(90deg,var(--cyan),var(--green));

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.home-btn{
width:28px;
height:28px;

display:flex;
align-items:center;
justify-content:center;

border-radius:9px;

background:#111827;

border:1px solid #00f5ff20;

color:var(--cyan);

font-size:10px;
}

/* =====================
HEADER
===================== */

.hero{
padding:14px 10px 12px;
text-align:center;
}

.hero-title{
font-family:'Orbitron',sans-serif;
font-size:17px;
font-weight:800;
letter-spacing:2px;

background:
linear-gradient(
90deg,
#00f5ff,
#ffffff,
#00ff88
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-sub{
margin-top:5px;

font-size:9px;
font-weight:700;

letter-spacing:3px;

color:var(--muted);

line-height:1.5;
}

/* =====================
WRAP
===================== */

.wrap{
width:min(100% - 10px,480px);
margin:auto;
}

/* =====================
SEARCH
===================== */

.search-box{
width:100%;

height:42px;

padding:0 14px;

border-radius:14px;

border:1px solid #00f5ff20;

background:
linear-gradient(145deg,#111827,#0f172a);

outline:none;

color:white;

font-size:12px;
font-weight:700;

font-family:'Rajdhani',sans-serif;

margin-bottom:12px;

box-shadow:
0 0 10px #00f5ff08;
}

.search-box::placeholder{
color:#94a3b8;
}

.search-box:focus{

border-color:#00f5ff55;

box-shadow:
0 0 12px #00f5ff22;
}

/* =====================
CARD
===================== */

.card{
position:relative;

padding:12px;

border-radius:18px;

background:
linear-gradient(145deg,#111827,#0f172a);

border:1px solid #00f5ff18;

overflow:hidden;

margin-bottom:10px;

box-shadow:
0 0 10px #000;
}

.card::before{
content:"";

position:absolute;

inset:3px;

border-radius:14px;

border:1px solid #00f5ff10;

pointer-events:none;
}

/* =====================
TOP INFO
===================== */

.player-top{
display:flex;
align-items:center;
justify-content:space-between;

gap:10px;
}

.player-left{
min-width:0;
}

.player-name{
font-size:14px;
font-weight:800;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.player-id{
margin-top:4px;

display:inline-flex;
align-items:center;
gap:5px;

padding:5px 8px;

border-radius:999px;

background:#00f5ff10;

border:1px solid #00f5ff15;

font-size:8px;
font-weight:700;

color:var(--cyan);
}

/* =====================
INFO GRID
===================== */

.info-grid{
display:grid;

grid-template-columns:
1fr 1fr;

gap:8px;

margin-top:12px;
}

.info-box{
padding:9px;

border-radius:14px;

background:
linear-gradient(145deg,#0b1220,#0f172a);

border:1px solid #ffffff10;
}

.info-label{
font-size:7px;
font-weight:700;

letter-spacing:1px;

color:var(--muted);

margin-bottom:4px;
}

.info-value{
font-size:11px;
font-weight:800;

word-break:break-word;
}

/* COLORS */

.konami{
color:#fbbf24;
}

.device{
color:#c084fc;
}

/* =====================
FB BUTTON
===================== */

.fb-btn{
margin-top:10px;

width:100%;

height:38px;

border-radius:14px;

display:flex;
align-items:center;
justify-content:center;
gap:8px;

text-decoration:none;

background:
linear-gradient(145deg,#111827,#0f172a);

border:1px solid #1877f220;

color:#4ea1ff;

font-size:11px;
font-weight:800;

transition:.25s;
}

.fb-btn:hover{
border-color:#1877f255;

box-shadow:
0 0 12px #1877f220;
}

/* =====================
EMPTY
===================== */

.empty{
padding:40px 10px;

text-align:center;

font-size:13px;
font-weight:700;

color:var(--muted);
}

/* =====================
FOOTER
===================== */

.footer{
margin-top:18px;

text-align:center;

font-size:9px;
font-weight:700;

letter-spacing:2px;

color:#64748b;
}

/* MOBILE */

@media(max-width:420px){

.player-name{
font-size:13px;
}

.info-value{
font-size:10px;
}

}

</style>
</head>

<body>

<!-- TOPBAR -->

<a href="https://goatfcbd.com"
class="topbar">

<div class="top-left">

<img src="https://i.imgur.com/LY3Bb9m.png"
class="top-logo">

<div class="top-title">
GOAT FC
</div>

</div>

<div class="home-btn">
<i class="fa-solid fa-house"></i>
</div>

</a>

<!-- HEADER -->

<div class="hero">

<div class="hero-title">
GOAT FC PLAY CARD
</div>

<div class="hero-sub">
SEARCH CLUB ID & VIEW PLAYER DETAILS
</div>

</div>

<!-- WRAP -->

<div class="wrap">

<input
type="text"
id="searchInput"
class="search-box"
placeholder="Search By Club ID...">

<div id="players">

</div>

<div class="footer">
POWERED BY GOAT FC
</div>

</div>

<script>

const csvURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRxNxMgcwsp3k8B9jqnfObnnRfhSX3vUcEOuaPTsyEMaEVOZKE9OIcLiMQRJHHkAQiJWn-msKE6Cs80/pub?output=csv";

let players=[];

/* NORMALIZE */

function normalize(str){

return (str || "")
.toLowerCase()
.replace(/[^a-z0-9]/g,"");

}

/* LOAD */

function loadData(){

Papa.parse(csvURL,{

download:true,

header:true,

skipEmptyLines:true,

complete:function(res){

players=res.data;

render(players);

}

});

}

/* RENDER */

function render(data){

const wrap =
document.getElementById("players");

wrap.innerHTML="";

if(data.length===0){

wrap.innerHTML=`

<div class="empty">
<i class="fa-solid fa-magnifying-glass"></i>
<br><br>
No Player Found
</div>

`;

return;

}

data.forEach(p=>{

wrap.innerHTML += `

<div class="card">

<div class="player-top">

<div class="player-left">

<div class="player-name">
${p["Player Name"] || "Unknown"}
</div>

<div class="player-id">

<i class="fa-solid fa-shield-halved"></i>

${p["Your Club ID"] || "N/A"}

</div>

</div>

</div>

<div class="info-grid">

<div class="info-box">

<div class="info-label">
KONAMI ID
</div>

<div class="info-value konami">
${p["KONAMI ID"] || "N/A"}
</div>

</div>

<div class="info-box">

<div class="info-label">
DEVICE
</div>

<div class="info-value device">
${p["DEVICE NAME"] || "N/A"}
</div>

</div>

</div>

<a href="${p["Facebook URL"] || "#"}"
target="_blank"
class="fb-btn">

<i class="fa-brands fa-facebook-f"></i>

VISIT FACEBOOK

</a>

</div>

`;

});

}

/* SEARCH */

document
.getElementById("searchInput")

.addEventListener("input",function(){

const val =
normalize(this.value);

const filtered =
players.filter(p=>{

let club =
normalize(p["Your Club ID"]);

return club.includes(val);

});

render(filtered);

});

/* LOAD */

loadData();

setInterval(loadData,30000);

</script>

</body>
</html>
