<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rival Tracker · GOAT FC</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/LY3Bb9m.png">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --neon-cyan: #00f5ff;
      --neon-green: #00ff88;
      --neon-pink: #ff007f;
      --neon-purple: #bd00ff;
      --gold: #ffd700;
      --dark-bg: #060913;
      --panel-bg: rgba(10, 16, 32, 0.75);
      --border-color: rgba(0, 245, 255, 0.15);
      --border-glow: rgba(0, 245, 255, 0.3);
      --font-hud: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--dark-bg);
      color: #ffffff;
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Scanline & Grid Atmosphere */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(2, 4, 10, 0.8) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Ambient Background Glows */
    .bg-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.12;
      filter: blur(120px);
    }
    .bg-glow-1 {
      top: -100px;
      left: -100px;
      background: var(--neon-cyan);
      animation: floatGlow 15s ease-in-out infinite alternate;
    }
    .bg-glow-2 {
      bottom: -100px;
      right: -100px;
      background: var(--neon-purple);
      animation: floatGlow 20s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 80px) scale(1.25); }
    }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 52px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(4, 8, 20, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      text-decoration: none;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
    }

    .topbar::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-green), var(--neon-pink), transparent);
      background-size: 200% 100%;
      animation: scanbar 4s linear infinite;
    }

    @keyframes scanbar {
      0% { background-position: 0% 0%; }
      100% { background-position: 200% 0%; }
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px var(--neon-cyan));
      transition: transform 0.3s ease;
    }

    .topbar:hover .topbar-logo {
      transform: rotate(360deg);
    }

    .topbar-text {
      font-family: var(--font-hud);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #fff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .topbar-right {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid rgba(0, 245, 255, 0.3);
      color: var(--neon-cyan);
      font-size: 13px;
      background: rgba(0, 245, 255, 0.05);
      transition: all 0.3s ease;
    }

    .topbar:hover .topbar-right {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 12px var(--neon-cyan);
    }

    /* ── MAIN ── */
    .main {
      position: relative;
      z-index: 2;
      flex: 1;
    }

    .wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    /* ── TITLE BLOCK ── */
    .title-block {
      padding: 24px 0 16px;
      text-align: center;
      position: relative;
    }

    .title-block h1 {
      font-family: var(--font-hud);
      font-size: clamp(20px, 5vw, 36px);
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green), var(--neon-pink), var(--neon-cyan));
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShift 6s linear infinite;
      text-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
    }

    .subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 6px;
      text-transform: uppercase;
      font-family: var(--font-hud);
    }

    .subtitle-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 10px;
      border: 1px dashed var(--neon-cyan);
      border-radius: 4px;
      color: var(--neon-cyan);
      font-size: 9px;
      font-family: var(--font-mono);
      background: rgba(0, 245, 255, 0.05);
    }

    /* ── FILTERS SECTION ── */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
      background: rgba(8, 14, 28, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
    }

    .select-wrap {
      position: relative;
      flex: 1;
    }

    .select-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--neon-cyan);
      opacity: 0.85;
      pointer-events: none;
      z-index: 2;
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    .select-wrap select {
      width: 100%;
      padding: 12px 40px 12px 38px;
      background: rgba(3, 6, 12, 0.85);
      color: #ffffff;
      border: 1px solid rgba(0, 245, 255, 0.25);
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font-hud);
      font-weight: 600;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      letter-spacing: 1px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .select-wrap::after {
      content: '\f107';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--neon-cyan);
      pointer-events: none;
      transition: transform 0.3s ease;
    }

    .select-wrap:focus-within::after {
      transform: translateY(-50%) rotate(180deg);
    }

    .select-wrap select:focus,
    .select-wrap select:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 245, 255, 0.3);
      background: rgba(0, 245, 255, 0.05);
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── PLAYER STATISTICS DASHBOARD ── */
    .player-dashboard {
      display: none;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .player-dashboard.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .db-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }

    .db-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--neon-cyan), var(--neon-purple));
    }

    .db-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 2fr;
      gap: 20px;
    }

    /* Profile info */
    .db-profile {
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding-right: 15px;
    }

    .db-avatar-container {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 1px solid var(--neon-cyan);
      background: rgba(0, 245, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(0, 245, 255, 0.15);
      font-size: 28px;
      color: var(--neon-cyan);
    }

    .db-player-name {
      font-family: var(--font-hud);
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .db-player-id {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* Winrate circular meter */
    .db-winrate-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding-right: 15px;
    }

    .radial-progress {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(closest-side, #090e1a 79%, transparent 80% 100%),
                  conic-gradient(var(--neon-green) 0%, rgba(255,255,255,0.05) 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 15px rgba(0, 255, 136, 0.1);
    }

    .radial-value {
      font-family: var(--font-hud);
      font-size: 16px;
      font-weight: 700;
      color: var(--neon-green);
    }

    .radial-label {
      font-size: 10px;
      font-family: var(--font-hud);
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
    }

    /* Stat blocks */
    .db-stats {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .stat-row-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .mini-stat-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .mini-stat-label {
      font-size: 9px;
      font-family: var(--font-hud);
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .mini-stat-value {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
    }

    .mini-stat-value.val-m { color: var(--neon-cyan); }
    .mini-stat-value.val-w { color: var(--neon-green); }
    .mini-stat-value.val-d { color: rgba(255, 255, 255, 0.7); }
    .mini-stat-value.val-l { color: var(--neon-pink); }

    /* Tactical intel cards */
    .tactical-intel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .intel-pill {
      background: rgba(0, 245, 255, 0.03);
      border: 1px solid rgba(0, 245, 255, 0.08);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
    }

    .intel-title {
      font-size: 8px;
      font-family: var(--font-hud);
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .intel-title.arch { color: var(--gold); }
    .intel-title.nemesis { color: var(--neon-pink); }
    .intel-title.prey { color: var(--neon-green); }

    .intel-opp-name {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .intel-opp-meta {
      font-family: var(--font-mono);
      font-size: 9px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 1px;
    }

    /* ── CARD (TABLE CONTAINER) ── */
    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.05), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green), var(--neon-pink), var(--neon-cyan));
      background-size: 300% auto;
      animation: titleShift 4s linear infinite;
    }

    .tbl-wrap {
      overflow-x: auto;
      position: relative;
      z-index: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      background: rgba(2, 4, 10, 0.6);
    }

    th {
      font-family: var(--font-hud);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      padding: 14px 8px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.2);
    }

    th.col-opp {
      text-align: left;
      padding-left: 20px;
    }

    td {
      padding: 14px 8px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      vertical-align: middle;
      font-family: var(--font-body);
      transition: all 0.2s ease;
    }

    td.col-opp {
      text-align: left;
      padding-left: 20px;
    }

    tbody tr {
      background: rgba(255, 255, 255, 0.01);
      transition: background 0.25s, transform 0.2s;
    }

    tbody tr:hover {
      background: rgba(0, 245, 255, 0.05);
    }

    tbody tr.warning-row {
      background: linear-gradient(90deg, rgba(255, 0, 127, 0.08), transparent) !important;
      border-left: 3px solid var(--neon-pink) !important;
    }

    /* Opponent Details */
    .opp-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .opp-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .opp-name {
      font-family: var(--font-hud);
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }

    .opp-id {
      font-size: 10px;
      color: var(--neon-cyan);
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
      opacity: 0.8;
    }

    .opp-former {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.35);
      font-style: italic;
      font-family: var(--font-body);
    }

    /* Visual H2H Ratio Bar */
    .h2h-bar-container {
      display: flex;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
      width: 90%;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }

    .h2h-segment {
      height: 100%;
      transition: width 0.4s ease;
    }

    .h2h-win {
      background: var(--neon-green);
      box-shadow: 0 0 6px rgba(0, 255, 136, 0.4);
    }

    .h2h-draw {
      background: rgba(255, 255, 255, 0.4);
    }

    .h2h-loss {
      background: var(--neon-pink);
      box-shadow: 0 0 6px rgba(255, 0, 127, 0.4);
    }

    /* Stat Numbers */
    .stat-win {
      color: var(--neon-green);
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 14px;
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.15);
    }

    .stat-draw {
      color: rgba(255, 255, 255, 0.7);
      font-family: var(--font-mono);
      font-size: 14px;
    }

    .stat-loss {
      color: var(--neon-pink);
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 14px;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.15);
    }

    .stat-total {
      color: var(--neon-cyan);
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 14px;
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.15);
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 9px;
      font-family: var(--font-hud);
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      position: relative;
    }

    .badge-ok {
      background: rgba(0, 255, 136, 0.08);
      color: var(--neon-green);
      border: 1px solid rgba(0, 255, 136, 0.3);
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.1);
    }

    .badge-alert {
      background: rgba(255, 0, 127, 0.12);
      color: var(--neon-pink);
      border: 1px solid rgba(255, 0, 127, 0.4);
      animation: alertPulse 1.5s infinite alternate;
    }

    @keyframes alertPulse {
      0% {
        box-shadow: 0 0 4px rgba(255, 0, 127, 0.2);
        border-color: rgba(255, 0, 127, 0.4);
      }
      100% {
        box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
        border-color: rgba(255, 0, 127, 0.8);
      }
    }

    /* Empty / Loading Screens */
    .info-cell {
      padding: 48px 24px;
      font-family: var(--font-hud);
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(0, 245, 255, 0.4);
      text-align: center;
      line-height: 1.6;
    }

    .info-cell i {
      font-size: 24px;
      margin-bottom: 12px;
      display: block;
      color: var(--neon-cyan);
      opacity: 0.6;
      animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .loading-cell {
      padding: 48px 24px;
      font-family: var(--font-hud);
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--neon-cyan);
      opacity: 0.8;
      text-align: center;
      position: relative;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(0, 245, 255, 0.1);
      border-top: 2px solid var(--neon-cyan);
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 1s linear infinite, glowPulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes glowPulse {
      from { box-shadow: 0 0 4px rgba(0, 245, 255, 0.1); }
      to { box-shadow: 0 0 15px rgba(0, 245, 255, 0.4); }
    }

    /* Embedded labels for mobile card view (hidden on desktop) */
    .mob-stat-label,
    .mob-status-label {
      display: none;
    }

    /* FOOTER */
    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px 0;
      border-top: 1px solid rgba(0, 245, 255, 0.08);
      background: rgba(4, 8, 20, 0.8);
      margin-top: auto;
    }

    .footer-text {
      font-family: var(--font-hud);
      font-size: 9px;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.65;
    }

    /* ── MOBILE DESIGN (RESPONSIVE GRID / CARDS) ── */
    @media (max-width: 768px) {
      .wrapper {
        padding: 16px 8px 30px;
      }

      .title-block {
        padding: 12px 0 6px;
      }

      .db-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .db-profile {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-right: 0;
        padding-bottom: 16px;
        align-items: center;
        text-align: center;
      }

      .db-winrate-box {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-right: 0;
        padding-bottom: 16px;
        flex-direction: row;
        gap: 20px;
      }

      .radial-progress {
        margin-bottom: 0;
      }

      .tactical-intel {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    @media (max-width: 600px) {
      /* Transform table rows into modular "Combat Cards" using CSS Grid */
      thead {
        display: none;
      }

      table, tbody, tr, td {
        display: block;
        width: 100%;
      }

      tbody tr {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        background: rgba(8, 14, 28, 0.85);
        padding: 12px;
        position: relative;
        overflow: hidden;
      }

      tbody tr::after {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--neon-cyan);
      }

      tbody tr.warning-row::after {
        background: var(--neon-pink);
      }

      td {
        padding: 0 !important;
        border: none !important;
        text-align: left !important;
      }

      td.col-opp {
        grid-column: span 4;
        margin-bottom: 4px;
      }

      .h2h-bar-container {
        width: 100%;
      }

      /* Stats columns - style as mini grid items side by side */
      td.stat-total, td.stat-win, td.stat-draw, td.stat-loss {
        grid-column: span 1;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 6px;
        padding: 6px 4px !important;
        text-align: center !important;
        border: 1px solid rgba(255, 255, 255, 0.02) !important;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .mob-stat-label {
        font-family: var(--font-hud);
        font-size: 8px;
        color: rgba(255, 255, 255, 0.4);
        display: block;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .stat-total, .stat-win, .stat-draw, .stat-loss {
        font-size: 13px;
      }

      /* Badges placement inside the mobile card */
      td.col-status {
        grid-column: span 4;
        margin-top: 6px;
        padding-top: 8px !important;
        border-top: 1px dashed rgba(255, 255, 255, 0.08) !important;
      }

      .mob-status-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .mob-status-label {
        font-family: var(--font-hud);
        font-size: 9px;
        color: rgba(255, 255, 255, 0.45);
        text-transform: uppercase;
        display: inline-block;
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- TOPBAR -->
  <a href="https://goatfcbd.com" class="topbar">
    <div class="topbar-left">
      <img src="https://i.imgur.com/LY3Bb9m.png" class="topbar-logo" alt="GOAT FC">
      <span class="topbar-text">GOAT FC</span>
    </div>
    <div class="topbar-right"><i class="fa-solid fa-house"></i></div>
  </a>

  <div class="main">
    <div class="wrapper">

      <!-- TITLE -->
      <div class="title-block">
        <h1>Rival Tracker</h1>
        <div class="subtitle">GOAT FC · Player Head-to-Head Statistics</div>
        <div class="subtitle-badge"><i class="fa-solid fa-microchip"></i> H2H ENGAGEMENT ENGINE</div>
      </div>

      <!-- FILTERS -->
      <div class="filter-section">
        <div class="select-wrap">
          <i class="fa-solid fa-user-shield"></i>
          <select id="playerSelect">
            <option value="">— Select Player —</option>
          </select>
        </div>
        <div class="filter-row">
          <div class="select-wrap">
            <i class="fa-solid fa-calendar-days"></i>
            <select id="periodFilter">
              <option value="monthly">Monthly</option>
              <option value="overall">Overall</option>
            </select>
          </div>
          <div class="select-wrap">
            <i class="fa-solid fa-shield-halved"></i>
            <select id="typeFilter">
              <option value="all">All Match</option>
              <option value="Friendly">Friendly</option>
              <option value="Tournament">Tournament</option>
            </select>
          </div>
        </div>
      </div>

      <!-- PLAYER SUMMARY DASHBOARD (NEW) -->
      <div id="playerDashboard" class="player-dashboard">
        <div class="db-card">
          <div class="db-grid">
            <div class="db-profile">
              <div class="db-avatar-container">
                <i class="fa-solid fa-circle-user"></i>
              </div>
              <div>
                <h3 id="dbPlayerName" class="db-player-name">PLAYER NAME</h3>
                <div id="dbPlayerId" class="db-player-id">GFC-000</div>
              </div>
            </div>
            <div class="db-winrate-box">
              <div id="dbWinrateRing" class="radial-progress">
                <span id="dbWinrateVal" class="radial-value">0%</span>
              </div>
              <span class="radial-label">WIN RATE</span>
            </div>
            <div class="db-stats">
              <div class="stat-row-summary">
                <div class="mini-stat-card">
                  <div class="mini-stat-label">Matches</div>
                  <div id="dbStatM" class="mini-stat-value val-m">0</div>
                </div>
                <div class="mini-stat-card">
                  <div class="mini-stat-label">Wins</div>
                  <div id="dbStatW" class="mini-stat-value val-w">0</div>
                </div>
                <div class="mini-stat-card">
                  <div class="mini-stat-label">Draws</div>
                  <div id="dbStatD" class="mini-stat-value val-d">0</div>
                </div>
                <div class="mini-stat-card">
                  <div class="mini-stat-label">Losses</div>
                  <div id="dbStatL" class="mini-stat-value val-l">0</div>
                </div>
              </div>
              <div class="tactical-intel">
                <div class="intel-pill">
                  <span class="intel-title arch"><i class="fa-solid fa-fire"></i> Arch-Rival</span>
                  <span id="intelArch" class="intel-opp-name">N/A</span>
                  <span id="intelArchMeta" class="intel-opp-meta">0 matches</span>
                </div>
                <div class="intel-pill">
                  <span class="intel-title nemesis"><i class="fa-solid fa-skull"></i> Nemesis</span>
                  <span id="intelNemesis" class="intel-opp-name">N/A</span>
                  <span id="intelNemesisMeta" class="intel-opp-meta">0 losses</span>
                </div>
                <div class="intel-pill">
                  <span class="intel-title prey"><i class="fa-solid fa-crosshairs"></i> Prey</span>
                  <span id="intelPrey" class="intel-opp-name">N/A</span>
                  <span id="intelPreyMeta" class="intel-opp-meta">0 wins</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- LEADERBOARD / RIVALS LIST -->
      <div class="card">
        <div class="tbl-wrap">
          <table id="mainTable">
            <thead>
              <tr>
                <th class="col-opp" style="width:45%">Opponent Record</th>
                <th style="width:11%">M</th>
                <th style="width:11%">W</th>
                <th style="width:11%">D</th>
                <th style="width:11%">L</th>
                <th style="width:11%">Status</th>
              </tr>
            </thead>
            <tbody id="resultTable">
              <tr>
                <td colspan="6" class="loading-cell">
                  <div class="loading-spinner"></div>
                  INITIALIZING HUD INTERFACE...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <footer>
    <div class="footer-text">POWERED BY GOAT FC</div>
  </footer>

  <script>
    const MONTHLY_MATCH_LIMIT = 5;
    const MATCH_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";
    const MEMBER_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";

    let matches = [], members = {};
    const clean = v => String(v || "").replace(/^"+|"+$/g, "").trim();
    const isValidID = id => /^GFC-\d+$/i.test(clean(id));

    function parseCSV(text) {
      const rows = []; let row = [], cur = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], n = text[i + 1];
        if (c === '"' && q && n === '"') { cur += '"'; i++; }
        else if (c === '"') { q = !q; }
        else if (c === ',' && !q) { row.push(cur); cur = ""; }
        else if ((c === '\n' || c === '\r') && !q) {
          if (cur || row.length) { row.push(cur); rows.push(row); }
          row = []; cur = "";
        } else cur += c;
      }
      if (cur || row.length) { row.push(cur); rows.push(row); }
      return rows;
    }

    function approved(v) { return clean(v).toLowerCase() === "yes"; }
    
    function isCurrentMonth(d) {
      const x = new Date(d), n = new Date();
      return !isNaN(x) && x.getMonth() === n.getMonth() && x.getFullYear() === n.getFullYear();
    }

    async function loadAll() {
      try {
        const [mRes, uRes] = await Promise.all([fetch(MATCH_CSV), fetch(MEMBER_CSV)]);
        const [mTxt, uTxt] = await Promise.all([mRes.text(), uRes.text()]);
        loadMembers(uTxt);
        loadMatches(mTxt);
        populatePlayers();
        document.getElementById("resultTable").innerHTML = `
          <tr>
            <td colspan="6" class="info-cell">
              <i class="fa-solid fa-gamepad"></i>
              SELECT A PLAYER TO DEPLOY DIAGNOSTICS
            </td>
          </tr>`;
      } catch (e) {
        document.getElementById("resultTable").innerHTML = `
          <tr>
            <td colspan="6" class="info-cell" style="color:var(--neon-pink);">
              <i class="fa-solid fa-triangle-exclamation"></i>
              CRITICAL: ERROR LOADING REMOTE DATABASE
            </td>
          </tr>`;
      }
    }

    function loadMembers(csv) {
      const rows = parseCSV(csv), h = rows[0];
      rows.slice(1).forEach(r => {
        const obj = {}; h.forEach((x, i) => obj[clean(x)] = clean(r[i]));
        const id = obj["Club ID Number"], name = obj["Full Name"];
        if (isValidID(id) && name) members[id] = { name, id };
      });
    }

    function loadMatches(csv) {
      const rows = parseCSV(csv), h = rows[0];
      matches = rows.slice(1).map(r => {
        const obj = {}; h.forEach((x, i) => obj[clean(x)] = clean(r[i]));
        return obj;
      }).filter(m => isValidID(m.P1_ID) && isValidID(m.P2_ID));
    }

    function populatePlayers() {
      const ids = [...new Set(matches.flatMap(m => [m.P1_ID, m.P2_ID]))].filter(id => members[id]).sort();
      const sel = document.getElementById("playerSelect");
      sel.innerHTML = '<option value="">— Select Player —</option>';
      ids.forEach(id => {
        const o = document.createElement("option");
        o.value = id;
        o.textContent = `${members[id].name}  ·  ${id}`;
        sel.appendChild(o);
      });
    }

    function oppCell(id, s) {
      // Calculate percentages for the visual ratio bar
      const total = s.total || 1;
      const winPct = (s.win / total) * 100;
      const drawPct = (s.draw / total) * 100;
      const lossPct = (s.loss / total) * 100;

      let nameAndId = "";
      if (!members[id]) {
        nameAndId = `
          <div class="opp-meta">
            <span class="opp-name">${id}</span>
          </div>
          <div class="opp-former">Former / Unknown Player</div>`;
      } else {
        nameAndId = `
          <div class="opp-meta">
            <span class="opp-name">${members[id].name}</span>
            <span class="opp-id">${id}</span>
          </div>`;
      }

      return `
        <div class="opp-row">
          ${nameAndId}
          <div class="h2h-bar-container">
            <div class="h2h-segment h2h-win" style="width: ${winPct}%" title="Wins: ${s.win} (${Math.round(winPct)}%)"></div>
            <div class="h2h-segment h2h-draw" style="width: ${drawPct}%" title="Draws: ${s.draw} (${Math.round(drawPct)}%)"></div>
            <div class="h2h-segment h2h-loss" style="width: ${lossPct}%" title="Losses: ${s.loss} (${Math.round(lossPct)}%)"></div>
          </div>
        </div>`;
    }

    function updateDashboard(player, stats) {
      const dash = document.getElementById("playerDashboard");
      if (!members[player]) {
        dash.classList.remove("active");
        return;
      }

      // Compute aggregates
      let totalM = 0, totalW = 0, totalD = 0, totalL = 0;
      let archId = null, nemesisId = null, preyId = null;
      let maxMatches = 0, maxLosses = 0, maxWins = 0;

      Object.entries(stats).forEach(([oppId, s]) => {
        totalM += s.total;
        totalW += s.win;
        totalD += s.draw;
        totalL += s.loss;

        if (s.total > maxMatches) { maxMatches = s.total; archId = oppId; }
        if (s.loss > maxLosses) { maxLosses = s.loss; nemesisId = oppId; }
        if (s.win > maxWins) { maxWins = s.win; preyId = oppId; }
      });

      const winRate = totalM > 0 ? Math.round((totalW / totalM) * 100) : 0;

      // Populate elements
      document.getElementById("dbPlayerName").textContent = members[player].name;
      document.getElementById("dbPlayerId").textContent = player;
      
      document.getElementById("dbStatM").textContent = totalM;
      document.getElementById("dbStatW").textContent = totalW;
      document.getElementById("dbStatD").textContent = totalD;
      document.getElementById("dbStatL").textContent = totalL;

      // Update radial circular winrate meter
      document.getElementById("dbWinrateVal").textContent = `${winRate}%`;
      const ring = document.getElementById("dbWinrateRing");
      ring.style.background = `radial-gradient(closest-side, #090e1a 79%, transparent 80% 100%), conic-gradient(var(--neon-green) ${winRate}%, rgba(255,255,255,0.05) ${winRate}% 100%)`;

      // Tactical Intel mapping helper
      const fillIntel = (elementId, metaId, oppId, count, label) => {
        const nameEl = document.getElementById(elementId);
        const metaEl = document.getElementById(metaId);
        if (oppId) {
          nameEl.textContent = members[oppId] ? members[oppId].name : oppId;
          metaEl.textContent = `${count} ${label}`;
        } else {
          nameEl.textContent = "NONE";
          metaEl.textContent = `0 ${label}`;
        }
      };

      fillIntel("intelArch", "intelArchMeta", archId, maxMatches, "matches");
      fillIntel("intelNemesis", "intelNemesisMeta", nemesisId, maxLosses, "losses");
      fillIntel("intelPrey", "intelPreyMeta", preyId, maxWins, "wins");

      dash.classList.add("active");
    }

    function renderData() {
      const player = clean(document.getElementById("playerSelect").value);
      const period = document.getElementById("periodFilter").value;
      const type = document.getElementById("typeFilter").value;
      const tbody = document.getElementById("resultTable");

      if (!members[player]) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="info-cell">
              <i class="fa-solid fa-gamepad"></i>
              SELECT A PLAYER TO DEPLOY DIAGNOSTICS
            </td>
          </tr>`;
        document.getElementById("playerDashboard").classList.remove("active");
        return;
      }

      let data = matches.filter(m => approved(m.Approved));
      if (period === "monthly") data = data.filter(m => isCurrentMonth(m.Match_Date));
      if (type === "Friendly") data = data.filter(m => clean(m.Match_Type) === "Friendly");
      if (type === "Tournament") data = data.filter(m => clean(m.Match_Type) !== "Friendly");

      const stats = {};
      data.forEach(m => {
        const p1 = m.P1_ID, p2 = m.P2_ID, s1 = +m.P1_Score || 0, s2 = +m.P2_Score || 0;
        let opp, res;
        if (p1 === player) { opp = p2; res = s1 > s2 ? "win" : s1 < s2 ? "loss" : "draw"; }
        else if (p2 === player) { opp = p1; res = s2 > s1 ? "win" : s2 < s1 ? "loss" : "draw"; }
        else return;
        
        if (!stats[opp]) stats[opp] = { total: 0, win: 0, draw: 0, loss: 0 };
        stats[opp].total++; stats[opp][res]++;
      });

      // Update Player Profile metrics
      updateDashboard(player, stats);

      const rows = Object.entries(stats).sort((a, b) => b[1].total - a[1].total);
      if (!rows.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="info-cell">
              <i class="fa-solid fa-triangle-exclamation"></i>
              NO head-to-head records found under selected filters
            </td>
          </tr>`;
        return;
      }

      // Render Rows with Embedded Mobile Labels
      tbody.innerHTML = rows.map(([opp, s]) => {
        const limit = period === "monthly" && s.total > MONTHLY_MATCH_LIMIT;
        
        return `
          <tr class="${limit ? 'warning-row' : ''}">
            <td class="col-opp">${oppCell(opp, s)}</td>
            
            <td class="stat-total">
              <span class="mob-stat-label">Matches</span>
              ${s.total}
            </td>
            <td class="stat-win">
              <span class="mob-stat-label">Wins</span>
              ${s.win}
            </td>
            <td class="stat-draw">
              <span class="mob-stat-label">Draws</span>
              ${s.draw}
            </td>
            <td class="stat-loss">
              <span class="mob-stat-label">Losses</span>
              ${s.loss}
            </td>
            
            <td class="col-status">
              <div class="mob-status-container">
                <span class="mob-status-label">Limit Status</span>
                <span class="badge ${limit ? 'badge-alert' : 'badge-ok'}">${limit ? 'LIMIT' : 'OK'}</span>
              </div>
            </td>
          </tr>`;
      }).join("");
    }

    // Bind event listeners
    ["playerSelect", "periodFilter", "typeFilter"].forEach(id => {
      document.getElementById(id).addEventListener("change", renderData);
    });

    // Run Initialization
    loadAll();
  </script>
</body>
</html>
