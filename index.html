<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOAT FC Profile</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
background:#020617;
color:#fff;
font-family:Segoe UI;
overflow-x:hidden;
}

/* HEADER */
.header{
text-align:center;
padding:10px 10px 2px;
}

.logo{
width:32px;
filter:drop-shadow(0 0 10px #00f5ff);
}

.title{
font-size:16px;
font-weight:800;
color:#00f5ff;
letter-spacing:1px;
}

.slogan{
font-size:10px;
color:#94a3b8;
margin-top:2px;
}

/* CARD */
.card{
width:min(720px,95%);
margin:auto;
background:#08111f;
border:1px solid #00f5ff22;
border-radius:16px;
overflow:hidden;
box-shadow:0 0 20px #00f5ff11;
}

/* COVER */
.cover{
height:85px;
background:url('https://c4.wallpaperflare.com/wallpaper/398/874/541/champions-league-stadium-wallpaper-preview.jpg');
background-size:cover;
background-position:center;
}

/* TOP */
.top{
text-align:center;
margin-top:-35px;
padding-bottom:8px;
}

.avatar{
width:70px;height:70px;
border-radius:50%;
border:2px solid #00f5ff;
box-shadow:0 0 15px #00f5ff33;
object-fit:cover;
}

.nameRow{
display:flex;
justify-content:center;
gap:6px;
margin-top:5px;
font-size:15px;
font-weight:700;
}

.name{color:#fff}
.cid{color:#00f5ff}

.rankRow{
display:flex;
justify-content:center;
gap:8px;
font-size:11px;
color:#94a3b8;
margin-top:4px;
}

.cp{
color:#fbbf24;
}

/* STATS */
.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
padding:8px;
}

.box{
background:#0f172a;
border:1px solid #00f5ff22;
border-radius:10px;
padding:6px;
text-align:center;
}

.label{font-size:9px;color:#94a3b8}
.value{font-size:13px;color:#00f5ff;font-weight:700}

/* MATCHES */
.matchWrap{
padding:8px;
}

.matchTitle{
text-align:center;
font-size:11px;
color:#00f5ff;
margin-bottom:6px;
}

.matchGrid{
display:flex;
overflow-x:auto;
gap:6px;
padding-bottom:6px;
scroll-snap-type:x mandatory;
}

.match{
min-width:160px;
background:#0f172a;
border:1px solid #1e293b;
border-radius:10px;
padding:6px;
scroll-snap-align:start;
font-size:10px;
}

.mTop{
display:flex;
justify-content:space-between;
font-size:9px;
color:#94a3b8;
}

.score{
text-align:center;
font-weight:800;
margin:4px 0;
}

.type{
text-align:center;
font-size:8px;
color:#64748b;
}

/* COLORS */
.win{color:#22c55e}
.loss{color:#ef4444}
.draw{color:#eab308}

</style>
</head>

<body>

<div class="header">
<img class="logo" src="https://i.imgur.com/LY3Bb9m.png">
<div class="title">PLAYER PROFILE</div>
<div class="slogan">BE A GAME CHANGER</div>
</div>

<div class="card" id="card">

<div class="cover"></div>

<div class="top">

<img id="img" class="avatar">

<div class="nameRow">
<div class="name" id="name">Loading</div>
<div class="cid" id="cid">...</div>
</div>

<div class="rankRow">
<div>🏆 Rank #<span id="rank">0</span></div>
<div>🪙 CP: <span class="cp" id="cp">0</span></div>
</div>

</div>

<div class="grid">

<div class="box"><div class="label">Win</div><div class="value" id="win"></div></div>
<div class="box"><div class="label">Loss</div><div class="value" id="loss"></div></div>
<div class="box"><div class="label">Draw</div><div class="value" id="draw"></div></div>
<div class="box"><div class="label">Match</div><div class="value" id="match"></div></div>

</div>

<div class="matchWrap">

<div class="matchTitle">RECENT MATCHES</div>

<div class="matchGrid" id="matches"></div>

</div>

</div>

<script>

const M = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1588171329&single=true&output=csv";
const U = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=133947099&single=true&output=csv";
const C = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqRJZskk_f4F0Xgx7eLadfVhLmjipE8bpbU9oFV5BYumJc1MKuU1LA4WjEKouVq67wEQ3-lo7VbkQ6/pub?gid=1252347749&single=true&output=csv";

const id = new URLSearchParams(location.search).get("id")?.toLowerCase() || "gfc001";

function norm(x){
return (x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
}

function csv(t){
return t.split("\n").map(r=>r.split(","));
}

async function load(){

const [m,u,c] = await Promise.all([
fetch(M).then(r=>r.text()),
fetch(U).then(r=>r.text()),
fetch(C).then(r=>r.text())
]);

const Mx = csv(m);
const Ux = csv(u);
const Cx = csv(c);

/* USER */
let user = Ux.find(r=>norm(r[1])===id);
document.getElementById("name").innerText = user?.[0] || "Player";
document.getElementById("cid").innerText = user?.[1] || id;
document.getElementById("img").src = user?.[4] || "https://i.imgur.com/LY3Bb9m.png";

/* CP */
let cp = Cx.find(r=>norm(r[0])===id);
document.getElementById("cp").innerText = cp?.[7] || 0;

/* STATS */
let win=0,loss=0,draw=0;

let matches=[];

Mx.slice(1).forEach(r=>{

if(norm(r[9])!=="yes") return;

let p1=norm(r[0]);
let p2=norm(r[1]);

if(p1!==id && p2!==id) return;

let s1=+r[3], s2=+r[4];

let me = p1===id ? s1 : s2;
let op = p1===id ? s2 : s1;

if(me>op) win++;
else if(me<op) loss++;
else draw++;

matches.push({
p1:r[0],
p2:r[1],
s1,s2,
type:r[2]
});

});

document.getElementById("win").innerText=win;
document.getElementById("loss").innerText=loss;
document.getElementById("draw").innerText=draw;
document.getElementById("match").innerText=matches.length;

/* RECENT 20 SLIDE STYLE */
let box = document.getElementById("matches");

matches.slice(-20).reverse().forEach(m=>{

let cls = (m.s1>m.s2)?"win":(m.s1<m.s2)?"loss":"draw";

box.innerHTML += `
<div class="match">

<div class="mTop">
<span>${m.p1}</span>
<span>${m.p2}</span>
</div>

<div class="score ${cls}">
${m.s1} - ${m.s2}
</div>

<div class="type">${m.type}</div>

</div>
`;

});

}

load();

</script>

</body>
</html>
